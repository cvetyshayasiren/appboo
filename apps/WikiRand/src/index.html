<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WikiRand — случайные статьи Википедии</title>

<!-- Ранняя установка темы: чтобы не было вспышки светлого фона при тёмной теме -->
<script>
(function () {
  try {
    var t = localStorage.getItem("wikirand:theme");
    if (!t && window.matchMedia) {
      t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t || "light";
  } catch (e) { /* приватный режим — остаёмся на светлой */ }
})();
</script>

<style>
/* ============================================================
   WikiRand — стили
   Тема построена на CSS-переменных; тёмная тема включается
   атрибутом data-theme="dark" на <html>.
   ============================================================ */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --text: #1a2233;
  --text-muted: #5b6575;
  --border: #dfe4ec;
  --accent: #3366cc;
  --accent-hover: #2855ab;
  --accent-soft: rgba(51, 102, 204, 0.14);
  --on-accent: #ffffff;
  --danger: #d9506e;
  --shadow: 0 10px 30px rgba(23, 34, 56, 0.08);
  --skeleton-a: #e7ebf2;
  --skeleton-b: #f2f5f9;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0e1320;
  --surface: #161d2e;
  --surface-2: #1d2639;
  --text: #e9edf5;
  --text-muted: #98a3b6;
  --border: #2a3448;
  --accent: #7aa5f8;
  --accent-hover: #8fb4fb;
  --accent-soft: rgba(122, 165, 248, 0.16);
  --on-accent: #0d1526;
  --danger: #f0879c;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  --skeleton-a: #232d42;
  --skeleton-b: #2b364e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.25s ease, color 0.25s ease;
}
button, select, input { font: inherit; }
a { color: var(--accent); }

.app {
  max-width: 760px;
  margin: 0 auto;
  padding: clamp(14px, 3vw, 28px) clamp(14px, 4vw, 24px) 26px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 100vh;
}

/* --- Шапка: название + селектор языка + переключатель темы --- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-badge {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(140deg, #4478dd, #2854a6);
  box-shadow: 0 6px 16px rgba(40, 84, 166, 0.35);
}
.brand h1 { margin: 0; font-size: 1.3rem; letter-spacing: -0.02em; }
.brand-sub { margin: 1px 0 0; font-size: 0.78rem; color: var(--text-muted); }

.header-controls { display: flex; align-items: center; gap: 10px; }

/* Обёртка селекта языка: глобус + нативный select */
.select-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 8px 0 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-muted);
  transition: border-color 0.2s ease;
}
.select-wrap:focus-within { border-color: var(--accent); }
.select-wrap select {
  border: none;
  background: transparent;
  color: var(--text);
  padding: 0;
  cursor: pointer;
  outline: none;
  max-width: 108px;
}

/* Кнопка-иконка (переключатель темы) */
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* какая иконка видна — зависит от текущей темы */
.icon-btn .icon-sun { display: none; }
.icon-btn .icon-moon { display: block; }
[data-theme="dark"] .icon-btn .icon-sun { display: block; }
[data-theme="dark"] .icon-btn .icon-moon { display: none; }

/* --- Карточки --- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: clamp(16px, 3.5vw, 22px);
  box-shadow: var(--shadow);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

/* --- Панель управления: раздел → подраздел → кнопка --- */
.controls { display: grid; gap: 16px; }
.field { display: grid; gap: 8px; }
.field-label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.control-select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 46px;
  padding: 0 42px 0 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  background: var(--surface) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23808a9c' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E") no-repeat right 12px center / 15px;
  cursor: pointer;
  transition: border-color 0.2s ease;
}
.control-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.control-input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.control-input::placeholder { color: var(--text-muted); opacity: 0.75; }
.control-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.control-input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(217, 80, 110, 0.15); }
.field-hint { margin: 0; font-size: 0.8rem; color: var(--danger); }

/* Чипы подразделов */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* активный подраздел визуально выделен */
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 4px 14px var(--accent-soft);
}

/* Главная кнопка */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 13px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px var(--accent-soft);
  transition: background-color 0.2s ease, transform 0.15s ease;
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.7; cursor: default; }
.btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* в состоянии загрузки вместо кубика крутится спиннер */
.btn-primary .spinner { display: none; }
.btn-primary.loading .btn-icon { display: none; }
.btn-primary.loading .spinner { display: inline-block; }

.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(128, 128, 128, 0.35);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --- Карточка статьи --- */
.article-body { display: grid; gap: 18px; }
.article-img {
  width: 100%;
  max-height: 330px;
  object-fit: cover;
  border-radius: 14px;
  box-shadow: 0 10px 26px rgba(9, 18, 38, 0.22);
  background: var(--surface-2);
}
.article-meta {
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
}
.article-title {
  margin: 6px 0 0;
  font-size: clamp(1.3rem, 4.5vw, 1.75rem);
  line-height: 1.22;
  letter-spacing: -0.015em;
}
.article-description { margin: 6px 0 0; font-size: 0.88rem; color: var(--text-muted); }
.article-extract { margin-top: 12px; }
.article-extract p { margin: 0 0 10px; font-size: 0.95rem; line-height: 1.68; }
.article-extract p:last-child { margin-bottom: 0; }
.article-actions { margin-top: 16px; }
.article-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border: 1.5px solid var(--accent);
  border-radius: 12px;
  color: var(--accent);
  background: transparent;
  font-weight: 700;
  font-size: 0.9rem;
  text-decoration: none;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.article-link:hover { background: var(--accent); color: var(--on-accent); }
.article-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* На широких экранах картинка слева, текст справа */
@media (min-width: 600px) {
  .article-body.with-image { grid-template-columns: 225px minmax(0, 1fr); align-items: start; }
}

/* --- Скелетон во время загрузки --- */
.skel {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  background: var(--skeleton-a);
}
.skel::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--skeleton-b) 50%, transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { 100% { transform: translateX(100%); } }
.skel-img { height: 190px; border-radius: 14px; }
@media (min-width: 600px) { .article-body.with-image .skel-img { height: 225px; } }
.skel-text { display: grid; gap: 10px; padding-top: 4px; }

/* --- Состояние ошибки --- */
.state {
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 26px 10px;
}
.state-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
}
.state h3 { margin: 0; font-size: 1.05rem; }
.state p { margin: 0; max-width: 42ch; font-size: 0.9rem; line-height: 1.55; color: var(--text-muted); }
.state .btn-primary { width: auto; height: 42px; padding: 0 22px; margin-top: 6px; font-size: 0.9rem; }

/* --- Плавное появление контента --- */
.fade-in { animation: fadeUp 0.45s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* --- Подвал --- */
.app-footer { text-align: center; font-size: 0.76rem; color: var(--text-muted); }
.app-footer a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dotted var(--text-muted);
}
.app-footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Уважаем настройку «меньше анимаций» */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <!-- Шапка -->
  <header class="header">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5.2C7 5.2 9 5.9 10 7.2v10.6C9 16.8 7 16 3 16Z"/>
          <path d="M17 5.2C13 5.2 11 5.9 10 7.2v10.6c1-1 3-1.8 7-1.8Z"/>
          <path d="M20 1.4l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7.7-1.7Z" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div>
        <h1>WikiRand</h1>
        <p class="brand-sub">Случайные статьи из Википедии</p>
      </div>
    </div>

    <div class="header-controls">
      <!-- Селектор языка -->
      <div class="select-wrap" title="Язык Википедии">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c2.7 2.6 2.7 15.4 0 18"/>
          <path d="M12 3c-2.7 2.6-2.7 15.4 0 18"/>
        </svg>
        <select id="lang-select" aria-label="Язык Википедии"></select>
      </div>

      <!-- Переключатель светлой/тёмной темы -->
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему">
        <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
        </svg>
        <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Панель управления: раздел → подразделы/своя тема → кнопка -->
  <section class="card controls" aria-label="Управление">
    <div class="field">
      <label class="field-label" for="section-select">Раздел</label>
      <select class="control-select" id="section-select"></select>
    </div>

    <!-- Чипы подразделов (показываются для «Наука» и «Искусство») -->
    <div class="field" id="chips-field" hidden>
      <span class="field-label" id="chips-label">Подраздел</span>
      <div class="chips" id="chips" role="group" aria-labelledby="chips-label"></div>
    </div>

    <!-- Поле для своей темы -->
    <div class="field" id="custom-field" hidden>
      <label class="field-label" for="custom-input">Тема</label>
      <input class="control-input" id="custom-input" type="text" placeholder="Например: Космос" autocomplete="off">
      <p class="field-hint" id="custom-hint" hidden>Введите тему — хотя бы одно слово</p>
    </div>

    <!-- Единственная кнопка запуска -->
    <button class="btn-primary" id="fetch-btn" type="button">
      <span class="btn-icon" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/>
          <circle cx="8.6" cy="8.6" r="1.35" fill="currentColor" stroke="none"/>
          <circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/>
          <circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/>
          <circle cx="15.4" cy="15.4" r="1.35" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn-label">Показать статью</span>
    </button>
  </section>

  <!-- Карточка статьи / скелетон / ошибка -->
  <section class="card article" id="article" aria-live="polite"></section>

  <footer class="app-footer">
    Статьи и данные — <a href="https://www.mediawiki.org/wiki/API" target="_blank" rel="noopener noreferrer">Википедия · MediaWiki API</a>
  </footer>
</div>

<script>
"use strict";

/* ============================================================
   WikiRand — логика приложения
   ============================================================ */

/* --- Языковые версии Википедии --- */
const LANGS = { ru: "Русский", en: "English", de: "Deutsch", fr: "Français", es: "Español" };

/* --- Разделы и подразделы.
   q — поисковый запрос для каждой языковой версии Википедии:
   интерфейс остаётся русским, а статья ищется на выбранном языке. --- */
const SECTIONS = [
  {
    id: "random",
    label: "Случайно",
    chips: []
  },
  {
    id: "science",
    label: "Наука",
    chips: [
      { id: "all",       label: "Вся наука",   q: { ru: "наука",        en: "science",          de: "Wissenschaft",   fr: "science",        es: "ciencia" } },
      { id: "physics",   label: "Физика",      q: { ru: "физика",       en: "physics",          de: "Physik",          fr: "physique",       es: "física" } },
      { id: "math",      label: "Математика",  q: { ru: "математика",   en: "mathematics",      de: "Mathematik",      fr: "mathématiques",  es: "matemáticas" } },
      { id: "biology",   label: "Биология",    q: { ru: "биология",     en: "biology",          de: "Biologie",        fr: "biologie",       es: "biología" } },
      { id: "chemistry", label: "Химия",       q: { ru: "химия",        en: "chemistry",        de: "Chemie",          fr: "chimie",         es: "química" } },
      { id: "astronomy", label: "Астрономия",  q: { ru: "астрономия",   en: "astronomy",        de: "Astronomie",      fr: "astronomie",     es: "astronomía" } },
      { id: "medicine",  label: "Медицина",    q: { ru: "медицина",     en: "medicine",         de: "Medizin",         fr: "médecine",       es: "medicina" } },
      { id: "cs",        label: "Информатика", q: { ru: "информатика",  en: "computer science", de: "Informatik",      fr: "informatique",   es: "informática" } }
    ]
  },
  {
    id: "art",
    label: "Искусство",
    chips: [
      { id: "all",          label: "Всё искусство", q: { ru: "искусство",   en: "art",          de: "Kunst",       fr: "art",          es: "arte" } },
      { id: "painting",     label: "Живопись",      q: { ru: "живопись",    en: "painting",     de: "Malerei",     fr: "peinture",     es: "pintura" } },
      { id: "music",        label: "Музыка",        q: { ru: "музыка",      en: "music",        de: "Musik",       fr: "musique",      es: "música" } },
      { id: "literature",   label: "Литература",    q: { ru: "литература",  en: "literature",   de: "Literatur",   fr: "littérature",  es: "literatura" } },
      { id: "cinema",       label: "Кино",          q: { ru: "кино",        en: "film",         de: "Film",        fr: "cinéma",       es: "cine" } },
      { id: "architecture", label: "Архитектура",  q: { ru: "архитектура", en: "architecture", de: "Architektur", fr: "architecture", es: "arquitectura" } },
      { id: "modernism",    label: "Модернизм",     q: { ru: "модернизм",   en: "modernism",    de: "Moderne",     fr: "modernisme",   es: "modernismo" } }
    ]
  },
  {
    id: "custom",
    label: "Своя тема",
    chips: [],
    custom: true
  }
];

/* --- Ссылки на API Википедии (origin=* обязателен для CORS) --- */

/* Полностью случайная статья — REST API */
const randomUrl = (lang) =>
  `https://${lang}.wikipedia.org/api/rest_v1/page/random/summary?origin=*`;

/* Краткое содержание конкретной статьи — REST API */
const summaryUrl = (lang, title) =>
  `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}?origin=*`;

/* Поиск заголовков — Action API */
const searchUrl = (lang, query) => {
  const params = new URLSearchParams({
    action: "query",
    list: "search",
    srsearch: query,   // поисковый запрос
    srlimit: "50",     // хватит простора для случайного выбора
    srnamespace: "0",  // только основное пространство имён (статьи)
    srprop: "",        // сами тексты сниппетов не нужны — только заголовки
    format: "json",
    formatversion: "2",
    origin: "*"        // разрешаем кросс-доменный запрос
  });
  return `https://${lang}.wikipedia.org/w/api.php?${params}`;
};

/* --- Состояние приложения --- */
const state = {
  sectionId: "random",                          // выбранный раздел
  chipId: null,                                 // выбранный подраздел
  lang: storeGet("wikirand:lang") || "ru",      // язык Википедии
  requestSeq: 0                                 // счётчик запросов (защита от гонок)
};

/* Безопасный доступ к localStorage (в песочнице может быть запрещён) */
function storeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function storeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

/* --- Ссылки на DOM --- */
const $ = (id) => document.getElementById(id);
const els = {
  sectionSelect: $("section-select"),
  chipsField: $("chips-field"),
  chips: $("chips"),
  customField: $("custom-field"),
  customInput: $("custom-input"),
  customHint: $("custom-hint"),
  fetchBtn: $("fetch-btn"),
  btnLabel: document.querySelector("#fetch-btn .btn-label"),
  article: $("article"),
  themeToggle: $("theme-toggle"),
  langSelect: $("lang-select")
};

/* --- Встроенные SVG-иконки для динамических блоков --- */
const ICONS = {
  external:
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M13.5 4H20v6.5"/><path d="M20 4 11 13"/>' +
    '<path d="M17.5 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h4.5"/></svg>',
  alert:
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 3 2.5 19.5h19L12 3Z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/></svg>',
  refresh:
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>'
};

/* ============================================================
   Инициализация
   ============================================================ */
function init() {
  buildSectionSelect();
  buildLangSelect();
  applySection(state.sectionId);
  bindEvents();
  loadArticle(); // сразу показываем случайную статью
}

/* Заполняем выпадающий список разделов */
function buildSectionSelect() {
  els.sectionSelect.innerHTML = SECTIONS
    .map((s) => `<option value="${s.id}">${s.label}</option>`)
    .join("");
  els.sectionSelect.value = state.sectionId;
}

/* Заполняем селектор языков */
function buildLangSelect() {
  els.langSelect.innerHTML = Object.entries(LANGS)
    .map(([code, name]) => `<option value="${code}">${name}</option>`)
    .join("");
  els.langSelect.value = state.lang;
}

/* Обработчики событий */
function bindEvents() {
  // смена раздела — обновляем панель чипов / поле темы
  els.sectionSelect.addEventListener("change", () => applySection(els.sectionSelect.value));

  // главная кнопка
  els.fetchBtn.addEventListener("click", loadArticle);

  // Enter в поле своей темы тоже запускает поиск
  els.customInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadArticle();
  });
  // начали печатать — снимаем подсветку ошибки
  els.customInput.addEventListener("input", () => {
    if (els.customInput.value.trim()) {
      els.customInput.classList.remove("invalid");
      els.customHint.hidden = true;
    }
  });

  // переключатель темы
  els.themeToggle.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    storeSet("wikirand:theme", next);
  });

  // смена языка: влияет на следующий запрос
  els.langSelect.addEventListener("change", () => {
    state.lang = els.langSelect.value;
    storeSet("wikirand:lang", state.lang);
  });
}

/* ============================================================
   Управление: раздел → панель чипов / поле своей темы
   ============================================================ */
function applySection(sectionId) {
  state.sectionId = sectionId;
  state.chipId = null;

  const section = SECTIONS.find((s) => s.id === sectionId);
  els.customInput.classList.remove("invalid");
  els.customHint.hidden = true;

  if (section.chips.length > 0) {
    // раздел с подразделами: показываем чипы, активен первый («вся тема»)
    state.chipId = section.chips[0].id;
    renderChips(section);
    els.chipsField.hidden = false;
    els.customField.hidden = true;
  } else if (section.custom) {
    // своя тема: показываем текстовое поле
    els.chipsField.hidden = true;
    els.customField.hidden = false;
    els.customInput.focus();
  } else {
    // «Случайно»: ни чипов, ни поля не нужно
    els.chipsField.hidden = true;
    els.customField.hidden = true;
  }
}

/* Рисуем чипы подразделов выбранного раздела */
function renderChips(section) {
  els.chips.innerHTML = "";
  for (const chip of section.chips) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (chip.id === state.chipId ? " active" : "");
    btn.textContent = chip.label;
    // клик по чипу: выбираем подраздел и сразу показываем статью
    btn.addEventListener("click", () => {
      if (state.chipId === chip.id) return; // уже активен
      state.chipId = chip.id;
      renderChips(section);
      loadArticle();
    });
    els.chips.appendChild(btn);
  }
}

/* ============================================================
   Загрузка статьи
   ============================================================ */

/* Собираем текущий запрос: {mode:"random"} или {mode:"search", query} */
function buildRequest() {
  const section = SECTIONS.find((s) => s.id === state.sectionId);

  if (section.id === "random") return { mode: "random" };

  if (section.custom) {
    const query = els.customInput.value.trim();
    if (!query) return null; // тема не введена
    return { mode: "search", query };
  }

  const chip = section.chips.find((c) => c.id === state.chipId) || section.chips[0];
  return { mode: "search", query: chip.q[state.lang] || chip.q.ru };
}

async function loadArticle() {
  const request = buildRequest();

  // «Своя тема» без текста — подсвечиваем поле и подсказку
  if (!request) {
    els.customInput.classList.add("invalid");
    els.customHint.hidden = false;
    els.customInput.focus();
    return;
  }
  els.customInput.classList.remove("invalid");
  els.customHint.hidden = true;

  const seq = ++state.requestSeq; // отметка «самого свежего» запроса
  setLoading(true);
  renderSkeleton();

  try {
    const data = request.mode === "random"
      ? await fetchRandomArticle(state.lang)
      : await searchRandomArticle(state.lang, request.query);

    if (seq !== state.requestSeq) return; // уже идёт более новый запрос
    renderArticle(data);
  } catch (err) {
    if (seq !== state.requestSeq) return;
    console.error("WikiRand:", err);
    const notFound = err && err.name === "WikiNotFound";
    renderError(
      notFound ? "Статья не найдена" : "Не удалось загрузить статью",
      notFound
        ? "Статья не найдена, попробуйте ещё раз."
        : "Проверьте подключение к интернету и попробуйте ещё раз.",
      true
    );
  } finally {
    // снимаем индикатор загрузки, только если нет более нового запроса
    if (seq === state.requestSeq) setLoading(false);
  }
}

/* Кнопка в состоянии загрузки */
function setLoading(on) {
  els.fetchBtn.disabled = on;
  els.fetchBtn.classList.toggle("loading", on);
  els.btnLabel.textContent = on ? "Загрузка…" : "Показать статью";
}

/* --- HTTP-хелпер --- */
async function fetchJson(url) {
  const res = await fetch(url, { headers: { accept: "application/json" } });
  if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  return res.json();
}

/* Ошибка «ничего не найдено» — по ней показываем свой текст */
function notFoundError() {
  const err = new Error("Ничего не найдено");
  err.name = "WikiNotFound";
  return err;
}

/* Страницу-значение или пустую страницу показывать не хотим */
function isArticle(data) {
  if (!data || typeof data !== "object") return false;
  if (data.type === "disambiguation" || data.type === "nothing") return false;
  return Boolean(data.extract || data.content_urls);
}

/* Случайная статья из всей Википедии (REST API) */
async function fetchRandomArticle(lang) {
  let last = null;
  // до трёх попыток: изредка попадаются страницы-значения
  for (let i = 0; i < 3; i++) {
    const data = await fetchJson(randomUrl(lang));
    if (isArticle(data)) return data;
    last = data;
  }
  return last;
}

/* Поиск по запросу → случайный заголовок из результатов → его summary */
async function searchRandomArticle(lang, query) {
  const data = await fetchJson(searchUrl(lang, query));
  const results = (data && data.query && data.query.search) || [];
  if (results.length === 0) throw notFoundError();

  // перемешиваем заголовки и пробуем несколько кандидатов
  const candidates = shuffle(results.map((r) => r.title)).slice(0, 6);
  let fallback = null;
  for (const title of candidates) {
    try {
      const summary = await fetchJson(summaryUrl(lang, title));
      if (!summary || !summary.title) continue;
      if (!fallback) fallback = summary;
      if (isArticle(summary)) return summary; // подходит
    } catch (e) { /* этот заголовок не загрузился — пробуем следующий */ }
  }
  if (fallback) return fallback; // хоть что-то нашли
  throw notFoundError();
}

/* Тасование Фишера—Йетса */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   Отрисовка: скелетон / статья / ошибка
   ============================================================ */

function renderSkeleton() {
  els.article.innerHTML = `
    <div class="article-body with-image" aria-hidden="true">
      <div class="skel skel-img"></div>
      <div class="skel-text">
        <div class="skel" style="height:13px;width:38%"></div>
        <div class="skel" style="height:26px;width:72%"></div>
        <div class="skel" style="height:12px;width:100%"></div>
        <div class="skel" style="height:12px;width:94%"></div>
        <div class="skel" style="height:12px;width:88%"></div>
        <div class="skel" style="height:12px;width:60%"></div>
      </div>
    </div>`;
}

/* Выбираем картинку статьи; заодно пытаемся взять версию побольше */
function pickImage(data) {
  const thumb = data.thumbnail && data.thumbnail.source;
  const original = data.originalimage && data.originalimage.source;
  if (!thumb && !original) return null;
  // миниатюры Википедии устроены как …/320px-Имя.jpg — просим 640px
  const bigger = thumb && thumb.includes("/thumb/")
    ? thumb.replace(/\/(\d+)px-/, "/640px-")
    : null;
  return { src: thumb || original, bigger: bigger && bigger !== thumb ? bigger : null };
}

function renderArticle(data) {
  const lang = state.lang;
  const img = pickImage(data);

  // ссылка на полную статью (страховка, если content_urls не пришёл)
  const link = (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) ||
    `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(data.title)}`;

  // абзацы краткого текста
  const extract = data.extract || "У этой статьи пока нет краткого описания — загляните в полную версию.";
  const paragraphs = extract
    .split("\n")
    .map((t) => t.trim())
    .filter(Boolean)
    .map((t) => `<p>${escapeHtml(t)}</p>`)
    .join("");

  els.article.innerHTML = `
    <article class="article-body ${img ? "with-image" : ""} fade-in">
      ${img ? `<img class="article-img" src="${escapeAttr(img.src)}" alt="${escapeAttr(data.title)}" decoding="async">` : ""}
      <div class="article-info">
        <div class="article-meta">${LANGS[lang]} · Википедия</div>
        <h2 class="article-title">${escapeHtml(data.title)}</h2>
        ${data.description ? `<p class="article-description">${escapeHtml(data.description)}</p>` : ""}
        <div class="article-extract">${paragraphs}</div>
        <div class="article-actions">
          <a class="article-link" href="${escapeAttr(link)}" target="_blank" rel="noopener noreferrer">
            ${ICONS.external} Читать в Википедии
          </a>
        </div>
      </div>
    </article>`;

  // пробуем укрупненную миниатюру; если не загрузится — откат к исходной
  if (img && img.bigger) {
    const imageEl = els.article.querySelector(".article-img");
    imageEl.addEventListener("error", () => { imageEl.src = img.src; }, { once: true });
    imageEl.src = img.bigger;
  }
}

function renderError(title, text, retryable) {
  els.article.innerHTML = `
    <div class="state fade-in" role="alert">
      <div class="state-icon">${ICONS.alert}</div>
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(text)}</p>
      ${retryable ? `<button class="btn-primary" type="button" id="retry-btn">${ICONS.refresh} Попробовать ещё раз</button>` : ""}
    </div>`;
  const retryBtn = $("retry-btn");
  if (retryBtn) retryBtn.addEventListener("click", loadArticle);
}

/* Экранирование HTML для вставки строк из API */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
const escapeAttr = escapeHtml;

init();
</script>
</body>
</html>
