<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>1984 · Джордж Оруэлл — интерактивная книга</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pt-mono@5/index.css">
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<style>
:root{
  --bg0:#07090d; --bg1:#0d141c; --panel:rgba(9,13,19,.82); --line:#2b3d4f;
  --ink:#e9e4d6; --dim:#8fa0ad; --red:#ff3242; --cyan:#3fd9ff; --acid:#9dff3a;
  --amber:#ffb347; --magenta:#ff4f8b; --paper:#f0e6cc; --teal:#2ee6a8;
  --psy:#c9a53f; --vig:rgba(120,90,20,.5);
  --px:'Press Start 2P',monospace; --mono:'PT Mono',monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg0);overscroll-behavior:none;touch-action:none}
body{font-family:var(--mono);color:var(--ink);user-select:none;-webkit-user-select:none;position:fixed;inset:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0a0f15}
::-webkit-scrollbar-thumb{background:#2b3d4f;border:2px solid #0a0f15}
::-webkit-scrollbar-thumb:hover{background:var(--red)}
#app{position:fixed;inset:0;touch-action:none;cursor:grab}
#app.dragging{cursor:grabbing}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%!important;height:100%!important;image-rendering:pixelated}
/* ---------- post fx ---------- */
.fx{position:absolute;inset:0;pointer-events:none}
#fxScan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);opacity:var(--scan,.12);mix-blend-mode:multiply}
#fxRoll{background:linear-gradient(180deg,transparent 0%,rgba(180,255,220,.05) 46%,rgba(255,255,255,.09) 50%,rgba(180,255,220,.05) 54%,transparent 100%);background-size:100% 240px;background-repeat:no-repeat;animation:roll 7s linear infinite;opacity:var(--roll,.5)}
@keyframes roll{0%{background-position:0 -260px}100%{background-position:0 110vh}}
#fxGrain{opacity:var(--grain,.1);animation:grain .48s steps(6) infinite}
@keyframes grain{0%{background-position:0 0}20%{background-position:-32px 18px}40%{background-position:14px -40px}60%{background-position:-40px -22px}80%{background-position:26px 30px}100%{background-position:0 0}}
#fxVign{background:radial-gradient(ellipse at 50% 46%,transparent 42%,var(--vig) 130%);transition:background 1.2s}
#fxFlash{background:#fff;opacity:0}
#scratches{overflow:hidden}
.scratch{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);animation:scr .32s linear forwards}
@keyframes scr{0%{opacity:0}15%{opacity:.7}80%{opacity:.4}100%{opacity:0}}
#pageSweep{position:absolute;top:0;bottom:0;width:34vw;left:-40vw;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 45%,rgba(240,230,204,.14) 50%,rgba(0,0,0,.55) 55%,transparent);opacity:0}
#pageSweep.goL{animation:sweepL .5s ease-in-out}
#pageSweep.goR{animation:sweepR .5s ease-in-out}
@keyframes sweepL{0%{left:100vw;opacity:1}100%{left:-40vw;opacity:1}}
@keyframes sweepR{0%{left:-40vw;opacity:1}100%{left:100vw;opacity:1}}
/* ---------- HUD ---------- */
#ui{position:absolute;inset:0;pointer-events:none;z-index:20}
#hud{position:absolute;top:calc(8px + var(--sat));left:calc(10px + var(--sal));right:calc(10px + var(--sar));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{background:var(--panel);border:2px solid var(--line);padding:7px 9px;clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));box-shadow:0 3px 0 rgba(0,0,0,.5)}
#psyBox{min-width:132px}
#psyBox .lbl{font-family:var(--px);font-size:7px;color:var(--dim);letter-spacing:1px;display:flex;justify-content:space-between;gap:8px}
#psyVal{color:var(--psy)}
#psyBar{display:flex;gap:2px;margin-top:5px}
#psyBar i{width:7px;height:9px;background:#1a232d;flex:0 0 auto}
#psyState{font-family:var(--px);font-size:6px;margin-top:5px;color:var(--psy);letter-spacing:1px}
#hudRight{display:flex;gap:8px;align-items:flex-start}
#pageTag{font-family:var(--px);font-size:8px;color:var(--paper);letter-spacing:1px;text-align:right;line-height:1.7}
#pageTag small{display:block;font-size:6px;color:var(--dim)}
#sndBtn{pointer-events:auto;cursor:pointer;background:var(--panel);border:2px solid var(--line);width:38px;height:38px;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));box-shadow:0 3px 0 rgba(0,0,0,.5)}
#sndBtn:active{transform:translateY(2px);box-shadow:none}
#sndBtn svg{width:20px;height:20px}
#sndBtn .on{fill:var(--acid)} #sndBtn .off{fill:#5a6a78}
#sndBtn.muted .wave{display:none}
#sndBtn.muted .cross{display:block}
#sndBtn .cross{display:none;stroke:var(--red);stroke-width:2.4}
/* ---------- caption ---------- */
#caption{position:absolute;top:calc(74px + var(--sat));left:50%;transform:translateX(-50%);max-width:min(92vw,560px);background:rgba(6,9,13,.78);border-left:3px solid var(--red);padding:8px 12px;font-size:14px;line-height:1.45;color:#cfd8de;opacity:0;transition:opacity .35s;text-align:left}
#caption.show{opacity:1}
#caption.red{color:#ff8b93;border-left-color:var(--red);font-family:var(--px);font-size:9px;line-height:1.9;letter-spacing:1px}
#caption.mono{color:var(--acid);border-left-color:var(--acid);font-size:12px;letter-spacing:.5px}
#caption.song{color:var(--amber);border-left-color:var(--amber);font-style:italic}
/* ---------- bubble ---------- */
#bubble{position:absolute;max-width:min(86vw,430px);background:rgba(10,16,24,.94);border:2px solid var(--cyan);padding:10px 13px 11px;font-size:15px;line-height:1.42;color:var(--ink);box-shadow:0 0 0 2px #04060a,5px 6px 0 rgba(0,0,0,.55);opacity:0;transform:translateY(6px);transition:opacity .22s,transform .22s;clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px))}
#bubble.show{opacity:1;transform:translateY(0)}
#bubble .who{font-family:var(--px);font-size:7px;letter-spacing:1px;margin-bottom:6px;color:var(--cyan)}
#bubble .tail{position:absolute;bottom:-8px;width:8px;height:8px;background:inherit;border-right:2px solid;border-bottom:2px solid;border-color:inherit;transform:rotate(45deg);box-shadow:none}
#bubble.note{background:var(--paper);color:#2a2118;border-color:#b9a67e;transform:rotate(-2deg);font-size:19px;text-align:center;font-weight:bold}
#bubble.note .who{color:#8a6f3f}
#bubble.note .tail{display:none}
#bubble.small{font-size:13px}
/* ---------- title pages ---------- */
#titleLayer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;opacity:0;transition:opacity .4s}
#titleLayer.show{opacity:1}
.tp{font-family:var(--px);font-size:9px;color:var(--dim);letter-spacing:3px;margin-bottom:18px}
.tn{font-family:var(--px);font-size:clamp(13px,4vw,20px);color:var(--red);letter-spacing:2px;margin-bottom:16px;text-shadow:3px 3px 0 #000}
.tname{font-family:var(--mono);font-weight:bold;font-size:clamp(26px,7.5vw,46px);color:var(--paper);text-shadow:4px 4px 0 #000;line-height:1.15;max-width:88vw}
.trule{width:120px;height:4px;background:var(--red);margin:22px 0 14px;box-shadow:4px 4px 0 #000}
.tdots{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:4px}
.tdots b{color:var(--amber)}
.tpart{font-family:var(--px);font-size:7px;color:var(--dim);letter-spacing:2px;margin-top:14px}
#titleLayer.show .tp{animation:rise .5s .05s both}
#titleLayer.show .tn{animation:rise .5s .18s both}
#titleLayer.show .tname{animation:rise .55s .3s both}
#titleLayer.show .trule{animation:rise .5s .45s both}
#titleLayer.show .tdots{animation:rise .5s .55s both}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.cv-big{font-family:var(--px);font-size:clamp(44px,15vw,96px);color:var(--paper);text-shadow:5px 0 0 rgba(255,50,66,.55),-5px 0 0 rgba(63,217,255,.5),6px 8px 0 #000;letter-spacing:4px;margin-bottom:20px}
.cv-author{font-family:var(--px);font-size:clamp(9px,2.6vw,13px);color:var(--red);letter-spacing:3px;margin-bottom:30px}
.cv-sub{font-size:14px;color:var(--dim);max-width:340px;line-height:1.6}
.cv-hint{font-family:var(--px);font-size:7px;color:var(--acid);letter-spacing:1px;margin-top:26px;line-height:2;animation:blink 1.6s steps(2) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#finalLine{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:92vw;text-align:center;font-family:var(--px);font-size:clamp(13px,4.2vw,26px);line-height:2;color:#ffd98a;text-shadow:0 0 18px rgba(255,179,71,.6),4px 4px 0 #000;opacity:0;transition:opacity 1.4s;pointer-events:none}
#finalLine.show{opacity:1}
/* ---------- bottom ---------- */
#hint{position:absolute;bottom:calc(26px + var(--sab));left:50%;transform:translateX(-50%);font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:2px;white-space:nowrap;transition:opacity .6s;text-shadow:2px 2px 0 #000}
#hint .ar{display:inline-block;color:var(--amber);animation:nudge 1.4s ease-in-out infinite}
#hint .ar.l{animation-name:nudgeL}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
#progWrap{position:absolute;left:0;right:0;bottom:0;padding-bottom:var(--sab);background:linear-gradient(0deg,rgba(4,6,9,.85),transparent)}
#progLabel{font-family:var(--px);font-size:6px;color:var(--dim);letter-spacing:1px;padding:0 12px 5px;display:flex;justify-content:space-between}
#prog{height:5px;background:#141c26;position:relative}
#progFill{position:absolute;left:0;top:0;bottom:0;background:var(--psy);width:0%;transition:width .5s,background 1s;box-shadow:0 0 8px var(--psy)}
#toast{position:absolute;bottom:calc(58px + var(--sab));left:50%;transform:translateX(-50%) translateY(8px);background:var(--panel);border:2px solid var(--amber);color:var(--paper);font-size:13px;padding:8px 14px;opacity:0;transition:opacity .35s,transform .35s;max-width:88vw;text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ripple{position:absolute;width:14px;height:14px;border:2px solid var(--cyan);pointer-events:none;animation:rip .45s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rip{0%{opacity:.9;scale:.4}100%{opacity:0;scale:2.6}}
/* ---------- end ---------- */
#endScreen{position:absolute;inset:0;background:#000;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#endScreen.show{display:flex;animation:endIn 1.6s both}
@keyframes endIn{0%{opacity:0}100%{opacity:1}}
#endScreen .e1{font-family:var(--px);font-size:clamp(20px,6vw,34px);color:var(--paper);letter-spacing:6px;margin-bottom:26px;text-shadow:4px 4px 0 #1a0508}
#endScreen .e2{font-size:14px;color:#5f6d7a;margin-bottom:8px}
#endScreen .e3{font-family:var(--px);font-size:8px;color:#7a4a52;letter-spacing:1px;line-height:2;margin-bottom:44px}
#restartBtn{pointer-events:auto;cursor:pointer;font-family:var(--px);font-size:11px;letter-spacing:1px;color:#fff;background:var(--red);border:3px solid #7a1020;padding:16px 24px;box-shadow:0 6px 0 #5a0c16,0 0 26px rgba(255,50,66,.35);clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px))}
#restartBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #5a0c16}
#boot{position:absolute;inset:0;z-index:60;background:var(--bg0);display:flex;align-items:center;justify-content:center;font-family:var(--px);font-size:10px;color:var(--acid);letter-spacing:2px;text-align:center;line-height:2.2;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
.ui-hide{opacity:0!important;transition:opacity .18s!important}
@media (max-height:460px){
  #hud{top:calc(5px + var(--sat))}
  .chip{padding:5px 7px}
  #psyBox{min-width:110px}
  #psyBar i{height:7px;width:6px}
  #caption{top:calc(56px + var(--sat));font-size:11px;padding:5px 9px}
  #caption.red{font-size:7px}
  #bubble{font-size:12px;padding:7px 10px}
  #bubble .who{font-size:6px;margin-bottom:4px}
  .tp{margin-bottom:10px}.tn{margin-bottom:10px}.trule{margin:12px 0 8px}
  #hint{bottom:calc(18px + var(--sab))}
  #sndBtn{width:32px;height:32px}
}
</style>
</head>

</div>

/* ================= SCENE LIFECYCLE ================= */
function buildScene(page){
  var id=page.type==='title'?('t'+page.p):(page.type==='scene'?page.s:page.type);
  var def=SCENES[id]||SCENES.cover;
  var ctx=makeCtx();
  try{def.build(ctx);}catch(e){}
  var obj={ctx:ctx,root:ctx.root,def:def,id:id,page:page};
  world.addChild(ctx.root);
  return obj;
}
function destroyScene(obj){
  if(!obj)return;
  world.removeChild(obj.root);
  obj.root.destroy({children:true,texture:false,baseTexture:false});
}
function startRunner(page){
  hideBubble();hideCap();
  $('#finalLine').classList.remove('show');
  if(page.type==='scene'||page.type==='final'){
    runner={beats:page.beats||[],t:0,idx:0,dur:page.loop||20,page:page};
  }else runner=null;
}
function fireBeat(b){
  var now=runner.t;
  if(b.psy!==undefined)setPsy(b.psy);
  if(b.cap)showCaption(b.cap,b.style,now,b.dur||4.6);
  if(b.say)showBubble(b.say[0],b.say[1],now,b.dur,b.note);
  if(b.ev){
    if(current&&current.ctx.events[b.ev])try{current.ctx.events[b.ev]();}catch(e){}
    AudioEng.event(b.ev);
    if(b.ev==='finalLine')$('#finalLine').classList.add('show');
  }
}
function resetLoopEvents(){
  if(current&&current.ctx.events.reset)try{current.ctx.events.reset();}catch(e){}
  if(current&&current.ctx.events.back)try{current.ctx.events.back();}catch(e){}
}
function updateRunner(dt){
  if(!runner||state.trans)return;
  runner.t+=dt;
  while(runner.idx<runner.beats.length&&runner.beats[runner.idx].t<=runner.t){fireBeat(runner.beats[runner.idx]);runner.idx++;}
  if(bubbleHideAt>0&&runner.t>bubbleHideAt)hideBubble();
  if(capHideAt>0&&runner.t>capHideAt)hideCap();
  if(runner.t>runner.dur){runner.t=0;runner.idx=0;hideBubble();hideCap();resetLoopEvents();setPsy(runner.page.psy);}
  if(runner.page.s==='s23'&&AudioEng.cur&&AudioEng.cur.p.heart){
    var iv=lerp(.85,.3,clamp(runner.t/16,0,1));
    if(Math.abs(AudioEng.cur.p.heart.interval-iv)>.06)AudioEng.cur.p.heart.interval=iv;
  }
}
function skipBeat(){
  if(!runner)return;
  for(var i=0;i<runner.beats.length;i++){
    var b=runner.beats[i];
    if(b.t>runner.t+.15&&(b.say||b.cap)){runner.t=b.t-.01;runner.idx=i;hideBubble();hideCap();return;}
  }
}
/* ---- page switching ---- */
function gotoPage(idx,dir,animate){
  idx=clamp(idx,0,PAGES.length-1);
  var page=PAGES[idx];
  state.page=idx;store.set('o1984.page',String(idx));
  setPsy(page.psy);updateHud(page,idx);
  applyFx((SCENES[page.type==='title'?('t'+page.p):(page.type==='scene'?page.s:page.type)]||SCENES.cover).fx||{});
  var old=current;
  current=buildScene(page);
  if(page.type==='cover'||page.type==='title')renderTitle(page);else hideTitle();
  if(animate&&old){
    current.root.x=dir*VW*1.15;current.root.y=6;
    state.trans={p:0,dir:dir,old:old,startX:old.root.x};
    var sw=$('#pageSweep');sw.className='';void sw.offsetWidth;sw.className=dir>0?'goL':'goR';
    bubbleEl.classList.add('ui-hide');capEl.classList.add('ui-hide');
    setTimeout(function(){bubbleEl.classList.remove('ui-hide');capEl.classList.remove('ui-hide');},260);
  }else{
    destroyScene(old);
  }
  startRunner(page);
  AudioEng.play(page);
  state.end=page.type==='end';
  $('#endScreen').classList.toggle('show',state.end);
  $('#hint').style.opacity=(state.flips<3&&!state.end)?'1':'0';
  if(page.type==='final')toast('ФИНАЛ · листайте дальше',2400);
}
function flip(dir){
  if(state.trans||state.end&&dir>0)return;
  var next=state.page+dir;
  if(next<0||next>=PAGES.length){springBack();return;}
  state.flips++;
  gotoPage(next,dir,true);
}
function springBack(){state.spring={v:current?current.root.x:0};}
/* ================= INPUT ================= */
var appEl=$('#app'),dragInfo=null,wheelAcc=0,wheelLock=0;
appEl.addEventListener('pointerdown',function(e){
  if(e.target.closest('#sndBtn')||e.target.closest('#restartBtn'))return;
  AudioEng.unlock();
  dragInfo={x:e.clientX,y:e.clientY,t:performance.now(),dx:0,dy:0,moved:false};
  try{appEl.setPointerCapture(e.pointerId);}catch(err){}
});
appEl.addEventListener('pointermove',function(e){
  pointer.x=e.clientX;pointer.y=e.clientY;
  pointer.nx=(e.clientX/window.innerWidth-.5)*2;pointer.ny=(e.clientY/window.innerHeight-.5)*2;
  if(!dragInfo)return;
  dragInfo.dx=e.clientX-dragInfo.x;dragInfo.dy=e.clientY-dragInfo.y;
  if(Math.abs(dragInfo.dx)>10)dragInfo.moved=true;
  if(dragInfo.moved&&!state.trans&&!state.end&&current){
    appEl.classList.add('dragging');
    var u=dragInfo.dx/S;
    current.root.x=clamp(u*.45,-VW*.4,VW*.4);
    $('#ui').style.transform='translateX('+(dragInfo.dx*.12)+'px)';
  }
});
function endDrag(e){
  if(!dragInfo)return;
  var d=dragInfo;dragInfo=null;appEl.classList.remove('dragging');
  $('#ui').style.transform='';
  var dt=performance.now()-d.t;
  if(!d.moved&&dt<400){
    ripple(e.clientX,e.clientY);
    if(!state.trans)skipBeat();
    return;
  }
  if(state.trans||state.end){springBack();return;}
  var vel=Math.abs(d.dx)/Math.max(dt,1);
  if(Math.abs(d.dx)>60||vel>.5){flip(d.dx<0?1:-1);}
  else springBack();
}
appEl.addEventListener('pointerup',endDrag);
appEl.addEventListener('pointercancel',function(){dragInfo=null;appEl.classList.remove('dragging');$('#ui').style.transform='';springBack();});
window.addEventListener('wheel',function(e){
  e.preventDefault();
  var now=performance.now();
  if(now<wheelLock||state.trans)return;
  wheelAcc+=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(Math.abs(wheelAcc)>70){flip(wheelAcc>0?1:-1);wheelAcc=0;wheelLock=now+700;}
  clearTimeout(window._wheelT);window._wheelT=setTimeout(function(){wheelAcc=0;},260);
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){AudioEng.unlock();flip(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){AudioEng.unlock();flip(-1);}
});
window.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
$('#sndBtn').addEventListener('click',function(e){
  e.stopPropagation();
  if(!AudioEng.started){AudioEng.unlock();return;}
  AudioEng.setMute(!state.muted);
  toast(state.muted?'ЗВУК ВЫКЛЮЧЕН':'ЗВУК ВКЛЮЧЕН',1200);
});
$('#sndBtn').addEventListener('pointerdown',function(e){e.stopPropagation();});
$('#restartBtn').addEventListener('click',function(){
  store.del('o1984.page');state.flips=0;state.end=false;
  $('#endScreen').classList.remove('show');
  gotoPage(0,-1,true);
  toast('КНИГА НАЧИНАЕТСЯ ЗАНОВО',2200);
});
$('#restartBtn').addEventListener('pointerdown',function(e){e.stopPropagation();});
document.addEventListener('visibilitychange',function(){
  if(!window.Tone||!AudioEng.started)return;
  if(document.hidden){Tone.Transport.pause();if(AudioEng.master)AudioEng.master.gain.rampTo(0,.1);}
  else{Tone.Transport.start();if(AudioEng.master)AudioEng.master.gain.rampTo(state.muted?0:.85,.3);}
});
/* ================= RESIZE ================= */
var resizeT=null;
function doResize(){
  if(state.trans){destroyScene(state.trans.old);state.trans.old=null;state.trans=null;}
  setupRT();
  var page=PAGES[state.page];
  destroyScene(current);
  current=buildScene(page);
  startRunner(page);
  setPsy(page.psy);state.psy=page.psy;lastPsyShown=-1;
}
window.addEventListener('resize',function(){clearTimeout(resizeT);resizeT=setTimeout(doResize,180);});
window.addEventListener('orientationchange',function(){clearTimeout(resizeT);resizeT=setTimeout(doResize,260);});
/* ================= MAIN LOOP ================= */
app.ticker.add(function(){
  var dt=Math.min(app.ticker.deltaMS,50)/1000;T+=dt;frameN++;
  /* transition */
  if(state.trans){
    var tr=state.trans;tr.p=Math.min(1,tr.p+dt/.5);
    var e=easeIO(tr.p);
    if(tr.old){tr.old.root.x=lerp(tr.startX,-tr.dir*VW*1.15,e);tr.old.root.y=e*6;}
    current.root.x=(1-e)*tr.dir*VW*1.15;current.root.y=(1-e)*6;
    if(tr.p>=1){destroyScene(tr.old);tr.old=null;state.trans=null;current.root.x=0;current.root.y=0;}
  }else if(state.spring&&current){
    state.spring.v=lerp(state.spring.v,0,dt*14);
    current.root.x=state.spring.v;
    if(Math.abs(state.spring.v)<.3){current.root.x=0;state.spring=null;}
  }
  /* scene update */
  if(current){
    var ctx=current.ctx;
    var drift=Math.sin(T*.25)*1.2;
    ctx.L.far.x=Math.round(pointer.nx*-1+drift*.3);
    ctx.L.mid.x=Math.round(pointer.nx*-2.2+drift*.6);
    ctx.L.near.x=Math.round(pointer.nx*-3.4+drift);
    ctx.L.chars.x=Math.round(pointer.nx*-4.2+drift*1.2);
    ctx.L.fx.x=Math.round(pointer.nx*-5+drift*1.4);
    for(var i=0;i<ctx.updaters.length;i++)ctx.updaters[i](T,dt);
    if(ctx.ps)ctx.ps.update(dt,T);
    for(var name in ctx.chars){
      var sp=ctx.chars[name];
      var talk=ctx.talk[name]||0;
      if(talk>0){ctx.talk[name]=Math.max(0,talk-dt*.8);
        sp.y=sp.baseY-((Math.sin(T*16)>0)?1:0);}
      else if(sp.baseY!==undefined&&sp.visible)sp.y=sp.baseY-((Math.sin(T*2+sp.baseX)>.92)?1:0);
    }
  }
  updateRunner(dt);
  /* psyche tween */
  state.psy=lerp(state.psy,state.psyT,dt*1.4);
  updatePsyHUD();
  /* shake */
  shakeAmt*=Math.pow(.02,dt);if(shakeAmt<.1)shakeAmt=0;
  screenGroup.x=Math.round(rnd(-1,1)*shakeAmt*S*.5);
  screenGroup.y=Math.round(rnd(-1,1)*shakeAmt*S*.5);
  /* flicker */
  if(state.flicker&&Math.random()<.015)baseSpr.alpha=rnd(.75,.95);else baseSpr.alpha=1;
  /* glitch scheduling */
  var fxdef=current?current.def.fx:null;
  if(fxdef&&T>glitchNext){glitch(rnd(.15,.4));glitchNext=T+(fxdef.glitch==='often'?rnd(2,4.5):rnd(8,16));}
  var glitching=T<glitchUntil;
  if(glitching&&frameN%3===0){
    var y=0;
    for(var s2=0;s2<6;s2++){
      var h=s2===5?VH-y:irnd(6,34);h=Math.min(h,VH-y);if(h<=0){slices[s2].visible=false;continue;}
      sliceTex[s2].frame=new PIXI.Rectangle(0,y,VW,h);
      slices[s2].visible=true;slices[s2].y=y;
      slices[s2].x=irnd(-6,6);slices[s2].tint=Math.random()<.25?(Math.random()<.5?0xff4060:0x40e0ff):0xffffff;
      y+=h;
    }
    baseSpr.visible=false;abR.visible=false;abC.visible=false;
  }else{
    for(var s3=0;s3<6;s3++)slices[s3].visible=false;
    baseSpr.visible=true;
    var ab=aberBase*(1+(glitching?2:0))+(shakeAmt*.15);
    abR.visible=abC.visible=ab>.05;
    abR.alpha=abC.alpha=clamp(ab*.16,0,.35);
    abR.x=ab*.5;abC.x=-ab*.5;abR.y=ab*.15;abC.y=-ab*.15;
  }
  /* render */
  app.renderer.render(world,{renderTexture:rt,clear:true});
});
/* ================= BOOT ================= */
setupRT();
AudioEng.init();
$('#sndBtn').classList.toggle('muted',state.muted);
var saved=parseInt(store.get('o1984.page')||'0',10);
if(isNaN(saved)||saved<0||saved>=PAGES.length)saved=0;
gotoPage(saved,1,false);
state.psy=PAGES[saved].psy;lastPsyShown=-1;updatePsyHUD();
if(saved>0&&saved<PAGES.length-1){
  var pg=PAGES[saved];
  setTimeout(function(){toast('ПРОДОЛЖАЕМ: ЧАСТЬ '+ROMAN[(pg.p||1)-1]+' · ГЛАВА '+(pg.n||'—'),3200);},700);
}
setTimeout(function(){$('#boot').classList.add('hide');},450);
})();
