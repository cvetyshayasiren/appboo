  stop(){this.running=false;if(this.raf)cancelAnimationFrame(this.raf);this.raf=0},

      const total=subs.reduce((s,o)=>s+o.e,0),r=13+n*7,base=time*(0.5/n)+n*0.8;
      let acc=0;const sectors=subs.map(o=>{const a0=base+acc/total*Math.PI*2;acc+=o.e;

  },

    for(let y=4;y<128;y+=8)for(let x=4;x<128;x+=8){c.fillStyle="rgba(120,140,255,.07)";c.fillRect(x,y,1,1)}

function slater(el,n,l){

function makeQuestion(z,mode,pool){
  const e=ELEMENTS[z-1],q={z,mode,answered:false,ok:false,given:null,givenText:"",hints:[],hintText:"",removed:[],typed:""};
  if(mode==="desc"){q.text=L(Math.random()<.55?e.use:e.fact);q.short="«"+q.text+"»"}
  else if(mode==="prop"){
    const keys=["mass","density","melt","boil","eneg","ie1"].filter(k=>e[k]);
    q.props=shuffle(keys).slice(0,Math.min(3,keys.length)).map(k=>[k,fmtProp(e,k)]);
    q.short=q.props.map(([k,v])=>t("prop_"+k)+" "+v).join(" · ");
  } else if(mode==="pos"){
    q.props=[[t("group"),e.group||"—"],[t("period"),e.period],[t("category"),t("cat_"+e.cat)],[t("block"),e.block]];
    q.short=q.props.map(([k,v])=>k+" "+v).join(" · ");
  } else if(mode==="number")q.short="№ "+z;
  else q.short=e.sym;
  if(S.cfg.answer==="choice"){
    const others=pool.filter(x=>x!==z);
    const same=others.filter(x=>ELEMENTS[x-1].cat===e.cat);
    const pick=shuffle(same.slice()).slice(0,3);
    while(pick.length<3&&others.length>pick.length){
      const c=shuffle(others.slice())[0];if(!pick.includes(c))pick.push(c)}
    q.opts=shuffle([z,...pick]);
  }
  return q;
}
function startRound(pool){
  const zs=(pool||[...S.set]).filter(z=>S.set.has(z)||pool);
  if(zs.length<2||!S.cfg.modes.length){toast(t("needMore"));return}
  const chosen=shuffle(zs.slice()).slice(0,Math.min(S.cfg.count,zs.length));
  S.round={qs:chosen.map(z=>makeQuestion(z,S.cfg.modes[Math.floor(Math.random()*S.cfg.modes.length)],zs)),i:0,
    started:new Intl.DateTimeFormat(S.lang==="ru"?"ru-RU":"en-US",{hour:"2-digit",minute:"2-digit"}).format(new Date())};
  S.phase="play";Snd.play("start");renderGame();
}
function answerQuestion(z,text){
  const r=S.round,q=r.qs[r.i],e=ELEMENTS[q.z-1];
  if(q.answered)return;
  q.answered=true;q.given=z;q.givenText=text!==undefined?text:(z?ELEMENTS[z-1].sym+" · "+ELEMENTS[z-1].name:"");
  q.ok=z===q.z;
  Snd.play(q.ok?"ok":"bad");
  renderGame();
}
function submitText(){
  const r=S.round,q=r.qs[r.i],inp=$("#answerInput");if(!inp)return;
  const val=inp.value.trim();if(!val)return;
  q.typed=val;
  const n=norm(val);
  const hit=ELEMENTS.find(e=>norm(e.ru)===n||norm(e.en)===n||norm(e.sym)===n||String(e.z)===val);
  answerQuestion(hit?hit.z:null,val);
}
function renderSuggest(q){
  const box=$("#sugg");if(!box)return;
  const v=norm(q.typed||"");
  if(!v){box.innerHTML="";return}
  const hits=ELEMENTS.filter(e=>e.z!==q.z&&(norm(e.ru).startsWith(v)||norm(e.en).startsWith(v)||norm(e.sym).startsWith(v))).slice(0,6);
  box.innerHTML=`<div>${t("hintLabel")}</div><div class="srow">${hits.length?hits.map(e=>`<button type="button" data-act="fill" data-v="${esc(e.name)}">${e.sym} · ${esc(e.name)}</button>`).join(""):`<span>${t("noMatch")}</span>`}</div>`;
}
function useHint(h){
  const r=S.round,q=r.qs[r.i],e=ELEMENTS[q.z-1];
  if(q.hints.includes(h))return;
  q.hints.push(h);Snd.play("toggle");
  if(h==="letter")q.hintText=(q.hintText?q.hintText+"<br>":"")+t("hintLetter")+": <b>"+esc(e.name[0])+"…</b> ("+e.name.length+" "+(S.lang==="ru"?"букв":"letters")+")";
  if(h==="info")q.hintText=(q.hintText?q.hintText+"<br>":"")+t("cat_"+e.cat)+" · "+t("period")+" "+e.period+" · "+t("prop_mass")+" ≈ "+nf(Math.round(e.mass),0);
  if(h==="5050"){const wrong=q.opts.filter(z=>z!==q.z);q.removed=shuffle(wrong).slice(0,2)}
  renderGame();
}

      <label class="switch"><input type="checkbox" id="motionOn" ${S.motion!=="off"?"checked":""}><span class="tr"></span><span>${S.motion!=="off"?t("on"):t("off")}</span></label></div>
    <div class="spread" style="margin-top:10px"><span class="small">${t("sound")}</span>
      <label class="switch"><input type="checkbox" id="soundOn" ${S.sound?"checked":""}><span class="tr"></span><span>${S.sound?t("on"):t("off")}</span></label></div>
  </div>
  <div class="card">
    <div class="sechead"><span class="n">2</span><h3>${t("language")} & ${t("unitsTitle")}</h3></div>
    <div class="small muted">${t("language")}</div>
    <div class="seg" style="margin:6px 0 14px">${[["ru","Русский"],["en","English"]].map(([v,k])=>
      `<button style="flex:1" data-act="lang" data-lang="${v}" aria-pressed="${S.lang===v}">${k}</button>`).join("")}</div>
    <div class="small muted">${t("temp")}</div>
    <div class="seg" style="margin:6px 0 14px">${["C","F","K"].map(v=>`<button style="flex:1" data-act="temp" data-v="${v}" aria-pressed="${S.temp===v}">°${v==="K"?"":v}${v==="K"?"K":""}</button>`).join("")}</div>
    <div class="small muted">${t("density")}</div>
    <div class="seg" style="margin:6px 0 14px">${[["g","u_gcm"],["kg","u_kgm"]].map(([v,k])=>
      `<button style="flex:1" data-act="dens" data-v="${v}" aria-pressed="${S.dens===v}">${t(k)}</button>`).join("")}</div>
    <div class="spread"><span class="small muted">${t("fontSize")}</span><b class="num small">${S.font}%</b></div>
    <input type="range" id="fontRange" min="90" max="135" step="5" value="${S.font}" aria-label="${t("fontSize")}">
  </div>
  <div class="card">
    <div class="sechead"><span class="n">3</span><h3>${t("keys")}</h3></div>
    <div class="klist">
      <div><span class="muted">${t("kArrows")}</span><span><span class="kbd">←</span> <span class="kbd">↑</span> <span class="kbd">↓</span> <span class="kbd">→</span></span></div>
      <div><span class="muted">${t("kEnter")}</span><span class="kbd">Enter</span></div>
      <div><span class="muted">${t("kEsc")}</span><span class="kbd">Esc</span></div>
      <div><span class="muted">${t("k14")}</span><span><span class="kbd">1</span>–<span class="kbd">4</span></span></div>
      <div><span class="muted">${t("kLR")}</span><span><span class="kbd">←</span> <span class="kbd">→</span></span></div>
    </div>
    <div style="margin-top:16px"><button class="btn" data-act="resetSettings">↺ ${t("resetSettings")}</button></div>
  </div>
  <div class="card">
    <div class="sechead"><span class="n">4</span><h3>${t("about")}</h3></div>
    <p class="small muted">${t("aboutText")}</p>
    <div class="props">
      <div class="prop"><small>${t("elements")}</small><b>118</b></div>
      <div class="prop"><small>${t("secIsotopes")}</small><b>${ELEMENTS.reduce((s,e)=>s+e.iso.length,0)}</b></div>
      <div class="prop"><small>${t("radio")}</small><b>${ELEMENTS.filter(e=>e.radio).length}</b></div>
      <div class="prop"><small>${t("ieAll")}</small><b>${ELEMENTS.reduce((s,e)=>s+e.ie.length,0)}</b></div>
    </div>
  </div>`;
}
/* ============================ EVENTS ============================ */
document.addEventListener("click",ev=>{
  const cell=ev.target.closest(".cell[data-z], .tile[data-z], .lt tbody tr[data-z]");
  const act=ev.target.closest("[data-act]");
  if(act){
    const a=act.dataset.act;
    if(a!=="pick"||act.tagName!=="INPUT"){if(a==="pick"&&act.tagName==="INPUT"){/*handled on change*/}}
    switch(a){
      case "tab":ev.preventDefault();setTab(act.dataset.tab);return;
      case "sound":S.sound=!S.sound;persist();applyI18n();Snd.play("toggle");toast(S.sound?t("soundOn"):t("soundOff"));if(S.tab==="settings")renderSettings();return;
      case "theme":{const order=["light","dark","system"];S.theme=order[(order.indexOf(S.theme)+1)%3];paint();persist();Snd.play("toggle");if(S.tab==="settings")renderSettings();return}
      case "lang":S.lang=act.dataset.lang;paint();persist();renderToolbar();renderFilters();renderTableArea();renderGame();renderSettings();if(openZ)openElement(openZ);return;
      case "view":S.view=act.dataset.v;persist();renderTable();return;
      case "dir":S.sort.d*=-1;persist();renderTable();return;
      case "sort":{const k=act.dataset.k;if(S.sort.k===k)S.sort.d*=-1;else S.sort={k,d:1};persist();renderTable();return}
      case "toggleFilters":{const p=$("#filters");p.hidden=!p.hidden;if(!p.hidden)renderFilters();renderToolbar();return}
      case "fcat":{const c=act.dataset.c,arr=S.filters.cats;const i=arr.indexOf(c);i<0?arr.push(c):arr.splice(i,1);persist();renderFilters();scheduleTable();return}
      case "fblock":{const c=act.dataset.b,arr=S.filters.blocks;const i=arr.indexOf(c);i<0?arr.push(c):arr.splice(i,1);persist();renderFilters();scheduleTable();return}
      case "fperiod":{const c=+act.dataset.p,arr=S.filters.periods;const i=arr.indexOf(c);i<0?arr.push(c):arr.splice(i,1);persist();renderFilters();scheduleTable();return}
      case "fstate":{const c=act.dataset.s,arr=S.filters.states;const i=arr.indexOf(c);i<0?arr.push(c):arr.splice(i,1);persist();renderFilters();scheduleTable();return}
      case "fstab":S.filters.stab=act.dataset.v;persist();renderFilters();scheduleTable();return;
      case "resetFilters":{const old=JSON.parse(JSON.stringify(S.filters));
        S.filters={q:"",cats:[],blocks:[],periods:[],group:0,states:[],stab:"all",prop:S.filters.prop,rmin:null,rmax:null,inGame:false};
        persist();renderFilters();renderTable();toast(t("filtersReset"),t("undo"),()=>{S.filters=old;persist();renderFilters();renderTable()});return}
      case "zoom":S.zoom=clamp(S.zoom+(+act.dataset.d)*.15,.45,2.4);applyZoom();return;
      case "zoomfit":zoomFit();return;
      case "jump":{const target=act.dataset.target;const row=target==="ln"?10:11;
        const c=$(`.cell[data-row="${row}"]`);if(c){c.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});c.focus();
          c.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],{duration:520});}return}
      case "close":closeSheet();return;
      case "prevEl":openElement(openZ<=1?118:openZ-1);return;
      case "nextEl":openElement(openZ>=118?1:openZ+1);return;
      case "toggleSet":toggleSet(+act.dataset.z);return;
      case "sub":Atom.sel=act.dataset.k;Snd.play("tick");Atom.draw(performance.now()/1000);renderOrbDetail(Atom.el,Atom.sel);return;
      case "png":Atom.png();return;
      case "copycfg":{const txt=Atom.el.cfgFull;
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),()=>toast(txt));
        else toast(txt);return}
      case "preset":{const list=PRESETS[+act.dataset.i][1]();S.set=new Set(list);persist();Snd.play("tick");renderGame();return}
      case "applyRange":{const lo=clamp(+$("#glo").value||1,1,118),hi=clamp(+$("#ghi").value||118,1,118);
        S.set=new Set(Array.from({length:Math.abs(hi-lo)+1},(_,i)=>Math.min(lo,hi)+i));persist();renderGame();return}
      case "selAll":S.set=new Set(ELEMENTS.map(e=>e.z));persist();renderGame();return;
      case "selNone":S.set=new Set();persist();renderGame();return;
      case "pick":{if(act.tagName==="INPUT")return;toggleSet(+act.dataset.z,true);Snd.play("tick");renderGame();return}
      case "atype":S.cfg.answer=act.dataset.v;persist();renderGame();return;
      case "start":startRound();return;
      case "answer":answerQuestion(+act.dataset.z);return;
      case "submitText":submitText();return;
      case "fill":{const inp=$("#answerInput");if(inp){inp.value=act.dataset.v;S.round.qs[S.round.i].typed=inp.value;renderSuggest(S.round.qs[S.round.i]);inp.focus()}return}
      case "hint":useHint(act.dataset.h);return;
      case "next":nextQuestion();return;
      case "abort":S.phase="setup";S.round=null;renderGame();return;
      case "retry":{const bad=S.round.qs.filter(q=>!q.ok).map(q=>q.z);startRound(bad);return}
      case "newRound":startRound();return;
      case "openFromGame":openElement(+act.dataset.z);return;
      case "setTheme":S.theme=act.dataset.v;paint();persist();renderSettings();return;
      case "base":S.base=act.dataset.c;paint();persist();renderSettings();return;
      case "temp":S.temp=act.dataset.v;persist();renderSettings();renderTableArea();return;
      case "dens":S.dens=act.dataset.v;persist();renderSettings();renderTableArea();return;
      case "resetSettings":{try{localStorage.removeItem(KEY)}catch(e){}
        S.theme="system";S.base="#6C4BF6";S.font=100;S.temp="C";S.dens="g";S.motion="auto";S.sound=true;
        S.filters={q:"",cats:[],blocks:[],periods:[],group:0,states:[],stab:"all",prop:"mass",rmin:null,rmax:null,inGame:false};
        S.view="grid";S.sort={k:"z",d:1};S.colorBy="cat";paint();persist();renderSettings();renderTable();toast(t("resetDone"));return}
    }
  }
  if(cell&&!ev.target.closest("input")){Snd.play("tick");openElement(+cell.dataset.z)}
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.act==="pick"&&el.tagName==="INPUT"){toggleSet(+el.dataset.z,true);renderTableArea();return}
  if(el.dataset.act==="mode"){const m=el.dataset.m,arr=S.cfg.modes,i=arr.indexOf(m);
    if(el.checked&&i<0)arr.push(m);if(!el.checked&&i>=0)arr.splice(i,1);persist();renderGame();return}
  switch(el.id){
    case "sortSel":S.sort.k=el.value;persist();renderTable();break;
    case "colorSel":S.colorBy=el.value;persist();renderTableArea();break;
    case "fgroup":S.filters.group=+el.value;persist();scheduleTable();break;
    case "rprop":S.filters.prop=el.value;S.filters.rmin=null;S.filters.rmax=null;persist();renderFilters();scheduleTable();break;
    case "fingame":S.filters.inGame=el.checked;persist();scheduleTable();break;
    case "qcount":S.cfg.count=+el.value;persist();break;
    case "hintsOn":S.cfg.hints=el.checked;persist();break;
    case "basePick":S.base=el.value;paint();persist();renderSettings();break;
    case "motionOn":S.motion=el.checked?"auto":"off";paint();persist();renderSettings();break;
    case "soundOn":S.sound=el.checked;persist();applyI18n();renderSettings();Snd.play("toggle");break;
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="q"){S.filters.q=el.value;persist();scheduleTable();return}
  if(el.id==="rmin"||el.id==="rmax"){
    const[b1,b2]=propBounds(S.filters.prop);
    let lo=+$("#rmin").value,hi=+$("#rmax").value;
    if(lo>hi){if(el.id==="rmin")hi=lo;else lo=hi;$("#rmin").value=lo;$("#rmax").value=hi}
    S.filters.rmin=lo;S.filters.rmax=hi;persist();
    const span=b2-b1||1;
    $("#rlo").textContent=nfs(lo);$("#rhi").textContent=nfs(hi);
    const fill=$(".dual .fill");if(fill){fill.style.left=((lo-b1)/span*100)+"%";fill.style.right=(100-(hi-b1)/span*100)+"%"}
    scheduleTable();return}
  if(el.id==="hueRange"){const hsl=window.__hsl.r2h.apply(null,window.__hsl.h2r(S.base));
    S.base=window.__hsl.hex(window.__hsl.hsl2r(+el.value,Math.max(55,hsl[1]),clamp(hsl[2],35,60)));
    paint();persist();const bp=$("#basePick");if(bp)bp.value=S.base;
    $$(".sw").forEach(s=>s.setAttribute("aria-pressed",String(s.dataset.c.toLowerCase()===S.base.toLowerCase())));return}
  if(el.id==="fontRange"){S.font=+el.value;paint();persist();const b=el.previousElementSibling.querySelector("b");if(b)b.textContent=S.font+"%";return}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&!$("#sheetwrap").hidden){closeSheet();return}
  if(!$("#sheetwrap").hidden){
    if(ev.key==="ArrowLeft"&&!/input|textarea|select/i.test(ev.target.tagName)){openElement(openZ<=1?118:openZ-1);return}
    if(ev.key==="ArrowRight"&&!/input|textarea|select/i.test(ev.target.tagName)){openElement(openZ>=118?1:openZ+1);return}
    if(ev.key==="Tab"){
      const f=$$('button, [href], input, select, canvas[tabindex], [tabindex]:not([tabindex="-1"])',$("#sheet")).filter(n=>!n.disabled&&n.offsetParent!==null);
      if(!f.length)return;const first=f[0],last=f[f.length-1];
      if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
      else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
    }
    return;
  }
  if(S.tab==="game"&&S.phase==="play"){
    const q=S.round.qs[S.round.i];
    if(ev.key==="Enter"){ev.preventDefault();q.answered?nextQuestion():(S.cfg.answer==="text"?submitText():null);return}
    if(/^[1-4]$/.test(ev.key)&&S.cfg.answer==="choice"&&!q.answered){
      const z=q.opts[+ev.key-1];if(z&&!q.removed.includes(z))answerQuestion(z);return}
  }
  const cell=ev.target.closest&&ev.target.closest(".cell[data-z]");
  if(cell&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(ev.key)){
    ev.preventDefault();
    let col=+cell.dataset.col,row=+cell.dataset.row;
    const dc=ev.key==="ArrowLeft"?-1:ev.key==="ArrowRight"?1:0;
    const dr=ev.key==="ArrowUp"?-1:ev.key==="ArrowDown"?1:0;
    for(let step=1;step<=20;step++){
      const c=col+dc*step,r=row+dr*step;
      if(c<1||c>19||r<1||r>11)break;
      const z=cellMap[c+","+r];
      if(z){const next=$(`.cell[data-z="${z}"]`);if(next){$$(".cell").forEach(x=>x.tabIndex=-1);next.tabIndex=0;next.focus();
        next.scrollIntoView({block:"nearest",inline:"nearest"});}break}
    }
  }
});
/* pinch + ctrl-wheel zoom inside the grid */
let pinch=null;
document.addEventListener("touchstart",ev=>{
  const w=ev.target.closest&&ev.target.closest("#gridwrap");
  if(w&&ev.touches.length===2){
    pinch={d:Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY),z:S.zoom};
  }
},{passive:true});
document.addEventListener("touchmove",ev=>{
  if(!pinch||ev.touches.length!==2)return;
  ev.preventDefault();
  const d=Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY);
  S.zoom=clamp(pinch.z*d/pinch.d,.45,2.4);applyZoom();
},{passive:false});
document.addEventListener("touchend",()=>{pinch=null},{passive:true});
document.addEventListener("wheel",ev=>{
  if(!ev.ctrlKey)return;
  const w=ev.target.closest&&ev.target.closest("#gridwrap");if(!w)return;
  ev.preventDefault();S.zoom=clamp(S.zoom-ev.deltaY*.002,.45,2.4);applyZoom();
},{passive:false});
window.addEventListener("resize",()=>{if(S.tab==="table"&&S.view==="grid")applyZoom()});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.theme==="system"){paint();if(S.tab==="settings")renderSettings()}});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)Atom.stop();
  else if(openZ&&!Atom.running&&S.motion!=="off"&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    Atom.running=true;const loop=ts=>{if(!Atom.running)return;Atom.draw(ts/1000);Atom.raf=requestAnimationFrame(loop)};Atom.raf=requestAnimationFrame(loop);}
});
/* ============================ INIT ============================ */
paint();renderToolbar();renderFilters();renderTableArea();renderGame();renderSettings();
requestAnimationFrame(()=>{if(S.view==="grid"&&window.innerWidth<900)zoomFit();});
</script>
