<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17251c"><title>Six Thousand Dogs</title><link rel="icon" href="../meta/icon.svg" type="image/svg+xml">
<style>
:root{--ink:#f4f2dc;--lime:#d8f27a}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#17251c;color:var(--ink);font-family:system-ui,sans-serif}.game{height:100dvh;width:100vw;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(7px,1.3vh,14px);padding:clamp(9px,1.8vw,20px);padding-bottom:max(10px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;z-index:5}.logo{font-size:clamp(14px,2.1vw,22px);font-weight:1000;letter-spacing:.1em;text-shadow:3px 3px #344c32}.logo b{color:var(--lime)}.counter{font-size:12px;font-weight:850;letter-spacing:.1em;background:#253c2b;border:2px solid #456044;border-radius:999px;padding:7px 11px}.mission{text-align:center;line-height:1.2;font-size:clamp(15px,2.5vw,26px);font-weight:900;padding:0 5px}.accent{color:var(--lime)}.stage{position:relative;min-height:0;overflow:hidden;border:3px solid #344d35;border-radius:20px;background:linear-gradient(#8ac6a0,#b5d68b 52%,#81b968);box-shadow:inset 0 0 0 3px #a5d19b,0 12px 40px #0005;isolation:isolate}.sky{position:absolute;inset:0 0 38%;background:linear-gradient(#8ec6c2,#b6dca3 85%)}.cloud{position:absolute;background:#d9edc3;opacity:.72;width:80px;height:12px;top:15%;left:13%;box-shadow:12px -9px 0 -2px #d9edc3,25px 0 #d9edc3,38px 5px 0 -3px #d9edc3;animation:cloud 28s linear infinite}.cloud.c2{top:33%;left:68%;animation-duration:38s;animation-direction:reverse}.hill{position:absolute;bottom:25%;width:70%;height:22%;background:#79b879;border-radius:50% 50% 0 0;opacity:.7}.h1{left:-15%}.h2{right:-20%;height:30%;background:#6eae70}.grass{position:absolute;inset:57% 0 0;background:linear-gradient(#87c66f,#5b9c50 65%,#4a8247)}.grass:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#b3db79 1.5px,transparent 1.5px),radial-gradient(#3f874b 1px,transparent 1px);background-size:29px 25px,19px 17px}.tuft{position:absolute;bottom:9%;width:3px;height:12px;background:#d0e879;box-shadow:5px 3px #d0e879,-4px 5px #d0e879}.dogs{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}.dog{position:absolute;bottom:12%;width:var(--w);height:var(--h);cursor:pointer;pointer-events:auto;filter:drop-shadow(3px 5px #315d3b55);animation:run var(--speed) ease-in-out infinite alternate,bounce .38s steps(2) infinite;transform-origin:50% 100%;touch-action:manipulation}.dog svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}.tail{transform-box:fill-box;transform-origin:12% 65%;animation:wag .22s steps(2) infinite alternate}.legs{animation:legs .19s steps(2) infinite alternate;transform-box:fill-box}.bubble{position:absolute;bottom:90%;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 9px;background:#fff8df;color:#493b2c;border:2px solid #554b37;border-radius:8px;font-size:12px;font-weight:1000;z-index:4}.leaving{animation:away .55s steps(5) forwards!important;pointer-events:none}.winner{animation:win .65s steps(5) forwards!important;pointer-events:none}.bottom{display:flex;justify-content:center;align-items:center;min-height:55px;z-index:5}#bark{font:1000 21px/1 system-ui;letter-spacing:.13em;color:#24351f;background:var(--lime);border:3px solid #f0ffb3;border-radius:15px;padding:16px 64px;box-shadow:0 5px #719747,0 8px #314d30,0 12px 22px #0004;cursor:pointer}.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:8;background:#203c29ef;border:2px solid #9dc66b;border-radius:999px;padding:8px 14px;white-space:nowrap;opacity:0;transition:.15s}.toast.show{opacity:1}@keyframes run{from{left:var(--from)}to{left:var(--to)}}@keyframes bounce{50%{translate:0 -6px}}@keyframes wag{to{rotate:28deg}}@keyframes legs{to{rotate:13deg}}@keyframes away{to{left:110%;translate:0 -8px;opacity:0}}@keyframes win{25%{translate:0 -24px}55%{translate:0 -28px;scale:1.12}100%{translate:0 -85px;opacity:0}}@keyframes cloud{to{translate:130vw}}@media(max-height:500px){.game{gap:4px;padding:6px}.bottom{min-height:39px}#bark{padding:9px 36px}}
</style></head><body><main class="game"><header class="top"><div class="logo">SIX THOUSAND <b>DOGS</b></div><div class="counter"><span id="count">0</span> / 5 DOGS</div></header><div class="mission" id="mission"></div><section class="stage" aria-label="Game field"><div class="sky"><i class="cloud"></i><i class="cloud c2"></i><i class="hill h1"></i><i class="hill h2"></i></div><div class="grass" id="grass"></div><div class="dogs" id="dogs"></div><div class="toast" id="toast"></div></section><div class="bottom"><button id="bark">BARK!</button></div></main>
<script>
const colors=[['white','White','#f4e9cf','#cbbd9e'],['gray','Gray','#9ba4a0','#66736f'],['brown','Brown','#a86d45','#75452f'],['ginger','Ginger','#d18a4d','#98572f'],['golden','Golden','#d8b76e','#a48443']],sizes=[['small','Small',78,70],['medium','Medium',104,94],['large','Large',140,126]],tails=['straight tail','curled tail','spiral tail'],ears=['pointy ears','floppy ears'];
const $=s=>document.querySelector(s),box=$('#dogs');let target,dogs=[],n=0,ctx,music,step=0;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mission(){target={size:pick(sizes),color:pick(colors),tail:pick(tails),ears:pick(ears)};$('#mission').innerHTML='Find a <span class="accent">'+target.size[0]+' '+target.color[0]+'</span> dog with a <span class="accent">'+target.tail+'</span> and <span class="accent">'+target.ears+'</span>.'}
function tone(f,d=.12,type='square',v=.04,delay=0){if(!ctx)return;let t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}
function sound(kind){if(!ctx){let A=window.AudioContext||window.webkitAudioContext;if(A)ctx=new A()}if(ctx?.state==='suspended')ctx.resume();if(kind==='bark'){tone(180,.13,'square',.07);tone(115,.16,'sawtooth',.045,.11);if(!music){let notes=[392,494,587,494,440,523,659,523];music=setInterval(()=>tone(notes[step++%notes.length],.12,'triangle',.012),260)}}else if(kind==='win')[523,659,784,1046].forEach((f,i)=>tone(f,.16,'square',.04,i*.09));else{tone(155,.22,'sawtooth');tone(125,.25,'sawtooth',.035,.17)}}
function svg(d){let c=d.color[2],sh=d.color[3],ear=d.ears===ears[0]?'<path d="M37 34 27 4 48 20 53 39Z M91 34 103 4 81 20 76 39Z" fill="'+sh+'"/>':'<path d="M39 30Q12 21 18 61L38 67 49 42Z M89 30Q116 21 110 61L90 67 79 42Z" fill="'+sh+'"/>',tail=d.tail===tails[0]?'M105 69 116 61 120 48':d.tail===tails[1]?'M105 69 119 63 122 49 113 43':'M105 69 119 63 123 52 116 46 109 52 114 58 121 54';return '<svg viewBox="0 0 128 112"><g class="legs" fill="'+sh+'"><path d="M37 76 34 100 45 100 49 76M79 76 82 100 93 100 91 76"/></g><path class="tail" d="'+tail+'" stroke="'+sh+'" stroke-width="8" fill="none"/><path d="M36 50Q26 57 29 82L43 88H94Q105 77 99 53Z" fill="'+c+'"/>'+ear+'<path d="M37 39Q38 14 64 16Q91 14 92 42L91 65Q84 81 64 80Q43 80 36 63Z" fill="'+c+'"/><path d="M45 51h6v6h-6m32-6h6v6h-6" fill="#292b24"/><path d="M59 64h10v6H59" fill="#49352c"/></svg>'}
function active(){return dogs.filter(d=>!d.classList.contains('leaving')&&!d.classList.contains('winner'))}function update(){$('#count').textContent=active().length}
function make(correct=false){let d=correct?target:{size:pick(sizes),color:pick(colors),tail:pick(tails),ears:pick(ears)},el=document.createElement('div');el.className='dog';el.innerHTML=svg(d);let from=4+Math.random()*65,dir=Math.random()<.5?-1:1;el.style.cssText='--w:'+d.size[2]+'px;--h:'+d.size[3]+'px;--from:'+from+'%;--to:'+Math.max(2,Math.min(83,from+dir*(12+Math.random()*19)))+'%;--speed:'+(2.8+Math.random()*2.2)+'s;bottom:'+(10+Math.random()*17)+'%;z-index:'+(1000+n);el.setAttribute('aria-label',[d.size[1],d.color[1],d.tail,d.ears].join(', '));el.onclick=()=>choose(el,correct);box.append(el);dogs.push(el);update()}
function choose(el,ok){if(el.classList.contains('leaving')||el.classList.contains('winner'))return;if(ok){el.classList.add('winner');sound('win');toast('That’s the one! ✨');setTimeout(()=>{el.remove();dogs=dogs.filter(x=>x!==el);mission();toast('New mission! Press BARK');update()},700)}else{sound('wrong');if(!el.querySelector('.bubble')){let b=document.createElement('div');b.className='bubble';b.textContent='GRRR! NOT ME!';el.append(b)}toast('Not this one! Keep looking.')}}
let timer;function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1250)}
function spawn(){sound('bark');n++;let live=active(),old=dogs.find(d=>d.isConnected&&!d.classList.contains('leaving')&&!d.classList.contains('winner'));if(live.length>=5&&old){old.classList.add('leaving');setTimeout(()=>{old.remove();dogs=dogs.filter(d=>d!==old);update()},600)}make(n%4===0);update()}
for(let i=0;i<36;i++){let t=document.createElement('i');t.className='tuft';t.style.cssText='left:'+(Math.random()*100)+'%;height:'+(5+Math.random()*11)+'px';$('#grass').append(t)}$('#bark').onclick=spawn;mission();
</script></body></html>
