        <div class="dr-top">${person?favBtnHTML(person.id):''}<button class="btn b-icon" data-action="close-top" aria-label="${esc(tr('close'))}">${icon('x')}</button></div>
        ${m.sub?`<div class="dr-sub">${subTag(m.sub,true)}</div>`:''}
      </div>
      <div class="dr-body scroll">${fb?`<div>${fb}</div>`:''}${bodyTop}${bodyMain}</div>
    </div></div>`;
}
/* Поделиться / скопировать ссылку */
async function shareItem(item){
  const m=itemMeta(item),url=itemUrl(item);
  try{
    if(navigator.share){await navigator.share({title:m.name,url});return;}
    throw{fallback:true};
  }catch(e){
    if(e&&e.name==='AbortError')return;
    try{await navigator.clipboard.writeText(url);toast(tr('copied'),'ok');}
    catch(e2){toast(tr('shareFail'),'err');}
  }
}

/* ================================================================
   10. ИЗБРАННОЕ
   ================================================================ */
function toggleFav(id){
  if(!P[id])return;
  const i=store.prefs.fav.indexOf(id);
  const added=i<0;
  if(added)store.prefs.fav.unshift(id);else store.prefs.fav.splice(i,1);
  savePrefs();
  $$(`[data-fav-id="${id}"]`).forEach(b=>{
    b.classList.toggle('on',added);b.setAttribute('aria-pressed',String(added));
    b.setAttribute('aria-label',tr(added?'faved':'fav'));b.title=tr(added?'faved':'fav');
    b.classList.remove('pop-anim');void b.offsetWidth;b.classList.add('pop-anim');
  });
  toast(tr(added?'favAdded':'favRemoved'),added?'ok':'info');
  renderCol();
  const top=store.ovl[store.ovl.length-1];
  if(top&&top.kind==='list'&&$('.lc-cat.c-fav',top.node))openList('fav');
}

/* ================================================================
   11. ТОСТЫ / RIPPLE
   ================================================================ */
function toast(msg,kind='info'){
  const box=$('#toasts');
  while(box.children.length>=3)box.firstChild.remove();
  const el=document.createElement('div');
  el.className=`toast t-${kind}`;
  el.innerHTML=icon(kind==='ok'?'check':kind==='err'?'alert':'info')+`<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260);},3400);
}
document.addEventListener('pointerdown',e=>{
  if(reducedMotion)return;
  const b=e.target.closest('.btn,.chip,.tab,.tb,.seg-btn,.swatch');
  if(!b)return;
  const r=b.getBoundingClientRect();
  const s=document.createElement('span');s.className='ripple';
  const d=Math.max(r.width,r.height);
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
  b.appendChild(s);s.addEventListener('animationend',()=>s.remove());
});

/* ================================================================
   12. СТАТИЧЕСКИЕ ЗОНЫ: контролы, настройки, i18n
   ================================================================ */
function renderControls(){
  $('#secSeg').innerHTML=['all','sci','art'].map(v=>
    `<button class="seg-btn ${store.section===v?'on':''}" data-action="section" data-v="${v}">${v==='sci'?icon('flask'):v==='art'?icon('palette'):icon('spark')}<span>${esc(tr(v==='all'?'all':v==='sci'?'science':'art'))}</span></button>`).join('');
  const subs=SUBS.filter(s=>store.section==='all'||s.sec===store.section);
  $('#subChips').innerHTML=`<button class="chip ${store.sub==='all'?'on':''}" data-action="sub" data-v="all">${esc(tr('allSubs'))}</button>`+
    subs.map(s=>`<button class="chip ${store.sub===s.id?'on':''}" data-action="sub" data-v="${s.id}">${icon(s.ic)}${esc(tr('short_'+s.id))}</button>`).join('');
  $('#statsLine').innerHTML=`<b>${PEOPLE.length}</b> ${esc(tr('statsPeople'))} · <b>${LISTS.length}</b> ${esc(tr('statsLists'))} · <b>${LINKS.length}</b> ${esc(tr('statsLinks'))}`;
  $('#modeSeg').innerHTML=[['all','modeAll'],['lists','modeLists'],['links','modeLinks']].map(([v,k])=>
    `<button class="seg-btn ${store.col.mode===v?'on':''}" data-action="mode" data-v="${v}">${esc(tr(k))}</button>`).join('');
  $('#catChips').innerHTML=[['all','catAll','spark'],['sci','catSci','flask'],['art','catArt','palette'],['mix','catMix','globe']].map(([v,k,ic])=>
    `<button class="chip ${store.col.cat===v?'on':''}" data-action="cat" data-v="${v}">${icon(ic)}${esc(tr(k))}</button>`).join('');
  // мобильная компоновка: поле поиска переносится в верхний ряд
  const mRow=$('.m-row'),fieldD=$('#discFieldD'),searchBlock=$('#searchBlock');
  if(isMobile()){mRow.appendChild(fieldD);fieldD.style.display='';searchBlock.style.display='none';}
  else{searchBlock.style.display='';searchBlock.insertBefore(fieldD,searchBlock.querySelector('.ctl-note'));fieldD.style.display='';}
  $('#discDate').textContent=new Intl.DateTimeFormat(LANG==='ru'?'ru-RU':'en-US',{day:'numeric',month:'long'}).format(new Date());
}
function renderSettingsState(){
  $('#themeSeg').innerHTML=[['light','themeLight','sun'],['auto','themeAuto','auto'],['dark','themeDark','moon']].map(([v,k,ic])=>
    `<button class="seg-btn ${store.prefs.theme===v?'on':''}" data-action="set-theme" data-v="${v}">${icon(ic)}<span>${esc(tr(k))}</span></button>`).join('');
  $('#langSeg').innerHTML=[['ru','Русский'],['en','English']].map(([v,label])=>
    `<button class="seg-btn ${LANG===v?'on':''}" data-action="set-lang" data-v="${v}"><span>${label}</span></button>`).join('');
  $('#swatches').innerHTML=ACCENTS.map(a=>
    `<button class="swatch ${store.prefs.accent.toLowerCase()===a.hex.toLowerCase()?'on':''}" style="--sw-c:${a.hex}" data-action="set-accent" data-v="${a.hex}" aria-label="${esc(tr(a.key))}" title="${esc(tr(a.key))}"></button>`).join('')+
    `<label class="custom-swatch" title="${esc(tr('custom'))}"><input type="color" id="customColor" value="${esc(store.prefs.accent)}" aria-label="${esc(tr('custom'))}"></label>`;
  const preset=ACCENTS.find(a=>a.hex.toLowerCase()===store.prefs.accent.toLowerCase());
  $('#accentName').innerHTML=`<i></i><span>${esc(preset?tr(preset.key):tr('custom')+' · '+store.prefs.accent.toUpperCase())}</span>`;
}
function updateThemeBtn(){
  $('#themeBtn').innerHTML=icon(isDark()?'moon':'sun');
}
function applyStatic(){
  document.documentElement.lang=LANG;
  $$('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
  $$('[data-i18n-ph]').forEach(el=>el.placeholder=tr(el.dataset.i18nPh));
  $$('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.i18nAria)));
}
function setLang(v){
  if(LANG===v)return;
  LANG=v;store.prefs.lang=v;savePrefs();
  while(store.ovl.length)removeOvl(store.ovl[store.ovl.length-1],true);
  closeSug();
  applyStatic();renderControls();renderSettingsState();updateThemeBtn();
  renderDiscover();renderCol();
  // перезагружаем данные на новом языке
  const d=store.disc;
  if(d.status==='ok'){
    if(d.mode==='search'&&d.q)runSearch(d.q);
    else if(d.spot&&d.spot.person){
      const persons=[d.spot.person,...d.items.filter(it=>it.person).map(it=>it.person)];
      const req=++store.discReq;
      api.peoplePages(persons,LANG).then(res=>{
        if(req!==store.discReq)return;
        const mk=p=>{const x=res.get(p.id);return{person:p,page:x.page,langUsed:x.langUsed};};
        store.disc.spot=mk(d.spot.person);
        store.disc.items=d.items.map(it=>it.person?mk(it.person):it);
        if(d.mode==='browse')store.disc.title=store.sub!=='all'?tr('sub_'+store.sub):store.section!=='all'?tr(store.section==='sci'?'science':'art'):tr('featuredGrid');
        else store.disc.title=tr('relatedGrid')+' · '+tr('sub_'+d.spot.person.sub);
        renderDiscover();
      }).catch(()=>{});
    }
  }else if(d.status==='empty'){store.disc={...d};renderDiscover();}
  if(store.col.online&&store.col.q.trim().length>=3)fetchOnline(store.col.q.trim());
}
function setTab(v){
  if(store.tab===v)return;
  store.scrollTop[store.tab]=(store.tab==='discover'?$('#discScroll'):$('#colScroll')).scrollTop;
  store.tab=v;closeSug();
  $$('.tab,.tb').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));});
  $('#panel-discover').classList.toggle('active',v==='discover');
  $('#panel-collections').classList.toggle('active',v==='collections');
  (v==='discover'?$('#discScroll'):$('#colScroll')).scrollTop=store.scrollTop[v]||0;
}
function openSettings(){$('#setWrap').hidden=false;renderSettingsState();const f=$('.set-panel [data-action="settings-close"]');if(f)f.focus();}
function closeSettings(){$('#setWrap').hidden=true;}

/* ================================================================
   13. СОБЫТИЯ (делегирование — один слушатель на действие)
   ================================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  switch(a){
    case 'noop':break;
    case 'tab':setTab(el.dataset.v);break;
    case 'random':{
      const pool=currentPool().filter(p=>!store.disc.spot||!store.disc.spot.person||p.id!==store.disc.spot.person.id);
      const pick=(pool.length?pool:currentPool())[Math.floor(Math.random()*(pool.length||currentPool().length))];
      if(pick){setTab('discover');showPersonFlow(pick);}
      break;}
    case 'section':{
      store.section=el.dataset.v;store.sub='all';renderControls();browseFlow();break;}
    case 'sub':{
      const v=el.dataset.v;store.sub=v;
      if(v!=='all'&&store.section!=='all'&&SUB_MAP[v].sec!==store.section)store.section=SUB_MAP[v].sec;
      if(v!=='all'&&store.section==='all')store.section=SUB_MAP[v].sec;
      renderControls();browseFlow();break;}
    case 'find':closeSug();runSearch(discInputEl().value);break;
    case 'clear-disc':syncDiscInputs('');closeSug();discInputEl().focus();break;
    case 'sug-pick':sugPick(+el.dataset.i);break;
    case 'shuffle':store.disc.items=shuffleArr(store.disc.items);renderDiscover();break;
    case 'open-person':{
      if(el.dataset.src==='spot'){if(store.disc.spot)openPerson(store.disc.spot);}
      else if(el.dataset.idx!==undefined){const it=store.disc.items[+el.dataset.idx];if(it)openPerson(it);}
      else if(el.dataset.pid){const p=P[el.dataset.pid];if(p)openPerson({person:p,page:p._cached&&p._cached.lang===LANG?p._cached.page:null,langUsed:p._cached?p._cached.langUsed:LANG});}
      break;}
    case 'try-person':{const p=P[el.dataset.pid];if(p){syncDiscInputs(pname(p));showPersonFlow(p);}break;}
    case 'topic-jump':{
      const sub=el.dataset.sub;store.section=SUB_MAP[sub].sec;store.sub=sub;
      syncDiscInputs('');renderControls();browseFlow();break;}
    case 'disc-retry':if(store.discRetry)store.discRetry();break;
    case 'fav':toggleFav(el.dataset.id);break;
    case 'share-person':{
      let it=null;
      if(el.dataset.src==='spot')it=store.disc.spot;
      else{const top=store.ovl[store.ovl.length-1];if(top&&top.kind==='person'){
        const dr=$('.drawer',top.node);const nm=dr?$('.dr-name',dr).textContent:'';
        const pidEl=$('[data-fav-id]',top.node);
        const person=pidEl?P[pidEl.dataset.favId]:null;
        it=person?{person,page:person._cached&&person._cached.page}:{page:{title:nm,url:wikiUrl(LANG,nm)}};
      }}
      if(it)shareItem(it);break;}
    case 'open-list':openList(el.dataset.id);break;
    case 'open-article':openArticle(el.dataset.title);break;
    case 'close-top':closeTop();break;
    case 'mode':store.col.mode=el.dataset.v;renderControls();renderCol();triggerOnline();break;
    case 'cat':store.col.cat=el.dataset.v;renderControls();renderCol();break;
    case 'clear-col':store.col.q='';$('#colInput').value='';store.col.onl={status:'idle',q:'',items:[],err:null};renderCol();$('#colInput').focus();break;
    case 'online-retry':fetchOnline(store.col.q.trim());break;
    case 'person-lists':{
      const p=P[el.dataset.pid];if(!p)break;
      while(store.ovl.length)removeOvl(store.ovl[store.ovl.length-1],true);
      setTab('collections');store.col.q=pname(p);$('#colInput').value=pname(p);renderCol();break;}
    case 'settings-open':openSettings();break;
    case 'settings-close':closeSettings();break;
    case 'set-theme':store.prefs.theme=el.dataset.v;savePrefs();refreshTheme();break;
    case 'theme-cycle':store.prefs.theme=isDark()?'light':'dark';savePrefs();refreshTheme();break;
    case 'set-lang':setLang(el.dataset.v);break;
    case 'set-accent':store.prefs.accent=el.dataset.v;savePrefs();refreshTheme();break;
  }
});
/* Клавиатура: Enter/Space на карточках, Esc, «/», Tab-ловушка */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#setWrap').hidden){closeSettings();return;}
    if(store.ovl.length){closeTop();return;}
    if(store.sugOpen){closeSug();return;}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-action]')){
    e.preventDefault();e.target.click();return;
  }
  if(e.key==='/'&&!e.target.closest('input,textarea,[contenteditable]')){
    e.preventDefault();setTab('discover');discInputEl().focus();return;
  }
  if(e.key==='Tab'&&store.ovl.length){
    const top=store.ovl[store.ovl.length-1].node;
    const foc=$$('a[href],button:not([disabled]),input,[tabindex="0"]',top).filter(x=>x.offsetParent!==null);
    if(!foc.length)return;
    const first=foc[0],last=foc[foc.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    else if(!top.contains(document.activeElement)){e.preventDefault();first.focus();}
  }
});
/* Поля ввода */
['discInput','discInputM'].forEach(id=>{
  const inp=document.getElementById(id);
  inp.addEventListener('input',()=>onDiscInput(inp.value));
  inp.addEventListener('keydown',onDiscKey);
  inp.addEventListener('focus',()=>{if(inp.value.trim().length>=2)onDiscInput(inp.value);});
});
$('#colInput').addEventListener('input',e=>{store.col.q=e.target.value;renderCol();triggerOnline();});
$('#onlineChk').addEventListener('change',e=>{store.col.online=e.target.checked;renderCol();triggerOnline();});
document.addEventListener('input',e=>{
  if(e.target.id==='customColor'){store.prefs.accent=e.target.value;savePrefs();applyScheme(store.prefs.accent,isDark());
    const preset=ACCENTS.find(x=>x.hex.toLowerCase()===e.target.value.toLowerCase());
    $('#accentName').innerHTML=`<i></i><span>${esc(preset?tr(preset.key):tr('custom')+' · '+e.target.value.toUpperCase())}</span>`;
    $$('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.v&&s.dataset.v.toLowerCase()===e.target.value.toLowerCase()));}
});
/* Клик вне подсказок / настроек */
document.addEventListener('pointerdown',e=>{
  if(store.sugOpen&&!sugBox.contains(e.target)&&!e.target.closest('#discField,#discFieldD'))closeSug();
  if(!$('#setWrap').hidden&&!e.target.closest('.set-panel')&&!e.target.closest('[data-action="settings-open"]'))closeSettings();
});
/* Перепозиционирование подсказок при прокрутке/resize */
addEventListener('scroll',()=>{if(store.sugOpen)positionSug();},true);
addEventListener('resize',()=>{if(store.sugOpen)positionSug();renderControls();});
/* Онлайн/оффлайн */
addEventListener('offline',()=>toast(tr('offline'),'err'));
addEventListener('online',()=>{toast(tr('backOnline'),'ok');if(store.disc.status==='error'&&store.discRetry)store.discRetry();});
sysLight.addEventListener('change',()=>{if(store.prefs.theme==='auto')refreshTheme();});

/* ================================================================
   14. СТАРТ
   ================================================================ */
loadPrefs();
applyScheme(store.prefs.accent,isDark());
applyStatic();
renderControls();
renderSettingsState();
updateThemeBtn();
renderCol();
browseFlow(); // первый экран уже населён: случайная икона + плотная сетка
})();
