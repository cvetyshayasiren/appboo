function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hx(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function rgb(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function mixc(a,b,t){const A=hx(a),B=hx(b);return rgb(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t));}
function shade(c,f){const A=hx(c);return rgb(A[0]*f,A[1]*f,A[2]*f);}
function rgba(c,a){const A=hx(c);return 'rgba('+A[0]+','+A[1]+','+A[2]+','+a+')';}
function mkC(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}

/* ---------- text rendering (cached) ---------- */
const tcache=new Map();
function textSprite(str,col,sc){
  const key=str+'\u0001'+col+'\u0001'+sc;
  let s=tcache.get(key);
  if(s)return s;
  if(tcache.size>700)tcache.clear();
  const w=Math.max(1,str.length*6*sc),h=9*sc;
  const c=mkC(w,h),g=c.getContext('2d');
  g.fillStyle=col;
  for(let i=0;i<str.length;i++){
    const gl=FONT[str[i]]||FONT['?'];
    for(let r=0;r<8;r++){const bits=gl[r];if(!bits)continue;
      for(let b=0;b<5;b++)if(bits&(16>>b))g.fillRect((i*6+b)*sc,r*sc,sc,sc);}
  }
  tcache.set(key,c);return c;
}
function drawText(g,str,x,y,col,sc,align){
  sc=sc||1;const s=textSprite(str,col,sc);
  let dx=x;if(align===1)dx=x-s.width/2;else if(align===2)dx=x-s.width;
  g.drawImage(s,Math.round(dx),Math.round(y));
}
const textW=(str,sc)=>str.length*6*(sc||1);
function wrapText(str,maxW,sc){
  sc=sc||1;const out=[];
  for(const para of String(str).split('\n')){
    const words=para.split(' ');let line='';
    for(const wd of words){
      const test=line?line+' '+wd:wd;
      if(textW(test,sc)<=maxW||!line)line=test;
      else{out.push(line);line=wd;}
    }
    out.push(line);
  }
  return out;
}
function fitText(str,maxW,sc){
  sc=sc||1;
  if(textW(str,sc)<=maxW)return str;
  const maxCh=Math.max(1,Math.floor(maxW/(6*sc))-1);
  return str.slice(0,maxCh)+'…';
}

/* ---------- save system ---------- */
const SAVE_KEY='noether.save.v1';
let save=null;
function defaultSave(){return {lang:'ru',sound:true,seed:(Math.random()*0xFFFFFFFF)>>>0,unlocks:{bonus:false,free:false},modes:{chrono:{reads:{},done:[]},bonus:{reads:{},done:[]}}};}
function loadSave(){
  let s=null;
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw)s=JSON.parse(raw);}catch(e){}
  const d=defaultSave();
  if(s&&typeof s==='object'){
    d.lang=(s.lang==='en')?'en':'ru';
    d.sound=s.sound!==false;
    if(typeof s.seed==='number')d.seed=s.seed>>>0;
    if(s.unlocks){d.unlocks.bonus=!!s.unlocks.bonus;d.unlocks.free=!!s.unlocks.free;}
    if(s.modes)for(const m of ['chrono','bonus']){
      const src=s.modes[m];if(src&&typeof src==='object'){
        if(src.reads&&typeof src.reads==='object')d.modes[m].reads=src.reads;
        if(Array.isArray(src.done))d.modes[m].done=src.done;
      }
    }
  }
  save=d;
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

const ALL_ROOMS=ROOMS_C.concat(ROOMS_B);
const ROOM_BY_ID={};ALL_ROOMS.forEach(r=>ROOM_BY_ID[r.id]=r);
function orderFor(mode,seed){
  if(mode==='chrono')return ROOMS_C.map(r=>r.id);
  if(mode==='bonus')return ROOMS_B.map(r=>r.id);
  const ids=ALL_ROOMS.map(r=>r.id);
  const rnd=mulberry32((seed^0x5F3EE7)>>>0);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=ids[i];ids[i]=ids[j];ids[j]=t;}
  return ids;
}
function ageFor(year){
  if(!year)return 'mature';
  const a=year-1882;
  return a<13?'child':a<22?'teen':a<33?'young':a<48?'mature':'elder';
}
function wikiUrl(w){
  const slug=lang==='ru'?w[1]:w[0];
  return 'https://'+(lang==='ru'?'ru':'en')+'.wikipedia.org/wiki/'+encodeURI(slug).replace(/%2527/g,'%27');
}

/* ---------- seed axes ---------- */
function roomAxes(room,seed){
  const out=[];
  for(let i=0;i<8;i++){
    let rg=room.ax[i]||[0,1];
    if(i===7){
      if(room.year){const e=clamp((1936-room.year)/60,0,1);rg=[clamp(e-.12,0,1),clamp(e+.12,0,1)];}
      else rg=[0,.35];
    }
    const rnd=mulberry32((seed^hashStr(room.id)^Math.imul(i+1,0x9E3779B9))>>>0);
    out.push(clamp(rg[0]+rnd()*(rg[1]-rg[0]),rg[0],rg[1]));
  }
  return out;
}
function derive(ax){
  return {
    weather:ax[0]<.22?0:ax[0]<.44?1:ax[0]<.66?2:ax[0]<.86?3:4,
    time:Math.min(3,Math.floor(ax[1]*4)),
    detail:ax[2],pal:Math.min(3,Math.floor(ax[3]*4)),
    glitch:ax[4],dust:ax[5],abs:ax[6],age:ax[7]
  };
}

function drawSkyline(g,w,gy,type,P,rnd,d){

function drawMidLayer(g,w,gy,sc,P,rnd){

function layout(){

function buildRoom(idx,side){
  roomIdx=idx;
  const id=order[idx],room=ROOM_BY_ID[id];
  const ax=roomAxes(room,save.seed),d=derive(ax),P=buildPalette(d);
  const sc=SCENES[room.scene];
  const n=room.objs.length;
  const roomW=Math.max(SW/S+2.6,n*1.95+3.6);
  const objs=room.objs.map((o,i)=>({o,x:1.6+(i+0.5)*(roomW-3.2)/n,idx:i}));
  R={room,ax,d,P,sc,roomW,objs,idx,age:ageFor(room.year),decor:[],lamps:[],windows:[]};
  const rnd=mulberry32((save.seed^hashStr(room.id)^0xBEEF)>>>0);
  const pool=sc.base==='in'?['bookshelf','plant','sconce','chair','rug','clock']:sc.base==='out'?['lamppost','treeOut','bench','fence']:['pylon','orb','rune'];
  const count=Math.floor(3+d.detail*6);
  for(let i=0;i<count;i++){
    const x=0.9+rnd()*(roomW-1.8);
    if(objs.some(ob=>Math.abs(ob.x-x)<1.0))continue;
    if(R.decor.some(dd=>Math.abs(dd.x-x)<0.9))continue;
    const kind=pool[Math.floor(rnd()*pool.length)];
    R.decor.push({kind,x});
  }
  if(sc.base==='in'){R.lamps.push({x:roomW*0.25,y:GY-1.95*S},{x:roomW*0.75,y:GY-1.95*S});}
  if(sc.base==='out'){for(let x=1.5;x<roomW;x+=3.2)R.lamps.push({x,y:GY-2.1*S});}
  if(sc.base==='abs'){R.lamps.push({x:roomW*0.5,y:GY-1.4*S});}
  buildRoomCaches(R);
  initParticles(R);
  player.x=side==='left'?0.85:roomW-0.85;
  player.dir=side==='left'?1:-1;
  player.anim=null;player.moving=false;player.phase=0;
  cam=clamp(player.x*S-SW/2,0,roomW*S-SW);
  edgeHold={dir:0,t:0};
  const root=[98,110,123,131][d.pal]*(d.time===3?0.75:1);
  Snd.room(d,sc.base,root);
}
function startGame(){
  if(!modeUnlocked(modeIdx)){Snd.error();shake=2;toast(L('Режим заблокирован','Mode locked'));return;}
  mode=MODES[modeIdx].id;
  order=orderFor(mode,save.seed);
  Snd.init();Snd.resume();Snd.duck(1);
  let start=0;
  if(mode!=='free'){for(let i=0;i<order.length;i++){if(!isDone(order[i])){start=i;break;}}}
  buildRoom(start,'left');
  state='play';panel=null;finish=null;
  Snd.click();
  toast(L('Подойдите к предмету и нажмите ✦','Approach an object and press ✦'));
}
function startTrans(dir){
  const next=(roomIdx+dir+order.length)%order.length;
  trans={t:0,dir,next,swapped:false};
  state='trans';Snd.whoosh();
}
function nearestObj(){
  if(!R)return null;
  let best=null,bd=1.05;
  for(const ob of R.objs){const dd=Math.abs(ob.x-player.x);if(dd<bd){bd=dd;best=ob;}}
  return best;
}
function layoutPanel(){
  if(!panel)return;
  const pw=SW-12,innerW=pw-16;
  const lines=wrapText(panel.ob.o.d[lang],innerW,1);
  const headH=24,footH=20,lineH=9;
  const maxH=SH-34;
  const perPage=Math.max(3,Math.floor((maxH-headH-footH-10)/lineH));
  const pages=[];for(let i=0;i<lines.length;i+=perPage)pages.push(lines.slice(i,i+perPage));
  panel.pages=pages;panel.page=clamp(panel.page,0,pages.length-1);
  panel.pw=pw;panel.headH=headH;panel.footH=footH;panel.lineH=lineH;
}
function openPanel(ob){
  player.dir=ob.x>=player.x?1:-1;
  player.anim=['reach','note','glasses','bow'][Math.floor(Math.random()*4)];
  player.animT=0;player.moving=false;
  panel={ob,page:0,t:0,pages:[],pw:0,headH:24,footH:20,lineH:9};
  layoutPanel();
  state='read';Snd.open();
  if(mode!=='free'){
    const m=save.modes[mode],rid=R.room.id;
    if(!m.reads[rid])m.reads[rid]=[];
    if(m.reads[rid].indexOf(ob.idx)<0){m.reads[rid].push(ob.idx);persist();}
    if(m.reads[rid].length>=R.room.objs.length&&m.done.indexOf(rid)<0){
      m.done.push(rid);persist();pendingComplete=true;
      if(order.every(id=>m.done.indexOf(id)>=0))pendingFinish=true;
    }
  }
}
function panelNext(){if(!panel)return;if(panel.page<panel.pages.length-1){panel.page++;Snd.page();}else closePanel();}
function panelPrev(){if(!panel)return;if(panel.page>0){panel.page--;Snd.page();}}
function closePanel(){
  panel=null;state='play';player.anim=null;Snd.close();
  if(pendingComplete){pendingComplete=false;toast(L('Комната изучена ✓','Room studied ✓'));Snd.complete();stampT=1.1;}
  if(pendingFinish){pendingFinish=false;finishDelay=1.2;}
}
function triggerFinish(){
  const newly=[];
  const cDone=save.modes.chrono.done.length>=ROOMS_C.length;
  const bDone=save.modes.bonus.done.length>=ROOMS_B.length;
  if(mode==='chrono'&&cDone&&!save.unlocks.bonus){save.unlocks.bonus=true;newly.push(1);}
  if(cDone&&bDone&&!save.unlocks.free){save.unlocks.free=true;newly.push(2);}
  persist();
  finish={t:0,newly};state='finish';Snd.unlock();
}
function pauseGame(){if(state!=='play'&&state!=='read')return;if(state==='read')panel=null;state='pause';Snd.duck(0);}
function resumeGame(){state='play';Snd.duck(1);Snd.click();}
function toTitle(){state='title';panel=null;finish=null;player.anim=null;Snd.duck(1);buildTitleBg();}
function pressStart(){
  if(state==='title')startGame();
  else if(state==='play'||state==='read')pauseGame();
  else if(state==='pause')resumeGame();
  else if(state==='finish')toTitle();
}
function doInteract(){
  if(state==='title'){regenSeed();return;}
  if(state==='read'){panelNext();return;}
  if(state==='finish'){toTitle();return;}
  if(state==='pause'){resumeGame();return;}
  if(state!=='play')return;
  const ob=nearestObj();
  if(!ob){Snd.page();return;}
  openPanel(ob);
}
function regenSeed(){save.seed=(Math.random()*0xFFFFFFFF)>>>0;persist();buildTitleBg();toast(L('Новый сид','New seed'));Snd.click();}
function setLang(l){save.lang=l;lang=l;persist();tcache.clear();if(panel)layoutPanel();Snd.click();}
function toggleSound(){save.sound=!save.sound;persist();Snd.init();Snd.setOn(save.sound);if(save.sound)Snd.click();}
function cycleMode(d){modeIdx=(modeIdx+d+3)%3;Snd.click();}
function openWiki(){if(!panel)return;try{window.open(wikiUrl(panel.ob.o.w),'_blank');}catch(e){}toast(L('Открыто в новой вкладке ↗','Opened in a new tab ↗'));Snd.click();}
function pressButton(id){
  pressFlash[id]=0.15;
  switch(id){
    case 'left':if(state==='title')cycleMode(-1);else if(state==='read')panelPrev();break;
    case 'right':if(state==='title')cycleMode(1);else if(state==='read')panelNext();break;
    case 'start':pressStart();break;
    case 'act':doInteract();break;
    case 'snd':case 'sndMini':toggleSound();break;
    case 'lang_ru':setLang('ru');break;
    case 'lang_en':setLang('en');break;
    case 'seed':regenSeed();break;
    case 'mode_l':cycleMode(-1);break;
    case 'mode_r':cycleMode(1);break;
    case 'wiki':openWiki();break;
    case 'next':panelNext();break;

function spawnFootPuff(){
  if(!R)return;
  PARTS.dust.push({x:player.x*S-cam,y:GY-2,vx:-player.dir*14,vy:-8,ph:0,r:1,puff:0.4});
}
function update(dt){
  time+=dt;titleT+=dt;
  Snd.tick();
  for(const k in pressFlash)pressFlash[k]=Math.max(0,pressFlash[k]-dt);
  toasts=toasts.filter(t=>(t.t+=dt)<t.life);
  if(stampT>0)stampT-=dt;
  shake=Math.max(0,shake-dt*6);
  flashA=Math.max(0,flashA-dt*2.6);
  if(glitchBurst>0)glitchBurst-=dt;
  if(state==='title')return;
  if(state==='pause')return;
  if(state==='finish'){finish.t+=dt;return;}
  if(state==='trans'){
    trans.t+=dt/1.8;
    if(trans.t>=0.5&&!trans.swapped){buildRoom(trans.next,trans.dir>0?'left':'right');trans.swapped=true;}
    if(trans.t>=1)state='play';
    updateParticles(dt);
    return;
  }
  updateParticles(dt);
  const d=R.d;
  if(d.weather===4){lightT-=dt;if(lightT<=0){flashA=1;shake=2.2;Snd.thunder();lightT=3.5+Math.random()*6;}}
  if(d.glitch>0.22){glitchT-=dt;if(glitchT<=0){glitchBurst=0.1+d.glitch*0.16;glitchT=1.6+Math.random()*4/(d.glitch+0.25);}}
  player.blinkT-=dt;
  if(player.blinkT<=0){player.blink=0.13;player.blinkT=2.4+Math.random()*3;}
  if(player.blink>0)player.blink-=dt;
  if(player.anim)player.animT+=dt;
  if(state==='read')return;
  if(finishDelay>0){finishDelay-=dt;if(finishDelay<=0){triggerFinish();return;}}
  player.idleT-=dt;
  if(player.idleT<=0&&!player.moving){player.anim=Math.random()<0.5?'glasses':null;player.animT=0;player.idleT=4+Math.random()*4;}
  const dir=(Input.right?1:0)-(Input.left?1:0);
  if(dir!==0){
    player.dir=dir;player.moving=true;player.anim=null;
    player.x+=dir*1.6*dt;
    player.phase+=dt*7.4;
    const si=Math.floor(player.phase/Math.PI);
    if(si!==player.lastStep){player.lastStep=si;Snd.step(si%2===0);spawnFootPuff();}
  }else player.moving=false;
  const minX=0.3,maxX=R.roomW-0.3;
  const atL=player.x<=minX+0.001,atR=player.x>=maxX-0.001;
  player.x=clamp(player.x,minX,maxX);
  if((atL&&dir<0)||(atR&&dir>0)){
    if(edgeHold.dir===dir)edgeHold.t+=dt;else edgeHold={dir,t:0};
    if(edgeHold.t>0.22){startTrans(dir);return;}
  }else edgeHold.t=Math.max(0,edgeHold.t-dt*2);
  const target=player.x*S-SW/2+player.dir*SW*0.07;
  cam+=(target-cam)*(1-Math.exp(-dt*5));
  cam=clamp(cam,0,R.roomW*S-SW);
}
function updateParticles(dt){
  for(const p of PARTS.precip){
    if(p.kind==='rain'){p.y+=p.v*dt;p.x-=p.v*0.18*dt;if(p.y>SH){p.y=-8;p.x=Math.random()*SW;}if(p.x<0)p.x+=SW;}
    else{p.sw+=dt*2;p.y+=p.v*dt;p.x+=Math.sin(p.sw)*12*dt;if(p.y>SH){p.y=-4;p.x=Math.random()*SW;}if(p.x<0)p.x+=SW;if(p.x>SW)p.x-=SW;}
  }
  for(let i=PARTS.dust.length-1;i>=0;i--){
    const p=PARTS.dust[i];
    if(p.puff!==undefined){p.puff-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=20*dt;if(p.puff<=0)PARTS.dust.splice(i,1);continue;}
    p.ph+=dt;p.x+=p.vx*dt+Math.sin(p.ph)*3*dt;p.y+=p.vy*dt;
    if(p.y<0){p.y=GY*0.9;p.x=Math.random()*SW;}
    if(p.x<0)p.x+=SW;if(p.x>SW)p.x-=SW;
  }
  for(const p of PARTS.spark){p.y-=p.v*dt;p.ph+=dt;if(p.y<-10){p.y=SH+6;p.x=Math.random()*SW;}}
}

  g.drawImage(skyC,-Math.round(cam*0.06+shX*0.3),Math.round(shY*0.3));
  g.drawImage(farC,-Math.round(cam*0.16+shX*0.5),Math.round(shY*0.5));
  g.drawImage(midC,-Math.round(cam*0.38+shX*0.7),Math.round(shY*0.7));
  drawPrecip(g,false);
  g.drawImage(roomC,-camX,Math.round(shY));
  for(const dd of R.decor){const x=dd.x*S-camX;if(x>-80&&x<SW+80)renderDecor(g,dd.kind,x,R.P,time);}
  drawEdgeSigns(g,camX);
  drawObjects(g,camX);
  drawEmmy(g,player.x*S-camX,GY+Math.round(shY),R.age,{dir:player.dir,phase:player.phase,moving:player.moving,blink:player.blink,anim:player.anim,animT:player.animT,t:time});
  drawPrecip(g,true);
  drawDust(g);
  drawLight(g);
  drawEffects(g);
  drawHUD(g);
  drawPrompt(g);
  drawToasts(g);
  if(state==='read')drawPanel(g);
  if(state==='trans')drawTrans(g);
  if(state==='pause')drawPause(g);
  if(state==='finish')drawFinish(g);
}
function renderTitle(g){
  const P=titleP;
  const drift=Math.round(titleT*6)%120;
  g.drawImage(titleSky,0,0);
  g.drawImage(titleFar,-drift,0);
  for(let i=0;i<3;i++){
    const a=titleT*0.4+i*2.1;
    const x=SW*(0.25+i*0.25)+Math.cos(a)*18,y=SH*0.3+Math.sin(a)*12;
    px(g,x-2,y-2,4,4,i%2?P.acc:P.acc2);
  }
  g.fillStyle='rgba(6,4,14,0.35)';g.fillRect(0,0,SW,SH);
  const chips=[['ru','RU'],['en','EN']];
  let cx2=6;
  for(const c of chips){
    const w=20,on=lang===c[0];
    px(g,cx2,4,w,11,on?P.acc:'rgba(20,16,32,0.8)');
    outline(g,cx2,4,w,11,on?mixc(P.acc,'#ffffff',0.3):'#4a4460');
    drawText(g,c[1],cx2+w/2,6,on?'#fff4e0':'#8a84a0',1,1);
    btnW('lang_'+c[0],cx2,4,w,11);cx2+=w+4;
  }
  if(SW>=260)drawText(g,'offline · canvas · web audio',SW-6,6,'#5a5470',1,2);
  const compact=SH<230;
  const lsc=compact?2:(SW>300?4:3);
  const ly=Math.max(20,Math.round(SH*0.09));
  const shimmer=0.5+0.5*Math.sin(titleT*1.6);
  drawText(g,'NOETHER',SW/2+1,ly+1,rgba(P.acc,0.5),lsc,1);
  drawText(g,'NOETHER',SW/2,ly,mixc('#f0ead8',P.acc2,shimmer*0.35),lsc,1);
  px(g,SW/2-textW('NOETHER',lsc)/2,ly+9*lsc+3,textW('NOETHER',lsc),1,rgba(P.acc2,0.6));
  const subTxt=L('Прогулка по жизни Эмми Нётер','A walk through the life of Emmy Noether');
  const sub=compact?[fitText(subTxt,SW*0.9,1)]:wrapText(subTxt,SW*0.85,1);
  let sy=ly+9*lsc+8;
  for(const ln of sub){drawText(g,ln,SW/2,sy,'#b8b2c8',1,1);sy+=10;}
  const my=sy+(compact?6:14);
  const M=MODES[modeIdx],unlocked=modeUnlocked(modeIdx);
  const aw=18;
  px(g,SW*0.08,my,aw,18,'rgba(20,16,32,0.85)');outline(g,SW*0.08,my,aw,18,'#4a4460');
  drawText(g,'←',SW*0.08+aw/2,my+5,'#e8e2d4',1,1);btnW('mode_l',SW*0.08,my,aw,18);
  px(g,SW*0.92-aw,my,aw,18,'rgba(20,16,32,0.85)');outline(g,SW*0.92-aw,my,aw,18,'#4a4460');
  drawText(g,'→',SW*0.92-aw/2,my+5,'#e8e2d4',1,1);btnW('mode_r',SW*0.92-aw,my,aw,18);
  drawText(g,fitText(M.name[lang],SW*0.6,2),SW/2,my+1,unlocked?'#f0ead8':'#6a6480',2,1);
  const descTxt=unlocked?M.desc[lang]:('× '+M.lock[lang]);
  const desc=compact?[fitText(descTxt,SW*0.85,1)]:wrapText(descTxt,SW*0.8,1);
  let dy=my+22;
  for(const ln of desc){drawText(g,ln,SW/2,dy,unlocked?'#b8b2c8':'#b08a6a',1,1);dy+=10;}
  if(modeIdx<2){
    const pr=modeProgress(M.id),tot=modeRooms(M.id).length;
    drawText(g,L('изучено: ','studied: ')+pr+' / '+tot+(pr>=tot?' ✓':''),SW/2,dy+2,pr>=tot?'#7ac97a':'#8a84a0',1,1);
  }else{
    drawText(g,fitText(L('порядок комнат зависит от сида','room order depends on the seed'),SW*0.9,1),SW/2,dy+2,'#8a84a0',1,1);
  }
  const dotsY=dy+14;
  for(let i=0;i<3;i++){
    const dx=SW/2-12+i*12;
    px(g,dx,dotsY,8,4,i===modeIdx?P.acc2:(modeUnlocked(i)?'#4a4460':'#2a2438'));
    if(!modeUnlocked(i))px(g,dx+3,dotsY+1,2,2,'#b04a32');
  }
  const seedTxt='SEED '+save.seed.toString(16).toUpperCase().padStart(8,'0')+' · ✦ '+L('новый','new');
  const sw2=textW(seedTxt,1)+12,sx2=SW/2-sw2/2,sy2=Math.max(dotsY+12,Math.round(SH*(compact?0.72:0.68)));
  px(g,sx2,sy2,sw2,15,'rgba(20,16,32,0.85)');outline(g,sx2,sy2,sw2,15,P.acc);
  drawText(g,seedTxt,sx2+6,sy2+3,'#ffe9b0',1);btnW('seed',sx2,sy2,sw2,15);
  drawText(g,L('СТАРТ — начать прогулку','START — begin the walk'),SW/2,sy2+22,'#6a6480',1,1);
  if(!compact){
    const ex=SW*0.5+Math.sin(titleT*0.22)*SW*0.32;
    const edir=Math.cos(titleT*0.22)>=0?1:-1;
    const egy=Math.round(SH*0.94);
    px(g,0,egy,SW,SH-egy,rgba(P.floor,0.9));
    px(g,0,egy,SW,2,rgba(P.acc2,0.5));
    const saveS=S;S=SH/9;
    drawEmmy(g,ex,egy,'mature',{dir:edir,phase:titleT*5,moving:true,blink:0,anim:null,animT:0,t:titleT});
    S=saveS;
  }
}
/* ---------- console ---------- */
function drawSpeaker(g,x,y,s,on){
  const c=on?'#7ac97a':'#b04a32';
  px(g,x,y+s*0.32,s*0.26,s*0.36,c);
  px(g,x+s*0.26,y+s*0.2,s*0.14,s*0.6,c);
  px(g,x+s*0.4,y+s*0.08,s*0.12,s*0.84,c);
  if(on){
    px(g,x+s*0.62,y+s*0.3,s*0.12,s*0.12,c);
    px(g,x+s*0.74,y+s*0.18,s*0.12,s*0.12,c);
    px(g,x+s*0.74,y+s*0.66,s*0.12,s*0.12,c);
    px(g,x+s*0.86,y+s*0.42,s*0.12,s*0.12,c);
  }else{
    px(g,x+s*0.6,y+s*0.2,s*0.34,s*0.12,c);
    px(g,x+s*0.6,y+s*0.66,s*0.34,s*0.12,c);
    px(g,x+s*0.72,y+s*0.32,s*0.12,s*0.36,c);
  }
}
function drawConsole(){
  const g=ctx;
  px(g,0,DY,W,DH,'#1c1826');
  px(g,0,DY,W,2,'#2e2840');
  px(g,0,DY+2,W,1,'#0a0812');
  drawText(g,'NOETHER · N-1882',W/2,DY+4,'#5a5470',1,1);
  for(const cxx of [4,W-6])for(const cyy of [DY+5,DY+DH-7])px(g,cxx,cyy,2,2,'#3a3450');
  const bs=clamp(Math.round(DH*0.46),24,40);
  const by=DY+Math.round(DH*0.26);
  const lx=Math.round(W*0.055);
  const mkArrow=(x,id,glyph)=>{
    const held=Input[id]||pressFlash[id]>0;
    const oy=held?1:0;
    px(g,x,by+oy,bs,bs-oy,held?'#221c30':'#2a2438');
    px(g,x,by+oy,bs,2,held?'#3a3450':'#4a4460');
    outline(g,x,by+oy,bs,bs-oy,'#0a0812');
    drawText(g,glyph,x+bs/2,by+oy+bs/2-7,held?'#ffe9b0':'#c8c2d8',2,1);
    btn(id,x,by,bs,bs,true);
  };
  mkArrow(lx,'left','←');mkArrow(lx+bs+6,'right','→');
  const ibs=bs+4,ix=W-Math.round(W*0.055)-ibs;
  const near=state==='play'&&nearestObj();
  const heldA=pressFlash.act>0;
  const ac=heldA?'#b8862e':'#d9a441';
  g.fillStyle=ac;g.beginPath();g.arc(ix+ibs/2,by+ibs/2+(heldA?1:0),ibs/2,0,Math.PI*2);g.fill();
  g.strokeStyle='#0a0812';g.lineWidth=2;g.beginPath();g.arc(ix+ibs/2,by+ibs/2+(heldA?1:0),ibs/2-1,0,Math.PI*2);g.stroke();
  if(near){const pl=0.5+0.5*Math.sin(time*4);g.strokeStyle=rgba('#ffe9b0',0.4+0.5*pl);g.beginPath();g.arc(ix+ibs/2,by+ibs/2,ibs/2+2,0,Math.PI*2);g.stroke();}
  drawText(g,'✦',ix+ibs/2,by+ibs/2-7+(heldA?1:0),'#241c10',2,1);
  btn('act',ix,by,ibs,ibs);
  drawText(g,L('ИЗУЧИТЬ','STUDY'),ix+ibs/2,by+ibs+3,'#8a84a0',1,1);
  const leftEnd=lx+bs*2+6;
  const zoneC=(leftEnd+ix)/2;
  const sw3=Math.min(52,Math.round(W*0.2),Math.max(30,ix-leftEnd-6)),sh3=13;
  const sx3=Math.round(zoneC-sw3/2),sy3=DY+Math.round(DH*0.3);
  const heldS=pressFlash.start>0;
  px(g,sx3,sy3+(heldS?1:0),sw3,sh3,heldS?'#8a3a26':'#b04a32');
  outline(g,sx3,sy3+(heldS?1:0),sw3,sh3,'#0a0812');
  px(g,sx3,sy3+(heldS?1:0),sw3,1,'#d97a5c');
  drawText(g,L('СТАРТ','START'),sx3+sw3/2,sy3+3+(heldS?1:0),'#fff4e0',1,1);
  btn('start',sx3,sy3,sw3,sh3);
  const ss=15,sndx=Math.round(zoneC-ss/2),sndy=DY+Math.round(DH*0.62);
  px(g,sndx,sndy,ss,ss,'#2a2438');outline(g,sndx,sndy,ss,ss,'#0a0812');
  drawSpeaker(g,sndx+3,sndy+3,9,save.sound);
  px(g,sndx+ss-4,sndy+2,2,2,save.sound?'#7ac97a':'#b04a32');
  btn('snd',sndx,sndy,ss,ss);
  drawText(g,L('ЗВУК','SOUND'),zoneC,sndy+ss+3,'#8a84a0',1,1);
  for(let r=0;r<3;r++)for(let c=0;c<4;c++)px(g,sndx-14+c*3,sndy+3+r*3,1,1,'#3a3450');
}
function render(){
  uiButtons=[];
  ctx.fillStyle='#14101f';ctx.fillRect(0,0,W,H);
  px(ctx,0,0,W,2,'#241e34');
  const g=worldG;
  if(state==='title')renderTitle(g);else if(R)renderWorld(g);
  ctx.drawImage(worldC,SX,SY);
  outline(ctx,SX-2,SY-2,SW+4,SH+4,'#0a0812');
  outline(ctx,SX-1,SY-1,SW+2,SH+2,'#2e2840');
  px(ctx,SX,SY,SW,1,'rgba(255,255,255,0.05)');
  drawConsole();
}
/* ---------- input attach ---------- */
function canvasPos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function attachInput(){
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();Snd.init();Snd.resume();
    const p=canvasPos(e),b=hitBtn(p.x,p.y);
    if(!b)return;
    pressFlash[b.id]=0.15;
    if(b.hold){Input.ptr.set(e.pointerId,b.id);if(state==='play')Input[b.id]=true;else pressButton(b.id);}
    else pressButton(b.id);
  });
  const up=e=>{const id=Input.ptr.get(e.pointerId);if(id){Input[id]=false;Input.ptr.delete(e.pointerId);}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0)e.preventDefault();
    if(e.repeat)return;
    Snd.init();Snd.resume();
    switch(e.code){
      case 'ArrowLeft':case 'KeyA':if(state==='title')cycleMode(-1);else if(state==='read')panelPrev();else Input.left=true;break;
      case 'ArrowRight':case 'KeyD':if(state==='title')cycleMode(1);else if(state==='read')panelNext();else Input.right=true;break;
      case 'KeyE':case 'Space':pressButton('act');break;
      case 'Enter':case 'KeyP':pressButton('start');break;
      case 'Escape':if(state==='read')closePanel();else if(state==='play')pauseGame();else if(state==='pause')resumeGame();break;
      case 'KeyM':pressButton('snd');break;
      case 'KeyL':setLang(lang==='ru'?'en':'ru');break;
      case 'KeyR':if(state==='title')regenSeed();break;
    }
  });
  window.addEventListener('keyup',e=>{
    if(e.code==='ArrowLeft'||e.code==='KeyA')Input.left=false;
    if(e.code==='ArrowRight'||e.code==='KeyD')Input.right=false;
  });
  window.addEventListener('resize',onResize);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(state==='play'||state==='read')pauseGame();if(Snd.ctx)Snd.ctx.suspend().catch(()=>{});}
    else if(Snd.ctx&&save.sound)Snd.ctx.resume().catch(()=>{});
  });
}
function onResize(){
  layout();
  worldC=mkC(SW,SH);worldG=worldC.getContext('2d');
  if(R){buildRoomCaches(R);initParticles(R);cam=clamp(cam,0,R.roomW*S-SW);if(panel)layoutPanel();}
  buildTitleBg();
}
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastTs)lastTs=ts;
  let dt=(ts-lastTs)/1000;lastTs=ts;
  dt=Math.min(dt,0.05);
  update(dt);render();
}
function boot(){
  cv=document.getElementById('game');ctx=cv.getContext('2d');
  loadSave();lang=save.lang;
  layout();
  worldC=mkC(SW,SH);worldG=worldC.getContext('2d');
  buildTitleBg();
  attachInput();
  requestAnimationFrame(frame);
}
if(typeof window!=='undefined'&&typeof document!=='undefined'&&typeof document.getElementById==='function'&&document.getElementById('game'))boot();
</script>
