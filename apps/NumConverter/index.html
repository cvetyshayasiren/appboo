<!DOCTYPE html>
<html lang="ru" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b0f">
<title>NumConverter — механический конвертер систем счисления</title>
<style>
/* ===================================================================
   NumConverter — конвертер систем счисления с барабанами-одометрами.
   Один файл: стили, разметка и логика. Темы: neon / steam / nordic.
   =================================================================== */

/* ---------------- 1. Сброс и базовая геометрия страницы ------------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;               /* документ НИКОГДА не скроллится */
  overscroll-behavior: none;      /* без pull-to-refresh и цепочек */
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg0);
  -webkit-font-smoothing: antialiased;
  user-select: none;              /* интерфейс — как физический прибор */
  touch-action: manipulation;
}

/* каркас приложения: шапка / доска / подвал, всё в пределах экрана */
#app {
  position: relative;
  height: 100vh;                  /* фолбэк для старых браузеров */
  height: 100dvh;                 /* точная высота на мобильных */
  display: flex;
  flex-direction: column;
  overflow: hidden;
  isolation: isolate;             /* свой контекст наложения для FX-слоёв */
}

/* ---------------- 2. Атмосферные FX-слои (постобработка) ----------- */
/* Все слои фиксированы, pointer-events:none — не мешают управлению. */

.fx { position: fixed; inset: 0; pointer-events: none; }

/* Конвергирующие линии фона — визуальный нарратив к барабанам */
.fx-lines {
  z-index: 0;
  background: var(--lines-img) center / cover no-repeat;
  opacity: var(--lines-op);
  mix-blend-mode: var(--fx-blend, screen);
}

/* Лёгкий туман/дымка — крупные медленно плывущие пятна */
.fx-fog {
  z-index: 80;
  opacity: var(--fog);
  background:
    radial-gradient(42vw 42vh at 18% 24%, var(--fog-c1), transparent 70%),
    radial-gradient(50vw 44vh at 82% 78%, var(--fog-c2), transparent 72%);
  animation: fogDrift 26s ease-in-out infinite alternate;
}

/* Редкий быстрый блик ограничен шапкой и не перекрывает рабочую область. */
.fx-sheen {
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: var(--sheen);
  background: linear-gradient(112deg,
    transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%);
  background-size: 240% 100%;
  animation: sheenSweep 26s linear infinite;
  will-change: background-position;
  pointer-events: none;
}

/* Зернистость плёнки: тайл шума из SVG feTurbulence + дрожание */
.fx-grain {
  z-index: 90;
  opacity: var(--grain);
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  background-size: 140px 140px;
  inset: -24px;
  animation: grainJitter 1.1s steps(4) infinite;
}

/* Сканлайны — только для неоновой темы (прозрачно в остальных) */
.fx-scan {
  z-index: 91;
  opacity: var(--scan);
  background: repeating-linear-gradient(0deg,
    rgba(255,255,255,.45) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}

/* Царапины и потёртости защитного стекла */
.fx-scratch {
  z-index: 92;
  opacity: var(--scratch);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><g fill='none' stroke='white' stroke-width='0.6'><path d='M20 38 C 90 62, 180 26, 284 52' opacity='.7'/><path d='M38 152 C 118 128, 198 172, 272 138' opacity='.55'/><path d='M8 98 L 92 94' opacity='.4'/><path d='M210 18 L 262 84' opacity='.45'/></g></svg>");
  background-size: cover;
}

/* Виньетирование по краям экрана */
.fx-vignette {
  z-index: 93;
  background: radial-gradient(ellipse at 50% 46%,
    transparent 52%, rgba(0,0,0,var(--vign)) 118%);
}

/* Защитное стекло: глянец сверху, хроматическая кромка, внутренние тени */
.fx-glass {
  z-index: 95;
  background: linear-gradient(168deg,
    rgba(255,255,255,.055) 0%, transparent 20%,
    transparent 80%, rgba(255,255,255,.028) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 0 0 0 1px rgba(255,255,255,.045),
    inset 1.5px 0 0 var(--aber-c1-soft),
    inset -1.5px 0 0 var(--aber-c2-soft),
    inset 0 -14px 34px rgba(0,0,0,.22);
}

/* ---------------- 3. Шапка приложения ------------------------------ */
.app-head {
  position: relative;
  z-index: 5;
  overflow: hidden;
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: clamp(10px, 2.2dvh, 20px) clamp(14px, 5vw, 54px) 6px clamp(14px, 6vw, 64px);
}

/* Название стилизуется под тему через переменные */
.brand-block, .head-right {
  position: relative;
  z-index: 1;
}

.brand {
  font-family: var(--font-display);
  font-weight: var(--brand-weight, 800);
  font-size: clamp(1.15rem, 3.4vw, 1.9rem);
  letter-spacing: var(--brand-ls, .3em);
  line-height: 1.05;
  color: var(--ink);
  text-shadow: var(--brand-shadow, none);
  text-transform: uppercase;
  white-space: nowrap;
}
.brand span { color: var(--accent); }

.brand-sub {
  margin-top: 3px;
  font-family: var(--font-mono);
  font-size: clamp(.55rem, 1.4vw, .68rem);
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.head-right {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.6vw, 18px);
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* Текущее значение в десятичной системе */
.readout {
  position: relative;             /* якорь для поля ввода значения */
  display: flex;
  align-items: baseline;
  gap: 8px;
  max-width: min(38vw, 420px);
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  background: var(--panel);
  font-family: var(--font-mono);
  cursor: pointer;
}
.readout-label {
  font-size: .58rem;
  letter-spacing: .22em;
  color: var(--accent);
  flex: 0 0 auto;
}
.readout-val {
  font-size: clamp(.72rem, 1.7vw, .95rem);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;               /* хвост числа важнее — прижат справа */
  text-align: left;
}
.readout:active { transform: translateY(1px); }

/* Редактор значения: клик по табло превращает его в поле ввода
   (Enter — применить, Esc или клик мимо — отмена) */
.readout.editing { border-color: var(--accent); }
.readout.editing .readout-label,
.readout.editing .readout-val { visibility: hidden; }
#valInput {
  display: none;
  position: absolute;
  inset: 0;
  width: 100%;
  border: none;
  background: var(--accent-ghost);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: clamp(.72rem, 1.7vw, .95rem);
  letter-spacing: .08em;
  padding: 6px 12px;
  outline: none;
  user-select: text;
}
.readout.editing #valInput { display: block; }

/* Переключатель тем */
.themes {
  display: flex;
  gap: 6px;
  padding: 4px;
  border: 1px solid var(--border);
  background: var(--panel);
}
.theme-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: .58rem;
  letter-spacing: .16em;
  cursor: pointer;
  transition: color .25s, border-color .25s, background .25s;
}
.theme-btn .sw {
  width: 10px; height: 10px;
  border-radius: 1px;
  box-shadow: 0 0 6px rgba(0,0,0,.4) inset;
}
.sw-neon { background: linear-gradient(120deg, #22d3ee 50%, #e0479e 50%); }
.sw-steam { background: linear-gradient(120deg, #e8a33d 50%, #7a4d20 50%); }
.sw-nordic { background: linear-gradient(120deg, #7d9b76 50%, #d9c8a6 50%); }
.theme-btn:hover { color: var(--ink); border-color: var(--border-strong); }
.theme-btn[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-ghost);
}

/* Кнопка "+" на мобильных (быстрый переход к слайду добавления) */
.m-add {
  display: none;
  width: 34px; height: 34px;
  border: 1px solid var(--accent);
  background: var(--accent-ghost);
  color: var(--accent);
  font-size: 1.25rem;
  line-height: 1;
  cursor: pointer;
}

/* ---------------- 4. Доска систем счисления ------------------------ */
/* Единая вёрстка для всех экранов: вертикальный список карточек.
   Скролл — только внутри доски, документ никогда не скроллится.       */
.board {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;                  /* ключ к «без скролла документа» */
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
  padding: 12px clamp(14px, 4vw, 32px) 16px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  touch-action: pan-y;            /* вертикальный жест ведёт список */
  scroll-snap-type: y proximity;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
.board::-webkit-scrollbar { width: 6px; }
.board::-webkit-scrollbar-thumb { background: var(--border-strong); }
.board::-webkit-scrollbar-track { background: transparent; }

/* Карточки занимают всю ширину доски (всегда вертикальный список) */
.board > * {
  flex: 0 0 auto;
  width: 100%;
  scroll-snap-align: start;
}
/* ---------------- 5. Панель системы счисления ---------------------- */
.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  border: 1px solid var(--border);
  border-top: 1px solid var(--border-strong);
  background:
    var(--panel-tex),
    linear-gradient(180deg, var(--panel2), var(--panel));
  box-shadow: var(--panel-shadow);
  /* глубина резкости: периферия слегка размыта, фокус при наведении */
  filter: blur(calc(var(--dof) * 1px));
  transition: filter .35s ease, border-color .3s, box-shadow .3s,
              background-color .4s;
}
.panel:hover, .panel:focus-within { filter: blur(0); }

/* Зубчатая брутальная кромка сверху — метка «прибора».
   У активной карточки полоса расползается на всю ширину. */
.panel::before {
  content: "";
  position: absolute;
  top: -1px; left: 0;
  width: 34%; height: 3px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  transition: width .35s ease;
}

/* Активная карточка — система, показанная в табло шапки */
.panel.active {
  border-color: var(--accent);
  box-shadow:
    0 0 0 1px var(--accent-ghost),
    0 0 26px var(--accent-ghost),
    var(--panel-shadow);
}
.panel.active .sys-base {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

/* Заклёпки по углам панели (стимпанк), в других темах прозрачны */
.panel::after {
  content: "";
  position: absolute;
  inset: 4px;
  pointer-events: none;
  background: var(--rivets-img) top left / 100% 100% no-repeat;
  opacity: var(--rivets, 0);
}

.panel-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}

/* Шапка-кнопка: клик открывает редактор основания (карточка обновится) */
.panel-id {
  display: flex;
  align-items: baseline;
  gap: 9px;
  min-width: 0;
  border: none;
  background: transparent;
  padding: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.panel-id:hover .sys-name { color: var(--accent); }
.sys-name {
  font-family: var(--font-display);
  font-size: clamp(.72rem, 1.9vw, .92rem);
  font-weight: 800;
  letter-spacing: .16em;
  color: var(--ink);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sys-base {
  flex: 0 0 auto;
  padding: 1px 6px;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .06em;
  background: var(--accent-ghost);
}

/* Кнопка «быстрого переключения» — делает систему активной (⇄) */
.sys-act {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--ink-dim);
  cursor: pointer;
  opacity: .75;
  transition: opacity .2s, color .2s, border-color .2s, background .2s;
}
.sys-act svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.5; fill: none; }
.sys-act:hover {
  opacity: 1;
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-ghost);
}
.panel.active .sys-act {
  opacity: 1;
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-ghost);
}

/* Крестик удаления системы */
.sys-del {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  opacity: .55;
  transition: opacity .2s, color .2s, border-color .2s, background .2s;
}
.sys-del svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.6; }
.sys-del:hover, .panel:focus-within .sys-del {
  opacity: 1;
  color: var(--hot);
  border-color: var(--hot);
  background: rgba(220, 60, 60, .08);
}

/* Форма смены основания — раскрывается вместо шапки-кнопки */
.base-edit { display: none; align-items: center; gap: 6px; }
.panel-head.editing .panel-id { display: none; }
.panel-head.editing .base-edit { display: flex; }
.base-edit-input {
  width: 64px;
  padding: 4px 8px;
  border: 1px solid var(--accent);
  border-left: 3px solid var(--accent);
  background: var(--drum-face);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: .8rem;
  outline: none;
  user-select: text;
  -moz-appearance: textfield; appearance: textfield;
}
.base-edit-input::-webkit-outer-spin-button,
.base-edit-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.base-edit-input:focus { border-color: var(--accent); }
.be-ok, .be-cancel {
  flex: 0 0 auto;
  width: 22px; height: 22px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--ink-dim);
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.be-ok svg, .be-cancel svg { width: 9px; height: 9px; stroke: currentColor; stroke-width: 1.6; fill: none; }
.be-ok:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-ghost); }
.be-cancel:hover { color: var(--hot); border-color: var(--hot); }

.panel-foot {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: .56rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------------- 6. Барабаны-одометры ----------------------------- */
.drums-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 9px 0;
}

/* Горизонтальный контейнер барабанов (края растворяются — имитация ГРИП).
   Полоска прокрутки появляется только когда барабаны не влезают в карточку */
.drums-row {
  position: relative;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  overscroll-behavior-y: auto; /* вертикальная прокрутка передаётся доске */
  /* Горизонтальный жест прокручивает ряд, вертикальный — общую доску. */
  touch-action: pan-x pan-y;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
  mask-image: linear-gradient(90deg,
    transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
  -webkit-mask-image: linear-gradient(90deg,
    transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
}
.drums-row::-webkit-scrollbar { height: 6px; }
.drums-row::-webkit-scrollbar-track { background: transparent; }
.drums-row::-webkit-scrollbar-thumb { background: var(--border-strong); }
.drums-row::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.drums-inner {
  position: relative;
  display: flex;
  gap: 9px;
  width: max-content;
  margin: 0 0 0 auto;             /* прижаты к правому краю: младший разряд справа */
  padding: 0 26px 0 14px;         /* справа ≥ 26px зоны растворения — цифра не «тает» */
}

/* Один барабан: вертикальный скролл-контейнер со снап-привязкой.
   Видны ТРИ значения: выбранная цифра и по одной соседней сверху/снизу
   (+22px — зона под стрелки-степперы по краям барабана). */
.drum {
  --drum-h: calc(var(--cell-h) * 3 + 22px);
  position: relative;
  width: var(--drum-w);
  height: var(--drum-h);
  flex: 0 0 auto;
  overflow: hidden;               /* барабан — только визуальный индикатор */
  overscroll-behavior: auto;
  scroll-snap-type: none;
  touch-action: pan-y;            /* вертикальный жест проходит к общей доске */
  scrollbar-width: none;
  cursor: default;
  border: 1px solid var(--border);
  background:
    linear-gradient(180deg, rgba(0,0,0,.34), transparent 26%, transparent 74%, rgba(0,0,0,.4)),
    var(--drum-face);
  outline: none;
}
.drum:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* Стрипа с цифрами: сверху/снизу «холостые» поля для центровки крайних цифр */
.strip {
  display: flex;
  flex-direction: column;
  padding-top: calc((var(--drum-h) - var(--cell-h)) / 2);
  padding-bottom: calc((var(--drum-h) - var(--cell-h)) / 2);
}
/* Колесный жест двигает ленту transform'ом (без нативного скролла):
   плавный «догоняющий» переход даёт ощущение механического щелчка.
   Снап на время жеста отключаем: Chrome переснапливает scrollTop при
   каждом изменении transform и сбивает парковку барабана. */
.drum.no-snap { scroll-snap-type: none; }
.strip.wheeling {
  transition: transform .13s cubic-bezier(.22, .68, .35, 1);
  will-change: transform;
}

/* Ячейка с цифрой */
.cell {
  height: var(--cell-h);
  flex: 0 0 auto;
  scroll-snap-align: center;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: var(--digit-size);
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink-dim);
  /* лёгкая постоянная хроматическая аберрация на глифах */
  text-shadow:
    calc(var(--aber) * -0.45px) 0 var(--aber-c1-soft),
    calc(var(--aber) * 0.45px) 0 var(--aber-c2-soft);
  transition: text-shadow .25s ease, color .25s;
}

/* Барабан в движении: аберрация усиливается — эффект рывка механизма */
.drums-row.is-moving .cell {
  color: var(--ink);
  text-shadow:
    calc(var(--aber) * -1px) 0 var(--aber-c1),
    calc(var(--aber) * 1px) 0 var(--aber-c2);
}

/* Блики и цилиндрический объём барабана (глянец пластика/металла) */
.drum-shine {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.42) 0%, rgba(255,255,255,.07) 16%,
      rgba(255,255,255,.16) 42%, rgba(255,255,255,.05) 58%,
      rgba(0,0,0,.2) 84%, rgba(0,0,0,.46) 100%),
    linear-gradient(180deg, rgba(255,255,255,.13), transparent 30%);
  mix-blend-mode: screen;
  opacity: var(--shine, .8);
}

/* Растворение только самых краёв барабана (зоны стрелок):
   обе соседние цифры остаются полностью читаемыми */
.drum {
  mask-image: linear-gradient(180deg,
    transparent 0, #000 8%, #000 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(180deg,
    transparent 0, #000 8%, #000 92%, transparent 100%);
}

/* Слот барабана: обёртка со стрелками-степперами сверху и снизу
   (управление мышью и клавиатурой — не только колесо/свайп) */
.drum-slot {
  position: relative;
  flex: 0 0 auto;
  width: var(--drum-w);
}
.drum-slot .drum { width: 100%; }

.drum-btn {
  position: absolute;
  left: 4px; right: 4px;
  z-index: 4;
  height: 16px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  background: var(--drum-face);
  color: var(--ink-faint);
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.drum-btn svg { width: 9px; height: 9px; stroke: currentColor; stroke-width: 1.7; fill: none; }
.drum-btn.up { top: 2px; }
.drum-btn.down { bottom: 2px; }
.drum-btn:hover, .drum-btn:focus-visible {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-ghost);
  outline: none;
}
.drum-btn:active { transform: translateY(1px); }

/* Световое окно активной цифры — «стеклянная» полоса поверх ряда.
   Без выноса за пределы .drums-inner: абсолютный вынос создавал бы
   фантомные 6px прокрутки → полоска скролла висела бы всегда. */
.band {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: calc(var(--cell-h) + 10px);
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 3;
  border-block: 1px solid var(--band-line);
  background: linear-gradient(180deg,
    transparent 0%, var(--band) 30%, var(--band) 70%, transparent 100%);
  box-shadow: var(--band-glow);
  /* хроматическая кромка окна + защитное стекло с искажением */
  box-shadow: var(--band-glow),
    inset 1.5px 0 0 var(--aber-c1-soft),
    inset -1.5px 0 0 var(--aber-c2-soft);
  backdrop-filter: blur(.6px) saturate(1.18);
  -webkit-backdrop-filter: blur(.6px) saturate(1.18);
  animation: bandFlicker var(--flicker, 0s) steps(2) infinite;
}

/* ---------------- 7. Панель добавления системы ---------------------- */
.add-panel {
  justify-content: center;
  gap: 12px;
  padding: 18px 20px;
  border-style: dashed;
  border-color: var(--border-strong);
  background:
    var(--panel-tex),
    linear-gradient(180deg, transparent, rgba(0,0,0,.12)),
    var(--panel);
}
.add-title {
  font-family: var(--font-display);
  font-size: clamp(.78rem, 2vw, 1rem);
  font-weight: 800;
  letter-spacing: .26em;
  color: var(--ink);
  text-transform: uppercase;
}
.add-title::before {
  content: "+ ";
  color: var(--accent);
}
.add-hint, .add-note {
  font-family: var(--font-mono);
  font-size: .6rem;
  letter-spacing: .14em;
  color: var(--ink-dim);
  text-transform: uppercase;
  line-height: 1.7;
}
.add-note { color: var(--ink-faint); }

#addForm {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#baseInput {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  background: var(--drum-face);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 1.05rem;
  letter-spacing: .1em;
  outline: none;
  user-select: text;
}
#baseInput:focus { border-color: var(--accent); }
#baseInput::placeholder { color: var(--ink-faint); }
/* убираем стрелки number-инпута — брутальный минимализм */
#baseInput::-webkit-outer-spin-button,
#baseInput::-webkit-inner-spin-button { -webkit-appearance: none; }
#baseInput { -moz-appearance: textfield; appearance: textfield; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 10px;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: .66rem;
  letter-spacing: .1em;
  cursor: pointer;
  transition: all .2s;
}
.chip:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-ghost);
}

.add-btn {
  padding: 11px 14px;
  border: 1px solid var(--accent);
  background: var(--accent-ghost);
  color: var(--accent);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: .8rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
}
.add-btn:hover {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 0 18px var(--accent-ghost), 0 0 40px var(--accent-ghost);
}
.add-btn:active { transform: translateY(1px); }

/* ---------------- 8. Подвал и тост ----------------------------------- */
.app-foot {
  position: relative;
  z-index: 5;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px clamp(14px, 5vw, 54px) max(8px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: .56rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  filter: blur(.35px);            /* периферия вне фокуса (ГРИП) */
}
.foot-hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Всплывающие сообщения */
#toast {
  position: fixed;
  z-index: 99;
  left: 50%;
  bottom: clamp(44px, 9dvh, 70px);
  transform: translateX(-50%) translateY(14px);
  max-width: min(86vw, 480px);
  padding: 10px 18px;
  border: 1px solid var(--accent);
  border-left: 4px solid var(--accent);
  background: var(--panel2);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: .72rem;
  letter-spacing: .06em;
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s, transform .3s, visibility .3s;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}
#toast.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}
/* ---------------- 9. Тема 1: Cyberpunk Neon (по умолчанию) ---------- */
:root, :root[data-theme="neon"] {
  --bg0: #070b0f;
  --panel: #0c141c;
  --panel2: #101b26;
  --border: #1c2f3d;
  --border-strong: #2a4658;
  --ink: #d8e7ef;
  --ink-dim: #7c939f;
  --ink-faint: #405663;
  --accent: #22d3ee;
  --accent-ink: #04252c;
  --accent-ghost: rgba(34, 211, 238, .09);
  --accent2: #e0479e;
  --hot: #ff5470;

  --font-display: "Bahnschrift", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
  --brand-ls: .3em;
  --brand-shadow:
    2px 0 var(--aber-c1), -2px 0 var(--aber-c2),
    0 0 20px rgba(34, 211, 238, .3);

  /* Фон: влажный карбоновый переплетённый текстиль + неоновая дымка */
  --panel-tex:
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.1) 0 1px, transparent 1px 4px);
  --drum-face: linear-gradient(180deg, #0e1822, #0a1219);
  --lines-img: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 120' preserveAspectRatio='none'><g stroke='white' stroke-width='0.5' fill='none'><path d='M-10 -10 L150 125'/><path d='M-10 20 L150 125'/><path d='M20 -10 L150 125'/><path d='M210 -10 L150 125'/><path d='M210 30 L150 125'/><path d='M180 -10 L150 125'/><path d='M-10 130 L150 125'/><path d='M210 130 L150 125'/></g></svg>");
  --fx-blend: screen;
  --lines-op: .045;
  --rivets: 0;
  --rivets-img: none;

  /* Интенсивность постобработки */
  --aber: 1.3;
  --aber-c1: rgba(255, 42, 90, .8);
  --aber-c2: rgba(0, 235, 255, .7);
  --aber-c1-soft: rgba(255, 42, 90, .34);
  --aber-c2-soft: rgba(0, 235, 255, .3);
  --grain: .08;
  --vign: .56;
  --sheen: .1;
  --scan: .05;
  --fog: .1;
  --fog-c1: rgba(34, 211, 238, .06);
  --fog-c2: rgba(224, 71, 158, .05);
  --scratch: .05;
  --dof: .6;
  --shine: .85;

  --band: rgba(34, 211, 238, .13);
  --band-line: rgba(34, 211, 238, .85);
  --band-glow: 0 0 22px rgba(34, 211, 238, .28), 0 0 64px rgba(34, 211, 238, .1);
  --flicker: 0s;

  --cell-h: clamp(36px, 8.6dvh, 56px);
  --drum-w: clamp(42px, 4.6vw, 60px);
  --digit-size: clamp(1.05rem, 3.4dvh, 1.55rem);
  --panel-shadow: 0 20px 44px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255,255,255,.05);
}

/* Фон страницы неона — отдельно, чтобы собрать много слоёв */
body {
  background:
    radial-gradient(58vw 46vh at 12% 8%, rgba(34, 211, 238, .07), transparent 62%),
    radial-gradient(52vw 44vh at 88% 92%, rgba(224, 71, 158, .06), transparent 64%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    linear-gradient(168deg, var(--bg0), #0a131c 55%, var(--bg0));
}

/* ---------------- 10. Тема 2: Steampunk Brass ----------------------- */
:root[data-theme="steam"] {
  --bg0: #171009;
  --panel: #251a11;
  --panel2: #2d2015;
  --border: #5d4223;
  --border-strong: #8a6a2f;
  --ink: #f1dfbc;
  --ink-dim: #b39a6d;
  --ink-faint: #77613f;
  --accent: #e8a33d;
  --accent-ink: #241503;
  --accent-ghost: rgba(232, 163, 61, .1);
  --accent2: #c2602f;
  --hot: #d05a3e;

  --font-display: Georgia, "Times New Roman", serif;
  --brand-ls: .16em;
  --brand-shadow: 0 1px 0 rgba(0,0,0,.65), 0 0 18px rgba(232, 163, 61, .28);

  /* Фон панелей: состаренная кожа + латунная шлифовка */
  --panel-tex:
    repeating-linear-gradient(90deg, rgba(232,163,61,.03) 0 1px, transparent 1px 4px),
    radial-gradient(120% 60px at 50% 0%, rgba(0,0,0,.25), transparent 70%);
  --drum-face: linear-gradient(180deg, #2e2115, #221709);
  --lines-img: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 120' preserveAspectRatio='none'><g stroke='%23e8a33d' stroke-width='0.5' fill='none'><path d='M-10 -10 L150 125'/><path d='M-10 20 L150 125'/><path d='M20 -10 L150 125'/><path d='M210 -10 L150 125'/><path d='M210 30 L150 125'/><path d='M180 -10 L150 125'/><path d='M-10 130 L150 125'/><path d='M210 130 L150 125'/></g></svg>");
  --fx-blend: screen;
  --lines-op: .035;

  /* Заклёпки по периметру панели */
  --rivets: .5;
  --rivets-img: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><g fill='rgba(232,163,61,0.55)' stroke='rgba(0,0,0,0.5)' stroke-width='0.5'><circle cx='7' cy='7' r='2.2'/><circle cx='93' cy='7' r='2.2'/><circle cx='7' cy='93' r='2.2'/><circle cx='93' cy='93' r='2.2'/><circle cx='50' cy='7' r='2.2'/><circle cx='50' cy='93' r='2.2'/></g></svg>");

  /* Тёплая ламповая постобработка */
  --aber: .8;
  --aber-c1: rgba(255, 140, 60, .55);
  --aber-c2: rgba(90, 200, 255, .38);
  --aber-c1-soft: rgba(255, 140, 60, .26);
  --aber-c2-soft: rgba(90, 200, 255, .18);
  --grain: .1;
  --vign: .6;
  --sheen: .1;
  --scan: 0;
  --fog: .16;
  --fog-c1: rgba(232, 163, 61, .05);
  --fog-c2: rgba(120, 70, 20, .08);
  --scratch: .07;
  --dof: .45;
  --shine: .7;

  --band: rgba(232, 163, 61, .12);
  --band-line: rgba(232, 163, 61, .9);
  --band-glow: 0 0 20px rgba(232, 163, 61, .3), 0 0 70px rgba(232, 163, 61, .12);
  --flicker: 4.2s;                 /* мерцание лампы накаливания */
}

:root[data-theme="steam"] body {
  background:
    radial-gradient(60vw 44vh at 14% 10%, rgba(232, 163, 61, .08), transparent 60%),
    radial-gradient(50vw 40vh at 86% 90%, rgba(120, 60, 10, .12), transparent 65%),
    radial-gradient(rgba(0,0,0,.2) 1px, transparent 1.6px),
    linear-gradient(168deg, var(--bg0), #221609 55%, var(--bg0));
}
:root[data-theme="steam"] body { background-size: auto, auto, 7px 7px, auto; }

/* ---------------- 11. Тема 3: Nordic Minimal ------------------------ */
:root[data-theme="nordic"] {
  --bg0: #edf0ea;
  --panel: #faf9f6;
  --panel2: #ffffff;
  --border: #d7ddd2;
  --border-strong: #b7c1b1;
  --ink: #2e3831;
  --ink-dim: #78836f;
  --ink-faint: #a9b3a5;
  --accent: #7d9b76;
  --accent-ink: #f6f8f4;
  --accent-ghost: rgba(125, 155, 118, .1);
  --accent2: #c9a97c;
  --hot: #c96f5e;

  --font-display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --brand-ls: .24em;
  --brand-weight: 650;
  --brand-shadow: none;

  /* Фон панелей: матовая ткань + светлый бетон */
  --panel-tex:
    repeating-linear-gradient(0deg, rgba(60, 80, 60, .012) 0 1px, transparent 1px 3px);
  --drum-face: linear-gradient(180deg, #ffffff, #f2f1ec);
  --lines-img: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 120' preserveAspectRatio='none'><g stroke='%232e3831' stroke-width='0.5' fill='none'><path d='M-10 -10 L150 125'/><path d='M-10 20 L150 125'/><path d='M20 -10 L150 125'/><path d='M210 -10 L150 125'/><path d='M210 30 L150 125'/><path d='M180 -10 L150 125'/><path d='M-10 130 L150 125'/><path d='M210 130 L150 125'/></g></svg>");
  --fx-blend: multiply;
  --lines-op: .05;
  --rivets: 0;

  /* Минимум постобработки: чистое стекло без искажений */
  --aber: .5;
  --aber-c1: rgba(255, 80, 80, .3);
  --aber-c2: rgba(60, 120, 255, .26);
  --aber-c1-soft: rgba(255, 80, 80, .14);
  --aber-c2-soft: rgba(60, 120, 255, .12);
  --grain: .04;
  --vign: .16;
  --sheen: .05;
  --scan: 0;
  --fog: 0;
  --scratch: .025;
  --dof: .3;
  --shine: .45;

  --band: rgba(125, 155, 118, .1);
  --band-line: rgba(125, 155, 118, .75);
  --band-glow: 0 4px 16px rgba(60, 80, 60, .14);
  --flicker: 0s;

  --panel-shadow: 0 14px 34px rgba(70, 90, 70, .13), inset 0 1px 0 rgba(255,255,255,.8);
}

:root[data-theme="nordic"] body {
  background:
    radial-gradient(64vw 44vh at 16% 6%, rgba(255, 255, 255, .75), transparent 58%),
    repeating-linear-gradient(90deg, rgba(150, 120, 70, .022) 0 3px, transparent 3px 34px),
    linear-gradient(168deg, var(--bg0), #e2e7de 55%, var(--bg0));
}
:root[data-theme="nordic"] .brand { color: var(--ink); }
:root[data-theme="nordic"] .brand span { color: var(--accent2); }
:root[data-theme="nordic"] .fx-sheen { mix-blend-mode: overlay; }
:root[data-theme="nordic"] .drum-shine { mix-blend-mode: soft-light; }

/* ---------------- 12. Плавная смена темы ---------------------------- */
body, .panel, .drum, .cell, .band, .readout, .themes, .theme-btn,
.add-btn, .chip, .app-foot, .sys-base, .sys-del, #baseInput, #toast {
  transition-property: background-color, background, color, border-color,
                       box-shadow, filter;
  transition-duration: .4s;
  transition-timing-function: ease;
}
.panel, .drum, .cell, .band, .readout, .themes, .theme-btn,
.add-btn, .chip, .app-foot, .sys-base, .sys-del, #baseInput, #toast {
  transition-delay: 0s;
}
/* у скролл-свойств барабана переход не нужен */
.drum { transition-property: background-color, color, border-color, box-shadow; }

/* ------------- 13. Компактная адаптация (узкие/портретные экраны) ---- */
/* Вёрстка везде одна — вертикальный список (см. секцию 4);
   здесь только уплотняем шапку, барабаны и панель добавления. */
@media (max-width: 760px), (orientation: portrait) {
  .app-head {
    padding: 10px 14px 6px;
    align-items: center;
  }
  .board { gap: 10px; padding: 8px 10px 12px; }
  .panel-head { padding: 8px 10px; }
  .drums-wrap { padding: 6px 0; }
  .panel-foot { padding: 5px 10px; }
  .brand-sub { display: none; }
  .readout { max-width: 34vw; padding: 4px 8px; }
  .theme-btn { padding: 5px 6px; }
  .theme-btn .txt { display: none; }   /* только цветные свотчи */
  .m-add { display: grid; place-items: center; }

  /* фильтр ГРИП на портретных экранах отключаем — экономим батарею */
  .panel { filter: none; }

  /* компактные барабаны: высота карточки «чтобы хорошо выглядело».
     Селекторы перечислены с [data-theme], чтобы перебить переменные тем. */
  :root, :root[data-theme="neon"], :root[data-theme="steam"], :root[data-theme="nordic"] {
    --cell-h: clamp(28px, 4.6dvh, 42px);
    --drum-w: clamp(36px, 9.5vw, 56px);
    --digit-size: clamp(.95rem, 3dvh, 1.3rem);
  }
  .drums-inner { gap: 7px; padding: 0 26px 0 12px; }

  /* панель добавления — компактный блок под списком */
  .add-panel {
    gap: 9px;
    padding: 12px 14px;
  }
  .add-title { font-size: .72rem; letter-spacing: .2em; }
  .add-hint, .add-note { display: none; }
  #addForm {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  #addForm > #baseInput { order: 1; }
  #addForm > .add-btn { order: 2; padding: 10px 16px; }
  #addForm > .presets { order: 3; grid-column: 1 / -1; }

  .app-foot { padding-left: 14px; padding-right: 14px; }
  .foot-hint { display: none; }        /* подсказка не помещается в одну строку */
}

/* Устройства без ховера: крестик удаления всегда виден */
@media (hover: none) {
  .sys-del { opacity: .85; }
}

/* ---------------- 14. Анимации -------------------------------------- */
@keyframes grainJitter {
  0%   { transform: translate3d(0, 0, 0); }
  25%  { transform: translate3d(-6px, 4px, 0); }
  50%  { transform: translate3d(4px, -6px, 0); }
  75%  { transform: translate3d(-3px, -3px, 0); }
  100% { transform: translate3d(5px, 5px, 0); }
}
@keyframes sheenSweep {
  0%, 85% { background-position: 210% 0; }
  92%, 100% { background-position: -110% 0; }
}
@keyframes fogDrift {
  0%   { transform: translate3d(-2.5%, -1.5%, 0) scale(1); }
  100% { transform: translate3d(2.5%, 2%, 0) scale(1.06); }
}
@keyframes bandFlicker {
  0%, 100% { opacity: 1; }
  48%      { opacity: 1; }
  50%      { opacity: .78; }
  52%      { opacity: 1; }
  86%      { opacity: .9; }
  88%      { opacity: 1; }
}

/* Уважение к reduced motion */
@media (prefers-reduced-motion: reduce) {
  .fx-fog, .fx-grain, .fx-sheen, .band { animation: none !important; }
  * { transition-duration: .01s !important; }
}
</style>

<body>
<div id="app">

  <!-- Шапка: бренд, значение, темы -->
  <header class="app-head">
    <div class="brand-block">
      <h1 class="brand">NUM<span>CONVERTER</span></h1>
      <p class="brand-sub">механический конвертер систем счисления</p>
    </div>
    <div class="head-right">
      <div class="readout" id="readout" title="Значение активной системы — нажмите, чтобы ввести новое">
        <span class="readout-label" id="readoutLabel">DEC</span>
        <span class="readout-val" id="readoutVal">0</span>
        <input id="valInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Новое значение в десятичной записи">
      </div>
      <div class="themes" role="group" aria-label="Тема оформления">
        <button class="theme-btn" data-theme="neon" aria-pressed="true">
          <i class="sw sw-neon"></i><span class="txt">НЕОН</span>
        </button>
        <button class="theme-btn" data-theme="steam" aria-pressed="false">
          <i class="sw sw-steam"></i><span class="txt">ЛАТУНЬ</span>
        </button>
        <button class="theme-btn" data-theme="nordic" aria-pressed="false">
          <i class="sw sw-nordic"></i><span class="txt">НОРД</span>
        </button>
      </div>
      <button class="m-add" id="mAdd" aria-label="Добавить систему счисления">+</button>
    </div>
    <div class="fx-sheen" aria-hidden="true"></div>
  </header>

  <!-- Доска систем счисления: панели генерируются скриптом -->
  <main class="board" id="board" aria-label="Системы счисления"></main>

  <!-- Подвал -->
  <footer class="app-foot">
    <span id="footInfo">BigInt · точность без предела</span>
    <span class="foot-hint">колесо / свайп — барабаны · клик по табло — ввод значения · по шапке карточки — основание</span>
  </footer>

  <!-- Слои постобработки -->
  <div class="fx fx-lines" aria-hidden="true"></div>
  <div class="fx fx-fog" aria-hidden="true"></div>
  <div class="fx fx-grain" aria-hidden="true"></div>
  <div class="fx fx-scan" aria-hidden="true"></div>
  <div class="fx fx-scratch" aria-hidden="true"></div>
  <div class="fx fx-vignette" aria-hidden="true"></div>
  <div class="fx fx-glass" aria-hidden="true"></div>

  <!-- Всплывающие сообщения -->
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
"use strict";
/* ===================================================================
   ЛОГИКА NumConverter
   Архитектура: единый источник истины — BigInt state.value.
   Панели и барабаны — чистая функция от этого значения (applyValue),
   поэтому бесконечные циклы синхронизации невозможны в принципе.
   =================================================================== */

/* ---------------- Константы ---------------------------------------- */
const DIGITS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"; // глифы цифр
const COPIES = 3;      // копий набора цифр в ленте (для «бесконечного» вращения)
const MID = 1;         // индекс средней копии — рабочая зона барабана
const MAX_DIGITS = 24; // защита от переполнения: максимум разрядов в системе
const MAX_BASE = 36;   // 0-9 + A-Z
const MIN_BASE = 2;
const MAX_SYSTEMS = 6; // максимум панелей одновременно
const LS_KEY = "numconv-v1";
const BASE_NAMES = { 2: "BINARY", 8: "OCTAL", 10: "DECIMAL", 16: "HEXADECIMAL" };

/* ---------------- Состояние ---------------------------------------- */
const state = {
  theme: "neon",
  bases: [10, 2, 16],   // порядок оснований (сверху вниз по списку)
  active: 10,           // АКТИВНАЯ система: её значение показывает табло шапки
  value: 0n,            // ЕДИНСТВЕННЫЙ источник истины (BigInt)
  systems: []           // объекты систем: { base, panel, rowEl, innerEl, bandEl, drums[] }
};

/* ---------------- Ссылки на DOM ------------------------------------ */
const rootEl = document.documentElement;
const board = document.getElementById("board");
const readoutLabel = document.getElementById("readoutLabel");
const readoutVal = document.getElementById("readoutVal");
const toastEl = document.getElementById("toast");
const addPanel = buildAddPanel();

/* ---------------- Утилиты ------------------------------------------ */

// Плюрализация: 1 разряд / 2 разряда / 5 разрядов
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

// Имя системы по основанию
const sysName = (b) => BASE_NAMES[b] || ("BASE-" + b);

// Разложение BigInt на цифры по основанию (младшие справа): 255→[1,5,5] для b=10... нет: [2,5,5]
function toDigits(v, base) {
  const B = BigInt(base);
  if (v === 0n) return [0];
  const digs = [];
  while (v > 0n) { digs.push(Number(v % B)); v /= B; }
  return digs.reverse();
}

// Количество разрядов числа в данном основании
function digitCount(v, base) {
  const B = BigInt(base);
  if (v === 0n) return 1;
  let n = 0;
  while (v > 0n) { v /= B; n++; }
  return n;
}

// Всплывающее сообщение
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

/* ---------------- Измерения барабана -------------------------------- */
// Абсолютный индекс ячейки, чей ЦЕНТР совпадает с центром окна барабана
function cellIndex(d) {
  return (d.drum.scrollTop - d.padTop) / d.cellH + d.half;
}
// scrollTop, при котором выбранная ячейка окажется точно в центре
// видимой внутренней области барабана. Смещение вычисляется по реальной
// геометрии DOM, а не по CSS-переменным/предположительной высоте ячейки:
// правки шрифта, рамки, padding и адаптивных размеров не накапливают ошибку.
function topFor(sys, d, digit) {
  const index = MID * sys.base + digit;
  const cell = d.strip.children[index];
  if (!cell) return 0;

  const drumRect = d.drum.getBoundingClientRect();
  const cellRect = cell.getBoundingClientRect();
  const viewportCenter =
    drumRect.top + d.drum.clientTop + d.drum.clientHeight / 2;
  const cellCenter = cellRect.top + cellRect.height / 2;

  return d.drum.scrollTop + cellCenter - viewportCenter;
}
// Замер высоты ячейки, «холостого» поля сверху и полу-окна (в ячейках)
function measureDrum(d) {
  const cell = d.strip.firstElementChild;
  d.cellH = cell ? cell.getBoundingClientRect().height : 44;
  d.padTop = (d.drum.clientHeight - d.cellH) / 2;
  // окно вмещает 3 ячейки → по (3-1)/2 = 1 соседняя цифра выше и ниже активной
  d.half = Math.max(0, Math.round((d.drum.clientHeight / d.cellH - 1) / 2));
}

/* ---------------- Построение панели системы ------------------------- */
// Каркас панели (шапка, ряд барабанов, подвал)
function buildPanel(sys) {
  const panel = document.createElement("section");
  panel.className = "panel";
  panel.dataset.base = sys.base;

  const head = document.createElement("header");
  head.className = "panel-head";
  head.innerHTML =
    '<button class="panel-id" type="button" title="Сменить основание системы">' +
      '<span class="sys-name"></span>' +
      '<span class="sys-base"></span>' +
    "</button>" +
    '<form class="base-edit" novalidate>' +
      '<input class="base-edit-input" type="number" inputmode="numeric" ' +
        'min="' + MIN_BASE + '" max="' + MAX_BASE + '" aria-label="Новое основание">' +
      '<button class="be-ok" type="submit" title="Применить" aria-label="Применить">' +
        '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.5 4 8l4.5-6"/></svg>' +
      "</button>" +
      '<button class="be-cancel" type="button" title="Отмена (Esc)" aria-label="Отмена">' +
        '<svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9"/></svg>' +
      "</button>" +
    "</form>" +
    '<button class="sys-act" type="button" title="Переключиться на эту систему (табло покажет её)" ' +
      'aria-label="Переключиться на эту систему">' +
      '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 4h7.2M9.4 4 7.6 2.2M9.8 8H2.6M2.6 8l1.8 1.8"/></svg>' +
    "</button>" +
    '<button class="sys-del" type="button" title="Удалить систему" aria-label="Удалить систему">' +
      '<svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9"/></svg>' +
    "</button>";
  head.querySelector(".sys-name").textContent = sysName(sys.base);
  head.querySelector(".sys-base").textContent = sys.base;
  head.querySelector(".panel-id").addEventListener("click", () => openBaseEdit(sys));
  head.querySelector(".base-edit").addEventListener("submit", (e) => {
    e.preventDefault();
    applyBaseEdit(sys);
  });
  head.querySelector(".be-cancel").addEventListener("click", () => closeBaseEdit(sys));
  head.querySelector(".base-edit-input").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeBaseEdit(sys); }
  });
  head.querySelector(".sys-act").addEventListener("click", () => {
    setActive(sys);
    // мягко доводим карточку в зону видимости вертикального списка
    sys.panel.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  });
  head.querySelector(".sys-del").addEventListener("click", () => removeSystem(sys));

  const wrap = document.createElement("div");
  wrap.className = "drums-wrap";
  const row = document.createElement("div");
  row.className = "drums-row";
  const inner = document.createElement("div");
  inner.className = "drums-inner";
  const band = document.createElement("div");
  band.className = "band";
  inner.appendChild(band);
  row.appendChild(inner);
  wrap.appendChild(row);

  const foot = document.createElement("footer");
  foot.className = "panel-foot";

  panel.append(head, wrap, foot);
  Object.assign(sys, {
    panel, headEl: head, baseInputEl: head.querySelector(".base-edit-input"),
    rowEl: row, innerEl: inner, bandEl: band, footEl: foot
  });
  return panel;
}

// Один барабан: лента цифр xCOPIES + блик + стрелки-степперы + слушатели
function makeDrum(sys, k, digit) {
  const drum = document.createElement("div");
  drum.className = "drum";
  // Цифры меняются только кнопками; сам барабан не перехватывает свайпы.
  drum.tabIndex = -1;
  drum.setAttribute("aria-hidden", "true");

  const strip = document.createElement("div");
  strip.className = "strip";
  const total = sys.base * COPIES;
  let html = "";
  for (let i = 0; i < total; i++) {
    html += '<div class="cell">' + DIGITS[i % sys.base] + "</div>";
  }
  strip.innerHTML = html;

  const shine = document.createElement("div");
  shine.className = "drum-shine";
  drum.append(strip, shine);

  // слот: барабан + стрелки сверху/снизу (мышь и клавиатура без колеса).
  // Направление как у клавиатуры: ↑ приносит верхнюю соседнюю цифру (−1),
  // ↓ — нижнюю (+1); переносом и синхронизацией ведёт commitDelta.
  const slot = document.createElement("div");
  slot.className = "drum-slot";
  slot.innerHTML =
    '<button class="drum-btn up" type="button" tabindex="-1" ' +
      'title="Предыдущая цифра (−1)" aria-label="Предыдущая цифра">' +
      '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 6.5 5 3l3.5 3.5"/></svg>' +
    "</button>";
  slot.appendChild(drum);
  slot.insertAdjacentHTML("beforeend",
    '<button class="drum-btn down" type="button" tabindex="-1" ' +
      'title="Следующая цифра (+1)" aria-label="Следующая цифра">' +
      '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5"/></svg>' +
    "</button>");
  // барабаны всегда ПЕРЕД световым окном band
  sys.innerEl.insertBefore(slot, sys.bandEl);
  slot.querySelector(".drum-btn.up").addEventListener("click", () => commitDelta(sys, k, -1));
  slot.querySelector(".drum-btn.down").addEventListener("click", () => commitDelta(sys, k, 1));

  const d = { slot, drum, strip, cellH: 44, padTop: 0, half: 1, digit, progTarget: null, progAt: 0,
              userScrolled: false, startCell: 0, lastScrollAt: 0, lastTouchAt: 0, touchDown: false,
              wheelActive: false, wheelDelta: 0, wheelBaseCellIdx: 0, k, base: sys.base };
  measureDrum(d);
  // глушим «фантомное» событие scroll от начальной установки позиции
  d.progTarget = topFor(sys, d, digit);
  drum.scrollTop = d.progTarget;
  updateDrumAria(d, digit);
  attachDrumListeners(sys, d);
  return d;
}

// Пересборка барабанов системы под новый набор цифр (мгновенно, без анимации)
function rebuildDrums(sys, digs) {
  sys.drums.forEach((d) => d.slot.remove());
  sys.drums = [];
  digs.forEach((digit, i) => {
    sys.drums.push(makeDrum(sys, digs.length - 1 - i, digit));
  });
  sys.footEl.textContent =
    digs.length + " " + plural(digs.length, "разряд", "разряда", "разрядов") +
    " · осн. " + sys.base;
  // барабаны прижаты к правому краю: после пересборки держим правый торец
  // (младшие разряды) в зоне видимости, если лента шире карточки
  sys.rowEl.scrollLeft = sys.rowEl.scrollWidth;
}

function updateDrumAria(d, digit) {
  d.drum.setAttribute("aria-valuenow", String(digit));
  d.drum.setAttribute("aria-valuetext", DIGITS[digit]);
}

/* ---------------- Слушатели барабана -------------------------------- */
function attachDrumListeners(sys, d) {
  // Никаких scroll/touch/wheel-обработчиков: вращение доступно через
  // кнопки-степперы, а свайпы над барабаном прокручивают общую доску.
}

/* Схлопывание колесного оффсета В СЕРЕДИНЕ жеста (тач прервал колесо):
   визуальная цифра = d.digit + целый сдвиг оффсета — переносим её в
   нативную позицию scrollTop одним синхронным блоком, картинка на экране
   не меняется ни на один пиксель. */
function collapseWheel(sys, d) {
  if (!d.wheelActive) return;
  const shift = Math.round(d.wheelDelta / d.cellH);      // целые «щелчки»
  const idxNow = MID * sys.base + d.digit + shift;
  const digitNow = ((idxNow % sys.base) + sys.base) % sys.base;
  d.drum.scrollTop = topFor(sys, d, digitNow);           // тихая запись позиции
  d.strip.classList.remove("wheeling");                  // без перехода — мгновенно
  d.strip.style.transform = "";                          // оффсет больше не нужен
  d.drum.classList.remove("no-snap");                    // позиция на сетке — снап безвреден
  d.digit = digitNow;
  updateDrumAria(d, digitNow);
  d.wheelDelta = 0;
  d.wheelActive = false;
  d.wheelBaseCellIdx = MID * sys.base + digitNow;        // новая база жеста
}

/* Схлопывание ПОСЛЕ коммита: applyValue уже обновил d.digit до истины,
   поэтому позиция ставится ровно на неё, оффсет просто сбрасывается.
   progTarget глушит «фантомное» событие scroll от этой записи. */
function settleCollapse(sys, d) {
  const t = topFor(sys, d, d.digit);
  d.progTarget = t;
  d.progAt = Date.now();
  d.drum.scrollTop = t;
  d.strip.classList.remove("wheeling");                  // без перехода — мгновенно
  d.strip.style.transform = "";
  d.drum.classList.remove("no-snap");                    // позиция на сетке — снап безвреден
  d.wheelActive = false;
  d.wheelDelta = 0;
  d.wheelBaseCellIdx = MID * sys.base + d.digit;         // новая база жеста
}

// Пользователь перехватил управление (тач/указатель)
function interruptDrum(sys, d) {
  // если крутили колесом — мгновенно схлопываем оффсет в позицию скролла
  if (d.wheelActive) collapseWheel(sys, d);
  if (d.progTarget !== null) d.progTarget = null;
  // новый жест: флага не было, либо он «зомби» (жест прервался без скролла,
  // и с последнего события прокрутки прошло больше секунды)
  const zombie = d.userScrolled && (Date.now() - (d.lastScrollAt || 0) > 1000);
  if (!d.userScrolled || zombie) {
    d.userScrolled = true;
    d.startCell = cellIndex(d); // точка отсчёта для подсчёта щелчков
  }
}

/* ---------------- Колесо мыши: transform вместо нативного скролла ---- */
/* Родная «пружина» прокрутки Chrome несовместима с точным подсчётом
   щелчков (переснап после каждого scrollTop, отложенный scrollend),
   поэтому колесо полностью виртуально: лента двигается transform'ом,
   а при остановке оффсет схлопывается в scrollTop.                      */
function onDrumWheel(sys, d, e) {
  // приводим дельту к пикселям (режимы LINE/PAGE у части мышей)
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 20;
  else if (e.deltaMode === 2) dy *= d.cellH;
  if (!dy) return;

  if (!d.wheelActive) {
    // парковка: нативная позиция ровно под текущую цифру (уже на сетке)
    const t = topFor(sys, d, d.digit);
    if (Math.abs(d.drum.scrollTop - t) > 0.75) d.drum.scrollTop = t;
    d.wheelActive = true;
    d.wheelDelta = 0;
    d.wheelBaseCellIdx = cellIndex(d); // база жеста для подсчёта щелчков
    // снап off: иначе Chrome переснапит scrollTop при каждом transform
    d.drum.classList.add("no-snap");
    d.strip.classList.add("wheeling");
  }
  // копим оффсет: быстрые тики не теряются, переход плавно «догоняет»
  d.wheelDelta += dy;
  d.userScrolled = true;
  d.lastScrollAt = Date.now();

  // Держим визуальный индекс в средней копии ленты. Если копия кончается —
  // тихо сдвигаем парковку; если сдвигать некуда (край ленты) — коммитим
  // накопленные щелчки прямо в жесте: одометр «проворачивается» с переносом.
  const maxSt = d.strip.offsetHeight - d.drum.clientHeight;
  let guard = 0;
  while (guard++ < 10) {
    const vIdx = cellIndex(d) + d.wheelDelta / d.cellH;
    const overTop = vIdx >= (MID + 1) * sys.base;
    const overBottom = vIdx < MID * sys.base;
    if (!overTop && !overBottom) break;
    const sh = sys.base * d.cellH;
    if (overTop && d.drum.scrollTop + sh <= maxSt) {
      d.progTarget = d.drum.scrollTop + sh;
      d.progAt = Date.now();
      d.drum.scrollTop += sh;
      d.wheelDelta -= sh;
    } else if (overBottom && d.drum.scrollTop - sh >= 0) {
      d.progTarget = d.drum.scrollTop - sh;
      d.progAt = Date.now();
      d.drum.scrollTop -= sh;
      d.wheelDelta += sh;
    } else {
      // сдвигать некому — проворачиваем механизм: коммит накопленного
      const partial = Math.round(
        cellIndex(d) + d.wheelDelta / d.cellH - d.wheelBaseCellIdx);
      if (partial === 0) break;               // меньше щелчка — упёрлись
      const before = state.value;
      commitDelta(sys, d.k, partial);
      if (state.value === before) break;      // откат (предел разрядов)
      d.wheelDelta = 0;
      d.wheelBaseCellIdx = MID * sys.base + d.digit;
      if (!sys.drums.includes(d)) break;      // пересборка сменила барабан
      const t = topFor(sys, d, d.digit);
      if (Math.abs(d.drum.scrollTop - t) > 0.75) {
        d.progTarget = t;
        d.progAt = Date.now();
        d.drum.scrollTop = t;
      }
      d.strip.style.transform = "translateY(0px)";
    }
  }

  sys.rowEl.classList.add("is-moving");
  scheduleSettle(sys);
  // оффсет ограничиваем видимой частью ленты (3 копии), чтобы окно
  // барабана не показывало пустоту при сверхдлинных жестах
  const loIdx = 0.5, hiIdx = COPIES * sys.base - 0.5;
  d.wheelDelta = Math.min(d.wheelDelta, (hiIdx - cellIndex(d)) * d.cellH);
  d.wheelDelta = Math.max(d.wheelDelta, (loIdx - cellIndex(d)) * d.cellH);
  d.strip.style.transform = "translateY(" + (-d.wheelDelta) + "px)";
}

// Обработчик прокрутки барабана (тач-жесты идут нативно, со снапом)
function onDrumScroll(sys, d) {
  // Программная прокрутка: ждём прибытия в цель и молчим (нет циклов)
  if (d.progTarget !== null) {
    if (Math.abs(d.drum.scrollTop - d.progTarget) < 1) d.progTarget = null;
    return;
  }
  // Пользовательская прокрутка (тач): фиксируем старт один раз за жест
  if (!d.userScrolled) {
    d.userScrolled = true;
    d.startCell = cellIndex(d);
  }
  d.lastScrollAt = Date.now();
  // Хроматическая аберрация при движении
  sys.rowEl.classList.add("is-moving");
  scheduleSettle(sys);
}

let settleDelay = 220;
function scheduleSettle(sys) {
  clearTimeout(sys.settleTimer);
  sys.settleTimer = setTimeout(() => settleSys(sys), settleDelay);
}

// Прокрутка остановилась: считаем щелчки и коммитим значение
function settleSys(sys) {
  if (sys._inSettle) return;
  // На мобильном браузер может ненадолго приостановить scroll-события
  // прямо во время удержания пальца. Не коммитим промежуточную цифру.
  if (sys.drums.some((d) => d.touchDown)) {
    scheduleSettle(sys);
    return;
  }
  sys._inSettle = true;
  try {
    clearTimeout(sys.settleTimer);
    sys.rowEl.classList.remove("is-moving");
    const touched = sys.drums.find((d) => d.userScrolled);
    let delta = 0;
    if (touched) {
      delta = touched.wheelActive
        ? // колесо: полный сдвиг жеста = оффсет + тихие сдвиги парковки
          Math.round(cellIndex(touched) +
            touched.wheelDelta / touched.cellH - touched.wheelBaseCellIdx)
        : Math.round(cellIndex(touched) - touched.startCell);   // тач: из позиции
    }
    if (delta !== 0 && touched) commitDelta(sys, touched.k, delta);
    // колесный барабан после коммита: цифра уже обновлена через applyValue,
    // поэтому просто ставим позицию ровно на неё (без повторного сдвига).
    // Барабан мог быть пересобран при изменении числа разрядов — тогда новый.
    if (touched && touched.wheelActive) {
      touched.wheelDelta = 0;
      if (sys.drums.includes(touched)) settleCollapse(sys, touched);
    }
    // сбрасываем пользовательские флаги у ВСЕХ барабанов системы
    // (защита от «залипших» флагов, ломающих подсчёт при следующем вращении)
    sys.drums.forEach((d) => { d.userScrolled = false; });
    // возвращаем ленты в среднюю копию — безопасно, без борьбы с анимациями
    tryReanchor(sys);
  } finally {
    sys._inSettle = false;
  }
}

/* Безопасная перепривязка/лечение лент: мутируем scrollTop ТОЛЬКО когда
   никакая анимация и жест не владеет барабаном. Цифра берётся из состояния
   (d.digit), поэтому любая рассинхронизация позиции самоисправляется. */
function tryReanchor(sys) {
  const now = Date.now();
  let pending = false;
  for (const d of sys.drums) {
    if (d.progTarget !== null || d.wheelActive) { pending = true; continue; }
    const expect = MID * sys.base + d.digit;      // где цифра должна стоять
    const idx = Math.round(cellIndex(d));
    if (idx !== expect) {
      // тишина после жеста — можно аккуратно поставить на место
      if (now - d.lastScrollAt > 180 && now - d.lastTouchAt > 260 && !d.touchDown) {
        d.progTarget = topFor(sys, d, d.digit);
        d.progAt = Date.now();
        d.drum.scrollTop = d.progTarget;
      } else {
        pending = true;
      }
    }
  }
  if (pending) {
    clearTimeout(sys._reanchorTimer);
    sys._reanchorTimer = setTimeout(() => tryReanchor(sys), 240);
  }
}

// Клавиатурное управление барабаном
function onDrumKey(sys, d, e) {
  let delta = 0;
  switch (e.key) {
    case "ArrowUp": delta = -1; break;
    case "ArrowDown": delta = 1; break;
    case "PageUp": delta = -5; break;
    case "PageDown": delta = 5; break;
    case "Home": delta = -((Math.round(cellIndex(d)) % sys.base + sys.base) % sys.base); break;
    case "End": {
      const cur = ((Math.round(cellIndex(d)) % sys.base) + sys.base) % sys.base;
      delta = sys.base - 1 - cur;
      break;
    }
    default: return;
  }
  e.preventDefault();
  if (delta !== 0) commitDelta(sys, d.k, delta);
}

/* ---------------- Единая точка применения значения ------------------- */
/* applyValue — единственная функция, меняющая положение барабанов.
   Все панели являются чистой проекцией state.value на своё основание.  */
function applyValue(value, sourceDrum, mode) {
  const behavior = mode === "smooth" ? "smooth" : "auto";
  for (const sys of state.systems) {
    const digs = toDigits(value, sys.base);
    if (sys.drums.length !== digs.length) {
      // изменилось число разрядов — структурная пересборка (мгновенно)
      rebuildDrums(sys, digs);
      continue;
    }
    sys.drums.forEach((d, i) => {
      const digit = digs[i];
      d.digit = digit;
      updateDrumAria(d, digit);
      // барабан, которым владеет колесный жест, не позиционируем —
      // его оффсет схлопнется в settleSys (иначе визуальный конфликт)
      if (d.wheelActive) return;
      // барабан, который крутит сам пользователь, не трогаем
      if (d === sourceDrum) { d.progTarget = null; return; }
      const t = topFor(sys, d, digit);
      if (Math.abs(d.drum.scrollTop - t) > 0.75) {
        d.userScrolled = false;     // программное движение глушит «пользовательский» флаг
        d.progTarget = t;
        d.progAt = Date.now();
        d.drum.scrollTo({ top: t, behavior }); // плавное синхронное вращение
      } else {
        d.progTarget = null;
      }
    });
  }
  updateReadout();
}

/* ---------------- Коммит вращения одного барабана -------------------- */
/* Смысл: сдвиг барабана с весом k на delta «щелчков» меняет число на
   delta * base^k. Автоматический перенос и рост разрядности получаются
   сами — applyValue пересобирает панели из нового BigInt.               */
function commitDelta(sys, k, delta) {
  const bPow = BigInt(sys.base) ** BigInt(k);
  let nv = state.value + BigInt(delta) * bPow;
  if (nv < 0n) nv = 0n; // ниже нуля одометр не умеет — упираемся в стоп

  // Защита от переполнения разрядности в ЛЮБОЙ из систем
  for (const s of state.systems) {
    if (digitCount(nv, s.base) > MAX_DIGITS) {
      toast("Предел " + MAX_DIGITS + " разрядов — вращение отменено");
      applyValue(state.value, null, "smooth"); // плавный откат барабана
      return;
    }
  }
  state.value = nv;
  applyValue(nv, null, "smooth");
  // система, которую крутят, становится активной — табло показывает её
  if (sys.base !== state.active) setActive(sys);
  persist();
}

/* Страховка от «залипшего» progTarget (прерванная анимация и т.п.) */
setInterval(() => {
  const now = Date.now();
  for (const sys of state.systems) {
    for (const d of sys.drums) {
      if (d.progTarget !== null &&
          (Math.abs(d.drum.scrollTop - d.progTarget) < 1 || now - d.progAt > 2500)) {
        d.progTarget = null;
      }
    }
  }
}, 1200);

/* ---------------- Добавление / удаление систем ----------------------- */
function createSystem(base) {
  const sys = { base, drums: [], settleTimer: null, _inSettle: false };
  buildPanel(sys);
  board.insertBefore(sys.panel, addPanel);
  rebuildDrums(sys, toDigits(state.value, base));
  state.systems.push(sys);
  return sys;
}

function addSystemFlow() {
  const raw = baseInput.value.trim();
  const base = Number(raw);
  if (!raw || !Number.isInteger(base) || base < MIN_BASE || base > MAX_BASE) {
    toast("Основание — целое число от " + MIN_BASE + " до " + MAX_BASE);
    return;
  }
  if (state.systems.some((s) => s.base === base)) {
    toast("Система с основанием " + base + " уже добавлена");
    return;
  }
  if (state.systems.length >= MAX_SYSTEMS) {
    toast("Максимум " + MAX_SYSTEMS + " систем одновременно");
    return;
  }
  const sys = createSystem(base);
  persist();
  baseInput.value = "";
  toast("Добавлена система " + sysName(base) + " (" + base + ")");
  sys.panel.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
}

function removeSystem(sys) {
  if (state.systems.length <= 1) {
    toast("Нужна хотя бы одна система счисления");
    return;
  }
  const i = state.systems.indexOf(sys);
  if (i === -1) return;
  sys.panel.remove();
  state.systems.splice(i, 1);
  // удалили активную — активной становится первая оставшаяся
  if (state.active === sys.base) setActive(state.systems[0]);
  persist();
  toast("Система " + sysName(sys.base) + " удалена");
}

/* ---------------- Редактор основания карточки ------------------------- */
/* Клик по шапке карточки (имя + бейдж основания) раскрывает мини-форму;
   применение пересобирает барабаны из текущего значения под новую базу. */
const isEditingBase = (sys) => sys.headEl.classList.contains("editing");

function openBaseEdit(sys) {
  state.systems.forEach((s) => { if (s !== sys) closeBaseEdit(s); });
  sys.headEl.classList.add("editing");
  sys.baseInputEl.value = sys.base;
  requestAnimationFrame(() => { sys.baseInputEl.focus(); sys.baseInputEl.select(); });
}

function closeBaseEdit(sys) {
  sys.headEl.classList.remove("editing");
  sys.baseInputEl.blur();
}

function applyBaseEdit(sys) {
  const raw = sys.baseInputEl.value.trim();
  const nb = Number(raw);
  if (!raw || !Number.isInteger(nb) || nb < MIN_BASE || nb > MAX_BASE) {
    toast("Основание — целое число от " + MIN_BASE + " до " + MAX_BASE);
    return;
  }
  if (state.systems.some((s) => s !== sys && s.base === nb)) {
    toast("Система с основанием " + nb + " уже добавлена");
    return;
  }
  const wasActive = state.active === sys.base;
  const old = sys.base;
  sys.base = nb;
  sys.panel.dataset.base = nb;
  sys.headEl.querySelector(".sys-name").textContent = sysName(nb);
  sys.headEl.querySelector(".sys-base").textContent = nb;
  rebuildDrums(sys, toDigits(state.value, nb));
  if (wasActive) { state.active = nb; updateReadout(); }
  persist();
  toast("Основание " + old + " → " + nb + " · " + sysName(nb));
  closeBaseEdit(sys);
}

/* ---------------- Редактор значения (табло в шапке) ------------------- */
/* Клик по табло раскрывает поле ввода; новое значение принимается всеми
   карточками через applyValue — единый источник истины не меняется.     */
const readoutEl = document.getElementById("readout");
const valInput = document.getElementById("valInput");

function openValueEdit() {
  state.systems.forEach((s) => { if (isEditingBase(s)) closeBaseEdit(s); });
  readoutEl.classList.add("editing");
  valInput.value = state.value.toString();
  requestAnimationFrame(() => { valInput.focus(); valInput.select(); });
}

function closeValueEdit() {
  readoutEl.classList.remove("editing");
  valInput.blur();
}

function submitValueEdit() {
  const raw = valInput.value.trim();
  if (!raw) { closeValueEdit(); return; }   // пустой ввод — просто отмена
  if (!/^[0-9]+$/.test(raw)) {
    toast("Введите целое число в десятичной записи (только цифры 0–9)");
    return;
  }
  const nv = BigInt(raw);
  for (const s of state.systems) {
    if (digitCount(nv, s.base) > MAX_DIGITS) {
      toast("Предел " + MAX_DIGITS + " разрядов — значение не применено");
      return;
    }
  }
  state.value = nv;
  applyValue(nv, null, "smooth");
  persist();
  toast("Значение установлено: " + nv.toString());
  closeValueEdit();
}

/* ---------------- Активная система (быстрое переключение) ------------- */
/* Активная карточка подсвечивается, табло в шапке показывает её значение.
   Переключение — кнопкой ⇄ на карточке или вращением её барабанов.      */
function setActive(sys) {
  if (!sys || state.systems.indexOf(sys) === -1) return;
  state.active = sys.base;
  state.systems.forEach((s) => s.panel.classList.toggle("active", s === sys));
  updateReadout();
  persist();
}

/* ---------------- Панель добавления системы -------------------------- */
function buildAddPanel() {
  const panel = document.createElement("section");
  panel.className = "panel add-panel";
  const chips = [2, 8, 10, 16, 32]
    .map((b) => '<button type="button" class="chip" data-b="' + b + '">' + b + "</button>")
    .join("");
  panel.innerHTML =
    '<h2 class="add-title">Новая система</h2>' +
    '<p class="add-hint">Основание ' + MIN_BASE + "–" + MAX_BASE + ". Цифры 0–9, далее A–Z.</p>" +
    '<form id="addForm" novalidate>' +
      '<input id="baseInput" type="number" inputmode="numeric" min="2" max="36" ' +
        'placeholder="10" aria-label="Основание системы счисления">' +
      '<div class="presets">' + chips + "</div>" +
      '<button class="add-btn" type="submit">Добавить</button>' +
    "</form>" +
    '<p class="add-note">BigInt · до ' + MAX_DIGITS + " разрядов · без потери точности</p>";
  board.appendChild(panel);
  panel.querySelector("#addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    addSystemFlow();
  });
  panel.querySelectorAll(".chip").forEach((c) => {
    c.addEventListener("click", () => {
      baseInput.value = c.dataset.b;
      baseInput.focus();
    });
  });
  return panel;
}

/* ---------------- Темы ------------------------------------------------ */
const THEME_COLORS = { neon: "#070b0f", steam: "#171009", nordic: "#edf0ea" };

function setTheme(t, save) {
  if (!THEME_COLORS[t]) t = "neon";
  rootEl.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", THEME_COLORS[t]);
  document.querySelectorAll(".theme-btn").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.theme === t));
  });
  state.theme = t;
  if (save !== false) persist();
}

/* ---------------- Чтение значения в шапке ---------------------------- */
function updateReadout() {
  // табло показывает значение в АКТИВНОЙ системе счисления
  if (readoutLabel) readoutLabel.textContent = sysName(state.active);
  const s = state.value.toString(state.active).toUpperCase();
  if (s.length > 42) {
    readoutVal.textContent = s.slice(0, 24) + "…" + s.slice(-10) + " (" + s.length + " цифр)";
  } else {
    readoutVal.textContent = s;
  }
}

/* ---------------- Сохранение состояния (localStorage) ----------------- */
function persist() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      theme: state.theme,
      bases: state.systems.map((s) => s.base),
      active: state.active,
      value: state.value.toString()
    }));
  } catch (e) { /* приватный режим — работаем без сохранения */ }
}

function loadPersisted() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (THEME_COLORS[data.theme]) state.theme = data.theme;
    if (Array.isArray(data.bases)) {
      const clean = Array.from(new Set(
        data.bases.map((b) => Number(b))
          .filter((b) => Number.isInteger(b) && b >= MIN_BASE && b <= MAX_BASE)
      )).slice(0, MAX_SYSTEMS);
      if (clean.length) state.bases = clean;
    }
    if (Number.isInteger(data.active) &&
        data.active >= MIN_BASE && data.active <= MAX_BASE) {
      state.active = data.active;
    }
    if (data.value != null) {
      const v = BigInt(String(data.value)); // бросит исключение на мусоре
      if (digitCount(v, 2n) <= MAX_DIGITS) state.value = v;
    }
  } catch (e) { /* повреждённые данные — берём значения по умолчанию */ }
}

/* ---------------- Пересчёт метрик при ресайзе ------------------------- */
let resizeTimer = null;
function remeasureAll() {
  for (const sys of state.systems) {
    for (const d of sys.drums) {
      measureDrum(d);
      const t = topFor(sys, d, d.digit);
      if (Math.abs(d.drum.scrollTop - t) > 0.75) {
        d.progTarget = t;
        d.progAt = Date.now();
        d.drum.scrollTop = t;
      }
    }
    // правая привязка ленты барабанов переживает ресайз/поворот экрана
    sys.rowEl.scrollLeft = sys.rowEl.scrollWidth;
  }
}
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(remeasureAll, 160);
});
window.addEventListener("orientationchange", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(remeasureAll, 300);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => remeasureAll());
}

/* ---------------- Инициализация -------------------------------------- */
function init() {
  loadPersisted();
  setTheme(state.theme, false);

  // создаём панели в порядке оснований
  state.bases.forEach((b) => createSystem(b));
  applyValue(state.value, null, "instant");

  // активная система: сохранённая или первая из списка
  const activeSys = state.systems.find((s) => s.base === state.active) || state.systems[0];
  setActive(activeSys);

  // клик по табло — редактор значения (Enter — применить, Esc/клик мимо — отмена)
  readoutEl.addEventListener("click", () => {
    if (!readoutEl.classList.contains("editing")) openValueEdit();
  });
  valInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitValueEdit(); }
    else if (e.key === "Escape") { e.preventDefault(); closeValueEdit(); }
  });
  // клик мимо открытых редакторов (значения и оснований) закрывает их
  document.addEventListener("pointerdown", (e) => {
    if (readoutEl.classList.contains("editing") && !readoutEl.contains(e.target)) {
      closeValueEdit();
    }
    for (const s of state.systems) {
      if (isEditingBase(s) && !s.headEl.contains(e.target)) closeBaseEdit(s);
    }
  });
  // мобильная «+» — прокрутка вертикального списка к панели добавления
  document.getElementById("mAdd").addEventListener("click", () => {
    board.scrollTo({ top: board.scrollHeight, behavior: "smooth" });
  });
  // кнопки тем
  document.querySelectorAll(".theme-btn").forEach((b) => {
    b.addEventListener("click", () => setTheme(b.dataset.theme));
  });
}
init();
</script>
</body>
