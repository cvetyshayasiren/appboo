        while(g.next.chirp<hor){
          const tt=Math.max(g.next.chirp,t+0.01);
          if(daylight(P.timeOfDay)>0.35)this.bird(tt,g.out,ar);else this.cricket(tt,g.out,ar);
          g.next.chirp+=(0.5+ar()*3)/(0.2+P.lifeDensity*1.5);
        }
      }else g.next.chirp=hor+1;
      if(P.waterLevel>0.2){
        while(g.next.bubble<hor){
          this.bubble(Math.max(g.next.bubble,t+0.01),g.out,ar);
          g.next.bubble+=0.3+ar()*2.2/Math.max(0.2,P.waterLevel);
        }
      }else g.next.bubble=hor+1;
      if(P.techEra>0.5&&P.civilization>0.15){
        while(g.next.relay<hor){
          this.relay(Math.max(g.next.relay,t+0.01),g.out,ar);
          g.next.relay+=0.8+ar()*4;
        }
      }else g.next.relay=hor+1;
      if(P.weather===6){
        while(g.next.thunder<hor){
          this.thunder(Math.max(g.next.thunder,t+0.01),g.out,ar);
          g.next.thunder+=5+ar()*11;
        }
      }else g.next.thunder=hor+2;
    }
  },
  envGain(t0,a,peak,dur,rel,dest){
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+a);
    g.gain.setTargetAtTime(0.0001,t0+dur,Math.max(0.02,rel/4));
    g.connect(dest);
    return g;
  },
  blip(type,f0,f1,t0,dur,vol,dest){
    const o=this.osc(type,f0);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    const g=this.envGain(t0,0.008,vol,dur,0.12,dest);
    o.connect(g);o.start(t0);o.stop(t0+dur+0.6);
    this.autoStop(o,g);
  },
  pluck(f,t0,dest,vol){
    this.blip('triangle',f,f,t0,0.4,vol,dest);
    this.blip('triangle',f,f,t0,0.5,vol*0.6,this.rev);
  },
  bird(t0,dest,ar){
    const n=2+((ar()*3)|0),base=1600+ar()*1600;
    for(let k=0;k<n;k++){
      const tt=t0+k*0.09;
      const o=this.osc('sine',base);
      o.frequency.setValueAtTime(base,tt);
      o.frequency.linearRampToValueAtTime(base*1.3,tt+0.05);
      o.frequency.linearRampToValueAtTime(base*0.9,tt+0.09);
      const g=this.envGain(tt,0.006,0.05,0.08,0.06,dest);
      o.connect(g);o.start(tt);o.stop(tt+0.3);
      this.autoStop(o,g);
    }
  },
  cricket(t0,dest,ar){
    const o=this.osc('triangle',4100+ar()*700);
    const g=this.ctx.createGain();g.gain.value=0.0001;
    for(let k=0;k<6;k++){
      g.gain.setValueAtTime(0.035,t0+k*0.07);
      g.gain.setValueAtTime(0.0001,t0+k*0.07+0.035);
    }
    g.connect(dest);o.connect(g);o.start(t0);o.stop(t0+0.5);
    this.autoStop(o,g);
  },
  bubble(t0,dest,ar){const f=260+ar()*340;this.blip('sine',f,f*2.3,t0,0.09,0.05,dest);},
  relay(t0,dest,ar){
    const o=this.osc('square',1400+ar()*900);
    const hp=this.filt('highpass',900);
    const g=this.envGain(t0,0.002,0.04,0.02,0.03,dest);
    o.connect(hp);hp.connect(g);o.start(t0);o.stop(t0+0.15);
    this.autoStop(o,g);
  },
  thunder(t0,dest,ar){
    const o=this.osc('sine',55);
    o.frequency.exponentialRampToValueAtTime(28,t0+1.8);
    const g=this.envGain(t0,0.05,0.22,1.6,1.4,dest);
    o.connect(g);o.start(t0);o.stop(t0+3.4);
    this.autoStop(o,g);
    const n=this.src(this.bufPink);
    const lp=this.filt('lowpass',150);
    const ng=this.envGain(t0,0.06,0.16,1.1,1.2,dest);
    n.connect(lp);lp.connect(ng);n.start(t0);n.stop(t0+2.8);
    this.autoStop(n,ng);
    this.blip('sine',48,30,t0,1.4,0.1,this.rev);
  },
  click(t0,dest){
    const n=this.ctx.createBufferSource();n.buffer=this.bufWhite;n.loop=false;
    const bp=this.filt('bandpass',2400,1.2);
    const g=this.envGain(t0,0.002,0.28,0.05,0.05,dest);
    n.connect(bp);bp.connect(g);n.start(t0);n.stop(t0+0.12);
    this.autoStop(n,g);
    this.blip('square',1100,700,t0,0.02,0.1,dest);
  },
  tone(f,type,t0,dur,vol,dest,a){
    const o=this.osc(type,f);
    const g=this.envGain(t0,a||0.012,vol,dur,0.25,dest);
    o.connect(g);o.start(t0);o.stop(t0+dur+1.2);
    this.autoStop(o,g);
  },
  bell(f,t0,vol,dest){
    const car=this.osc('sine',f);
    const mod=this.osc('sine',f*2.4);
    const mg=this.ctx.createGain();
    mg.gain.setValueAtTime(f*1.6,t0);
    mg.gain.exponentialRampToValueAtTime(1,t0+1.6);
    mod.connect(mg);mg.connect(car.frequency);
    const g=this.envGain(t0,0.004,vol,1.7,1.5,dest);
    car.connect(g);car.start(t0);mod.start(t0);
    car.stop(t0+3.4);mod.stop(t0+3.4);
    this.autoStop(car,g);this.autoStop(mod,mg);
  },
  brass(f,t0,dur,vol,dest){
    const o=this.osc('sawtooth',f);
    const lp=this.filt('lowpass',400);
    lp.frequency.setValueAtTime(400,t0);
    lp.frequency.linearRampToValueAtTime(2400,t0+0.09);
    lp.frequency.linearRampToValueAtTime(800,t0+dur);
    const g=this.envGain(t0,0.03,vol,dur,0.2,dest);
    o.connect(lp);lp.connect(g);o.start(t0);o.stop(t0+dur+0.9);
    this.autoStop(o,g);
  },
  playRarity(idx){
    if(!this.ctx||!this.enabled||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime+0.02;
    /* быстрые листания: старые хвосты гасим фейдом, не обрываем */
    for(const gr of this.sfxGroups){
      if(!gr.dead){gr.dead=true;gr.g.gain.setTargetAtTime(0.0001,this.ctx.currentTime,0.08);}
    }
    this.sfxGroups=this.sfxGroups.filter(x=>!x.dead);
    const g=this.gain(1);g.connect(this.sfxBus);
    const grp={g,dead:false,sg:null};
    if(idx>=5){const sg=this.gain(0.5);g.connect(sg);sg.connect(this.rev);grp.sg=sg;}
    this.sfxGroups.push(grp);
    const dest=g;
    const V=[0.3,0.4,0.5,0.6,0.7,0.8,0.9,0.7,0.8,1.0][idx]*0.55;
    this.click(t,dest);
    const C4=261.63,E4=329.63,G4=392,C5=523.25;
    if(idx===1)this.tone(440,'sine',t+0.05,0.3,V*0.5,dest);
    else if(idx===2){
      this.tone(C4,'sine',t+0.05,0.5,V*0.35,dest);
      this.tone(E4,'sine',t+0.05,0.5,V*0.3,dest);
      this.tone(G4,'sine',t+0.05,0.5,V*0.3,dest);
    }else if(idx===3){
      const notes=[C4,E4,G4,C5];
      for(let i=0;i<4;i++)this.tone(notes[i],'triangle',t+0.05+i*0.12,0.5,V*0.4,dest);
    }else if(idx===4){
      const notes=[C4,E4,G4];
      for(let i=0;i<3;i++)this.brass(notes[i],t+0.05+i*0.15,0.45,V*0.35,dest);
      this.brass(C5,t+0.5,0.65,V*0.4,dest);
    }else if(idx===5){
      const notes=[C4,E4,G4,C5];
      for(let i=0;i<4;i++){
        const o=this.osc('sawtooth',notes[i]);o.detune.value=(i-1.5)*7;
        const lp=this.filt('lowpass',1100);
        const gg=this.envGain(t+0.05,0.35,V*0.16,1.1,0.8,dest);
        const vib=this.osc('sine',5+i);const vg=this.gain(6);
        vib.connect(vg);vg.connect(o.detune);
        o.connect(lp);lp.connect(gg);
        o.start(t+0.05);vib.start(t+0.05);o.stop(t+2.4);vib.stop(t+2.4);
        this.autoStop(o,gg);this.autoStop(vib,vg);
      }
    }else if(idx===6){
      this.bell(C5,t+0.05,V*0.4,dest);
      this.bell(E4*2,t+0.35,V*0.32,dest);
      this.bell(G4*2,t+0.65,V*0.3,dest);
      this.bell(C5*2,t+1.0,V*0.24,dest);
    }else if(idx===7){
      for(let i=0;i<6;i++){
        const tt=t+0.05+i*0.13;
        const o=this.osc('square',200+((i*733)%1800));
        const gg=this.envGain(tt,0.002,V*0.22,0.05,0.03,dest);
        o.connect(gg);o.start(tt);o.stop(tt+0.2);this.autoStop(o,gg);
        const n=this.ctx.createBufferSource();n.buffer=this.bufWhite;n.loop=false;
        const ng=this.envGain(tt+0.04,0.002,V*0.15,0.03,0.02,dest);
        n.connect(ng);n.start(tt+0.04);n.stop(tt+0.12);this.autoStop(n,ng);
      }
    }else if(idx===8){
      const o=this.osc('sine',C4/2),o2=this.osc('sine',G4/2);
      const gg=this.ctx.createGain();
      gg.gain.setValueAtTime(0.0001,t+0.05);
      gg.gain.exponentialRampToValueAtTime(V*0.5,t+1.35);
      gg.gain.setValueAtTime(0.0001,t+1.38);
      gg.connect(dest);o.connect(gg);o2.connect(gg);
      o.start(t+0.05);o2.start(t+0.05);o.stop(t+1.5);o2.stop(t+1.5);
      this.autoStop(o,gg);this.autoStop(o2,null);
    }else if(idx===9){
      const o=this.osc('sine',200);
      o.frequency.exponentialRampToValueAtTime(20,t+2.2);
      const gg=this.envGain(t+0.05,0.03,V*0.7,2.2,0.6,dest);
      o.connect(gg);o.start(t+0.05);o.stop(t+3.2);this.autoStop(o,gg);
      const n=this.src(this.bufPink);
      const lp=this.filt('lowpass',400);
      lp.frequency.exponentialRampToValueAtTime(60,t+2.2);
      const ng=this.envGain(t+0.05,0.05,V*0.3,2.0,0.8,dest);
      n.connect(lp);lp.connect(ng);n.start(t+0.05);n.stop(t+3.2);this.autoStop(n,ng);
      this.bell(C5*2,t+0.1,V*0.15,dest);
    }
    setTimeout(()=>{
      try{g.disconnect();}catch(e){}
      if(grp.sg){try{grp.sg.disconnect();}catch(e){}}
      grp.dead=true;
      this.sfxGroups=this.sfxGroups.filter(x=>!x.dead);
    },4200);
  },
  setEnabled(on){
    this.enabled=on;
    if(on){
      if(!this.ctx&&!this.init())return false;
      this.ctx.resume();
      this.master.gain.setTargetAtTime(0.9,this.ctx.currentTime,0.15);
      if(!this.active.length&&typeof App!=='undefined'&&App.world)this.startWorld(App.world);
    }else if(this.ctx){
      this.master.gain.setTargetAtTime(0.0001,this.ctx.currentTime,0.12);
    }
    return true;
  }
};

  recent:[],recentPf:[],commonStreak:0,world:null,
  navLock:false,lastWheel:0,renderTimer:0,lastPreview:0,
  reduced:false,lastHash:'',devTimer:0,toastTimer:0,rollNonce:0,firstAudioToast:false
};
const $=id=>document.getElementById(id);
let viewCtx=null;
const ICONS={
  lockOpen:'<svg class="ico-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>',
  lockClosed:'<svg class="ico-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/></svg>'
};
function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(App.toastTimer);
  App.toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){showToast('Не удалось скопировать');}
  ta.remove();
}
function copyText(txt,ok){
  const done=()=>showToast(ok);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function copySeed(){copyText(App.world.seed,'Сид скопирован: '+App.world.seed);}
function copyLink(){writeHash();copyText(location.href,'Ссылка на мир скопирована');}
/* ---- строки параметров: просмотр + слайдеры с локом и перекрутом ---- */
function buildRows(){
  const box=$('params');
  for(const d of PARAM_DEFS){
    const row=document.createElement('div');
    row.className='param-row';row.dataset.k=d.k;
    row.innerHTML='<span class="p-label">'+d.l+'</span><span class="p-val"></span>'+
      '<button class="pbtn p-lock" aria-label="Закрепить параметр '+d.l+'" title="Лок: сохранить при переснятии">'+ICONS.lockOpen+ICONS.lockClosed+'</button>'+
      '<button class="pbtn p-roll" aria-label="Перекрутить параметр '+d.l+'" title="Случайное значение только этого параметра">'+ICONS.dice+'</button>'+
      '<input class="p-slider" type="range" min="'+d.min+'" max="'+d.max+'" step="'+d.st+'" aria-label="'+d.l+'">';
    box.appendChild(row);
    const slider=row.querySelector('.p-slider');
    slider.addEventListener('input',()=>onParamInput(d,parseFloat(slider.value),false));
    slider.addEventListener('change',()=>onParamInput(d,parseFloat(slider.value),true));
    row.querySelector('.p-lock').addEventListener('click',e=>{
      App.locks[d.k]=!App.locks[d.k];
      e.currentTarget.classList.toggle('locked',App.locks[d.k]);
      showToast(App.locks[d.k]?d.l+': закреплено при переснятии':d.l+': откреплено');
    });
    row.querySelector('.p-roll').addEventListener('click',e=>{
      const btn=e.currentTarget;
      btn.classList.remove('rolling');void btn.offsetWidth;btn.classList.add('rolling');
      App.rollNonce++;
      const rr=rngFor(App.world.seed,'reroll#'+d.k+'#'+App.rollNonce);
      let v=d.min+rr()*(d.max-d.min);
      v=d.k==='weather'?Math.round(v):round3(v);
      slider.value=v;
      onParamInput(d,v,true);
    });
  }
}
function syncRows(){
  const rows=$('params').children;
  for(let i=0;i<PARAM_DEFS.length;i++){
    const d=PARAM_DEFS[i],row=rows[i],v=App.world.params[d.k];
    row.querySelector('.p-val').textContent=d.f(v);
    row.querySelector('.p-slider').value=v;
    row.querySelector('.p-lock').classList.toggle('locked',!!App.locks[d.k]);
  }
}
/* движение слайдера: превью с троттлом ~90 мс, финал по отпусканию */
function onParamInput(d,v,final){
  if(!App.world)return;
  v=d.k==='weather'?Math.round(v):round3(v);
  App.world.params[d.k]=v;
  const row=$('params').children[PARAM_DEFS.indexOf(d)];
  row.querySelector('.p-val').textContent=d.f(v);
  $('biomeChip').textContent=biomeOf(App.world.params);
  AudioEngine.updateWorld(App.world);
  const entry=App.history[App.hIndex];
  if(entry)entry.png=null;
  if(final){
    clearTimeout(App.renderTimer);
    renderAndPresent('final');
    applyPaletteVars();
    writeHash();
    cacheEntry();
  }else{
    const now=nowMs();
    if(now-App.lastPreview>110){
      App.lastPreview=now;
      renderAndPresent('preview');
      applyPaletteVars();
    }else{
      clearTimeout(App.renderTimer);
      App.renderTimer=setTimeout(()=>{
        App.lastPreview=nowMs();
        renderAndPresent('preview');
        applyPaletteVars();
      },85);
    }
  }
}
function updateCaption(){
  const w=App.world;
  $('worldName').textContent=w.name;
  $('worldName').title=w.name;
  $('biomeChip').textContent=biomeOf(w.params);
  $('seedBtn').textContent=w.seed;
  $('frameCounter').textContent='КАДР '+String(App.frameNo).padStart(4,'0');
  $('view').setAttribute('aria-label','Пиксельный снимок: '+w.name+', биом '+biomeOf(w.params));
  $('btnBack').disabled=App.hIndex<=0;
}
function applyPaletteVars(){
  const pal=App.world._pal||buildPalette(App.world);
  const root=document.documentElement.style;
  const acc=pal.accent[0],acc2=pal.accent[1];
  root.setProperty('--acc',css(acc));
  root.setProperty('--acc2',css(acc2));
  root.setProperty('--tintA','rgba('+(acc[0]|0)+','+(acc[1]|0)+','+(acc[2]|0)+',0.16)');
  root.setProperty('--tintB','rgba('+(pal.air[0]|0)+','+(pal.air[1]|0)+','+(pal.air[2]|0)+',0.12)');
  const rc=RARITY[App.world.rarity].c;
  root.setProperty('--rc',rc);
  root.setProperty('--rc-glow',rc+'55');
}
function setTier(){
  const t=App.world.rarity;
  const wrap=$('cardWrap');
  wrap.className=wrap.className.replace(/tier-\d/g,'').replace(/\s+/g,' ').trim()+' tier-'+t;
  $('rarityName').textContent=RARITY[t].n;
  $('rarityChip').title='Редкость: '+RARITY[t].n+' · вероятность '+RARITY[t].p+'%';
  spawnParticles(t);
}
/* CSS-частицы вокруг карточки для редкостей 2+ */
function spawnParticles(t){
  const box=$('fxParticles');
  box.innerHTML='';
  if(App.reduced||t<2)return;
  const cfg=[null,null,
    {n:8,anim:'pFloat'},
    {n:12,anim:'pOrbit'},
    {n:16,anim:'pFloat',cols:['#ffd76a','#fff2b0','#f2c14e']},
    {n:18,anim:'pOrbit'},
    {n:22,anim:'pOrbit',cols:['#ffffff','#ffe9a8','#ffd76a']},
    {n:14,anim:'pGlitch',cols:['#59f2e8','#ff3b6b','#ffffff'],square:true},
    {n:12,anim:'pOrbit',rev:true},
    {n:20,anim:'pSuck',cols:['#c9b8ff','#ff9a3c','#ffffff']}][t];
  if(!cfg)return;
  const pal=App.world._pal;
  const cols=cfg.cols||[css(pal.accent[0]),css(pal.accent[1]),'#ffffff'];
  const r=rngFor(App.world.seed,'fx');
  const wrap=$('cardWrap');
  const rad=Math.max(wrap.clientWidth||400,wrap.clientHeight||500)*0.56+14;
  for(let i=0;i<cfg.n;i++){
    const s=document.createElement('span');
    const a0=r()*360,size=2+r()*3.5,dur=5+r()*7,delay=-r()*10;
    s.style.setProperty('--s',size.toFixed(1)+'px');
    s.style.setProperty('--c',cols[(r()*cols.length)|0]);
    s.style.setProperty('--o',(0.35+r()*0.5).toFixed(2));
    s.style.setProperty('--anim',cfg.anim);
    s.style.setProperty('--dur',dur.toFixed(2)+'s');
    s.style.setProperty('--delay',delay.toFixed(2)+'s');
    if(cfg.rev)s.style.setProperty('--dir','reverse');
    if(cfg.square)s.style.borderRadius='0';
    if(cfg.anim==='pOrbit'||cfg.anim==='pSuck'){
      s.style.setProperty('--a0',a0.toFixed(1)+'deg');
      s.style.setProperty('--a1',(a0+360).toFixed(1)+'deg');
      s.style.setProperty('--r',(rad*(0.85+r()*0.35)).toFixed(0)+'px');
    }else{
      const ang=r()*TAU;
      const x0=Math.cos(ang)*rad*0.95,y0=Math.sin(ang)*rad*0.8;
      s.style.setProperty('--x0',x0.toFixed(0)+'px');
      s.style.setProperty('--y0',y0.toFixed(0)+'px');
      s.style.setProperty('--x1',(x0+(r()-0.5)*40).toFixed(0)+'px');
      s.style.setProperty('--y1',(y0-40-r()*70).toFixed(0)+'px');
    }
    box.appendChild(s);
  }
}
function present(){viewCtx.putImageData(BUF.out.img,0,0);}
function renderAndPresent(q){renderWorld(App.world,q);present();}
function cacheEntry(){
  const e=App.history[App.hIndex];
  if(e&&e.world===App.world){
    try{e.png=$('view').toDataURL('image/png');}catch(err){}
  }
}
function writeHash(){
  const h=serializeWorld(App.world);
  App.lastHash=h;
  try{history.replaceState(null,'',h);}catch(e){try{location.hash=h;}catch(e2){}}
}
/* ---- загрузка мира: проявка, кэш истории, звук, hash ---- */
function loadWorld(w,dir,opts){
  App.world=w;
  if(!w.pf)w.pf=makePostFXCfg(w.seed,w.pfVariant);
  const wrap=$('cardWrap'),photo=$('photo');
  /* Угол детерминированно привязан к сиду: примерно от −2.4° до +2.4°. */
  wrap.style.setProperty('--tilt',(rngFor(w.seed,'tilt')()*4.8-2.4).toFixed(2));
  wrap.style.setProperty('--dx','0');
  wrap.classList.remove('enter-next','enter-prev','fly-next','fly-prev','dragging');
  updateCaption();syncRows();setTier();
  clearTimeout(App.devTimer);
  if(opts.cached){
    /* возврат по истории — мгновенно из кэша, без перегенерации */
    const img=new Image();
    img.onload=()=>{if(App.world===w)viewCtx.drawImage(img,0,0);};
    img.src=opts.cached;
    w._pal=buildPalette(w);
    applyPaletteVars();
    photo.classList.remove('developing');
    App.devTimer=setTimeout(()=>{if(App.world===w){renderAndPresent('final');cacheEntry();}},90);
  }else if(opts.develop&&!App.reduced){
    /* проявка: молочно-сепийное состояние → чистый кадр за 0.9–1.4 с */
    renderAndPresent('preview');
    applyPaletteVars();
    photo.classList.remove('developing');void photo.offsetWidth;
    photo.style.setProperty('--devdur',(0.9+rngFor(w.seed,'dev')()*0.5).toFixed(2)+'s');
    photo.classList.add('developing');
    App.devTimer=setTimeout(()=>{
      if(App.world===w){renderAndPresent('final');applyPaletteVars();cacheEntry();}
    },340);
  }else{
    photo.classList.remove('developing');
    renderAndPresent('final');
    applyPaletteVars();
    cacheEntry();
  }
  if(!App.reduced){
    void wrap.offsetWidth;
    wrap.classList.add(dir<0?'enter-prev':'enter-next');
  }
  AudioEngine.startWorld(w);
  if(opts.raritySound)AudioEngine.playRarity(w.rarity);
  writeHash();
}
function pushNew(w,dir){
  App.history=App.history.slice(0,App.hIndex+1);
  App.history.push({world:w,png:null});
  if(App.history.length>80)App.history.shift();
  App.hIndex=App.history.length-1;
  App.frameNo++;
  App.recent.push({v:paramVector(w.params),sig:genreSig(w.params)});
  if(App.recent.length>20)App.recent.shift();
  App.recentPf.push(w.pf.mask);
  if(App.recentPf.length>6)App.recentPf.shift();
  if(w.rarity===0)App.commonStreak++;else App.commonStreak=0;
  loadWorld(w,dir,{develop:true,raritySound:true});
}
function resnapInner(){
  /* Кандидат сначала полностью проверяется отдельно; история меняется только
     после успешной генерации и пробного рендера. */
  let lastError=null,lastStage='generate';
  for(let attempt=0;attempt<12;attempt++){
    let w;
    try{
      lastStage='generate';
      w=generateWorld(null,App.recent,App.recentPf,App.commonStreak);
      /* залоченные параметры переживают переснятие */
      for(const k in App.locks)if(App.locks[k]&&App.world)w.params[k]=App.world.params[k];
      w.originalParams=Object.assign({},w.params);

      lastStage='validate-params';
      for(const d of PARAM_DEFS){
        const value=w.params[d.k];
        if(!Number.isFinite(value)||value<d.min||value>d.max)
          throw new Error('Некорректный параметр '+d.k+': '+value);
      }
      if(!w.seed||!w.pf||!w.name)throw new Error('Неполная структура мира');

      lastStage='preview-render';
      renderWorld(w,'preview');

    }catch(err){
      lastError=err;
      console.warn('[Pixel-Archive] Сбой кандидата; попытка '+(attempt+1)+'/12; этап: '+lastStage,{
        name:err&&err.name||'Error',message:err&&err.message||String(err),
        stack:err&&err.stack||null,seed:w&&w.seed||null
      });
      continue;
    }
    /* Фиксация — вне блока повтора: сбой интерфейса/анимации не должен
       ошибочно запускать новую генерацию поверх уже изменённой истории. */
    pushNew(w,1);
    return true;
  }
  console.error('[Pixel-Archive] Не удалось создать мир после 12 попыток. Последний этап: '+lastStage,lastError);
  return false;
}
function goBackInner(){
  if(App.hIndex<=0)return;
  App.hIndex--;
  const e=App.history[App.hIndex];
  loadWorld(e.world,-1,{cached:e.png,develop:false,raritySound:false});
  AudioEngine.playRarity(0);
}
function navigate(dir,fly){
  if(App.navLock)return;
  if(dir<0&&App.hIndex<=0){showToast('Начало архива');return;}
  App.navLock=true;
  const wrap=$('cardWrap');
  let finished=false;
  const unlock=()=>{
    if(finished)return;
    finished=true;
    App.navLock=false;
    wrap.classList.remove('fly-next','fly-prev','dragging');
    wrap.style.setProperty('--dx','0');
  };
  const doIt=()=>{
    try{
      if(dir>0)resnapInner();else goBackInner();
    }catch(err){
      /* Не показываем пользователю техническую ошибку: следующая попытка
         генерации выполняется автоматически внутри resnapInner(). */
      console.error('[Pixel-Archive] Ошибка переключения снимка:',err);
    }finally{
      unlock();
    }
  };
  if(fly&&!App.reduced){
    /* Убираем хвосты предыдущей анимации перед новым вылетом. */
    wrap.classList.remove('enter-next','enter-prev','fly-next','fly-prev');
    void wrap.offsetWidth;
    wrap.classList.add(dir>0?'fly-next':'fly-prev');
    setTimeout(doIt,210);
  }else doIt();
}
function toggleEdit(force){
  App.editing=typeof force==='boolean'?force:!App.editing;
  document.body.classList.toggle('editing',App.editing);
  $('btnEdit').classList.toggle('active',App.editing);
  $('btnEdit').setAttribute('aria-pressed',String(App.editing));
  $('editorOverlay').setAttribute('aria-hidden',String(!App.editing));
  if(App.editing){
    showToast('Настраивайте мир — изменения применяются сразу');
    setTimeout(()=>$('params').focus({preventScroll:true}),180);
  }
}
function firstGestureAudio(){
  if(AudioEngine.started||!AudioEngine.enabled)return;
  if(AudioEngine.init()){
    const p=AudioEngine.ctx.resume();
    AudioEngine.startWorld(App.world);
    const play=()=>AudioEngine.playRarity(App.world.rarity);
    if(p&&p.then)p.then(play,play);else setTimeout(play,120);
    $('btnSound').classList.remove('pending');
    if(!App.firstAudioToast){App.firstAudioToast=true;showToast('Звук включён — амбиент этого мира');}
  }
}
function toggleSound(){
  const btn=$('btnSound');
  if(!AudioEngine.started){
    AudioEngine.enabled=true;
    firstGestureAudio();
    btn.classList.remove('muted');
    btn.setAttribute('aria-label','Выключить звук');
    return;
  }
  const on=!AudioEngine.enabled;
  AudioEngine.setEnabled(on);
  btn.classList.toggle('muted',!on);
  btn.classList.remove('pending');
  btn.setAttribute('aria-label',on?'Выключить звук':'Включить звук');
  showToast(on?'Звук включён':'Звук выключен');
}
/* ---- экспорт PNG: снимок + белая полоса с паспортом мира ---- */
function savePNG(){
  const w=App.world;
  const scale=2,m=40,sw=RW*scale,sh=RH*scale,band=330;
  const cv=document.createElement('canvas');
  cv.width=sw+m*2;cv.height=m+sh+band;
  const cx=cv.getContext('2d');
  cx.imageSmoothingEnabled=false;
  cx.fillStyle='#f4efe3';cx.fillRect(0,0,cv.width,cv.height);
  cx.drawImage($('view'),m,m,sw,sh);
  cx.strokeStyle='rgba(0,0,0,.25)';cx.strokeRect(m+0.5,m+0.5,sw-1,sh-1);
  const y0=m+sh;
  cx.fillStyle='#241f18';
  cx.font='44px "Segoe Script","Bradley Hand","Comic Sans MS",cursive';
  cx.fillText(w.name,m+8,y0+62,sw-16);
  cx.font='20px ui-monospace,Consolas,monospace';
  cx.fillStyle='#4a4234';
  cx.fillText('SEED '+w.seed+'   \u00B7   '+RARITY[w.rarity].n+'   \u00B7   '+biomeOf(w.params),m+8,y0+96);
  cx.font='15px ui-monospace,Consolas,monospace';
  const colW=sw/2;
  for(let i=0;i<PARAM_DEFS.length;i++){
    const d=PARAM_DEFS[i],col=i%2,rowI=(i/2)|0;
    const x=m+8+col*colW,y=y0+128+rowI*19;
    cx.fillStyle='#6b6152';cx.fillText(d.l,x,y);
    cx.fillStyle='#241f18';cx.fillText(d.f(w.params[d.k]),x+190,y);
  }
  cx.fillStyle='#9a938a';
  cx.font='13px ui-monospace,Consolas,monospace';
  cx.fillText('PIXEL-ARCHIVE OF LOST WORLDS',m+8,cv.height-18);
  const a=document.createElement('a');
  a.download='pixel-archive_'+w.seed+'.png';
  a.href=cv.toDataURL('image/png');
  document.body.appendChild(a);a.click();a.remove();
  showToast('PNG сохранён: '+a.download);
}
/* ---- процедурная текстура зерна стола и бумаги ---- */
function makeDeskTextures(){
  const cv=document.createElement('canvas');cv.width=96;cv.height=96;
  const cx=cv.getContext('2d');
  const im=cx.createImageData(96,96);
  const r=rngFor('desk','grain');
  for(let i=0;i<im.data.length;i+=4){
    const v=118+((r()*20)|0);
    im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=14;
  }
  cx.putImageData(im,0,0);
  const url=cv.toDataURL();
  $('grainOverlay').style.backgroundImage='url('+url+')';
  document.documentElement.style.setProperty('--paper-tile','url('+url+')');
}
function bindControls(){
  $('btnSnap').addEventListener('click',()=>navigate(1,true));
  $('btnBack').addEventListener('click',()=>navigate(-1,true));
  $('btnEdit').addEventListener('click',()=>toggleEdit());
  $('closeEditor').addEventListener('click',()=>toggleEdit(false));
  $('editorOverlay').addEventListener('click',e=>{if(e.target===$('editorOverlay'))toggleEdit(false);});
  $('btnSound').addEventListener('click',toggleSound);
  $('btnSave').addEventListener('click',savePNG);
  $('btnLink').addEventListener('click',copyLink);
  $('seedBtn').addEventListener('click',copySeed);
  $('resetBtn').addEventListener('click',()=>{
    const w=App.world;
    w.params=Object.assign({},w.originalParams);
    syncRows();updateCaption();
    renderAndPresent('final');applyPaletteVars();writeHash();cacheEntry();
    AudioEngine.updateWorld(w);
    showToast('Параметры сброшены к исходному сиду');
  });
  window.addEventListener('hashchange',()=>{
    if(location.hash===App.lastHash)return;
    const w=parseHash(location.hash);
    if(w){pushNew(w,1);showToast('Мир восстановлен из ссылки');}
    else{showToast('Ссылка повреждена — снимаю новый мир');resnapInner();}
  });
  /* звук стартует только после первого жеста пользователя */
  window.addEventListener('pointerdown',e=>{
    if(e.target&&e.target.closest&&e.target.closest('#btnSound'))return;
    firstGestureAudio();
  },{capture:true});
  document.addEventListener('visibilitychange',()=>{
    if(!AudioEngine.ctx)return;
    if(document.hidden)AudioEngine.ctx.suspend();
    else if(AudioEngine.enabled)AudioEngine.ctx.resume();
  });
}
function bindGestures(){
  const photo=$('photo'),wrap=$('cardWrap');
  let sx=0,sy=0,dx=0,dragging=false,pid=null;
  photo.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;dx=0;dragging=true;
    try{photo.setPointerCapture(pid);}catch(err){}
    wrap.classList.add('dragging');
  });
  photo.addEventListener('pointermove',e=>{
    if(!dragging||e.pointerId!==pid)return;
    dx=e.clientX-sx;
    const dy=e.clientY-sy;
    if(Math.abs(dx)>Math.abs(dy))wrap.style.setProperty('--dx',(dx*0.55).toFixed(1));
  });
  const end=e=>{
    if(!dragging||e.pointerId!==pid)return;
    const swipeX=dx;
    dragging=false;
    pid=null;
    wrap.classList.remove('dragging');
    wrap.style.setProperty('--dx','0');
    if(e.type==='pointerup'){
      if(swipeX<-60)navigate(1,true);
      else if(swipeX>60)navigate(-1,true);
    }
  };
  photo.addEventListener('pointerup',end);
  photo.addEventListener('pointercancel',end);
  photo.addEventListener('dblclick',()=>navigate(1,true));
  /* колесо над фото листает архив, над подписью — скроллит параметры */
  $('stage').addEventListener('wheel',e=>{
    if(e.target&&e.target.closest&&e.target.closest('.caption'))return;
    e.preventDefault();
    const now=nowMs();
    if(now-App.lastWheel<550||Math.abs(e.deltaY)<12)return;
    App.lastWheel=now;
    navigate(e.deltaY>0?1:-1,false);
  },{passive:false});
}
function bindKeys(){
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea')return;
    const k=e.key;
    if(k==='Escape'&&App.editing){e.preventDefault();toggleEdit(false);return;}
    if(k==='ArrowRight'){e.preventDefault();navigate(1,true);}
    else if(k==='ArrowLeft'){e.preventDefault();navigate(-1,true);}
    else if(k==='r'||k==='R'||k===' '||k==='к'||k==='К'){e.preventDefault();navigate(1,true);}
    else if(k==='s'||k==='S'||k==='ы'||k==='Ы')toggleEdit();
    else if(k==='m'||k==='M'||k==='ь'||k==='Ь')toggleSound();
    else if(k==='p'||k==='P'||k==='з'||k==='З')savePNG();
    else if(k==='l'||k==='L'||k==='д'||k==='Д')copyLink();
    else if(k==='c'||k==='C'||k==='с'||k==='С')copySeed();
    firstGestureAudio();
  });
}
function boot(){
  viewCtx=$('view').getContext('2d');
  App.reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  makeDeskTextures();
  buildRows();
  bindControls();
  bindGestures();
  bindKeys();
  const fromHash=location.hash.length>4?parseHash(location.hash):null;
  const w=fromHash||generateWorld(null,App.recent,App.recentPf,0);
  pushNew(w,1);
  if(fromHash)showToast('Мир восстановлен из ссылки');
  /* фоновый самотест: сид+параметры дают пиксель-в-пиксель тот же кадр */
  setTimeout(()=>{
    if(App.editing||!App.world)return;
    const w2=App.world;
    const a=checksum(BUF.out);
    renderWorld(w2,'final');
    const b=checksum(BUF.out);
    const restored=parseHash(serializeWorld(w2));
    const c2=restored?renderWorld(restored,'final'):b;
    renderWorld(w2,'final');present();
    console.info('[Pixel-Archive] детерминизм: '+((a===b&&b===c2)?'OK':'СБОЙ')+' \u00B7 рендер '+w2._renderMs+' мс');
  },1500);
}
if(typeof document!=='undefined'&&document.getElementById('app')){
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
</script>
