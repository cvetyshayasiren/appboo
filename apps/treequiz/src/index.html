<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Treequiz — тренажёр насмотренности: каталог деревьев, пиксель-арт из фото Википедии и простая викторина-самопроверка.">
<meta name="theme-color" content="#0c1410">
<title>Treequiz — узнавай деревья в лицо</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ru.wikipedia.org" crossorigin>
<link rel="preconnect" href="https://en.wikipedia.org" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/pixelify-sans@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/pixelify-sans@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/600.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2012%2012'%3E%3Crect%20width='12'%20height='12'%20rx='2'%20fill='%23123b2a'/%3E%3Cpath%20fill='%2357d98f'%20d='M5%201h2v1H5zM4%202h4v1H4zM3%203h6v1H3zM4%204h4v1H4zM2%205h8v1H2zM1%206h10v1H1zM5%207h2v3H5zM4%2010h4v1H4z'/%3E%3C/svg%3E">
<script>
try{var s=JSON.parse(localStorage.getItem('treequiz:v1')||'null');if(s){if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;if(typeof s.hue==='number'&&s.hue>=0&&s.hue<8){var H=[[152,60],[88,52],[40,80],[6,72],[174,60],[212,72],[276,52],[24,40]][s.hue];document.documentElement.style.setProperty('--hue',H[0]);document.documentElement.style.setProperty('--hsat',H[1]+'%');}}else if(matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.dataset.theme='light';}}catch(e){}
</script>
<style>
/* ============ THEME SYSTEM ============ */
:root{
  --hue:152; --hsat:60%;
  --bg:hsl(var(--hue) calc(var(--hsat)*.42) 93%);
  --bg2:hsl(var(--hue) calc(var(--hsat)*.38) 87%);
  --surface:hsl(var(--hue) 32% 98%);
  --surface2:hsl(var(--hue) 26% 93%);
  --overlay:hsl(var(--hue) 30% 99% / .82);
  --text:hsl(var(--hue) 28% 12%);
  --muted:hsl(var(--hue) 12% 37%);
  --line:hsl(var(--hue) 22% 82%);
  --accent:hsl(var(--hue) calc(var(--hsat)*.92) 32%);
  --accent2:hsl(calc(var(--hue) + 48) 68% 38%);
  --accent-soft:hsl(var(--hue) 48% 88%);
  --on-accent:hsl(var(--hue) 30% 98%);
  --glow:hsl(var(--hue) 85% 45% / .30);
  --ok:hsl(147 62% 34%); --ok-soft:hsl(147 55% 90%);
  --bad:hsl(4 70% 46%); --bad-soft:hsl(4 75% 93%);
  --warn:hsl(38 85% 40%); --info:hsl(212 75% 42%);
  --aur-o:.5; --grain-o:.05;
  --shadow:0 14px 44px hsl(var(--hue) 40% 20% / .14);
  --notch:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px));
  --px:'Pixelify Sans','Courier New',monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-theme="dark"]{
  --bg:hsl(var(--hue) calc(var(--hsat)*.5) 7%);
  --bg2:hsl(var(--hue) calc(var(--hsat)*.44) 10%);
  --surface:hsl(var(--hue) 30% 11%);
  --surface2:hsl(var(--hue) 26% 16%);
  --overlay:hsl(var(--hue) 30% 9% / .82);
  --text:hsl(var(--hue) 16% 92%);
  --muted:hsl(var(--hue) 10% 65%);
  --line:hsl(var(--hue) 20% 23%);
  --accent:hsl(var(--hue) calc(var(--hsat)*.85) 58%);
  --accent2:hsl(calc(var(--hue) + 48) 74% 62%);
  --accent-soft:hsl(var(--hue) 34% 20%);
  --on-accent:hsl(var(--hue) 45% 8%);
  --glow:hsl(var(--hue) 90% 55% / .38);
  --ok:hsl(147 62% 52%); --ok-soft:hsl(147 40% 16%);
  --bad:hsl(4 78% 62%); --bad-soft:hsl(4 45% 18%);
  --warn:hsl(38 90% 58%); --info:hsl(212 85% 64%);
  --aur-o:.32; --grain-o:.07;
  --shadow:0 16px 48px hsl(var(--hue) 50% 2% / .5);
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{
  font-family:var(--sans); color:var(--text); background:var(--bg);
  background-image:linear-gradient(180deg,var(--bg),var(--bg2));
  overflow:hidden; -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.55;
  transition:background-color .45s,color .45s;
}
button{font-family:inherit;color:inherit;touch-action:manipulation}
img{max-width:100%}
svg.ic{width:16px;height:16px;display:inline-block;flex:none}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.main,.sidebar,.chips,.angles{scrollbar-width:thin;scrollbar-color:color-mix(in oklab,var(--accent) 55%,var(--line)) transparent}
.main::-webkit-scrollbar,.sidebar::-webkit-scrollbar{width:11px}
.chips::-webkit-scrollbar,.angles::-webkit-scrollbar{height:7px}
.main::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track,.chips::-webkit-scrollbar-track,.angles::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.chips::-webkit-scrollbar-thumb,.angles::-webkit-scrollbar-thumb{
  background:color-mix(in oklab,var(--accent) 45%,var(--line));border-radius:8px;border:2px solid var(--bg)}
.main::-webkit-scrollbar-thumb:hover,.chips::-webkit-scrollbar-thumb:hover,.angles::-webkit-scrollbar-thumb:hover{background:var(--accent)}
/* ============ BACKGROUND LAYERS ============ */
.aurora{position:fixed;inset:-12%;z-index:0;pointer-events:none;filter:blur(72px);opacity:var(--aur-o);transition:opacity .5s}
.aurora i{position:absolute;width:56vmax;height:56vmax;border-radius:50%}
.aurora .b1{left:-8%;top:-14%;background:radial-gradient(circle at 35% 35%,hsl(var(--hue) 85% 58% / .55),transparent 66%);animation:drift1 34s ease-in-out infinite alternate}
.aurora .b2{right:-12%;top:6%;background:radial-gradient(circle at 60% 40%,hsl(calc(var(--hue) + 55) 80% 55% / .42),transparent 66%);animation:drift2 41s ease-in-out infinite alternate}
.aurora .b3{left:16%;bottom:-24%;background:radial-gradient(circle at 50% 50%,hsl(calc(var(--hue) - 45) 75% 52% / .38),transparent 66%);animation:drift3 47s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(9%,7%) scale(1.14)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-8%,9%) scale(.94)}}
@keyframes drift3{from{transform:translate(0,0) scale(.96)}to{transform:translate(7%,-8%) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--grain-o);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.85'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='160'%20height='160'%20filter='url(%23n)'%20opacity='0.6'/%3E%3C/svg%3E")}
/* ============ APP SHELL ============ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:284px minmax(0,1fr);height:100vh;height:100dvh}
.sidebar{display:flex;flex-direction:column;gap:18px;padding:22px 18px calc(18px + env(safe-area-inset-bottom));
  border-right:1px solid var(--line);background:var(--overlay);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  overflow-y:auto;transition:background-color .45s,border-color .45s}
.main{overflow-y:auto;overscroll-behavior:contain;height:100%;padding:30px clamp(16px,3.6vw,52px) 70px;scroll-behavior:smooth}
.topbar,.tabbar{display:none}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo-badge{width:42px;height:42px;flex:none;display:grid;place-items:center;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent),var(--accent2));clip-path:var(--notch);filter:drop-shadow(0 0 12px var(--glow))}
.logo-badge .ic{width:24px;height:24px}
.logo-name{font-family:var(--px);font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.logo-name .cursor{display:inline-block;width:.45em;height:.85em;background:var(--accent);margin-left:3px;vertical-align:-.08em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.logo-tag{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.side-controls{display:flex;align-items:center;gap:8px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.5px}
.net .dot{width:8px;height:8px;border-radius:2px;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.net.off .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.sidenav{display:flex;flex-direction:column;gap:6px}
.navbtn{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;width:100%;text-align:left;
  border-radius:13px;border:1px solid transparent;background:none;color:var(--muted);font-weight:600;font-size:14.5px;cursor:pointer;
  transition:background-color .2s,color .2s,box-shadow .2s}
.navbtn .ic{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface2);color:var(--text)}
.navbtn.active{background:var(--accent-soft);color:var(--text);box-shadow:inset 4px 0 0 var(--accent);border-color:color-mix(in oklab,var(--accent) 25%,transparent)}
.navbtn.active .ic{color:var(--accent)}
.side-status{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.stat{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--px);font-size:21px;font-weight:700;color:var(--accent);min-width:44px}
.side-foot{font-size:10.5px;color:var(--muted);line-height:1.5}
.side-foot .ver{margin-top:4px;font-family:var(--px);letter-spacing:.4px}
/* ============ VIEWS ============ */
.view{display:none;max-width:1280px;margin:0 auto}
.view.active{display:block;animation:viewIn .38s cubic-bezier(.2,.9,.25,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:riseIn .5s cubic-bezier(.2,.9,.25,1) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.view-head{margin-bottom:18px}
.view-title{font-family:var(--px);font-weight:700;font-size:clamp(27px,3.4vw,40px);line-height:1.02;text-shadow:0 0 18px var(--glow);position:relative;display:inline-block;padding-bottom:9px}
.view-title::after{content:'';position:absolute;left:0;bottom:0;height:5px;width:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2),transparent);clip-path:var(--notch);opacity:.9;
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask-image:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.view-sub{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:640px}
/* ============ CHIPS ============ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;cursor:pointer;
  clip-path:var(--notch);background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  font-weight:600;font-size:13px;white-space:nowrap;transition:background-color .2s,color .2s,filter .2s}
.chip .ic{width:15px;height:15px}
.chip .cnt{font-family:var(--px);font-size:12px;opacity:.8}
.chip:hover{color:var(--text);background:color-mix(in oklab,var(--surface2) 70%,var(--accent-soft))}
.chip.on{background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 62%,var(--accent2)));
  color:var(--on-accent);border-color:transparent;filter:drop-shadow(0 0 9px var(--glow))}
.chip:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.chip-sep{flex:none;width:1px;align-self:stretch;margin:6px 4px;background:var(--line)}
/* ============ CARDS / MEDIA ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);transition:background-color .45s,border-color .45s}
.browse-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:22px;align-items:start}
.media{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--bg2);
  border:1px solid var(--line);touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .3s,box-shadow .3s}
.media img,.media canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.media canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.media[data-show="img"] canvas{opacity:0;pointer-events:none}
.media[data-show="canvas"] img{opacity:0;pointer-events:none}
.media .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 56%,rgb(4 8 14 / .34) 100%);transition:opacity .3s}
.media[data-show="canvas"] .vig{opacity:0}
.media .scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:repeating-linear-gradient(0deg,rgb(0 0 0 / .13) 0 1px,transparent 1px 3px)}
.media[data-show="canvas"] .scan{opacity:1}
.media[data-show="canvas"]{border:2px solid var(--accent);box-shadow:0 0 0 1px color-mix(in oklab,var(--accent) 30%,transparent),0 0 26px var(--glow)}
.m-tag{position:absolute;top:10px;left:10px;font-family:var(--px);font-size:13px;letter-spacing:.6px;
  background:rgb(9 13 20 / .62);color:#e9eef5;padding:7px 11px;border-radius:9px;border:1px solid rgb(255 255 255 / .16);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
.m-status{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  background:rgb(9 13 20 / .62);color:#dfe7f0;padding:7px 11px;border-radius:9px;border:1px solid rgb(255 255 255 / .16);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;max-width:75%}
.m-status .ic{width:13px;height:13px}
.m-status .blink{animation:blink 1s steps(2) infinite}
.m-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;display:grid;place-items:center;cursor:pointer;
  background:rgb(9 13 20 / .55);color:#fff;border:1px solid rgb(255 255 255 / .18);border-radius:12px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background-color .2s,transform .15s;z-index:3}
.m-nav:hover{background:var(--accent);color:var(--on-accent)}
.m-nav:active{transform:translateY(-50%) scale(.92)}
.m-nav.prev{left:10px}.m-nav.next{right:10px}
.m-nav .ic{width:18px;height:18px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgb(9 13 20 / .6);border:1px solid rgb(255 255 255 / .15);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.media .seg{position:absolute;top:10px;right:10px;z-index:3}
.seg button{min-height:44px;padding:0 13px;border:none;border-radius:9px;background:none;color:#c9d4e0;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .2s,color .2s}
.seg button .ic{width:14px;height:14px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg-flat{background:var(--surface2);border:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none}
.seg-flat button{color:var(--muted)}
.seg-flat button.on{background:var(--accent);color:var(--on-accent)}
.tree-name{font-family:var(--px);font-weight:700;font-size:clamp(24px,2.6vw,34px);line-height:1.08;text-shadow:0 0 14px var(--glow)}
.latin{font-style:italic;color:var(--muted);font-size:15px;margin-top:4px}
.altname{font-size:12.5px;color:var(--muted);margin-top:2px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.minitag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--accent-soft);color:var(--text);border:1px solid color-mix(in oklab,var(--accent) 22%,transparent)}
.extract{font-size:14.5px;line-height:1.62;margin-top:4px}
.extract.clamped{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.extract p+p{margin-top:8px}
.extract-note{display:inline-block;font-family:var(--px);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-bottom:6px}
.linkbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border-radius:11px;cursor:pointer;
  border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line));background:none;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:none;transition:background-color .2s,filter .2s}
.linkbtn:hover{background:var(--accent-soft);filter:drop-shadow(0 0 8px var(--glow))}
.linkbtn .ic{width:14px;height:14px}
.info-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;align-items:center}
.credit{font-size:10.5px;color:var(--muted);margin-top:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:12px}
.angles-wrap{margin-top:14px}
.angles-title{font-family:var(--px);font-size:13px;letter-spacing:.8px;color:var(--muted);margin-bottom:7px;text-transform:uppercase}
.angles{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.angle{flex:none;width:78px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--surface2);cursor:pointer;padding:0;transition:border-color .2s,box-shadow .2s}
.angle img{width:100%;height:56px;object-fit:cover;display:block}
.angle span{display:block;font-size:10px;padding:4px 2px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;text-align:center}
.angle.on{border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.angle.on span{color:var(--accent)}
.skl{background:linear-gradient(90deg,var(--surface2),var(--bg2),var(--surface2));background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;color:transparent!important}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* ============ PIXEL LAB ============ */
.lab{margin-top:22px}
.lab-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.lab-title{font-family:var(--px);font-weight:700;font-size:21px;display:flex;align-items:center;gap:9px;text-shadow:0 0 12px var(--glow)}
.lab-title .ic{width:19px;height:19px;color:var(--accent)}
.lab-note{font-size:11.5px;color:var(--muted);flex:1;min-width:200px}
.lab-actions{display:flex;gap:8px;flex-wrap:wrap}
.lab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.ctl output{font-family:var(--px);font-size:13px;color:var(--accent);white-space:nowrap}
.ctl select{width:100%;min-height:44px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:0 10px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
.ctl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer}
.ctl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 65%,var(--line)),var(--line))}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:6px;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 9px var(--glow);margin-top:-7px}
.ctl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.ctl input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.ctl input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:6px;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 9px var(--glow)}
.ctl input[type=range]:disabled{opacity:.4;cursor:default}
.lab-rm{margin-top:12px;font-size:11.5px;color:var(--warn);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 18px;cursor:pointer;

  transition:transform .12s,box-shadow .2s,background-color .2s,border-color .2s,color .2s;text-decoration:none}
.btn .ic{width:16px;height:16px;flex:none}
.btn:hover{border-color:color-mix(in oklab,var(--accent) 55%,var(--line))}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 62%,var(--accent2)));
  color:var(--on-accent);border-color:transparent;
  box-shadow:0 4px 0 color-mix(in oklab,var(--accent) 52%,black),0 10px 26px var(--glow)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklab,var(--accent) 52%,black),0 6px 16px var(--glow)}
.btn.ghost{background:none;border-color:color-mix(in oklab,var(--accent) 42%,var(--line));color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.icon{width:46px;padding:0;flex:none}
.btn.sm{min-height:44px;font-size:13px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:default;transform:none!important}
/* ============ QUIZ ============ */
.quiz-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.quiz-top .pool{font-size:12px;color:var(--muted);flex:1;min-width:180px}
.quiz-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.quiz-media{max-height:52vh;max-height:52dvh}
.quiz-prompt{font-family:var(--px);font-weight:700;font-size:clamp(20px,2.2vw,26px);margin-bottom:14px;text-shadow:0 0 12px var(--glow)}
.answers{display:grid;gap:11px}
.answer{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 16px;text-align:left;cursor:pointer;
  border-radius:14px;border:2px solid var(--line);background:var(--surface);transition:border-color .18s,box-shadow .18s,transform .18s,background-color .18s,opacity .3s}
.answer .key{font-family:var(--px);font-weight:700;font-size:17px;width:36px;height:36px;flex:none;display:grid;place-items:center;
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s}
.answer .nm{font-weight:600;font-size:15px;line-height:1.3}
.answer .lt{font-style:italic;font-size:12px;color:var(--muted);margin-top:1px}
.answer .mark{margin-left:auto;width:22px;height:22px;flex:none;opacity:0;transition:opacity .2s}
.answer .mark .ic{width:22px;height:22px}
.answer:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px var(--glow)}

.answer:disabled:not(.correct):not(.wrong):not(.dim){opacity:.75}
.answer.correct{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 13%,var(--surface));box-shadow:0 0 0 1px var(--ok),0 0 22px color-mix(in oklab,var(--ok) 40%,transparent)}
.answer.correct .key{background:var(--ok);border-color:var(--ok);color:#fff}
.answer.correct .mark{opacity:1;color:var(--ok)}
.answer.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 11%,var(--surface));animation:shake .4s}
.answer.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.answer.wrong .mark{opacity:1;color:var(--bad)}
.answer.dim{opacity:.48}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.quiz-fb{min-height:58px;margin-top:14px}
.quiz-fb .fb{font-family:var(--px);font-weight:700;font-size:21px;display:flex;align-items:center;gap:9px}
.quiz-fb .fb .ic{width:19px;height:19px}
.quiz-fb .fb.ok{color:var(--ok)}.quiz-fb .fb.bad{color:var(--bad)}
.quiz-fb .fb-sub{font-size:13px;color:var(--muted);margin-top:3px}
.quiz-fb .fb-sub i{font-style:italic}
.quiz-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.quiz-foot .btn.primary{flex:1;min-width:220px;min-height:54px;font-size:15.5px}
/* ============ SETTINGS ============ */
.settings-wrap{max-width:780px}
.set-card{margin-bottom:16px}
.set-title{font-family:var(--px);font-weight:700;font-size:19px;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.set-title .ic{width:17px;height:17px;color:var(--accent)}
.set-note{font-size:12px;color:var(--muted);margin-bottom:13px}
.set-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.swatch{min-height:66px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);transition:border-color .2s,box-shadow .2s,color .2s}
.swatch .dot{width:26px;height:26px;border-radius:8px}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px var(--glow);color:var(--text)}
.switch{position:relative;width:64px;height:44px;background:none;border:none;cursor:pointer;flex:none}
.switch::before{content:'';position:absolute;left:4px;top:7px;width:56px;height:30px;border-radius:15px;background:var(--line);transition:background-color .25s}
.switch::after{content:'';position:absolute;left:8px;top:11px;width:22px;height:22px;border-radius:11px;background:var(--surface);box-shadow:0 1px 4px rgb(0 0 0 / .35);transition:transform .25s}
.switch[aria-pressed="true"]::before{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(26px)}
.fx-row{display:flex;align-items:center;gap:14px}
.fx-row input{flex:1}
.fx-row output{font-family:var(--px);font-size:17px;color:var(--accent);min-width:52px;text-align:right}
.about-p{font-size:13.5px;line-height:1.65;color:var(--text)}
.about-p+.about-p{margin-top:8px}
.kbd{font-family:var(--px);font-size:12px;padding:2px 7px;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:var(--surface2)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 20px}
.empty canvas{width:192px;height:144px;image-rendering:pixelated;border-radius:12px;border:2px solid var(--accent);box-shadow:0 0 24px var(--glow)}
.empty h3{font-family:var(--px);font-size:24px;font-weight:700}
.empty p{color:var(--muted);font-size:13.5px;max-width:380px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:94vw}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;

.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}

  .main{padding:calc(74px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom))}
  .browse-grid,.quiz-grid{grid-template-columns:1fr}
  .card{padding:15px;border-radius:17px}
  .quiz-media{max-height:44vh;max-height:44dvh}
  .toasts{bottom:calc(80px + env(safe-area-inset-bottom))}
  .view-sub{font-size:12.5px}
}
@media (max-width:480px){

  .seg button{padding:0 10px;font-size:12px}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ================= WIKIPEDIA API + CACHE ================= */
const memCache = new Map();
const cacheKey = (lang, title) => 'tq1:' + lang + ':' + title;
function cacheGet(lang, title){
  const k = cacheKey(lang, title);
  if (memCache.has(k)) return memCache.get(k);
  try {
    const raw = localStorage.getItem(k);
    if (raw){ const obj = JSON.parse(raw); memCache.set(k, obj); return obj; }
  } catch (e) {}
  return null;
}
function cacheSet(lang, title, obj){
  obj.ts = Date.now();
  const k = cacheKey(lang, title);
  memCache.set(k, obj);
  try { localStorage.setItem(k, JSON.stringify(obj)); }
  catch (e) {
    evictCache();
    try { localStorage.setItem(k, JSON.stringify(obj)); } catch (e2) {}
  }
}
function cacheDel(lang, title){
  const k = cacheKey(lang, title);
  memCache.delete(k);
  try { localStorage.removeItem(k); } catch (e) {}
}
function cacheKeys(){
  const keys = [];
  try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.indexOf('tq1:') === 0) keys.push(k); } } catch (e) {}
  return keys;
}
function evictCache(){
  const keys = cacheKeys();
  const withTs = keys.map(k => { let ts = 0; try { ts = (JSON.parse(localStorage.getItem(k)) || {}).ts || 0; } catch (e) {} return { k, ts }; });
  withTs.sort((a, b) => a.ts - b.ts);
  withTs.slice(0, Math.ceil(withTs.length / 2)).forEach(x => { memCache.delete(x.k); try { localStorage.removeItem(x.k); } catch (e) {} });
}
function cacheCount(){ return cacheKeys().length; }
async function apiGet(lang, params, retry){
  const q = new URLSearchParams(Object.assign({ format: 'json', origin: '*' }, params));
  const url = 'https://' + lang + '.wikipedia.org/w/api.php?' + q.toString();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('http ' + res.status);
    return await res.json();
  } catch (e) {
    clearTimeout(timer);
    if (!retry && navigator.onLine){
      await new Promise(r => setTimeout(r, 650));
      return apiGet(lang, params, true);
    }
    throw e;
  }
}
async function fetchPage(lang, title){
  const j = await apiGet(lang, {
    action: 'query', prop: 'pageimages|extracts', piprop: 'thumbnail', pithumbsize: '800',
    exintro: '1', explaintext: '1', redirects: '1', titles: title
  });
  const pages = j && j.query && j.query.pages;
  if (!pages) return null;
  const p = Object.values(pages)[0];
  if (!p || p.missing !== undefined || p.invalid) return null;
  return {
    title: p.title,
    thumb: (p.thumbnail && p.thumbnail.source) || null,
    extract: p.extract || '',
    url: 'https://' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_')),
    lang: lang
  };
}
async function getTreeData(tr, lang){
  const primary = lang === 'ru' ? tr.wikiTitleRu : tr.wikiTitleEn;
  const secondary = lang === 'ru' ? tr.wikiTitleEn : tr.wikiTitleRu;
  const other = lang === 'ru' ? 'en' : 'ru';
  const hit = cacheGet(lang, primary);
  if (hit) return hit;
  const attempts = [[lang, primary], [other, secondary], [other, tr.latin]];
  for (const pair of attempts){
    if (!pair[1]) continue;
    try {
      const p = await fetchPage(pair[0], pair[1]);
      if (p && (p.thumb || p.extract)){ cacheSet(lang, primary, p); return p; }
    } catch (e) {}
  }
  throw new Error('nodata');
}
const ANGLE_RULES = [
  ['leaf', ['leaf','leaves','foliage','blatt','blätter','feuille','feuillage','hoja','foglia','лист','листв']],
  ['bark', ['bark','rinde','ecorce','écorce','corteza','кора','ствол','trunk','stamm','tronc','bole']],
  ['cone', ['cone','cones','zapfen','strobil','шишк']],
  ['fruit', ['fruit','fruits','berry','berries','frucht','fruto','плод','ягод','семен','seed']],
  ['flower', ['flower','flowers','blossom','bloom','blüte','blute','fleur','flor','цвет','сереж','серёж','catkin','kätzchen','infloresc']],
  ['habit', ['habit','habitus','silhouette','whole','tree','крона','crown','габитус','дерев']]
];
const ANGLE_SKIP = ['svg','gif','icon','logo','map','range','distribution','areal','chart','diagram','location','flag','coat','symbol','stub','edit','lock','star','folder','portal','question','book','audio','video','ogg','ogv','webm','pdf','djvu','commons','wiki','herbarium','sketch','drawing','engraving','illustration','painting'];
function classifyAngle(name){
  const s = name.toLowerCase();
  for (const bad of ANGLE_SKIP){ if (s.indexOf(bad) >= 0) return null; }
  for (const rule of ANGLE_RULES){
    for (const kw of rule[1]){ if (s.indexOf(kw) >= 0) return rule[0]; }
  }
  return null;
}
async function getAngles(tr, data){
  if (Array.isArray(data.angles)) return data.angles;
  let angles = [];
  try {
    const j = await apiGet(data.lang, { action: 'query', prop: 'images', imlimit: '400', imnamespace: '6', redirects: '1', titles: data.title });
    const pages = j && j.query && j.query.pages;
    const page = pages && Object.values(pages)[0];
    const files = (page && page.images) || [];
    const picked = [], seen = {};
    for (const f of files){
      const kind = classifyAngle(f.title);
      if (kind && !seen[kind]){ seen[kind] = true; picked.push({ kind: kind, title: f.title }); }
      if (picked.length >= 5) break;
    }
    if (picked.length){
      const j2 = await apiGet(data.lang, { action: 'query', prop: 'imageinfo', iiprop: 'url', iiurlwidth: '640', titles: picked.map(p => p.title).join('|') });
      const norm = s => s.replace(/_/g, ' ').toLowerCase();
      const map = {};
      const pages2 = (j2 && j2.query && j2.query.pages) || {};
      Object.values(pages2).forEach(p => {
        if (p.imageinfo && p.imageinfo[0] && p.imageinfo[0].thumburl) map[norm(p.title)] = p.imageinfo[0].thumburl;
      });
      angles = picked.map(p => ({ kind: p.kind, title: p.title, url: map[norm(p.title)] || null })).filter(a => a.url);
    }
  } catch (e) { angles = []; }
  data.angles = angles;
  const primary = state.lang === 'ru' ? tr.wikiTitleRu : tr.wikiTitleEn;
  cacheSet(state.lang, primary, data);
  return angles;
}
function loadImage(url){
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.decoding = 'async';
    let retried = false, done = false;
    const guard = setTimeout(() => { if (!done){ done = true; reject(new Error('timeout')); } }, 20000);
    im.onload = () => { if (!done){ done = true; clearTimeout(guard); resolve(im); } };
    im.onerror = () => {
      if (!retried){ retried = true; setTimeout(() => { im.src = url; }, 700); }
      else if (!done){ done = true; clearTimeout(guard); reject(new Error('img')); }
    };
    im.src = url;
  });
}

function attachGestures(frame, handlers){
  if (!frame) return;
  let pid = null, sx = 0, sy = 0, moved = false;
  frame.addEventListener('pointerdown', e => {
    if (e.target.closest('button,a,input,select,label')) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; moved = false;
    try { frame.setPointerCapture(pid); } catch (err) {}
  });
  frame.addEventListener('pointermove', e => {
    if (pid !== e.pointerId) return;
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) moved = true;
  });
  frame.addEventListener('pointerup', e => {
    if (pid !== e.pointerId) return;
    pid = null;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3){
      if (dx < 0) handlers.onSwipeL(); else handlers.onSwipeR();
      return;
    }
    if (!moved && handlers.onTap) handlers.onTap();
  });
  frame.addEventListener('pointercancel', () => { pid = null; });
}

  state.browse.index = (state.browse.index + d + list.length) % list.length;
  AudioFX.tick();
  showBrowseCard();
}
function updateBrowseSeg(){ $$('#bMedia .seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.browse.mode)); }
function setBrowseMode(mode, roll){
  if (state.browse.mode !== mode){ state.browse.mode = mode; save(); }
  updateBrowseSeg();
  const ctx = browseCtx; if (!ctx) return;
  if (mode === 'pixel'){
    if (roll !== false){ Object.assign(state.lab, rollCRT(Math.random)); syncLabUI(); }
    renderPixel(ctx.canvas, ctx.source, state.lab);
    ctx.frame.dataset.show = 'canvas';
  } else {
    if (ctx.sourceIsPhoto && ctx.currentUrl){ ctx.img.src = ctx.currentUrl; ctx.frame.dataset.show = 'img'; }
    else ctx.frame.dataset.show = 'canvas';
  }
  AudioFX.tick();
}
function ensurePixelLive(){
  const ctx = browseCtx; if (!ctx) return;
  if (state.browse.mode !== 'pixel'){ state.browse.mode = 'pixel'; save(); updateBrowseSeg(); }
  renderPixel(ctx.canvas, ctx.source, state.lab);
  ctx.frame.dataset.show = 'canvas';
}
function fillBrowseInfo(tr, data, tok){
  if (tok !== state.browse.token) return;
  const ex = $('#bExtract'), wiki = $('#bWiki'), badge = $('#bEnBadge'), retry = $('#bRetry'), expand = $('#bExpand');
  if (!ex) return;
  if (data && data.extract){
    ex.innerHTML = data.extract.split(/\n+/).filter(Boolean).map(p => '<p>' + esc(p) + '</p>').join('');
    retry.hidden = true;
  } else {
    ex.innerHTML = '<p>' + esc(t('noExtract')) + '</p>';
    retry.hidden = false;
  }
  badge.hidden = !data || data.lang === state.lang;
  wiki.href = data ? data.url : wikiUrlFor(tr);
  requestAnimationFrame(() => {
    if (tok !== state.browse.token) return;
    expand.hidden = !(ex.scrollHeight > ex.clientHeight + 4);
  });
  if (data && data.thumb){
    getAngles(tr, data).then(angles => {
      if (tok !== state.browse.token) return;
      renderAngles(data, angles);
    }).catch(() => {});
  }
}
function renderAngles(data, angles){
  const wrap = $('#bAnglesWrap'), box = $('#bAngles');
  if (!wrap || !box) return;
  if (!angles.length){ wrap.hidden = true; return; }
  wrap.hidden = false;
  let h = '<button class="angle on" data-action="angle" data-url="' + esc(data.thumb) + '"><img src="' + esc(data.thumb) + '" alt="" loading="lazy" crossorigin="anonymous"><span>' + esc(t('angleMain')) + '</span></button>';
  angles.forEach(a => {
    h += '<button class="angle" data-action="angle" data-url="' + esc(a.url) + '"><img src="' + esc(a.url) + '" alt="" loading="lazy" crossorigin="anonymous"><span>' + esc(t('angle_' + a.kind)) + '</span></button>';
  });
  box.innerHTML = h;
}
function pickAngle(btn){
  const ctx = browseCtx; if (!ctx) return;
  const url = btn.dataset.url;
  $$('#bAngles .angle').forEach(b => b.classList.toggle('on', b === btn));
  const tok = ctx.token;
  AudioFX.tick();
  loadImage(url).then(im => {
    if (tok !== ctx.token) return;
    ctx.source = im; ctx.sourceIsPhoto = true; ctx.currentUrl = url;
    if (state.browse.mode === 'photo'){ ctx.img.src = url; ctx.frame.dataset.show = 'img'; }
    else { Object.assign(state.lab, rollCRT(Math.random)); syncLabUI(); renderPixel(ctx.canvas, im, state.lab); ctx.frame.dataset.show = 'canvas'; }
    setStatus(ctx.status, 'hidden');
  }).catch(() => { if (tok === ctx.token) toast(t('noPhoto'), 'warn'); });
}

function labExport(){
  const src = (browseCtx && browseCtx.source) ? browseCtx.source : proceduralTree(7);
  const c = document.createElement('canvas');
  renderPixel(c, src, state.lab);
  const tr = browseCtx && browseCtx.tree;
  const name = 'treequiz-' + (tr ? tr.latin.replace(/[^a-zA-Zа-яА-ЯёЁ×]+/g, '-') : 'pixel-tree') + '.png';
  const done = url => {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast(t('exported'), 'ok');
  };
  if (c.toBlob){
    c.toBlob(b => {
      if (!b){ done(c.toDataURL('image/png')); return; }
      const u = URL.createObjectURL(b);
      done(u);
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    }, 'image/png');
  } else done(c.toDataURL('image/png'));
  AudioFX.tick();
}
/* ================= QUIZ ================= */
function buildOptions(tr, pool){
  const genus = tr.latin.split(' ')[0];
  const rest = pool.filter(x => x.id !== tr.id);
  const same = shuffle(rest.filter(x => x.latin.split(' ')[0] === genus));
  const other = shuffle(rest.filter(x => x.latin.split(' ')[0] !== genus));
  const picks = same.slice(0, 2);
  for (const x of other){ if (picks.length >= 3) break; picks.push(x); }
  if (picks.length < 3){
    const glob = shuffle(SPECIES.filter(x => x.id !== tr.id && !picks.some(p => p.id === x.id)));
    for (const x of glob){ if (picks.length >= 3) break; picks.push(x); }
  }
  return shuffle([tr].concat(picks));
}

function newQuestion(){
  const body = $('#quizBody'); if (!body) return;
  const pool = filtered();
  updateFilterCount();
  if (!pool.length){ quizCtx = null; state.quiz.tree = null; mountEmpty(body); return; }
  let tr = pool[(Math.random() * pool.length) | 0];
  if (pool.length > 1){ while (tr.id === state.quiz.lastId){ tr = pool[(Math.random() * pool.length) | 0]; } }
  state.quiz.lastId = tr.id;
  const options = buildOptions(tr, pool);
  const mode = state.quiz.imgMode === 'mix' ? (Math.random() < 0.5 ? 'photo' : 'pixel') : state.quiz.imgMode;
  state.quiz.tree = tr; state.quiz.options = options;
  state.quiz.answered = false; state.quiz.picked = -1; state.quiz.ready = false; state.quiz.mode = mode;
  state.quiz.lab = Object.assign({}, state.lab, rollCRT(Math.random));
  const tok = ++state.quiz.token;
  body.innerHTML = questionHTML(tr, options, mode);
  const ctx = {
    token: tok, kind: 'quiz', lab: state.quiz.lab, tree: tr,
    frame: $('#qMedia'), img: $('#qImg'), canvas: $('#qCanvas'), status: $('#qStatus'),
    source: null, sourceIsPhoto: false, currentUrl: null, data: null,
    onReady(){
      if (tok !== state.quiz.token) return;
      state.quiz.ready = true;
      $$('#qAnswers .answer').forEach(b => { b.disabled = false; });
    }
  };
  quizCtx = ctx;
  attachGestures(ctx.frame, {
    onSwipeL: () => { AudioFX.tick(); newQuestion(); },
    onSwipeR: () => { AudioFX.tick(); newQuestion(); }
  });
  loadMedia(tr, ctx, 'quiz');
}
function answerQuiz(i){
  const q = state.quiz;
  if (!q.tree || q.answered || !q.ready || i < 0 || i > 3) return;
  q.answered = true; q.picked = i;
  const correctIdx = q.options.findIndex(o => o.id === q.tree.id);
  $$('#qAnswers .answer').forEach((b, j) => {
    b.disabled = true;
    const mark = $('.mark', b);
    if (j === correctIdx){ b.classList.add('correct'); if (mark) mark.innerHTML = icon('check'); }
    else if (j === i){ b.classList.add('wrong'); if (mark) mark.innerHTML = icon('cross'); }
    else b.classList.add('dim');
  });
  const ok = i === correctIdx;
  const fb = $('#qFb');
  const nm = treeName(q.tree);
  fb.innerHTML = ok
    ? '<div class="fb ok">' + icon('check') + esc(t('correct')) + '</div><div class="fb-sub">' + esc(nm) + ' · <i>' + esc(q.tree.latin) + '</i></div>'
    : '<div class="fb bad">' + icon('cross') + esc(t('wrong')) + '</div><div class="fb-sub">' + esc(t('itIs')) + ' ' + esc(nm) + ' · <i>' + esc(q.tree.latin) + '</i></div>';
  $('#qSkip').hidden = true;
  $('#qNext').hidden = false;
  const wl = $('#qWiki');
  wl.hidden = false;
  wl.href = (quizCtx && quizCtx.data) ? quizCtx.data.url : wikiUrlFor(q.tree);
  if (ok) AudioFX.correct(); else AudioFX.wrong();
}

  newQuestion();
}

  newQuestion();
}
/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'nav') nav(el.dataset.view);
  else if (a === 'toggleMute') toggleMute();
  else if (a === 'toggleTheme'){ applyTheme(state.theme === 'dark' ? 'light' : 'dark'); AudioFX.tick(); }
  else if (a === 'chip') toggleRegion(el.dataset.r);
  else if (a === 'presetMy') setRegions(['nw']);
  else if (a === 'presetAll') setRegions(REGIONS.map(r => r.id));
  else if (a === 'bPrev') navBrowse(-1);
  else if (a === 'bNext') navBrowse(1);
  else if (a === 'bMode') setBrowseMode(el.dataset.mode);
  else if (a === 'bExpand') toggleExtract();
  else if (a === 'bRetry') retryBrowse();
  else if (a === 'angle') pickAngle(el);
  else if (a === 'labRandom') labRandom();
  else if (a === 'labReset') labReset();
  else if (a === 'labExport') labExport();
  else if (a === 'qAnswer') answerQuiz(+el.dataset.i);
  else if (a === 'qNext' || a === 'qSkip'){ AudioFX.tick(); newQuestion(); }
  else if (a === 'qImgMode') setQuizImgMode(el.dataset.val);
  else if (a === 'lang') applyLang(el.dataset.val);
  else if (a === 'theme'){ applyTheme(el.dataset.val); AudioFX.tick(); }
  else if (a === 'hue'){ applyHue(+el.dataset.i); AudioFX.tick(); }
  else if (a === 'testSound') testSound();
  else if (a === 'clearCache') clearCache();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.lab && el.type === 'range') labInput(el.dataset.lab, el.value);
  else if (el.id === 'fxRange'){
    state.fx = clampN(+el.value, 0, 100); save();
    const out = $('#fxOut'); if (out) out.textContent = state.fx + '%';
    if (state.view === 'browse' && browseCtx && browseCtx.frame.dataset.show === 'canvas') renderPixel(browseCtx.canvas, browseCtx.source, state.lab);
    if (state.view === 'quiz' && quizCtx && state.quiz.mode === 'pixel' && quizCtx.frame.dataset.show === 'canvas') renderPixel(quizCtx.canvas, quizCtx.source, quizCtx.lab);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset && el.dataset.lab) labInput(el.dataset.lab, el.value);
});
document.addEventListener('keydown', e => {
  const tgt = e.target;
  if (tgt && tgt.matches && tgt.matches('input,select,textarea')) return;
  const onControl = tgt && tgt.closest && tgt.closest('button,a');
  if (state.view === 'browse'){
    if (e.key === 'ArrowLeft'){ e.preventDefault(); navBrowse(-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); navBrowse(1); }
    else if (e.key === ' ' && !onControl){ e.preventDefault(); setBrowseMode(state.browse.mode === 'photo' ? 'pixel' : 'photo'); }
    else if (e.key === 'Enter' && tgt && tgt.id === 'bMedia'){ e.preventDefault(); setBrowseMode(state.browse.mode === 'photo' ? 'pixel' : 'photo'); }
  } else if (state.view === 'quiz'){
    if (e.key >= '1' && e.key <= '4') answerQuiz(+e.key - 1);
    else if ((e.key === 'ArrowRight' || e.key === 'Enter') && !onControl){ e.preventDefault(); AudioFX.tick(); newQuestion(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); AudioFX.tick(); newQuestion(); }
  }
});
window.addEventListener('online', () => { updateNet(); toast(t('onlineToast'), 'ok'); });
window.addEventListener('offline', () => { updateNet(); toast(t('offlineToast'), 'warn'); });
const onRMChange = () => {
  RM = RM_QUERY.matches;
  if (state.view === 'browse'){
    const box = $('#labBox');
    if (box){ box.innerHTML = labHTML(); syncLabUI(); }
    if (browseCtx && browseCtx.frame.dataset.show === 'canvas') renderPixel(browseCtx.canvas, browseCtx.source, state.lab);
  } else if (state.view === 'settings') renderSettingsView();
  else if (state.view === 'quiz' && quizCtx && state.quiz.mode === 'pixel') renderPixel(quizCtx.canvas, quizCtx.source, quizCtx.lab);
};
if (RM_QUERY.addEventListener) RM_QUERY.addEventListener('change', onRMChange);
else if (RM_QUERY.addListener) RM_QUERY.addListener(onRMChange);
document.addEventListener('pointerdown', function unlock(){
  if (!state.muted){ AudioFX.ensure(); AudioFX.resume(); }
}, { once: true });
/* ================= INIT ================= */
loadSettings();
document.documentElement.dataset.theme = state.theme;
const h0 = HUES[state.hue];
document.documentElement.style.setProperty('--hue', h0.h);
document.documentElement.style.setProperty('--hsat', h0.s + '%');
fillIcons(document);
applyStaticI18n();
metaTheme();
nav('browse');
})();
</script>
</body>
</html>
