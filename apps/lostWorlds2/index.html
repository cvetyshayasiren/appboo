    else if(idx===9){ const o=ctx.createOscillator(), gg=ctx.createGain(), f=ctx.createBiquadFilter();
        o.type='sine'; o.frequency.setValueAtTime(200,t+.05); o.frequency.exponentialRampToValueAtTime(20,t+2.3);
        f.type='lowpass'; f.frequency.value=900;
        gg.gain.setValueAtTime(.0001,t+.05); gg.gain.exponentialRampToValueAtTime(V*.42,t+.25);
        gg.gain.exponentialRampToValueAtTime(.0001,t+2.5);
        o.connect(f); f.connect(gg); gg.connect(g); o.start(t+.05); o.stop(t+2.6);
        o.onended=()=>{try{o.disconnect();f.disconnect();gg.disconnect()}catch(e){}}; rec.srcs.push(o);
        noiseHit(g,t+.05,2.2,V*.1,'lowpass',300);
        tone(2400,300,t+.1,1.8,V*.06,'sine'); }
    setTimeout(()=>{ const i=stingers.indexOf(rec); if(i>=0) stingers.splice(i,1);
      try{g.disconnect()}catch(e){} },(def.dur+2.5)*1000);
  }
  return {
    isStarted:()=>started,
    isMuted:()=>muted,
    unlock(){ if(!init()) return false; if(ctx.state==='suspended') ctx.resume(); return true; },
    setWorld(world){ if(!ctx) return; buses.forEach(b=>retire(b)); createBus(world); },
    updateParams(world){ const b=buses[buses.length-1]; if(b&&!b.retired){ b.world=world; applyLevels(b); } },
    playRarity,
    setMuted(m){
      muted=m; if(!ctx) return;
      if(!m&&ctx.state==='suspended') ctx.resume();
      master.gain.setTargetAtTime(m?0:.85,now(),.15);
      if(m) setTimeout(()=>{ if(muted&&ctx&&ctx.state==='running') ctx.suspend(); },450);
    },
    suspend(){ if(ctx&&ctx.state==='running') ctx.suspend(); },
    resume(){ if(ctx&&!muted&&ctx.state==='suspended') ctx.resume(); }
  };
})();

const viewRows={}, edRows={};
(function buildRows(){
  const frag=document.createDocumentFragment(), efrag=document.createDocumentFragment();
  for(const d of PARAM_DEFS){
    const row=document.createElement('div'); row.className='prow';
    row.innerHTML=`<div class="prow-top"><span>${d.label}</span><b>—</b></div><div class="pbar"><i></i></div>`;

    er.innerHTML=`<div class="erow-top"><span>${d.label}</span><b>—</b></div>

      </div>`;
    efrag.appendChild(er);

    edRows[d.k]={row:er,val:er.querySelector('.erow-top b'),input,lockBtn,reBtn};
    input.addEventListener('input',()=>onSlider(d,parseFloat(input.value)));
    input.addEventListener('change',()=>commitSlider());
    lockBtn.addEventListener('click',()=>toggleLock(d.k));

  }

})();

/* --- раскладка карточки (без скролла страницы) --- */
function layout(){
  const st=$('stage'), hint=$('hint');
  const hintH=(hint.offsetParent!==null)?hint.offsetHeight+10:0;
  const availW=Math.max(200,st.clientWidth-24), availH=Math.max(220,st.clientHeight-hintH-14);
  const narrow=window.innerWidth<720, maxW=narrow?520:560;
  const bMin=App.edit?.38:.20, bMax=App.edit?.50:.30;
  let W=Math.min(maxW,availW,availH*(1-bMin)/0.9025);
  let H=Math.min(availH*.97,0.9025*W/(1-bMax));
  H=Math.max(H,0.9025*W/(1-bMin));
  if(H>availH){ W=availH*(1-bMin)/0.9025; H=availH; }
  el.wrap.style.width=Math.round(W)+'px';
  el.wrap.style.height=Math.round(H)+'px';
}
let layoutRaf=0;
window.addEventListener('resize',()=>{ cancelAnimationFrame(layoutRaf); layoutRaf=requestAnimationFrame(layout); });

/* --- палитра → UI --- */
function applyPaletteUI(w){
  const pal=getPalette(w), rar=RARITIES[w.rarity];
  const acc=pal.accent, acc2=pal.city[4];
  const root=document.documentElement.style;
  root.setProperty('--acc',rgbcss(acc));
  root.setProperty('--acc2',rgbcss(acc2));
  root.setProperty('--rar',rar.col);
  const d1=mixc(pal.ink,[7,6,10],.62), d2=mixc(pal.ink,acc,.16);
  root.setProperty('--desk1',rgbcss(d1)); root.setProperty('--desk2',rgbcss(d2));
  const paper=w.rarity>=1?mixc([247,243,233],acc,w.rarity>=3?.05:.07):[247,243,233];
  root.setProperty('--paper',rgbcss(paper));
}
/* --- частицы редкости --- */
function buildParticles(w){
  el.parts.innerHTML='';
  const def=RARITIES[w.rarity]; if(!def.parts||REDUCED) return;
  const r=rngFor(w.seed,'particles'), pal=getPalette(w);
  const cols=[def.col,rgbcss(pal.accent),w.rarity>=6?'#fff8dc':def.col];
  const n=def.parts;
  for(let i=0;i<n;i++){
    const s=document.createElement('i');
    const side=r();
    const x=side<.5? (r()*106-3) : (r()<.5? -3-r()*4 : 100+r()*4);
    const y=r()*104-2;
    s.style.setProperty('--x',x.toFixed(1)+'%');
    s.style.setProperty('--y',y.toFixed(1)+'%');
    s.style.setProperty('--s',(1.5+r()*2.6).toFixed(1)+'px');
    s.style.setProperty('--c',cols[Math.floor(r()*cols.length)]);
    s.style.setProperty('--d',(2.6+r()*3.4).toFixed(2)+'s');
    s.style.setProperty('--delay',(-r()*5).toFixed(2)+'s');
    s.style.setProperty('--dx',((r()*2-1)*22).toFixed(0)+'px');
    el.parts.appendChild(s);
  }
}
/* --- обновление подписи --- */
function fmt(d,v){ return d.fmt(v); }
function applyWorldUI(w){
  el.name.textContent=w.name;
  el.seed.textContent=w.seed;
  const P=w.params;
  el.meta.innerHTML=`<b>${w.biome}</b> · ${w.archetype} · ${WEATHERS[Math.round(P.weather)]} · ${PARAM_DEFS[11].fmt(P.timeOfDay)}`;
  const rar=RARITIES[w.rarity];
  el.rarName.textContent=rar.name;
  el.frameNo.textContent='КАДР '+String(App.idx+1).padStart(4,'0');
  for(const d of PARAM_DEFS){
    const v=P[d.k], t=(v-d.min)/(d.max-d.min);
    const vr=viewRows[d.k]; vr.val.textContent=fmt(d,v); vr.bar.style.width=(t*100).toFixed(1)+'%';
    vr.row.classList.toggle('locked',App.locks[d.k]!=null);
    const er=edRows[d.k];
    er.val.textContent=fmt(d,v);
    if(document.activeElement!==er.input) er.input.value=v;
    er.input.style.setProperty('--fill',(t*100).toFixed(1)+'%');
    const locked=App.locks[d.k]!=null;
    er.lockBtn.classList.toggle('on',locked);
    er.lockBtn.setAttribute('aria-pressed',locked?'true':'false');
    er.lockBtn.innerHTML=locked?ICON.lock:ICON.unlock;
  }
  el.wrap.className='card-wrap rw'+w.rarity+(App.edit?' editing':'');
  const rot=(rngFor(w.seed,'postfx')()*2-1)*1.2;
  el.card.style.setProperty('--rot',rot.toFixed(2)+'deg');
  $('btnBack').disabled=App.idx<=0;
  applyPaletteUI(w); buildParticles(w);
  viewCanvas.setAttribute('aria-label',`Пиксельный снимок мира ${w.name}, биом ${w.biome}, редкость ${rar.name}`);
}
/* --- проявка --- */
function developAnim(w){
  if(REDUCED) return;
  const dur=900+Math.round(rngFor(w.seed,'postfx')()*500);
  el.photo.style.setProperty('--dev',dur+'ms');
  el.photo.classList.remove('developing'); void el.photo.offsetWidth; el.photo.classList.add('developing');
  el.wrap.classList.remove('enter'); void el.wrap.offsetWidth; el.wrap.classList.add('enter');
}
/* --- hash --- */
let hashTimer=null;
function writeHash(w){
  App.hashLock=true;
  const h=encodeHash(w);
  try{ history.replaceState(null,'',h); }catch(e){ location.hash=h; }
  setTimeout(()=>{App.hashLock=false;},60);
}
function scheduleHash(w){ clearTimeout(hashTimer); hashTimer=setTimeout(()=>writeHash(w),320); }
window.addEventListener('hashchange',()=>{
  if(App.hashLock) return;
  const w=decodeHash(location.hash); if(!w) return;
  App.hist=App.hist.slice(0,App.idx+1); App.hist.push({world:w,bitmap:null});
  App.idx=App.hist.length-1; remember(w); show(true,true);
});

/* --- показ кадра --- */
function show(develop,stinger){
  const e=cur(); if(!e) return;
  if(!e.bitmap) e.bitmap=renderToCanvas(e.world,false);
  blit(e.bitmap);
  applyWorldUI(e);
  AudioEngine.setWorld(e.world);
  if(stinger) AudioEngine.playRarity(e.world.rarity,e.world.seed);
  writeHash(e.world);
  if(develop) developAnim(e.world);
}
function rerender(preview){
  const e=cur(); if(!e) return;
  const c=renderToCanvas(e.world,preview);
  if(!preview) e.bitmap=c;
  blit(c); applyPaletteUI(e.world);
}
/* --- анти-однообразие --- */
function remember(w){
  App.vec.push(vectorOf(w.params)); if(App.vec.length>20) App.vec.shift();
  App.sigs.push(fxSig(w.fx)); if(App.sigs.length>6) App.sigs.shift();
  App.rars.push(w.rarity); if(App.rars.length>12) App.rars.shift();
}
function tooClose(P){
  const v=vectorOf(P); let min=1;
  for(const o of App.vec) min=Math.min(min,vecDist(v,o,App.locks));
  return min;
}
function makeWorld(){
  const pity=App.rars.length>=5&&App.rars.slice(-5).every(r=>r===0);
  let best=null,bestD=-1;
  for(let a=0;a<(pity?26:6);a++){
    const w=buildWorld(newSeed(),App.locks);
    if(pity&&w.rarity<2) continue;
    const d=tooClose(w.params);
    if(d>.60){ best=w; break; }
    if(d>bestD){ bestD=d; best=w; }
  }
  if(!best) best=buildWorld(newSeed(),App.locks);
  /* разнообразие характера плёнки */
  for(let i=0;i<4;i++){
    const sig=fxSig(best.fx);
    let similar=false;
    for(const s of App.sigs.slice(-3)) if(sigDist(sig,s)>.86) similar=true;
    if(!similar) break;
    best.fxSeed=(best.fxSeed+7919*(i+1))%100000;
    best.fx=buildFX(best.seed,best.fxSeed);
  }
  return best;
}
function pushWorld(w){
  App.hist=App.hist.slice(0,App.idx+1);
  App.hist.push({world:w,bitmap:null});
  if(App.hist.length>MAXHIST) App.hist.shift();
  App.idx=App.hist.length-1;
  remember(w);
}
/* --- навигация --- */
function nextShot(){ pushWorld(makeWorld()); show(true,true); }
function goBack(){ if(App.idx<=0) return; App.idx--; show(true,true); }
function goForward(){ if(App.idx>=App.hist.length-1){ nextShot(); return; } App.idx++; show(true,true); }

/* --- правка параметров --- */
let previewTimer=null;
function onSlider(d,v){
  const w=cur().world;
  w.params[d.k]=Math.round(v*1000)/1000;
  if(App.locks[d.k]!=null) App.locks[d.k]=w.params[d.k];
  refreshWorldMeta(w);
  const t=(w.params[d.k]-d.min)/(d.max-d.min);
  edRows[d.k].val.textContent=fmt(d,w.params[d.k]);
  edRows[d.k].input.style.setProperty('--fill',(t*100).toFixed(1)+'%');
  viewRows[d.k].val.textContent=fmt(d,w.params[d.k]);
  viewRows[d.k].bar.style.width=(t*100).toFixed(1)+'%';
  el.meta.innerHTML=`<b>${w.biome}</b> · ${w.archetype} · ${WEATHERS[Math.round(w.params.weather)]} · ${PARAM_DEFS[11].fmt(w.params.timeOfDay)}`;
  AudioEngine.updateParams(w);
  clearTimeout(previewTimer);
  previewTimer=setTimeout(()=>rerender(true),90);
  scheduleHash(w);
}
function commitSlider(){
  clearTimeout(previewTimer);
  const w=cur().world;
  rerender(false); applyWorldUI(w); writeHash(w);
}
function toggleLock(k){
  const w=cur().world;
  if(App.locks[k]!=null) delete App.locks[k]; else App.locks[k]=w.params[k];
  applyWorldUI(w);
  toast(App.locks[k]!=null?'Параметр залочен: '+PARAM_DEFS.find(d=>d.k===k).label:'Замок снят');
}
function rerollParam(d){
  const w=cur().world;
  const r=rngFor(w.seed+'|'+d.k+'|'+(performance.now()|0),'reroll');
  let v=d.k==='weather'?Math.floor(r()*7):d.min+r()*(d.max-d.min);
  if(DISCRETE[d.k]) v=snapDisc(d.k,v);
  v=Math.round(v/d.step)*d.step;
  w.params[d.k]=Math.round(v*1000)/1000;
  if(App.locks[d.k]!=null) App.locks[d.k]=w.params[d.k];
  refreshWorldMeta(w);
  edRows[d.k].input.value=w.params[d.k];
  rerender(false); applyWorldUI(w); writeHash(w);
  AudioEngine.updateParams(w);
}
function setEdit(on){
  App.edit=on;
  el.wrap.classList.toggle('editing',on);
  $('btnEdit').classList.toggle('on',on);
  $('btnEdit').setAttribute('aria-pressed',on?'true':'false');
  layout();
}
/* --- звук --- */
function setSound(on){
  AudioEngine.unlock();
  AudioEngine.setMuted(!on);
  const b=$('btnSound');
  b.classList.toggle('on',on);
  b.setAttribute('aria-pressed',on?'true':'false');
  $('sndIcon').innerHTML=on?ICON.sndOn:ICON.sndOff;
  $('sndLabel').textContent=on?'звук':'тихо';
  if(on&&!AudioEngine.isStarted()) AudioEngine.setWorld(cur().world);
}
let soundOn=true;
function firstGesture(){
  if(AudioEngine.isStarted()) return;
  AudioEngine.unlock();
  if(cur()){ AudioEngine.setWorld(cur().world); AudioEngine.playRarity(cur().world.rarity,cur().world.seed); }
  $('btnSound').classList.add('on'); $('btnSound').setAttribute('aria-pressed','true');
}
document.addEventListener('pointerdown',firstGesture,{once:true});
document.addEventListener('keydown',firstGesture,{once:true});

/* --- тост --- */
let toastTimer=null;
function toast(msg){
  el.toast.textContent=msg; el.toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.toast.classList.remove('show'),1900);
}
async function copyText(txt,msg){
  try{ await navigator.clipboard.writeText(txt); toast(msg); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(msg); }catch(_){ toast('Не удалось скопировать'); }
    document.body.removeChild(ta);
  }
}
/* --- экспорт PNG: снимок + подпись и паспорт --- */
function savePNG(){
  const e=cur(); if(!e) return;
  const w=e.world, bmp=e.bitmap||renderToCanvas(w,false);
  const S=3, iw=RW*S, ih=RH*S, m=Math.round(iw*.04), band=300;
  const c=document.createElement('canvas'); c.width=iw+m*2; c.height=m+ih+band;
  const x=c.getContext('2d');
  const pal=getPalette(w), rar=RARITIES[w.rarity];
  x.fillStyle='#f7f3e9'; x.fillRect(0,0,c.width,c.height);
  const rn=rngFor(w.seed,'paper');
  for(let i=0;i<5200;i++){ const px_=rn()*c.width, py_=rn()*c.height;
    x.fillStyle=`rgba(0,0,0,${(rn()*.035).toFixed(3)})`; x.fillRect(px_,py_,1,1); }
  x.imageSmoothingEnabled=false;
  x.drawImage(bmp,m,m,iw,ih);
  x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=1; x.strokeRect(m+.5,m+.5,iw-1,ih-1);
  const top=m+ih;
  x.fillStyle='#2a2620';
  x.font='40px "Segoe Script","Bradley Hand","Comic Sans MS",cursive';
  x.textBaseline='alphabetic';
  x.fillText(w.name,m+2,top+56);
  x.font='17px ui-monospace,Menlo,Consolas,monospace'; x.fillStyle='#5d564a';
  const seedW=x.measureText(w.seed).width;
  x.fillText(w.seed,c.width-m-seedW,top+52);
  x.font='13px ui-monospace,Menlo,Consolas,monospace'; x.fillStyle='#8a8172';
  x.fillText((w.biome+' · '+w.archetype+' · '+WEATHERS[Math.round(w.params.weather)]).toUpperCase(),m+2,top+82);
  x.fillStyle=rar.col; x.beginPath(); x.arc(c.width-m-96,top+77,5,0,TAU); x.fill();
  x.fillStyle='#6b6355'; x.fillText(rar.name.toUpperCase(),c.width-m-84,top+82);
  x.font='13px ui-monospace,Menlo,Consolas,monospace';
  const cols=3, colW=(iw)/cols;
  PARAM_DEFS.forEach((d,i)=>{
    const cx=m+2+Math.floor(i/6)*colW, cy=top+118+(i%6)*24;
    x.fillStyle='#8a8172'; x.fillText(d.label,cx,cy);
    x.fillStyle='#33302a'; x.fillText(fmt(d,w.params[d.k]),cx+128,cy);
  });
  x.fillStyle='#a9a091'; x.font='11px ui-monospace,Menlo,Consolas,monospace';
  x.fillText('PIXEL·ARCHIVE OF LOST WORLDS · fx'+w.fxSeed,m+2,c.height-16);
  c.toBlob(blob=>{
    if(!blob){ toast('Экспорт недоступен'); return; }
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='polaroid-'+w.seed+'.png'; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('PNG сохранён · '+w.seed);
  },'image/png');
}

/* --- события кнопок --- */
$('btnShot').addEventListener('click',nextShot);
$('btnBack').addEventListener('click',goBack);
$('btnEdit').addEventListener('click',()=>setEdit(!App.edit));
$('btnSound').addEventListener('click',()=>{
  if(!AudioEngine.isStarted()){ soundOn=true; setSound(true); toast('Звук включён'); return; }
  soundOn=!soundOn; setSound(soundOn); toast(soundOn?'Звук включён':'Звук выключен');
});
$('btnPng').addEventListener('click',savePNG);
$('btnLink').addEventListener('click',()=>copyText(location.href,'Ссылка на мир скопирована'));
$('seedChip').addEventListener('click',()=>copyText(cur().world.seed,'Сид скопирован: '+cur().world.seed));
$('btnReset').addEventListener('click',()=>{
  const e=cur(); const w=buildWorld(e.world.seed,App.locks,null,e.world.fxSeed);
  e.world=w; e.bitmap=null; rerender(false); applyWorldUI(w); writeHash(w); AudioEngine.updateParams(w);
  toast('Параметры сида восстановлены');
});
$('btnUnlock').addEventListener('click',()=>{ App.locks={}; applyWorldUI(cur().world); toast('Все замки сняты'); });

/* --- клавиатура --- */
window.addEventListener('keydown',ev=>{
  const tag=(ev.target&&ev.target.tagName)||'';
  if(tag==='INPUT'&&ev.key!=='Escape') return;
  switch(ev.key){
    case 'ArrowRight': ev.preventDefault(); nextShot(); break;
    case 'ArrowLeft': ev.preventDefault(); App.idx>0?goBack():nextShot(); break;
    case ' ': ev.preventDefault(); nextShot(); break;
    case 'Escape': if(App.edit) setEdit(false); break;
    case 's': case 'S': case 'ы': case 'Ы': setEdit(!App.edit); break;
    case 'm': case 'M': case 'ь': case 'Ь': $('btnSound').click(); break;
    case 'e': case 'E': case 'у': case 'У': savePNG(); break;
    case 'c': case 'C': case 'с': case 'С': copyText(cur().world.seed,'Сид скопирован'); break;
  }
});
/* --- колесо мыши: над снимком листает, над паспортом — скроллит --- */
$('stage').addEventListener('wheel',ev=>{
  if(ev.target.closest('.scroll')) return;
  ev.preventDefault();
  const t=performance.now();
  if(t-App.wheelT<420){ return; }
  App.wheelAcc+=ev.deltaY;
  if(Math.abs(App.wheelAcc)>26){
    App.wheelT=t; const dir=App.wheelAcc>0?1:-1; App.wheelAcc=0;
    if(dir>0) nextShot(); else (App.idx>0?goBack():nextShot());
  }
},{passive:false});
/* --- свайпы и перетаскивание карточки --- */
el.wrap.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('button,input,.scroll')) return;
  App.drag={x:ev.clientX,y:ev.clientY,dx:0,active:false,id:ev.pointerId};
  el.wrap.setPointerCapture(ev.pointerId);
});
el.wrap.addEventListener('pointermove',ev=>{
  const d=App.drag; if(!d||d.id!==ev.pointerId) return;
  const dx=ev.clientX-d.x, dy=ev.clientY-d.y;
  if(!d.active&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.3){ d.active=true; el.wrap.classList.add('dragging'); }
  if(d.active){ d.dx=dx; el.card.style.setProperty('--dx',(dx*.35).toFixed(1)+'px'); }
});
function endDrag(ev){
  const d=App.drag; if(!d) return;
  App.drag=null; el.wrap.classList.remove('dragging'); el.card.style.setProperty('--dx','0px');
  if(d.active&&Math.abs(d.dx)>52){ if(d.dx<0) nextShot(); else (App.idx>0?goBack():nextShot()); }
}
el.wrap.addEventListener('pointerup',endDrag);
el.wrap.addEventListener('pointercancel',endDrag);
el.photo.addEventListener('dblclick',nextShot);
document.addEventListener('visibilitychange',()=>{ document.hidden?AudioEngine.suspend():AudioEngine.resume(); });

/* --- текстуры бумаги и зерна стола (процедурные, без внешних файлов) --- */
(function textures(){
  const t=document.createElement('canvas'); t.width=t.height=150;
  const c=t.getContext('2d'), im=c.createImageData(150,150), r=rngFor('paper','tex');
  for(let i=0;i<150*150;i++){
    const v=228+r()*27, o=i*4;
    im.data[o]=v; im.data[o+1]=v-2; im.data[o+2]=v-6; im.data[o+3]=255;
  }
  c.putImageData(im,0,0);
  document.documentElement.style.setProperty('--paper-tex',`url(${t.toDataURL()})`);
  const g=document.createElement('canvas'); g.width=g.height=180;
  const gc=g.getContext('2d'), gi=gc.createImageData(180,180), rg=rngFor('desk','tex');
  for(let i=0;i<180*180;i++){
    const v=rg()*255, o=i*4;
    gi.data[o]=gi.data[o+1]=gi.data[o+2]=v; gi.data[o+3]=26;
  }
  gc.putImageData(gi,0,0);
  document.documentElement.style.setProperty('--grain-tex',`url(${g.toDataURL()})`);
})();

/* --- старт --- */
(function boot(){
  layout();
  const fromHash=decodeHash(location.hash);
  const w=fromHash||makeWorld();
  pushWorld(w);
  show(true,false);
  requestAnimationFrame(layout);
  setTimeout(layout,120);
  if(fromHash) toast('Мир восстановлен из ссылки');
})();
</script>
