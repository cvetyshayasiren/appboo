/* ============================================================
   appboo — плеер мини-приложений
   Один файл: HTML + CSS + JS. Без внешних библиотек.
   ============================================================ */

/* --- Тема: тёмная по умолчанию, светлая через prefers-color-scheme --- */
:root {
  --bg: #0a0c10;
  --bg-elevated: #11141b;
  --card: #161a23;
  --card-hover: #1c2230;
  --border: #232a39;
  --border-strong: #2e3648;
  --text: #e8eaf0;
  --text-muted: #8b91a1;
  --text-dim: #5e6473;
  --accent: #86C26B;
  --accent-hover: #6FB356;
  --accent-soft: rgba(134, 194, 107, 0.16);
  --danger: #ef4444;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.45);
  --sk-color: #1f2531;
  color-scheme: dark;
}

/* Ручное переключение темы (data-theme имеет приоритет над системной) */
:root[data-theme="light"] {
  --bg: #f4f5f9;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-hover: #fafbff;
  --border: #e6e8ee;
  --border-strong: #d4d8e2;
  --text: #161a23;
  --text-muted: #5f6573;
  --text-dim: #9aa0ad;
  --accent: #86C26B;
  --accent-hover: #5F9D47;
  --accent-soft: rgba(134, 194, 107, 0.18);
  --sk-color: #e9ebf1;
  --shadow: 0 6px 24px rgba(20, 25, 40, 0.08);
  --shadow-hover: 0 12px 34px rgba(20, 25, 40, 0.13);
  color-scheme: light;
}

/* Если data-theme не задан — следуем системной теме */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #f4f5f9;
    --bg-elevated: #ffffff;
    --card: #ffffff;
    --card-hover: #fafbff;
    --border: #e6e8ee;
    --border-strong: #d4d8e2;
    --text: #161a23;
    --text-muted: #5f6573;
    --text-dim: #9aa0ad;
    --accent: #86C26B;
    --accent-hover: #5F9D47;
    --accent-soft: rgba(134, 194, 107, 0.18);
    --sk-color: #e9ebf1;
    --shadow: 0 6px 24px rgba(20, 25, 40, 0.08);
    --shadow-hover: 0 12px 34px rgba(20, 25, 40, 0.13);
    color-scheme: light;
  }
}

/* Переходные темы — выбираются вручную в меню тем, от светлой к тёмной */
:root[data-theme="dawn"] {
  --bg: #e4e9db;
  --bg-elevated: #eef2e4;
  --card: #f4f7ee;
  --card-hover: #ecf1e2;
  --border: #d2d9c5;
  --border-strong: #c0c8b1;
  --text: #1f2618;
  --text-muted: #525a48;
  --text-dim: #868e7a;
  --accent: #86C26B;
  --accent-hover: #5F9D47;
  --accent-soft: rgba(134, 194, 107, 0.18);
  --sk-color: #dde3cf;
  --shadow: 0 6px 24px rgba(38, 46, 30, 0.10);
  --shadow-hover: 0 12px 34px rgba(38, 46, 30, 0.16);
  color-scheme: light;
}
:root[data-theme="overcast"] {
  --bg: #99a392;
  --bg-elevated: #a5af9d;
  --card: #b0baa7;
  --card-hover: #bac4b1;
  --border: #7e8873;
  --border-strong: #69735d;
  --text: #141a10;
  --text-muted: #38402f;
  --text-dim: #58614c;
  --accent: #86C26B;
  --accent-hover: #5F9D47;
  --accent-soft: rgba(134, 194, 107, 0.26);
  --sk-color: #a9b39f;
  --shadow: 0 6px 24px rgba(16, 22, 10, 0.18);
  --shadow-hover: 0 12px 34px rgba(16, 22, 10, 0.26);
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --bg: #161b16;
  --bg-elevated: #1b211b;
  --card: #20271f;
  --card-hover: #262e25;
  --border: #2c352b;
  --border-strong: #3a4537;
  --text: #e4e8e2;
  --text-muted: #9aa398;
  --text-dim: #6e786c;
  --accent: #86C26B;
  --accent-hover: #6FB356;
  --accent-soft: rgba(134, 194, 107, 0.16);
  --sk-color: #2a332a;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  transition: background 0.25s ease, color 0.25s ease;
}

/* --- Шапка --- */
/* Стили шапки переключаются кликом по логотипу: обычная -> прозрачная -> стекло */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
/* Прозрачная: лёгкая просвечиваемость — контент чуть виден под шапкой при скролле */
.app-header[data-header-style="translucent"] {
  background: color-mix(in srgb, var(--bg-elevated) 76%, transparent);
  border-bottom-color: color-mix(in srgb, var(--border) 70%, transparent);
  backdrop-filter: saturate(160%) blur(16px);
  -webkit-backdrop-filter: saturate(160%) blur(16px);
}
/* Стеклянная: матовое стекло — сильное размытие, блики, внутренние подсветки, глубина */
.app-header[data-header-style="glass"] {
  background:
    linear-gradient(105deg,
      transparent 42%,
      color-mix(in srgb, #ffffff 9%, transparent) 50%,
      transparent 58%),
    linear-gradient(to bottom,
      color-mix(in srgb, #ffffff 14%, transparent),
      color-mix(in srgb, #ffffff 4%, transparent) 55%,
      color-mix(in srgb, #ffffff 2%, transparent)),
    color-mix(in srgb, var(--bg-elevated) 52%, transparent);
  border-bottom-color: color-mix(in srgb, #ffffff 28%, transparent);
  backdrop-filter: blur(26px) saturate(190%) brightness(1.06);
  -webkit-backdrop-filter: blur(26px) saturate(190%) brightness(1.06);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, #ffffff 35%, transparent),
    inset 0 -14px 28px -20px color-mix(in srgb, #ffffff 24%, transparent),
    0 12px 36px rgba(0, 0, 0, 0.18);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  font-size: clamp(1.4rem, 4vw, 1.8rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  user-select: none;
}
.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #b4de9a);
  color: #fff;
  box-shadow: 0 4px 14px var(--accent-soft);
}
.logo-mark svg { display:block; width:32px; height:32px; }
.logo-accent { color: var(--accent); }

/* --- Выпадающее меню тем (иконка + название) --- */
.theme-menu-wrap { position: relative; flex: 0 0 auto; }
.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 42px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.theme-toggle:hover { background: var(--card-hover); border-color: var(--border-strong); transform: translateY(-1px); }
.theme-toggle:active { transform: translateY(0); }
.theme-toggle .theme-menu-icon { font-size: 1.05rem; line-height: 1; }
.theme-toggle .accordion-chevron { flex: 0 0 16px; }
.theme-toggle .accordion-chevron svg { width: 15px; height: 15px; }
.theme-menu-wrap.open .theme-toggle .accordion-chevron { transform: rotate(180deg); }
.theme-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 172px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-elevated);
  box-shadow: var(--shadow-hover);
  z-index: 60;
  display: none;
}
.theme-menu.open { display: block; }
.theme-menu button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}
.theme-menu button:hover { background: var(--accent-soft); }
.theme-menu button[aria-checked="true"] { background: var(--accent-soft); font-weight: 700; }
.theme-menu .theme-menu-icon { font-size: 1rem; line-height: 1; }
.theme-menu .theme-check { margin-left: auto; color: var(--accent); font-weight: 800; visibility: hidden; }
.theme-menu button[aria-checked="true"] .theme-check { visibility: visible; }
:root[data-theme="light"] .card-icon {
  background-color: #e8f3e1;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.35), transparent 52%),
    linear-gradient(180deg, #d7ebcc, #c3dcb4);
}
:root[data-theme="light"] .icon-img { filter: none; }
:root[data-theme="light"] .icon-mask { background: #3f6f2e; }
:root[data-theme="light"] .icon-glyph { color: #3f6f2e; text-shadow: none; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .card-icon {
    background-color: #e8f3e1;
    background-image:
      radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.35), transparent 52%),
      linear-gradient(180deg, #d7ebcc, #c3dcb4);
  }
  :root:not([data-theme]) .icon-img { filter: none; }
  :root:not([data-theme]) .icon-mask { background: #3f6f2e; }
  :root:not([data-theme]) .icon-glyph { color: #3f6f2e; text-shadow: none; }
}
/* Переходные темы: блок иконки — та же зелёная гамма, светлые темы светлее, сумерки — как тёмная */
:root[data-theme="dawn"] .card-icon {
  background-color: #d3decc;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.32), transparent 52%),
    linear-gradient(180deg, #d8e3cb, #c2d2b0);
}
:root[data-theme="dawn"] .icon-mask { background: #3f6f2e; }
:root[data-theme="dawn"] .icon-glyph { color: #3f6f2e; text-shadow: none; }
:root[data-theme="dawn"] .icon-img { filter: none; }
:root[data-theme="overcast"] .card-icon {
  background-color: #8ba06c;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.30), transparent 52%),
    linear-gradient(180deg, #9fb184, #7e915f);
}
:root[data-theme="overcast"] .icon-mask { background: #2c4a1f; }
:root[data-theme="overcast"] .icon-glyph { color: #2c4a1f; text-shadow: none; }
:root[data-theme="overcast"] .icon-img { filter: none; }

/* --- Основной контейнер --- */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 22px 20px 60px;
}

/* --- Панель фильтров --- */
.toolbar {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow);
}
.catalog-search-wrap { position:relative; width:100%; }
.catalog-search-input { width:100%; min-width:0; padding:12px 44px 12px 42px; border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); font:inherit; font-size:.96rem; outline:none; transition:border-color .18s,box-shadow .18s; }
.search-icon { position:absolute; left:14px; top:50%; transform:translateY(-54%); color:var(--text-muted); font-size:1.45rem; line-height:1; pointer-events:none; }
.search-hint { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-dim); border:1px solid var(--border); border-radius:6px; padding:1px 6px; font:inherit; font-size:.72rem; pointer-events:none; }
/* Шапка панели: поиск всегда виден, фильтры скрываются под кнопкой */
.toolbar-head {
  display: flex;
  align-items: stretch;
  gap: 10px;
}
.toolbar-head .catalog-search-wrap { flex: 1 1 auto; min-width: 0; }
.toolbar-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  transition: background 0.18s, border-color 0.18s;
}
.toolbar-toggle:hover { background: var(--card-hover); border-color: var(--border-strong); }
.toolbar-toggle .accordion-chevron { flex: 0 0 16px; }
.toolbar-toggle .accordion-chevron svg { width: 15px; height: 15px; }
.toolbar-toggle[aria-expanded="true"] .accordion-chevron { transform: rotate(180deg); }
.filters-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 0.74rem;
  font-weight: 700;
}
.filters-count[hidden] { display: none; }
/* Сворачиваемое тело панели (тот же механизм, что у секций-аккордеонов) */
.toolbar-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .3s ease;
}
.toolbar-body.open { grid-template-rows: 1fr; }
.toolbar-body-inner {
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.toolbar-body.open .toolbar-body-inner { padding-top: 14px; }
@media (prefers-reduced-motion: reduce) {
  .toolbar-body, .toolbar-body-inner { transition: none; }
}
/* Секция платформы внутри аккордеона: сегмент на всю ширину, как на мобильных */
.filter-accordion .seg { display: flex; width: 100%; min-width: 0; }
.filter-accordion .seg-btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; }
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Сворачиваемые секции фильтров */
.filter-accordion {
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0;
  overflow: hidden;
  background: var(--card);
}
.filter-accordion-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 0;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.filter-accordion-toggle:hover { background: var(--accent-soft); }
.filter-accordion-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.filter-accordion-toggle .filter-label { min-width: 0; color: var(--text); }
.filter-summary { margin-left: auto; color: var(--text-muted); font-size: .82rem; }
.accordion-chevron {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: transform .24s ease, color .2s ease;
  flex: 0 0 20px;
}
.accordion-chevron svg {
  display: block;
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.filter-accordion-toggle:hover .accordion-chevron { color: var(--accent); }
.filter-accordion.open .accordion-chevron { transform: rotate(180deg); }
.filter-accordion-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .28s ease;
}
.filter-accordion.open .filter-accordion-panel { grid-template-rows: 1fr; }
.filter-accordion-inner { min-height: 0; overflow: hidden; padding: 0 14px; transition: padding .28s ease; }
.filter-accordion.open .filter-accordion-inner { padding: 12px 14px 14px; }
.filter-search { width:100%; min-width:0; margin:0 0 10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--bg-elevated); color:var(--text); font:inherit; font-size:.9rem; outline:none; }
.filter-search:focus,.catalog-search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.filter-search::placeholder,.catalog-search-input::placeholder { color:var(--text-dim); }
.filter-accordion.open .filter-accordion-inner { padding-bottom: 14px; }
.filter-accordion .tag-filters { gap: 10px 8px; }
.sort-options {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
}
.sort-options .sort-option {
  display: block;
  width: 100%;
  padding: 5px 2px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  box-shadow: none;
  color: var(--text);
  font-size: .84rem;
  font-weight: 500;
  line-height: 1.35;
  text-align: left;
  white-space: normal;
}
.sort-options .sort-option:hover {
  transform: none;
  background: var(--accent-soft);
  color: var(--text);
}
.sort-options .sort-option.active {
  border: 0;
  background: transparent;
  box-shadow: none;
  color: #fff;
  font-weight: 650;
}
:root[data-theme="light"] .sort-options .sort-option.active,
:root[data-theme="dawn"] .sort-options .sort-option.active,
:root[data-theme="overcast"] .sort-options .sort-option.active {
  color: var(--text);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .sort-options .sort-option.active {
    color: var(--text);
  }
}
.filter-accordion .tag-filters:empty { display: none; }
@media (prefers-reduced-motion: reduce) {
  .filter-accordion-panel, .accordion-chevron { transition: none; }
}
/* Сегментный переключатель платформы */
.seg {
  display: inline-flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.seg-btn {
  border: 0;
  background: transparent;
  color: var(--text-muted);
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: background 0.18s, color 0.18s;
  white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px var(--accent-soft);
}
/* Кнопка сброса */
.btn-reset {
  margin-left: auto;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  transition: all 0.18s;
  font-family: inherit;
}
.btn-reset:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

/* --- Пилюли тегов (фильтр и карточки используют один стиль) --- */
.tag-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-filters:empty { display: none; }
.filter-group:has(.tag-filters) {
  align-items: flex-start;
  width: 100%;
}
.filter-group:has(.tag-filters) .filter-label {
  padding-top: 6px;
  min-width: 92px;
}
.tag {
  /* hue задаётся инлайн через style="--hue:N" — детерминированный цвет по тексту тега */
  --hue: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  background: hsla(var(--hue), 70%, 55%, 0.14);
  color: hsl(var(--hue), 75%, 72%);
  border: 1px solid hsla(var(--hue), 70%, 55%, 0.28);
  cursor: pointer;
  font-family: inherit;
  line-height: 1.4;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
  transition: transform 0.12s, background 0.18s;
}
.tag:hover { transform: translateY(-1px); background: hsla(var(--hue), 70%, 55%, 0.22); }
/* Пилюля-фильтр кликабельна и переключает состояние */
.tag-filter {
  cursor: pointer;
  background: transparent;
  border: 1px solid hsla(var(--hue), 70%, 55%, 0.30);
  color: hsl(var(--hue), 60%, 68%);
}
.tag-filter:hover { transform: translateY(-1px); background: hsla(var(--hue), 70%, 55%, 0.12); }
.tag-filter.active {
  background: hsla(var(--hue), 70%, 55%, 0.22);
  color: hsl(var(--hue), 85%, 80%);
  border-color: hsla(var(--hue), 80%, 60%, 0.6);
  box-shadow: 0 0 0 1px hsla(var(--hue), 80%, 60%, 0.25);
}
/* Светлая тема: теги темнее для читаемости */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .tag {
    background: hsla(var(--hue), 65%, 50%, 0.12);
    color: hsl(var(--hue), 55%, 38%);
    border-color: hsla(var(--hue), 65%, 45%, 0.25);
  }
  :root:not([data-theme]) .tag-filter {
    color: hsl(var(--hue), 48%, 36%);
    border-color: hsla(var(--hue), 60%, 45%, 0.28);
  }
  :root:not([data-theme]) .tag-filter.active {
    background: hsla(var(--hue), 65%, 50%, 0.20);
    color: hsl(var(--hue), 50%, 30%);
  }
}
:root[data-theme="light"] .tag {
  background: hsla(var(--hue), 65%, 50%, 0.12);
  color: hsl(var(--hue), 55%, 38%);
  border-color: hsla(var(--hue), 65%, 45%, 0.25);
}
:root[data-theme="light"] .tag-filter {
  color: hsl(var(--hue), 48%, 36%);
  border-color: hsla(var(--hue), 60%, 45%, 0.28);
}
:root[data-theme="light"] .tag-filter.active {
  background: hsla(var(--hue), 65%, 50%, 0.20);
  color: hsl(var(--hue), 50%, 30%);
}

/* --- Сетка карточек --- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
  gap: 18px;
}

/* --- Карточка приложения --- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow);
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-hover);
}
/* Блок иконки: цветная подложка + img поверх (если задан путь)
   Тёмная тема — глубокий однотонный зелёный градиент (#2e451f → #223319)
   с лёгкой подсветкой угла, свето-зелёные иконки (#d7ebcc); в светлой наоборот. */
.card-icon {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background-color: #223319;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.14), transparent 55%),
    linear-gradient(180deg, #2e451f, #223319);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.icon-glyph {
  font-size: clamp(2rem, 7vw, 3rem);
  font-weight: 800;
  color: #d7ebcc;
  line-height: 1;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
  max-width: 86%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-img {
  position: absolute;
  inset: 22%;
  width: auto;
  height: auto;
  max-width: 56%;
  max-height: 56%;
  margin: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.22));
}
.icon-mask {
  position: absolute;
  inset: 22%;
  margin: auto;
  width: 46%;
  height: 46%;
  background: #d7ebcc;
  -webkit-mask: var(--icon-src) center / contain no-repeat;
  mask: var(--icon-src) center / contain no-repeat;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.22));
}
.card-icon:has(.icon-img) .icon-glyph,
.card-icon:has(.icon-mask) .icon-glyph { display: none; }
.card-content {
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.card-title {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  word-break: break-word;
}
.card-desc {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.92rem;
  line-height: 1.45;
}
.card-info {
  margin: 0;
  color: var(--text-dim);
  font-size: 0.85rem;
  font-style: italic;
  line-height: 1.4;
}
.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.card-tags:empty { display: none; }
/* Бейдж нейросети — похож на тег, но с пометкой робота и пунктирной обводкой */
.ai-badge {
  --hue: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 700;
  background: hsla(var(--hue), 70%, 55%, 0.16);
  color: hsl(var(--hue), 80%, 74%);
  border: 1px dashed hsla(var(--hue), 75%, 60%, 0.55);
  cursor: pointer;
  font-family: inherit;
  appearance: none;
  -webkit-appearance: none;
}
.ai-badge:hover { transform: translateY(-1px); }
.ai-filter {
  background: transparent;
}
.ai-filter.active {
  background: hsla(var(--hue), 70%, 55%, 0.22);
  box-shadow: 0 0 0 1px hsla(var(--hue), 80%, 60%, 0.25);
}
.ai-robot { font-size: 0.9rem; }
:root[data-theme="light"] .ai-badge {
  background: hsla(var(--hue), 65%, 50%, 0.14);
  color: hsl(var(--hue), 55%, 36%);
  border-color: hsla(var(--hue), 60%, 45%, 0.5);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .ai-badge {
    background: hsla(var(--hue), 65%, 50%, 0.14);
    color: hsl(var(--hue), 55%, 36%);
    border-color: hsla(var(--hue), 60%, 45%, 0.5);
  }
}
/* Бейдж платформы — нейтральный, с иконкой */
.platform-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
}
:root[data-theme="light"] .platform-badge { color: var(--accent); }
/* Кнопки действий */
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 10px;
}
.btn-copy {
  position: relative;
  flex: 0 0 38px;
  width: 38px;
  min-width: 38px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: var(--card-hover);
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.12s;
}
.btn-copy:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.btn-copy:active { transform: translateY(0); }
.btn-copy.copied { color: var(--accent); border-color: var(--accent); }
.btn-copy svg { width: 17px; height: 17px; display: block; }
.copy-toast {
  position: fixed;
  z-index: 1000;
  left: 50%;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100vw - 32px);
  padding: 12px 18px;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
  border-radius: 14px;
  background: var(--bg-elevated);
  color: var(--text);
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.28);
  font-size: 0.9rem;
  font-weight: 650;
  line-height: 1.35;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 12px);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.copy-toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}
.copy-toast-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 0.82rem;
  font-weight: 800;
}
@media (prefers-reduced-motion: reduce) {
  .copy-toast { transition: none; }
}
.btn {
  flex: 1;
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: inherit;
  transition: transform 0.12s, background 0.18s, border-color 0.18s, color 0.18s;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-secondary {
  background: var(--card-hover);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-secondary:hover { background: var(--bg-elevated); border-color: var(--accent); color: var(--accent); }
.btn:active { transform: translateY(0); }

/* --- Состояние загрузки (скелетоны) --- */
.skeleton-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.sk-icon { aspect-ratio: 16 / 9; background: var(--sk-color); }
.sk-line { height: 12px; margin: 12px 16px 0; border-radius: 6px; background: var(--sk-color); }
.sk-line.sk-title { height: 18px; width: 60%; }
.sk-line.sk-short { width: 40%; }
.sk-tags { height: 22px; margin: 16px; border-radius: 11px; background: var(--sk-color); width: 45%; }
.sk-icon, .sk-line, .sk-tags { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.85; }
}

/* --- Пустые состояния --- */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 56px 20px;
  color: var(--text-muted);
  font-size: 1.05rem;
  background: var(--card);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}
.empty.error { color: var(--danger); border-color: var(--danger); }

/* --- Полноэкранное окно приложения (iframe) --- */
.modal { position:fixed; inset:0; z-index:1000; display:none; padding:0; background:#080b09; }
.modal.open { display:flex; }
.modal-panel { position:relative; display:flex; flex-direction:column; width:100%; height:100%; max-width:none; margin:0; overflow:hidden; border-radius:0; background:#080b09; box-shadow:none; }
.modal-toolbar { position:absolute; top:12px; right:12px; z-index:2; display:flex; justify-content:flex-end; padding:0; background:transparent; }
.modal-close { display:grid; place-items:center; width:38px; height:38px; padding:0; border:1px solid rgba(255,255,255,.28); border-radius:50%; cursor:pointer; background:rgba(15,20,17,.62); color:#fff; line-height:1; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .15s ease, border-color .15s ease, transform .1s ease; }
.modal-close svg { display:block; width:20px; height:20px; }
.modal-close:hover { background:rgba(15,20,17,.82); border-color:rgba(255,255,255,.5); }
.modal-close:active { transform:scale(.94); }
.modal-close:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:2px; }
.modal-frame { flex:1; width:100%; height:100%; min-height:0; border:0; background:#fff; }
@media (max-width:600px) { .modal-toolbar { top:10px; right:10px; } .modal-close { width:36px; height:36px; } }

/* --- Фоновые «водяные» иконки приложений — только в переходных темах --- */
#bg-decor {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  display: none;
}
:root[data-theme="dawn"] #bg-decor,
:root[data-theme="overcast"] #bg-decor,
:root[data-theme="dusk"] #bg-decor { display: block; }
.bg-decor-item {
  position: absolute;
  color: var(--text-muted);
}
.bg-decor-item svg { display: block; width: 100%; height: 100%; }
.bg-decor-item svg path { fill: currentColor; stroke: currentColor; }
/* SVG-иконка мини-приложения: силуэт перекрашивается в цвет темы через маску */
.bg-decor-item.bg-decor-mask {
  background: var(--text-muted);
  -webkit-mask: var(--icon-src) center / contain no-repeat;
  mask: var(--icon-src) center / contain no-repeat;
}
/* Растровая иконка: показываем как есть (на будущее, сейчас у всех SVG) */
.bg-decor-item .bg-decor-img { display: block; width: 100%; height: 100%; object-fit: contain; }

/* --- Подвал --- */
.app-footer {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.82rem;
  padding: 10px 20px 30px;
}

<script>
"use strict";
/* ============================================================
   appboo — логика плеера
   ============================================================ */

/* --- Состояние плеера --- */
let allApps = [];                 // массив загруженных приложений {id, ...meta}
let activeTagFilter = "";         // выбранный тег (один)
let activeAiFilter = "";          // выбранная нейросеть (одна)
let activePlatform = "all";       // "all" | "desktop" | "mobile"
let sortMode = "default";         // "default" (последние) | "first" | "az" | "za"
let catalogSearch = "";
let tagSearch = "";
let aiSearch = "";

/* --- Утилиты --- */

// Экранирование текста/атрибутов для безопасной вставки в innerHTML
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
const escapeAttr = escapeHtml;

// Похоже ли значение icon на путь к файлу (icon.png, logo.svg и т.п.)
function isIconFile(val) {
  return /\.[a-z0-9]{2,4}$/i.test(String(val));
}

// Первая буква названия (для автогенерации иконки)
function firstLetter(title) {
  const t = (title || "").trim();
  return t ? t.charAt(0).toUpperCase() : "?";
}

// Детерминированный хэш строки -> число
function hashStr(s) {
  let h = 0;
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    h = s.charCodeAt(i) + ((h << 5) - h);
    h |= 0; // приводим к 32-битному целому
  }
  return Math.abs(h);
}

// Автоматический цвет иконки: hue из хэша названия (или поле color)
function autoColor(text) {
  const hue = hashStr(text) % 360;
  return `hsl(${hue}, 58%, 48%)`;
}

// Hue для тега/нейросети: одинаковый текст -> одинаковый цвет во всех карточках
function hueFor(text) {
  return hashStr(text) % 360;
}

// URL приложения (относительный, без ведущего "/" — для GitHub Pages)
function appUrl(id) {
  return `apps/${encodeURIComponent(id)}/index.html`;
}

// Разрешение пути иконки: абсолютный URL как есть, иначе относительно папки приложения
function resolveIconPath(val, id) {
  if (/^(https?:)?\/\//i.test(val) || val.startsWith("data:")) return val;
  const clean = String(val).replace(/^\/+/, ""); // убираем ведущие слэши
  return `apps/${encodeURIComponent(id)}/${clean}`;
}

/* --- Дефолтные метаданные (на случай отсутствия/битости meta.json) --- */
function defaultMeta(id) {
  return {
    id,
    title: id,
    description: "",
    info: "",
    icon: "",
    color: "",
    ai: "",
    platform: "",
    tags: []
  };
}

/* --- Загрузка одного приложения --- */
async function loadMeta(id) {
  const meta = defaultMeta(id);
  try {
    // Защита от кэша через ?v=Date.now()
    const res = await fetch(`apps/${encodeURIComponent(id)}/meta.json?v=${Date.now()}`);
    if (!res.ok) return meta; // файла нет — используем дефолт
    const text = await res.text();
    if (!text.trim()) return meta; // пустой файл — дефолт
    const data = JSON.parse(text);
    // Мерджим известные поля, tags приводим к массиву
    Object.assign(meta, {
      title: data.title != null ? String(data.title) : id,
      description: data.description != null ? String(data.description) : "",
      info: data.info != null ? String(data.info) : "",
      icon: data.icon != null ? String(data.icon) : "",
      color: data.color != null ? String(data.color) : "",
      ai: data.ai != null ? String(data.ai) : "",
      platform: data.platform != null ? String(data.platform) : "",
      tags: Array.isArray(data.tags) ? data.tags.map(String) : []
    });
  } catch (e) {
    // Битый JSON или сетевая ошибка — тихо используем дефолт
    return meta;
  }
  return meta;
}

/* --- Основная загрузка --- */
async function loadApps() {
  showLoading();
  let ids = [];
  try {
    const res = await fetch(`apps/apps.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    ids = await res.json();
    if (!Array.isArray(ids)) throw new Error("apps.json не является массивом");
  } catch (e) {
    showError(`Не удалось загрузить apps/apps.json — ${e.message}`);
    return;
  }
  // Параллельно грузим meta.json всех приложений (порядок сохраняется)
  const metas = await Promise.all(ids.map(id => loadMeta(String(id))));
  allApps = metas.filter(Boolean);
  buildTagFilters();
  buildAiFilters();
  render();
  // Иконки мини-приложений появились — пересобираем фоновый декор переходных тем
  if (DECOR_THEMES.includes(document.documentElement.getAttribute("data-theme"))) buildBgDecor();
}

/* --- Состояние загрузки: скелетоны --- */
function showLoading() {
  const grid = document.getElementById("grid");
  const card = `<div class="skeleton-card">
    <div class="sk-icon"></div>
    <div class="sk-line sk-title"></div>
    <div class="sk-line"></div>
    <div class="sk-line sk-short"></div>
    <div class="sk-tags"></div>
  </div>`;
  grid.innerHTML = card.repeat(6);
}

/* --- Состояние ошибки --- */
function showError(msg) {
  const grid = document.getElementById("grid");
  grid.innerHTML = `<div class="empty error">⚠️ ${escapeHtml(msg)}</div>`;
}

/* --- Построение панели фильтров по тегам --- */
function buildTagFilters() {
  const container = document.getElementById("tag-filters");
  const allTags = new Set();
  allApps.forEach(app => (app.tags || []).forEach(t => allTags.add(t)));
  const tags = [...allTags].sort((a, b) => a.localeCompare(b, "ru"))
    .filter(t => t.toLocaleLowerCase("ru").includes(tagSearch.toLocaleLowerCase("ru")));
  container.innerHTML = tags.map(t => {
    const hue = hueFor(t);
    const active = t === activeTagFilter ? " active" : "";
    return `<button class="tag tag-filter${active}" data-tag="${escapeAttr(t)}" style="--hue:${hue}">${escapeHtml(t)}</button>`;
  }).join("");
}

/* --- Построение панели фильтров по нейросетям --- */
function buildAiFilters() {
  const container = document.getElementById("ai-filters");
  const allAi = new Set();
  allApps.forEach(app => { if (app.ai && app.ai.trim()) allAi.add(app.ai.trim()); });
  const names = [...allAi].sort((a, b) => a.localeCompare(b, "ru"))
    .filter(name => name.toLocaleLowerCase("ru").includes(aiSearch.toLocaleLowerCase("ru")));
  container.innerHTML = names.map(name => {
    const hue = hueFor(name);
    const active = name === activeAiFilter ? " active" : "";
    return `<button class="ai-badge ai-filter${active}" data-ai="${escapeAttr(name)}" style="--hue:${hue}">
      <span class="ai-robot" aria-hidden="true">🤖</span>${escapeHtml(name)}
    </button>`;
  }).join("");
}

/* --- Рендер иконки --- */
function renderIcon(meta) {
  // Цвет подложки: поле color, иначе автогенер из названия
  const color = meta.color && meta.color.trim() ? meta.color.trim() : autoColor(meta.title);
  const iconVal = (meta.icon || "").trim();
  let glyph = "";
  let imgHtml = "";

  if (iconVal && isIconFile(iconVal)) {
    const src = resolveIconPath(iconVal, meta.id);
    if (/\.svg$/i.test(iconVal)) {
      imgHtml = `<span class="icon-mask" style="--icon-src:url('${escapeAttr(src)}')" aria-hidden="true"></span>`;
    } else {
      imgHtml = `<img class="icon-img" src="${escapeAttr(src)}" alt="" loading="lazy"
        onerror="this.remove()">`;
    }
    glyph = firstLetter(meta.title);
  } else if (iconVal) {
    // Эмодзи, буква или короткий текст
    glyph = iconVal;
  } else {
    glyph = firstLetter(meta.title);
  }

  return `<div class="card-icon" style="--icon-color:${escapeAttr(color)}">
    <span class="icon-glyph">${escapeHtml(glyph)}</span>
    ${imgHtml}
  </div>`;
}

/* --- Рендер бейджа нейросети --- */
function renderAiBadge(ai) {
  if (!ai || !ai.trim()) return "";
  const hue = hueFor(ai);
  return `<button class="ai-badge" type="button" data-ai="${escapeAttr(ai)}" style="--hue:${hue}" title="Фильтр: ${escapeAttr(ai)}">
    <span class="ai-robot" aria-hidden="true">🤖</span>${escapeHtml(ai)}
  </button>`;
}

/* --- Рендер бейджа платформы --- */
const PLATFORMS = {
  desktop: { icon: "🖥", label: "Desktop" },
  mobile:  { icon: "📱", label: "Mobile" },
  both:    { icon: "📲", label: "Desktop & Mobile" }
};
function renderPlatformBadge(platform) {
  const p = PLATFORMS[platform];
  if (!p) return "";
  return `<span class="platform-badge" title="Платформа: ${escapeAttr(p.label)}">${p.icon} ${escapeHtml(p.label)}</span>`;
}

/* --- Рендер одной карточки --- */
function renderCard(app) {
  const tagsHtml = (app.tags || []).map(t => {
    const hue = hueFor(t);
    return `<button class="tag" type="button" data-tag="${escapeAttr(t)}" style="--hue:${hue}">${escapeHtml(t)}</button>`;
  }).join("");

  const descHtml = app.description ? `<p class="card-desc">${escapeHtml(app.description)}</p>` : "";
  const infoHtml = app.info ? `<p class="card-info">${escapeHtml(app.info)}</p>` : "";
  const aiHtml = renderAiBadge(app.ai);
  const platformHtml = renderPlatformBadge(app.platform);
  const metaHtml = (aiHtml || platformHtml)
    ? `<div class="card-meta">${aiHtml}${platformHtml}</div>` : "";
  const tagsWrap = tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : "";

  return `<article class="card" data-id="${escapeAttr(app.id)}" data-open="${escapeAttr(appUrl(app.id))}">
    ${renderIcon(app)}
    <div class="card-content">
      <h3 class="card-title">${escapeHtml(app.title)}</h3>
      ${descHtml}
      ${infoHtml}
      ${metaHtml}
      ${tagsWrap}
      <div class="card-actions">
        <a class="btn btn-primary" href="${escapeAttr(appUrl(app.id))}">Перейти</a>
        <button class="btn btn-secondary" type="button" data-iframe="${escapeAttr(appUrl(app.id))}">Окно</button>
        <button class="btn-copy" type="button" data-copy="${escapeAttr(appUrl(app.id))}" aria-label="Скопировать ссылку" title="Скопировать ссылку">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2"></rect>
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </div>
  </article>`;
}

/* --- Основной рендер с учётом фильтров и сортировки --- */
function render() {
  const grid = document.getElementById("grid");

  if (allApps.length === 0) {
    grid.innerHTML = `<div class="empty">Приложений пока нет</div>`;
    return;
  }

  let list = allApps.slice();

  // Общий поиск по каталогу
  if (catalogSearch) {
    const q = catalogSearch.toLocaleLowerCase("ru");
    list = list.filter(app => [app.title, app.description, app.info, app.ai, app.id, ...(app.tags || [])]
      .some(value => String(value || "").toLocaleLowerCase("ru").includes(q)));
  }
  // Фильтр по одному тегу
  if (activeTagFilter) {
    list = list.filter(app => (app.tags || []).includes(activeTagFilter));
  }
  // Фильтр по нейросети
  if (activeAiFilter) {
    list = list.filter(app => (app.ai || "").trim() === activeAiFilter);
  }
  // Фильтр по платформе (both попадает и в desktop, и в mobile)
  if (activePlatform !== "all") {
    list = list.filter(app => app.platform === activePlatform || app.platform === "both");
  }
  // Сортировка: default — новые сверху (обратный порядок apps.json)
  if (sortMode === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title, "ru"));
  } else if (sortMode === "za") {
    list.sort((a, b) => b.title.localeCompare(a.title, "ru"));
  } else if (sortMode === "default") {
    list.reverse(); // Новые добавленные — сверху
  }

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">Ничего не найдено</div>`;
    return;
  }

  grid.innerHTML = list.map(renderCard).join("");
}

/* --- Управление состоянием кнопки «Сбросить фильтры» и счётчика фильтров --- */
function updateResetBtn() {
  const show = !!catalogSearch || !!activeTagFilter || !!activeAiFilter || activePlatform !== "all" || sortMode !== "default";
  document.getElementById("reset-btn").style.display = show ? "" : "none";
  updateFiltersCount();
}

// Счётчик активных фильтров на кнопке «Фильтры» (поиск не считаем — он всегда виден)
function updateFiltersCount() {
  const count = (activePlatform !== "all") + (sortMode !== "default") + (activeTagFilter ? 1 : 0) + (activeAiFilter ? 1 : 0);
  const badge = document.getElementById("filters-count");
  badge.textContent = String(count);
  badge.hidden = count === 0;
}

// При клике по тегу/нейросети на карточке раскрываем панель фильтров и нужную секцию
function ensureFiltersVisible(accordionName) {
  const body = document.getElementById("toolbar-body");
  if (!body.classList.contains("open")) setToolbarOpen(true);
  if (accordionName) {
    const section = document.querySelector(`.filter-accordion[data-accordion="${accordionName}"]`);
    if (section && !section.classList.contains("open")) setAccordionOpen(section, true);
  }
}

function applyTagFilter(tag) {
  activeTagFilter = activeTagFilter === tag ? "" : tag;
  document.querySelectorAll(".tag-filter").forEach(b =>
    b.classList.toggle("active", b.dataset.tag === activeTagFilter));
  ensureFiltersVisible("tags");
  render();
  updateResetBtn();
}

function applyAiFilter(ai) {
  activeAiFilter = activeAiFilter === ai ? "" : ai;
  document.querySelectorAll(".ai-filter").forEach(b =>
    b.classList.toggle("active", b.dataset.ai === activeAiFilter));
  ensureFiltersVisible("ai");
  render();
  updateResetBtn();
}

const SORT_LABELS = { default: "Новые", first: "Старые", az: "По алфавиту (А–Я)", za: "По алфавиту (Я–А)" };
const PLATFORM_LABELS = { all: "Все", desktop: "Desktop", mobile: "Mobile" };

function resetFilters() {
  activeTagFilter = "";
  activeAiFilter = "";
  activePlatform = "all";
  sortMode = "default";
  catalogSearch = "";
  tagSearch = "";
  aiSearch = "";
  document.getElementById("catalog-search").value = "";
  document.getElementById("tag-search").value = "";
  document.getElementById("ai-search").value = "";
  buildTagFilters();
  buildAiFilters();
  document.querySelectorAll(".seg-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.platform === "all"));
  document.querySelectorAll(".tag-filter").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".ai-filter").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".sort-option").forEach(option =>
    option.classList.toggle("active", option.dataset.sort === "default"));
  document.getElementById("sort-summary").textContent = SORT_LABELS.default;
  document.getElementById("platform-summary").textContent = PLATFORM_LABELS.all;
  render();
  updateResetBtn();
}

/* --- Темы: системная, светлая, тёмная и переходные; выбор в меню с запоминанием --- */
const THEMES = [
  { value: "system",   icon: "🌗", name: "Системная" },
  { value: "light",    icon: "☀️", name: "Светлая" },
  { value: "dawn",     icon: "🌅", name: "Рассвет" },
  { value: "overcast", icon: "☁️", name: "Пасмурно" },
  { value: "dusk",     icon: "🌆", name: "Сумерки" },
  { value: "dark",     icon: "🌙", name: "Тёмная" }
];
// Цвет мобильной browser-панели под тему
const THEME_UI_COLORS = {
  light: "#f4f5f9", dawn: "#e4e9db", overcast: "#99a392", dusk: "#161b16", dark: "#0a0c10"
};
// В переходных темах на фоне разбросаны едва заметные иконки приложений
const DECOR_THEMES = ["dawn", "overcast", "dusk"];
const DECOR_ICON_SVG = '<svg viewBox="0 0 128 128" focusable="false"><path d="M28 34c14-5 26-3 36 4v59c-10-7-22-9-36-4V34Zm72 0c-14-5-26-3-36 4v59c10-7 22-9 36-4V34Z" fill="#FFFFFF" stroke="#E8EFE5" stroke-width="5" stroke-linejoin="round"/><path d="M64 39v58" stroke="#527D3D" stroke-width="4" stroke-linecap="round"/><path d="M37 48c8-2 15-1 21 3M37 60c8-2 15-1 21 3M91 48c-8-2-15-1-21 3M91 60c-8-2-15-1-21 3" fill="none" stroke="#527D3D" stroke-width="3" stroke-linecap="round"/></svg>';

const SYSTEM_SCHEME = window.matchMedia("(prefers-color-scheme: light)");
function systemTheme() {
  return SYSTEM_SCHEME.matches ? "light" : "dark";
}

// «Системная» — живое следование теме ОС
function resolveTheme(value) {
  if (value === "system") return systemTheme() === "light" ? "dawn" : "dusk";
  return value;
}

// Выбранная в меню тема (может быть "system"); хранится и при отсутствии выбора
let currentThemeValue = null;

// Пока выбрана «Системная» — переключаемся следом за темой ОС
if (typeof SYSTEM_SCHEME.addEventListener === "function") {
  SYSTEM_SCHEME.addEventListener("change", () => {
    if (currentThemeValue === "system") applyTheme("system", false);
  });
}

function applyTheme(value, persist) {
  const resolved = resolveTheme(value);
  currentThemeValue = value;
  document.documentElement.setAttribute("data-theme", resolved);
  if (persist) localStorage.setItem("appboo-theme", value);
  const theme = THEMES.find(t => t.value === value) || THEMES[THEMES.length - 1];
  document.getElementById("theme-current-icon").textContent = theme.icon;
  document.getElementById("theme-current-name").textContent = theme.name;
  document.querySelectorAll("#theme-menu [data-theme-value]").forEach(btn =>
    btn.setAttribute("aria-checked", String(btn.dataset.themeValue === value)));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && THEME_UI_COLORS[resolved]) meta.setAttribute("content", THEME_UI_COLORS[resolved]);
  // Иконки на фоне: пересобираем при каждом входе в переходную тему, вне их — убираем
  if (DECOR_THEMES.includes(resolved)) buildBgDecor();
  else {
    const layer = document.getElementById("bg-decor");
    if (layer) layer.innerHTML = "";
  }
}

function initTheme() {
  const saved = localStorage.getItem("appboo-theme");
  applyTheme(THEMES.some(t => t.value === saved) ? saved : systemTheme(), false);
}

/* --- Стиль шапки: обычная / прозрачная / стекло — цикл по клику на логотип --- */
const HEADER_STYLES = ["default", "translucent", "glass"];
function applyHeaderStyle(style, persist) {
  const header = document.querySelector(".app-header");
  if (!header) return;
  if (style === "default") header.removeAttribute("data-header-style");
  else header.setAttribute("data-header-style", style);
  if (persist) localStorage.setItem("appboo-header-style", style);
}
function initHeaderStyle() {
  const saved = localStorage.getItem("appboo-header-style");
  applyHeaderStyle(HEADER_STYLES.includes(saved) ? saved : "default", false);
}

/* --- Разбросанные фоновые иконки: книжка appboo + иконки мини-приложений,
       редкие, разного масштаба и с случайным поворотом --- */
function decorIconSources() {
  // Пути к реальным иконкам всех загруженных мини-приложений
  const sources = [];
  allApps.forEach(app => {
    const iconVal = (app.icon || "").trim();
    if (iconVal && isIconFile(iconVal)) sources.push(resolveIconPath(iconVal, app.id));
  });
  return sources;
}

function buildBgDecor() {
  let layer = document.getElementById("bg-decor");
  if (!layer) {
    layer = document.createElement("div");
    layer.id = "bg-decor";
    layer.setAttribute("aria-hidden", "true");
    document.body.prepend(layer);
  }
  layer.innerHTML = "";
  const icons = decorIconSources();
  // Плотность подбираем от площади экрана, чтобы узор оставался «редким»
  const area = window.innerWidth * window.innerHeight;
  const count = Math.max(18, Math.min(38, Math.round(area / 32000)));
  for (let i = 0; i < count; i++) {
    const item = document.createElement("span");
    item.className = "bg-decor-item";
    const size = 30 + Math.random() * 105;                // масштаб: 1x–4x базовой иконки
    const rotate = Math.round(Math.random() * 60 - 30);   // поворот: −30°…30°
    item.style.left = (Math.random() * 100).toFixed(2) + "%";
    item.style.top = (Math.random() * 100).toFixed(2) + "%";
    item.style.width = size.toFixed(1) + "px";
    item.style.height = size.toFixed(1) + "px";
    item.style.transform = `rotate(${rotate}deg)`;
    item.style.opacity = (0.14 + Math.random() * 0.10).toFixed(2); // заметные, но фоновые
    // ~70% — иконки мини-приложений, остальные — книжка appboo
    if (icons.length && Math.random() < 0.7) {
      const src = icons[Math.floor(Math.random() * icons.length)];
      if (/\.svg$/i.test(src)) {
        // Штриховые SVG перекрашиваем в цвет темы через маску — единый стиль с книжкой
        item.classList.add("bg-decor-mask");
        item.style.setProperty("--icon-src", `url('${escapeAttr(src)}')`);
      } else {
        item.innerHTML = `<img class="bg-decor-img" src="${escapeAttr(src)}" alt="" loading="lazy" onerror="this.remove()">`;
      }
    } else {
      item.innerHTML = DECOR_ICON_SVG;
    }
    layer.appendChild(item);
  }
}

/* --- Уведомление об успешном копировании --- */
let copyToastTimer = null;
function showCopyToast() {
  let toast = document.getElementById("copy-toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "copy-toast";
    toast.className = "copy-toast";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    toast.innerHTML = '<span class="copy-toast-icon" aria-hidden="true">✓</span><span>Ссылка скопирована</span>';
    document.body.appendChild(toast);
  }
  toast.classList.add("show");
  if (copyToastTimer) window.clearTimeout(copyToastTimer);
  copyToastTimer = window.setTimeout(() => {
    toast.classList.remove("show");
    copyToastTimer = null;
  }, 2200);
}

/* --- Раскрытие/сворачивание секций фильтров (общее для всех аккордеонов) --- */
function setAccordionOpen(section, open) {
  section.classList.toggle("open", open);
  const button = section.querySelector(".filter-accordion-toggle");
  if (button) button.setAttribute("aria-expanded", String(open));
  const panel = document.getElementById(button && button.getAttribute("aria-controls"));
  if (panel) panel.setAttribute("aria-hidden", String(!open));
  const summary = section.querySelector(".filter-summary");
  // У сортировки и платформы в summary всегда показан текущий выбор
  if (summary && (section.dataset.accordion === "tags" || section.dataset.accordion === "ai")) {
    summary.textContent = open ? "Скрыть фильтры" : "Показать фильтры";
  }
}

/* --- Сворачиваемая панель фильтров (поиск остаётся видимым) --- */
function setToolbarOpen(open) {
  const body = document.getElementById("toolbar-body");
  body.classList.toggle("open", open);
  body.setAttribute("aria-hidden", String(!open));
  document.getElementById("toolbar-toggle").setAttribute("aria-expanded", String(open));
  localStorage.setItem("appboo-filters-open", open ? "1" : "0");
}

function initToolbar() {
  const saved = localStorage.getItem("appboo-filters-open") === "1";
  const body = document.getElementById("toolbar-body");
  body.classList.toggle("open", saved);
  body.setAttribute("aria-hidden", String(!saved));
  document.getElementById("toolbar-toggle").setAttribute("aria-expanded", String(saved));
}

/* --- Меню тем --- */
function setThemeMenuOpen(open) {
  document.getElementById("theme-menu").classList.toggle("open", open);
  document.getElementById("theme-menu").setAttribute("aria-hidden", String(!open));
  document.getElementById("theme-toggle").setAttribute("aria-expanded", String(open));
  document.getElementById("theme-menu-wrap").classList.toggle("open", open);
}

/* --- Навешивание событий --- */
function bindEvents() {
  // Раскрытие и сворачивание секций: платформа, сортировка, теги, нейросети
  document.querySelectorAll(".filter-accordion-toggle").forEach(button => {
    button.addEventListener("click", () => {
      const section = button.closest(".filter-accordion");
      setAccordionOpen(section, !section.classList.contains("open"));
    });
  });

  // Сворачивание всей панели фильтров
  document.getElementById("toolbar-toggle").addEventListener("click", () => {
    setToolbarOpen(!document.getElementById("toolbar-body").classList.contains("open"));
  });

  // Поиск по всему каталогу
  document.getElementById("catalog-search").addEventListener("input", e => {
    catalogSearch = e.target.value.trim();
    render();
    updateResetBtn();
  });
  // Локальный поиск внутри списков тегов и нейросетей
  document.getElementById("tag-search").addEventListener("input", e => {
    tagSearch = e.target.value;
    buildTagFilters();
  });
  document.getElementById("ai-search").addEventListener("input", e => {
    aiSearch = e.target.value;
    buildAiFilters();
  });

  // Фильтр по платформе
  document.querySelector(".seg").addEventListener("click", e => {
    const btn = e.target.closest("[data-platform]");
    if (!btn) return;
    document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activePlatform = btn.dataset.platform;
    document.getElementById("platform-summary").textContent = PLATFORM_LABELS[activePlatform] || PLATFORM_LABELS.all;
    render();
    updateResetBtn();
  });

  // Сортировка в том же раскрывающемся стиле, что теги и нейросети
  document.getElementById("sort-options").addEventListener("click", e => {
    const btn = e.target.closest("[data-sort]");
    if (!btn) return;
    sortMode = btn.dataset.sort;
    document.querySelectorAll(".sort-option").forEach(option =>
      option.classList.toggle("active", option === btn));
    document.getElementById("sort-summary").textContent = SORT_LABELS[sortMode] || SORT_LABELS.default;
    render();
    updateResetBtn();
  });

  // Фильтр по тегам (делегирование на контейнер пилюль)
  document.getElementById("tag-filters").addEventListener("click", e => {
    const btn = e.target.closest("[data-tag]");
    if (!btn) return;
    applyTagFilter(btn.dataset.tag);
  });

  // Фильтр по нейросетям
  document.getElementById("ai-filters").addEventListener("click", e => {
    const btn = e.target.closest("[data-ai]");
    if (!btn) return;
    applyAiFilter(btn.dataset.ai);
  });

  // Сброс
  document.getElementById("reset-btn").addEventListener("click", resetFilters);

  // Копирование прямой ссылки на приложение из карточки
  document.getElementById("grid").addEventListener("click", async e => {
    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      e.preventDefault();
      e.stopPropagation();
      const link = new URL(copyBtn.dataset.copy, document.baseURI).href;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(link);
        } else {
          const field = document.createElement("textarea");
          field.value = link;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          if (!copied) throw new Error("Не удалось скопировать ссылку");
        }
        showCopyToast();
        const originalTitle = "Скопировать ссылку";
        copyBtn.classList.add("copied");
        copyBtn.title = "Ссылка скопирована";
        copyBtn.setAttribute("aria-label", "Ссылка скопирована");
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
        window.setTimeout(() => {
          if (!copyBtn.isConnected) return;
          copyBtn.classList.remove("copied");
          copyBtn.title = originalTitle;
          copyBtn.setAttribute("aria-label", originalTitle);
          copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>';
        }, 1600);
      } catch (error) {
        copyBtn.title = "Не удалось скопировать";
        copyBtn.setAttribute("aria-label", "Не удалось скопировать ссылку");
      }
      return;
    }

    const iframeBtn = e.target.closest("[data-iframe]");
    if (iframeBtn) {
      e.preventDefault();
      e.stopPropagation();
      openIframe(iframeBtn.dataset.iframe);
      return;
    }
    const tagBtn = e.target.closest("[data-tag]");
    if (tagBtn) {
      e.preventDefault();
      e.stopPropagation();
      applyTagFilter(tagBtn.dataset.tag);
      return;
    }
    const aiBtn = e.target.closest("[data-ai]");
    if (aiBtn) {
      e.preventDefault();
      e.stopPropagation();
      applyAiFilter(aiBtn.dataset.ai);
      return;
    }
    const action = e.target.closest(".card-actions");
    if (action) return;
    const card = e.target.closest(".card[data-open]");
    if (card) window.location.href = card.dataset.open;
  });

  document.getElementById("modal-close").addEventListener("click", closeIframe);
  document.getElementById("app-modal").addEventListener("click", e => {
    if (e.target.id === "app-modal") closeIframe();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeIframe();
      setThemeMenuOpen(false);
    }
  });

  // Меню тем: открытие по кнопке, выбор темы, закрытие по клику мимо
  document.getElementById("theme-toggle").addEventListener("click", e => {
    e.stopPropagation();
    setThemeMenuOpen(!document.getElementById("theme-menu").classList.contains("open"));
  });
  document.querySelectorAll("#theme-menu [data-theme-value]").forEach(button => {
    button.addEventListener("click", () => {
      applyTheme(button.dataset.themeValue, true);
      setThemeMenuOpen(false);
    });
  });
  document.addEventListener("click", e => {
    if (!e.target.closest("#theme-menu-wrap")) setThemeMenuOpen(false);
  });

  // Пасхалка: клик по надписи appboo в шапке циклически меняет её стиль
  document.querySelector(".logo").addEventListener("click", e => {
    e.preventDefault();
    const idx = Math.max(0, HEADER_STYLES.indexOf(localStorage.getItem("appboo-header-style")));
    applyHeaderStyle(HEADER_STYLES[(idx + 1) % HEADER_STYLES.length], true);
  });
}

/* --- Встроенное окно приложения --- */
function openIframe(url) {
  const modal = document.getElementById("app-modal");
  document.getElementById("modal-frame").src = url;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeIframe() {
  const modal = document.getElementById("app-modal");
  modal.classList.remove("open");
  document.getElementById("modal-frame").src = "about:blank";
  document.body.style.overflow = "";
}

/* --- Старт --- */
initTheme();
initHeaderStyle();
initToolbar();
bindEvents();
loadApps();
</script>
