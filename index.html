/* ============================================================
   appboo — плеер мини-приложений
   Один файл: HTML + CSS + JS. Без внешних библиотек.
   ============================================================ */

/* --- Тема: тёмная по умолчанию, светлая через prefers-color-scheme --- */
:root {
  --bg: #0a0c10;
  --bg-elevated: #11141b;
  --card: #161a23;
  --card-hover: #1c2230;
  --border: #232a39;
  --border-strong: #2e3648;
  --text: #e8eaf0;
  --text-muted: #8b91a1;
  --text-dim: #5e6473;
  --accent: #86C26B;
  --accent-hover: #6FB356;
  --accent-soft: rgba(134, 194, 107, 0.16);
  --danger: #ef4444;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.45);
  --sk-color: #1f2531;
  color-scheme: dark;
}

/* Ручное переключение темы (data-theme имеет приоритет над системной) */
:root[data-theme="light"] {
  --bg: #f4f5f9;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-hover: #fafbff;
  --border: #e6e8ee;
  --border-strong: #d4d8e2;
  --text: #161a23;
  --text-muted: #5f6573;
  --text-dim: #9aa0ad;
  --accent: #86C26B;
  --accent-hover: #5F9D47;
  --accent-soft: rgba(134, 194, 107, 0.18);
  --sk-color: #e9ebf1;
  --shadow: 0 6px 24px rgba(20, 25, 40, 0.08);
  --shadow-hover: 0 12px 34px rgba(20, 25, 40, 0.13);
  color-scheme: light;
}

/* Если data-theme не задан — следуем системной теме */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #f4f5f9;
    --bg-elevated: #ffffff;
    --card: #ffffff;
    --card-hover: #fafbff;
    --border: #e6e8ee;
    --border-strong: #d4d8e2;
    --text: #161a23;
    --text-muted: #5f6573;
    --text-dim: #9aa0ad;
    --accent: #86C26B;
    --accent-hover: #5F9D47;
    --accent-soft: rgba(134, 194, 107, 0.18);
    --sk-color: #e9ebf1;
    --shadow: 0 6px 24px rgba(20, 25, 40, 0.08);
    --shadow-hover: 0 12px 34px rgba(20, 25, 40, 0.13);
    color-scheme: light;
  }
}

/* Переходные темы — выбираются вручную в меню тем, от светлой к тёмной */
:root[data-theme="dawn"] {
  --bg: #e4e9db;
  --bg-elevated: #eef2e4;
  --card: #f4f7ee;
  --card-hover: #ecf1e2;
  --border: #d2d9c5;
  --border-strong: #c0c8b1;
  --text: #1f2618;
  --text-muted: #525a48;
  --text-dim: #868e7a;
  --accent: #86C26B;
  --accent-hover: #5F9D47;
  --accent-soft: rgba(134, 194, 107, 0.18);
  --sk-color: #dde3cf;
  --shadow: 0 6px 24px rgba(38, 46, 30, 0.10);
  --shadow-hover: 0 12px 34px rgba(38, 46, 30, 0.16);
  color-scheme: light;
}
:root[data-theme="overcast"] {
  --bg: #99a392;
  --bg-elevated: #a5af9d;
  --card: #b0baa7;
  --card-hover: #bac4b1;
  --border: #7e8873;
  --border-strong: #69735d;
  --text: #141a10;
  --text-muted: #38402f;
  --text-dim: #58614c;
  --accent: #86C26B;
  --accent-hover: #5F9D47;
  --accent-soft: rgba(134, 194, 107, 0.26);
  --sk-color: #a9b39f;
  --shadow: 0 6px 24px rgba(16, 22, 10, 0.18);
  --shadow-hover: 0 12px 34px rgba(16, 22, 10, 0.26);
  color-scheme: light;
}
:root[data-theme="dusk"] {
  --bg: #161b16;
  --bg-elevated: #1b211b;
  --card: #20271f;
  --card-hover: #262e25;
  --border: #2c352b;
  --border-strong: #3a4537;
  --text: #e4e8e2;
  --text-muted: #9aa398;
  --text-dim: #6e786c;
  --accent: #86C26B;
  --accent-hover: #6FB356;
  --accent-soft: rgba(134, 194, 107, 0.16);
  --sk-color: #2a332a;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  transition: background 0.25s ease, color 0.25s ease;
}
/* Крупный превью-слой может выступать за край сетки — без горизонтальной прокрутки */
body { overflow-x: clip; }

/* --- Шапка --- */
/* Стиль шапки (обычная / прозрачная / стекло) выбирается в настройках плеера */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
/* Прозрачная: лёгкая просвечиваемость — контент чуть виден под шапкой при скролле */
.app-header[data-header-style="translucent"] {
  background: color-mix(in srgb, var(--bg-elevated) 76%, transparent);
  border-bottom-color: color-mix(in srgb, var(--border) 70%, transparent);
  backdrop-filter: saturate(160%) blur(16px);
  -webkit-backdrop-filter: saturate(160%) blur(16px);
}
/* Стекло (liquid glass): шейдер рисует живые блики на канвасе поверх
   матового слоя. Нет WebGL — канвас просто не показывается, остаётся CSS */
.app-header[data-header-style="glass"] {
  background: color-mix(in srgb, var(--bg-elevated) 55%, transparent);
  border-bottom-color: color-mix(in srgb, #ffffff 26%, transparent);
  backdrop-filter: blur(22px) saturate(180%) brightness(1.05);
  -webkit-backdrop-filter: blur(22px) saturate(180%) brightness(1.05);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, #ffffff 30%, transparent),
    0 12px 36px rgba(0, 0, 0, 0.18);
}
/* Канвас с шейдером внутри шапки: за контентом, не ловит указатель.
   color: var(--accent) — JS читает вычисленный цвет как оттенок шейдера */
.header-glass-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  pointer-events: none;
  color: var(--accent);
}
.app-header[data-header-style="glass"] .header-glass-canvas { display: block; }
.header-inner { position: relative; z-index: 1; }
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  font-size: clamp(1.4rem, 4vw, 1.8rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  user-select: none;
}
.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #b4de9a);
  color: #fff;
  box-shadow: 0 4px 14px var(--accent-soft);
}
.logo-mark svg { display:block; width:32px; height:32px; }
.logo-accent { color: var(--accent); }

/* --- Поиск и фильтры в шапке: строка поиска + кнопка с выпадающим меню.
       Встраивается между логотипом и настройками, не сдвигая их --- */
.header-search-zone {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.header-search-zone .catalog-search-wrap { position: relative; flex: 1 1 auto; max-width: 460px; min-width: 60px; }
.catalog-search-input {
  width: 100%; min-width: 0; height: 40px;
  padding: 0 14px 0 36px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--card); color: var(--text);
  font: inherit; font-size: 0.92rem; outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  display: inline-flex;
}
.search-icon svg { display: block; width: 16px; height: 16px; }
.header-filters-wrap { position: relative; flex: 0 0 auto; }
/* Выпадающее меню настроек фильтров: под кнопкой, выровнено по правому краю */
.toolbar-body {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: min(380px, calc(100vw - 24px));
  max-height: min(72vh, 540px);
  overflow-y: auto;
  z-index: 80;
  padding: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-hover);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
}
.toolbar-body.open {
  opacity: 1;
  visibility: visible;
  transform: none;
  pointer-events: auto;
  transition: opacity .18s ease, transform .18s ease;
}
.toolbar-body-inner {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media (prefers-reduced-motion: reduce) {
  .toolbar-body { transition: none; }
}

/* --- Кнопка настроек в шапке --- */
.header-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  padding: 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.header-icon-btn:hover { background: var(--card-hover); border-color: var(--border-strong); transform: translateY(-1px); }
.header-icon-btn:active { transform: translateY(0); }
.header-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.header-icon-btn svg { display: block; width: 20px; height: 20px; }

/* --- Окно настроек: тема оформления и вид карточек --- */
.settings-backdrop {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(8, 11, 9, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, visibility 0.2s;
}
.settings-backdrop.open { opacity: 1; visibility: visible; }
.settings-panel {
  width: min(430px, 100%);
  max-height: 100%;
  overflow-y: auto;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-hover);
  transform: translateY(10px) scale(0.98);
  transition: transform 0.2s ease;
  outline: none;
}
.settings-backdrop.open .settings-panel { transform: none; }
.settings-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px 0;
}
.settings-title { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
.settings-close {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.settings-close:hover { background: var(--card-hover); color: var(--text); border-color: var(--border-strong); }
.settings-close svg { display: block; width: 16px; height: 16px; }
.settings-body {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 14px 18px 18px;
}
.settings-section { display: flex; flex-direction: column; gap: 10px; }
.settings-label {
  margin: 0;
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
/* Сегментный переключатель в окне настроек: на всю ширину панели */
.settings-section .seg { display: flex; width: 100%; min-width: 0; }
.settings-section .seg-btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; }
@media (prefers-reduced-motion: reduce) {
  .settings-backdrop, .settings-panel { transition: none; }
}

/* --- Выпадающие списки в окне настроек: тема, язык. Панель раскрывается
       под кнопкой-значением, закрывается выбором или кликом мимо --- */
.settings-dropdown { position: relative; }
.settings-dropdown-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: left;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.settings-dropdown-btn:hover { background: var(--card-hover); border-color: var(--border-strong); }
.settings-dropdown-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.settings-dropdown-btn .sd-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-dropdown-btn .sd-chevron { margin-left: auto; color: var(--text-muted); transition: transform 0.18s ease; flex: 0 0 auto; }
.settings-dropdown.open .settings-dropdown-btn .sd-chevron { transform: rotate(180deg); }
.settings-dropdown-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-hover);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease, visibility 0s linear 0.16s;
}
.settings-dropdown.open .settings-dropdown-panel {
  opacity: 1;
  visibility: visible;
  transform: none;
  pointer-events: auto;
  transition: opacity 0.16s ease, transform 0.16s ease;
}
.settings-dropdown-panel button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}
.settings-dropdown-panel button:hover { background: var(--accent-soft); }
.settings-dropdown-panel button[aria-selected="true"] { background: var(--accent-soft); font-weight: 700; }
.settings-dropdown .sd-icon { font-size: 1rem; line-height: 1; flex: 0 0 auto; }
.sd-check { margin-left: auto; color: var(--accent); font-weight: 800; visibility: hidden; flex: 0 0 auto; }
.settings-dropdown-panel button[aria-selected="true"] .sd-check { visibility: visible; }

/* --- Базовый цвет: ряд свотчей, оттенки фона и акцентов (Material You) --- */
.color-options { display: flex; flex-wrap: wrap; gap: 10px; }
.color-swatch {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 50%;
  background: var(--swatch);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.22);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease;
}
.color-swatch:hover { transform: scale(1.08); }
.color-swatch:active { transform: scale(0.96); }
.color-swatch.active { border-color: var(--text); }
.color-swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
:root[data-theme="light"] .card-icon {
  background-color: #e8f3e1;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.35), transparent 52%),
    linear-gradient(180deg, #d7ebcc, #c3dcb4);
}
:root[data-theme="light"] .icon-img { filter: none; }
:root[data-theme="light"] .icon-mask { background: #3f6f2e; }
:root[data-theme="light"] .icon-glyph { color: #3f6f2e; text-shadow: none; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .card-icon {
    background-color: #e8f3e1;
    background-image:
      radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.35), transparent 52%),
      linear-gradient(180deg, #d7ebcc, #c3dcb4);
  }
  :root:not([data-theme]) .icon-img { filter: none; }
  :root:not([data-theme]) .icon-mask { background: #3f6f2e; }
  :root:not([data-theme]) .icon-glyph { color: #3f6f2e; text-shadow: none; }
}
/* Переходные темы: блок иконки — та же зелёная гамма, светлые темы светлее, сумерки — как тёмная */
:root[data-theme="dawn"] .card-icon {
  background-color: #d3decc;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.32), transparent 52%),
    linear-gradient(180deg, #d8e3cb, #c2d2b0);
}
:root[data-theme="dawn"] .icon-mask { background: #3f6f2e; }
:root[data-theme="dawn"] .icon-glyph { color: #3f6f2e; text-shadow: none; }
:root[data-theme="dawn"] .icon-img { filter: none; }
:root[data-theme="overcast"] .card-icon {
  background-color: #8ba06c;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.30), transparent 52%),
    linear-gradient(180deg, #9fb184, #7e915f);
}
:root[data-theme="overcast"] .icon-mask { background: #2c4a1f; }
:root[data-theme="overcast"] .icon-glyph { color: #2c4a1f; text-shadow: none; }
:root[data-theme="overcast"] .icon-img { filter: none; }

/* --- Основной контейнер --- */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 22px 20px 60px;
}

/* --- Кнопка «Фильтры» в шапке: открывает выпадающее меню настроек.
       На узких экранах подпись прячется — остаётся иконка-воронка:
       сначала жертвуем кнопкой фильтров, поиск важнее --- */
.toolbar-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  transition: background 0.18s, border-color 0.18s;
}
.toolbar-toggle:hover { background: var(--card-hover); border-color: var(--border-strong); }
.toolbar-toggle .filters-funnel { display: none; }
.toolbar-toggle .accordion-chevron { flex: 0 0 16px; }
.toolbar-toggle .accordion-chevron svg { width: 15px; height: 15px; }
.toolbar-toggle[aria-expanded="true"] .accordion-chevron { transform: rotate(180deg); }
@media (max-width: 600px) {
  .toolbar-toggle { width: 38px; padding: 0; justify-content: center; gap: 0; }
  .toolbar-toggle .toolbar-toggle-text,
  .toolbar-toggle .accordion-chevron { display: none; }
  .toolbar-toggle .filters-funnel { display: block; width: 18px; height: 18px; flex: 0 0 18px; }
}
.filters-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 0.74rem;
  font-weight: 700;
}
.filters-count[hidden] { display: none; }
/* Секция платформы внутри аккордеона: сегмент на всю ширину, как на мобильных */
.filter-accordion .seg { display: flex; width: 100%; min-width: 0; }
.filter-accordion .seg-btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; }
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Сворачиваемые секции фильтров */
.filter-accordion {
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0;
  overflow: hidden;
  background: var(--card);
}
.filter-accordion-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 0;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.filter-accordion-toggle:hover { background: var(--accent-soft); }
.filter-accordion-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.filter-accordion-toggle .filter-label { min-width: 0; color: var(--text); }
.filter-summary { margin-left: auto; color: var(--text-muted); font-size: .82rem; }
.accordion-chevron {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: transform .24s ease, color .2s ease;
  flex: 0 0 20px;
}
.accordion-chevron svg {
  display: block;
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.filter-accordion-toggle:hover .accordion-chevron { color: var(--accent); }
.filter-accordion.open .accordion-chevron { transform: rotate(180deg); }
.filter-accordion-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .28s ease;
}
.filter-accordion.open .filter-accordion-panel { grid-template-rows: 1fr; }
.filter-accordion-inner { min-height: 0; overflow: hidden; padding: 0 14px; transition: padding .28s ease; }
.filter-accordion.open .filter-accordion-inner { padding: 12px 14px 14px; }
.filter-search { width:100%; min-width:0; margin:0 0 10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--bg-elevated); color:var(--text); font:inherit; font-size:.9rem; outline:none; }
.filter-search:focus,.catalog-search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.filter-search::placeholder,.catalog-search-input::placeholder { color:var(--text-dim); }
.filter-accordion.open .filter-accordion-inner { padding-bottom: 14px; }
.filter-accordion .tag-filters { gap: 10px 8px; }
.sort-options {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
}
.sort-options .sort-option {
  display: block;
  width: 100%;
  padding: 5px 2px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  box-shadow: none;
  color: var(--text);
  font-size: .84rem;
  font-weight: 500;
  line-height: 1.35;
  text-align: left;
  white-space: normal;
}
.sort-options .sort-option:hover {
  transform: none;
  background: var(--accent-soft);
  color: var(--text);
}
.sort-options .sort-option.active {
  border: 0;
  background: transparent;
  box-shadow: none;
  color: #fff;
  font-weight: 650;
}
:root[data-theme="light"] .sort-options .sort-option.active,
:root[data-theme="dawn"] .sort-options .sort-option.active,
:root[data-theme="overcast"] .sort-options .sort-option.active {
  color: var(--text);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .sort-options .sort-option.active {
    color: var(--text);
  }
}
.filter-accordion .tag-filters:empty { display: none; }
@media (prefers-reduced-motion: reduce) {
  .filter-accordion-panel, .accordion-chevron { transition: none; }
}
/* Сегментный переключатель платформы */
.seg {
  display: inline-flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.seg-btn {
  border: 0;
  background: transparent;
  color: var(--text-muted);
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: background 0.18s, color 0.18s;
  white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px var(--accent-soft);
}
/* Кнопка сброса */
.btn-reset {
  margin-left: auto;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
  transition: all 0.18s;
  font-family: inherit;
}
.btn-reset:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

/* --- Пилюли тегов (фильтр и карточки используют один стиль) --- */
.tag-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-filters:empty { display: none; }
.filter-group:has(.tag-filters) {
  align-items: flex-start;
  width: 100%;
}
.filter-group:has(.tag-filters) .filter-label {
  padding-top: 6px;
  min-width: 92px;
}
.tag {
  /* hue задаётся инлайн через style="--hue:N" — детерминированный цвет по тексту тега */
  --hue: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  background: hsla(var(--hue), 70%, 55%, 0.14);
  color: hsl(var(--hue), 75%, 72%);
  border: 1px solid hsla(var(--hue), 70%, 55%, 0.28);
  cursor: pointer;
  font-family: inherit;
  line-height: 1.4;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
  transition: transform 0.12s, background 0.18s;
}
.tag:hover { transform: translateY(-1px); background: hsla(var(--hue), 70%, 55%, 0.22); }
/* Пилюля-фильтр кликабельна и переключает состояние */
.tag-filter {
  cursor: pointer;
  background: transparent;
  border: 1px solid hsla(var(--hue), 70%, 55%, 0.30);
  color: hsl(var(--hue), 60%, 68%);
}
.tag-filter:hover { transform: translateY(-1px); background: hsla(var(--hue), 70%, 55%, 0.12); }
.tag-filter.active {
  background: hsla(var(--hue), 70%, 55%, 0.22);
  color: hsl(var(--hue), 85%, 80%);
  border-color: hsla(var(--hue), 80%, 60%, 0.6);
  box-shadow: 0 0 0 1px hsla(var(--hue), 80%, 60%, 0.25);
}
/* Светлая тема: теги темнее для читаемости */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .tag {
    background: hsla(var(--hue), 65%, 50%, 0.12);
    color: hsl(var(--hue), 55%, 38%);
    border-color: hsla(var(--hue), 65%, 45%, 0.25);
  }
  :root:not([data-theme]) .tag-filter {
    color: hsl(var(--hue), 48%, 36%);
    border-color: hsla(var(--hue), 60%, 45%, 0.28);
  }
  :root:not([data-theme]) .tag-filter.active {
    background: hsla(var(--hue), 65%, 50%, 0.20);
    color: hsl(var(--hue), 50%, 30%);
  }
}
:root[data-theme="light"] .tag {
  background: hsla(var(--hue), 65%, 50%, 0.12);
  color: hsl(var(--hue), 55%, 38%);
  border-color: hsla(var(--hue), 65%, 45%, 0.25);
}
:root[data-theme="light"] .tag-filter {
  color: hsl(var(--hue), 48%, 36%);
  border-color: hsla(var(--hue), 60%, 45%, 0.28);
}
:root[data-theme="light"] .tag-filter.active {
  background: hsla(var(--hue), 65%, 50%, 0.20);
  color: hsl(var(--hue), 50%, 30%);
}

/* --- Сетка карточек (крупный вид: чуть компактнее прежнего) --- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
  gap: 16px;
}

/* --- Карточка приложения --- */
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow);
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-hover);
}

/* --- Вид карточек: компактный (по умолчанию) и крупный.
     Атрибут data-card-view на <html> переключает сетку и детали вида --- */
:root[data-card-view="compact"] .grid {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 216px), 1fr));
  gap: 14px;
}

/* Компактный вид: маленькая карточка — иконка на градиенте, теги, кнопки-иконки.
   Селекторы ограничены прямым содержимым карточки: внутри живёт превью
   в крупном виде, и компактные стили на него действовать не должны */
.card-compact > .card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 0;
}
/* Общая маленькая плитка иконки: в компактной карточке и в ряду с названием
   крупной карточки. Тёмная тема — глубокий зелёный градиент с оттенком
   цвета приложения; светло-зелёные — наоборот */
.card-icon-tile {
  aspect-ratio: auto;
  background-image:
    radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.16), transparent 55%),
    linear-gradient(145deg,
      color-mix(in srgb, var(--icon-color, #86c26b) 30%, #2e451f) 0%,
      color-mix(in srgb, var(--icon-color, #86c26b) 22%, #223319) 100%);
}
/* Светлые темы: светло-зелёная гамма с лёгким оттенком цвета приложения */
:root[data-theme="light"] .card-icon-tile,
:root[data-theme="dawn"] .card-icon-tile {
  background-image:
    radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.30), transparent 55%),
    linear-gradient(145deg,
      color-mix(in srgb, var(--icon-color, #86c26b) 24%, #d7ebcc) 0%,
      color-mix(in srgb, var(--icon-color, #86c26b) 16%, #bfd9af) 100%);
}
:root[data-theme="overcast"] .card-icon-tile {
  background-image:
    radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.28), transparent 55%),
    linear-gradient(145deg,
      color-mix(in srgb, var(--icon-color, #86c26b) 22%, #9fb184) 0%,
      color-mix(in srgb, var(--icon-color, #86c26b) 16%, #7e915f) 100%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) .card-icon-tile {
    background-image:
      radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.30), transparent 55%),
      linear-gradient(145deg,
        color-mix(in srgb, var(--icon-color, #86c26b) 24%, #d7ebcc) 0%,
        color-mix(in srgb, var(--icon-color, #86c26b) 16%, #bfd9af) 100%);
  }
}
.card-icon-tile .icon-glyph { font-size: 1.45rem; }
.card-icon-tile .icon-img { inset: 16%; max-width: 68%; max-height: 68%; }
.card-icon-tile .icon-mask { width: 58%; height: 58%; }
.card-compact > .card-head .card-icon {
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  border-radius: 14px;
}
/* Ряд «иконка + название» крупной карточки */
.card-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.card-title-row .card-icon {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 12px;
}
.card-title-row .card-title { flex: 1 1 auto; min-width: 0; }
.card-compact > .card-head .card-title {
  font-size: 1rem;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Отступ между строкой «иконка + название» и тегами */
.card-compact > .card-tags { padding: 0 12px; margin-top: 9px; }
.card-compact > .card-tags .tag { font-size: 0.72rem; padding: 3px 9px; }
/* Пилюля «+N» вместо обрезанных тегов: раскрывает подробности карточки */
.tag-more {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  font-family: inherit;
  line-height: 1.4;
  white-space: nowrap;
  background: var(--accent-soft);
  color: var(--text-muted);
  border: 1px dashed var(--border-strong);
  cursor: pointer;
}
.tag-more:hover { color: var(--text); border-color: var(--text-dim); }
/* Кнопки-иконки без подписей: перейти, окно, ссылка, крупный просмотр */
.card-compact > .card-actions { padding: 10px 12px 12px; gap: 6px; }
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  padding: 0;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--card-hover);
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s;
}
.icon-btn svg { display: block; width: 17px; height: 17px; }
.icon-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);

/* --- Крупный просмотр поверх компактной карточки: показывается при наведении

.preview-dim {

/* Блок иконки: цветная подложка + img поверх (если задан путь)

   с лёгкой подсветкой угла, свето-зелёные иконки (#d7ebcc); в светлой наоборот. */
.card-icon {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background-color: #223319;
  background-image:
    radial-gradient(circle at 28% 22%, rgba(134, 194, 107, 0.14), transparent 55%),
    linear-gradient(180deg, #2e451f, #223319);

.icon-glyph {
  font-size: clamp(2rem, 7vw, 3rem);
  font-weight: 800;
  color: #d7ebcc;
  line-height: 1;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
  max-width: 86%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-img {
  position: absolute;
  inset: 22%;
  width: auto;
  height: auto;
  max-width: 56%;
  max-height: 56%;
  margin: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.22));
}
.icon-mask {
  position: absolute;
  inset: 22%;
  margin: auto;
  width: 46%;
  height: 46%;

  -webkit-mask: var(--icon-src) center / contain no-repeat;

  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.22));
}

.cover-slides {
  position: absolute;
  inset: 0;
  display: flex;

.cover-slide {

.cover-img {

  display: block;

.cover-dots {

  left: 0;

.cover-dot {

  height: 22px;

  margin: 0;

.cover-arrow {

/* --- Кнопка «развернуть» на элементе скриншотов и развёрнутый просмотр --- */

/* --- Режим просмотра скриншотов: отдельная сущность. Затемнение на весь экран
       плюс окно по центру: с отступами от краёв (небольшими на смартфоне,
       значительными на больших экранах) и разумным максимумом размера.
       Работает одинаково откуда бы его ни открыли — из карточки или из превью --- */
:root { --viewer-gap: clamp(8px, 3.5vw, 56px); }
.cover-viewer-dim {
  position: fixed;
  inset: 0;
  z-index: 1090;

.card-icon.cover-expanded {
  position: fixed;
  inset: 0;
  margin: auto; /* центрирование окна при заданных ширине и высоте */
  width: min(1240px, calc(100vw - 2 * var(--viewer-gap)));

/* --- Кнопка «свернуть» на крупном просмотре компактной карточки: слева сверху,
       правый угол занят разворотом скриншотов. Тап вне превью тоже сворачивает --- */
.card-collapse {

/* --- Обрезанный текст с кнопкой «⋯»: кнопка видна, только если текст

.btn {
  flex: 1;
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: inherit;
  transition: transform 0.12s, background 0.18s, border-color 0.18s, color 0.18s;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-secondary {
  background: var(--card-hover);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-secondary:hover { background: var(--bg-elevated); border-color: var(--accent); color: var(--accent); }
.btn:active { transform: translateY(0); }

/* --- Состояние загрузки (скелетоны) --- */
.skeleton-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.sk-icon { aspect-ratio: 16 / 9; background: var(--sk-color); }
.sk-line { height: 12px; margin: 12px 16px 0; border-radius: 6px; background: var(--sk-color); }
.sk-line.sk-title { height: 18px; width: 60%; }
.sk-line.sk-short { width: 40%; }
.sk-tags { height: 22px; margin: 16px; border-radius: 11px; background: var(--sk-color); width: 45%; }
.sk-icon, .sk-line, .sk-tags { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.85; }
}
/* Скелетон компактного вида: плитка иконки рядом с названием */
.skeleton-compact .sk-head { display: flex; align-items: center; gap: 12px; padding: 12px 12px 0; }
.skeleton-compact .sk-tile { width: 54px; height: 54px; flex: 0 0 54px; border-radius: 14px; background: var(--sk-color); }
.skeleton-compact .sk-line { margin: 12px 12px 0; }
.skeleton-compact .sk-line.sk-title { margin: 0; flex: 1; width: auto; }
.skeleton-compact .sk-tags { margin: 12px; }

/* --- Пустые состояния --- */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 56px 20px;
  color: var(--text-muted);
  font-size: 1.05rem;
  background: var(--card);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}
.empty.error { color: var(--danger); border-color: var(--danger); }

/* --- Полноэкранное окно приложения (iframe) --- */
.modal { position:fixed; inset:0; z-index:1000; display:none; padding:0; background:#080b09; }
.modal.open { display:flex; }
.modal-panel { position:relative; display:flex; flex-direction:column; width:100%; height:100%; max-width:none; margin:0; overflow:hidden; border-radius:0; background:#080b09; box-shadow:none; }
.modal-toolbar { position:absolute; top:12px; right:12px; z-index:2; display:flex; justify-content:flex-end; padding:0; background:transparent; }
.modal-close { display:grid; place-items:center; width:38px; height:38px; padding:0; border:1px solid rgba(255,255,255,.28); border-radius:50%; cursor:pointer; background:rgba(15,20,17,.62); color:#fff; line-height:1; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .15s ease, border-color .15s ease, transform .1s ease; }
.modal-close svg { display:block; width:20px; height:20px; }
.modal-close:hover { background:rgba(15,20,17,.82); border-color:rgba(255,255,255,.5); }
.modal-close:active { transform:scale(.94); }
.modal-close:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:2px; }
.modal-frame { flex:1; width:100%; height:100%; min-height:0; border:0; background:#fff; }
@media (max-width:600px) { .modal-toolbar { top:10px; right:10px; } .modal-close { width:36px; height:36px; } }

/* --- Кнопки прокрутки каталога: в начало и в конец списка --- */
.scroll-nav { position:fixed; right:16px; bottom:16px; z-index:90; display:flex; flex-direction:column; gap:8px; }
.scroll-btn { display:grid; place-items:center; width:42px; height:42px; padding:0; border:1px solid var(--border-strong); border-radius:50%; cursor:pointer; background:var(--bg-elevated); color:var(--text-muted); box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease, opacity .2s ease, visibility .2s ease; }
.scroll-btn svg { display:block; width:20px; height:20px; }
.scroll-btn:hover { background:var(--card-hover); color:var(--text); border-color:var(--text-dim); }
.scroll-btn:active { transform:scale(.94); }
.scroll-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
/* Кнопка не видна, когда она бесполезна: наверху прячется «в начало», внизу — «в конец» */
.scroll-btn.is-hidden { opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px); }
@media (max-width:600px) { .scroll-nav { right:12px; bottom:12px; } .scroll-btn { width:38px; height:38px; } }

/* --- Фоновые «водяные» иконки приложений — только в переходных темах --- */
#bg-decor {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  display: none;
}
:root[data-theme="dawn"] #bg-decor,
:root[data-theme="overcast"] #bg-decor,
:root[data-theme="dusk"] #bg-decor { display: block; }
.bg-decor-item {
  position: absolute;
  color: var(--text-muted);
}
.bg-decor-item svg { display: block; width: 100%; height: 100%; }
.bg-decor-item svg path { fill: currentColor; stroke: currentColor; }
/* SVG-иконка мини-приложения: силуэт перекрашивается в цвет темы через маску */
.bg-decor-item.bg-decor-mask {
  background: var(--text-muted);
  -webkit-mask: var(--icon-src) center / contain no-repeat;
  mask: var(--icon-src) center / contain no-repeat;
}
/* Растровая иконка: показываем как есть (на будущее, сейчас у всех SVG) */
.bg-decor-item .bg-decor-img { display: block; width: 100%; height: 100%; object-fit: contain; }

/* --- Подвал --- */
.app-footer {

  color: var(--text-dim);
  font-size: 0.82rem;
  padding: 10px 20px 30px;
}

/* --- Адаптивность --- */

  .btn-reset { margin-left: 0; width: 100%; text-align: center; }
}
</style>

<!-- Просмотр приложения во встроенном окне по отдельной кнопке -->
<div class="modal" id="app-modal" role="dialog" aria-modal="true" aria-label="Окно мини-приложения">
  <div class="modal-panel">
    <div class="modal-toolbar"><button class="modal-close" id="modal-close" type="button" aria-label="Закрыть окно приложения" title="Закрыть"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16"/></svg></button></div>
    <iframe class="modal-frame" id="modal-frame" title="Мини-приложение" src="about:blank" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   appboo — логика плеера
   ============================================================ */

/* --- Состояние плеера --- */
let allApps = [];                 // массив загруженных приложений {id, ...meta}
let activeTagFilter = "";         // выбранный тег (один)
let activeAiFilter = "";          // выбранная нейросеть (одна)
let activePlatform = "all";       // "all" | "desktop" | "mobile"
let sortMode = "default";         // "default" (последние) | "first" | "az" | "za"
let catalogSearch = "";
let tagSearch = "";
let aiSearch = "";
let cardView = "compact";         // "compact" | "large" — вид карточек каталога

/* --- Утилиты --- */

// Экранирование текста/атрибутов для безопасной вставки в innerHTML
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
const escapeAttr = escapeHtml;

/* --- Мягкий парс JSON (терпимость к рукописным файлам) ---
   Обычный JSON.parse; при ошибке — повтор после удаления комментариев
   (строчные «//», блочные «слэш-звезда…звезда-слэш» и «#») и висячих запятых.
   Удаление учитывает строковые литералы: «//» внутри URL ("https://...") не режется. */
function stripJsonComments(text) {
  let out = "";
  let i = 0;
  const n = text.length;
  let inStr = false;
  while (i < n) {
    const ch = text[i];
    if (inStr) {
      out += ch;
      if (ch === "\\") {           // экранированный символ внутри строки
        if (i + 1 < n) { out += text[i + 1]; i += 2; continue; }
      } else if (ch === '"') {
        inStr = false;
      }
      i++;
      continue;
    }
    if (ch === '"') { inStr = true; out += ch; i++; continue; }
    if (ch === "/" && text[i + 1] === "/") {          // // до конца строки
      while (i < n && text[i] !== "\n") i++;
      continue;
    }
    if (ch === "/" && text[i + 1] === "*") {          // /* ... */
      const end = text.indexOf("*/", i + 2);
      i = end === -1 ? n : end + 2;
      continue;
    }
    if (ch === "#") {                                  // # до конца строки
      while (i < n && text[i] !== "\n") i++;
      continue;
    }
    out += ch;
    i++;
  }
  return out;
}

// Висячие запятые перед } и ] (вне строковых литералов)
function removeTrailingCommas(text) {
  let out = "";
  let inStr = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inStr) {
      out += ch;
      if (ch === "\\") {
        if (i + 1 < text.length) { out += text[i + 1]; i++; }
      } else if (ch === '"') {
        inStr = false;
      }
      continue;
    }
    if (ch === '"') { inStr = true; out += ch; continue; }
    if (ch === ",") {
      let j = i + 1;
      while (j < text.length && /\s/.test(text[j])) j++;
      if (j < text.length && (text[j] === "}" || text[j] === "]")) continue;
    }
    out += ch;
  }
  return out;
}

function softParseJson(text) {
  try {
    return JSON.parse(text);
  } catch (e) {
    return JSON.parse(removeTrailingCommas(stripJsonComments(text)));
  }
}

// Санитизация реестра: trim записей, отброс не-строк, пустых и дубликатов
function sanitizeRegistry(ids) {
  const seen = new Set();
  const out = [];
  for (const raw of ids) {
    if (typeof raw !== "string") continue;
    const id = raw.trim();
    if (!id || seen.has(id)) continue;
    seen.add(id);
    out.push(id);
  }
  return out;
}

// Похоже ли значение icon на путь к файлу (icon.png, logo.svg и т.п.)
function isIconFile(val) {
  return /\.[a-z0-9]{2,4}$/i.test(String(val));
}

// Первая буква названия (для автогенерации иконки)
function firstLetter(title) {
  const t = (title || "").trim();
  return t ? t.charAt(0).toUpperCase() : "?";
}

// Детерминированный хэш строки -> число
function hashStr(s) {
  let h = 0;
  s = String(s);
  for (let i = 0; i < s.length; i++) {
    h = s.charCodeAt(i) + ((h << 5) - h);
    h |= 0; // приводим к 32-битному целому
  }
  return Math.abs(h);
}

// Автоматический цвет иконки: hue из хэша названия (или поле color)
function autoColor(text) {
  const hue = hashStr(text) % 360;
  return `hsl(${hue}, 58%, 48%)`;
}

// Hue для тега/нейросети: одинаковый текст -> одинаковый цвет во всех карточках
function hueFor(text) {
  return hashStr(text) % 360;
}

// URL приложения (относительный, без ведущего "/" — для GitHub Pages)
function appUrl(id) {
  return `apps/${encodeURIComponent(id)}/src/index.html`;
}

// Разрешение пути файла из meta/: абсолютный URL / data-URI как есть, иначе относительно meta/ приложения
function resolveMetaPath(val, id) {
  if (/^(https?:)?\/\//i.test(val) || val.startsWith("data:")) return val;
  const clean = String(val).replace(/^\/+/, ""); // убираем ведущие слэши
  return `apps/${encodeURIComponent(id)}/meta/${clean}`;
}

/* --- Дефолтные метаданные (на случай отсутствия/битости meta.json) --- */
function defaultMeta(id) {
  return {
    id,
    title: id,
    description: "",
    info: "",
    icon: "",
    color: "",
    ai: "",
    platform: "",
    tags: [],
    languages: [],
    screenshots: []
  };
}

/* --- Загрузка одного приложения --- */
async function loadMeta(id) {
  const meta = defaultMeta(id);
  try {
    // Защита от кэша через ?v=Date.now()
    const res = await fetch(`apps/${encodeURIComponent(id)}/meta/meta.json?v=${Date.now()}`);
    if (!res.ok) return meta; // файла нет — используем дефолт
    const text = await res.text();
    if (!text.trim()) return meta; // пустой файл — дефолт
    const data = softParseJson(text); // битый JSON — дефолт, каталог не роняем
    // Мерджим известные поля, списки приводим к массивам строк
    Object.assign(meta, {
      title: data.title != null ? String(data.title) : id,
      description: data.description != null ? String(data.description) : "",
      info: data.info != null ? String(data.info) : "",
      icon: data.icon != null ? String(data.icon) : "",
      color: data.color != null ? String(data.color) : "",
      ai: data.ai != null ? String(data.ai) : "",
      platform: data.platform != null ? String(data.platform) : "",
      tags: Array.isArray(data.tags) ? data.tags.map(String) : [],
      languages: Array.isArray(data.languages)
        ? [...new Set(data.languages.map(v => String(v).trim().toLowerCase()).filter(Boolean))]
        : [],
      screenshots: Array.isArray(data.screenshots) ? data.screenshots.map(String).filter(Boolean) : []
      // неизвестные поля игнорируем
    });
  } catch (e) {
    // Битый JSON или сетевая ошибка — тихо используем дефолт
    return meta;
  }
  return meta;
}

/* --- Основная загрузка --- */
async function loadApps() {
  showLoading();
  let ids = [];
  try {
    const res = await fetch(`apps.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = softParseJson(await res.text());
    if (!Array.isArray(data)) throw new Error("apps.json не является массивом");
    ids = sanitizeRegistry(data);
  } catch (e) {
    showError(`Не удалось загрузить apps.json — ${e.message}`);
    return;
  }
  // Параллельно грузим meta.json всех приложений (порядок сохраняется)
  const metas = await Promise.all(ids.map(id => loadMeta(String(id))));
  allApps = metas.filter(Boolean);
  buildTagFilters();
  buildAiFilters();
  render();
  // Иконки мини-приложений появились — пересобираем фоновый декор переходных тем
  if (DECOR_THEMES.includes(document.documentElement.getAttribute("data-theme"))) buildBgDecor();
}

/* --- Состояние загрузки: скелетоны (свой рисунок под каждый вид карточек) --- */
function showLoading() {
  const grid = document.getElementById("grid");
  if (cardView === "compact") {
    const card = `<div class="skeleton-card skeleton-compact">
      <div class="sk-head"><div class="sk-tile"></div><div class="sk-line sk-title"></div></div>
      <div class="sk-line"></div>
      <div class="sk-tags"></div>
    </div>`;
    grid.innerHTML = card.repeat(9);
    updatePreviewDim();
    return;
  }
  const card = `<div class="skeleton-card">
    <div class="sk-icon"></div>
    <div class="sk-line sk-title"></div>
    <div class="sk-line"></div>
    <div class="sk-line sk-short"></div>
    <div class="sk-tags"></div>
  </div>`;
  grid.innerHTML = card.repeat(6);
  updatePreviewDim();
}

/* --- Состояние ошибки --- */
function showError(msg) {
  const grid = document.getElementById("grid");
  grid.innerHTML = `<div class="empty error">⚠️ ${escapeHtml(msg)}</div>`;
  updatePreviewDim();
}

/* --- Построение панели фильтров по тегам --- */
function buildTagFilters() {
  const container = document.getElementById("tag-filters");
  const allTags = new Set();
  allApps.forEach(app => (app.tags || []).forEach(t => allTags.add(t)));
  const tags = [...allTags].sort((a, b) => a.localeCompare(b, "ru"))
    .filter(t => t.toLocaleLowerCase("ru").includes(tagSearch.toLocaleLowerCase("ru")));
  container.innerHTML = tags.map(t => {
    const hue = hueFor(t);
    const active = t === activeTagFilter ? " active" : "";
    return `<button class="tag tag-filter${active}" data-tag="${escapeAttr(t)}" style="--hue:${hue}">${escapeHtml(t)}</button>`;
  }).join("");
}

/* --- Построение панели фильтров по нейросетям --- */
function buildAiFilters() {
  const container = document.getElementById("ai-filters");
  const allAi = new Set();
  allApps.forEach(app => { if (app.ai && app.ai.trim()) allAi.add(app.ai.trim()); });
  const names = [...allAi].sort((a, b) => a.localeCompare(b, "ru"))
    .filter(name => name.toLocaleLowerCase("ru").includes(aiSearch.toLocaleLowerCase("ru")));
  container.innerHTML = names.map(name => {
    const hue = hueFor(name);
    const active = name === activeAiFilter ? " active" : "";
    return `<button class="ai-badge ai-filter${active}" data-ai="${escapeAttr(name)}" style="--hue:${hue}">
      <span class="ai-robot" aria-hidden="true">🤖</span>${escapeHtml(name)}
    </button>`;
  }).join("");
}

/* --- Иконка приложения: буква-глиф, картинка или SVG-маска поверх градиента --- */
function renderIconLayers(meta) {
  const iconVal = (meta.icon || "").trim();
  let glyph = firstLetter(meta.title);
  let imgHtml = "";

  if (iconVal && isIconFile(iconVal)) {
    const src = resolveMetaPath(iconVal, meta.id);
    if (/\.svg$/i.test(iconVal)) {
      imgHtml = `<span class="icon-mask" style="--icon-src:url('${escapeAttr(src)}')" aria-hidden="true"></span>`;
    } else {
      imgHtml = `<img class="icon-img" src="${escapeAttr(src)}" alt="" loading="lazy"
        onerror="this.remove()">`;
    }
  } else if (iconVal) {
    // Эмодзи, буква или короткий текст
    glyph = iconVal;
  }
  return { glyph, imgHtml };
}

// Цвет подложки иконки: поле color, иначе автогенер из названия
function coverColor(meta) {
  return meta.color && meta.color.trim() ? meta.color.trim() : autoColor(meta.title);
}

/* --- Обложка крупной карточки: скриншоты сразу, иконка — до загрузки
       и как запасной вариант, если все скриншоты битые --- */
function renderCover(meta) {
  const { glyph, imgHtml } = renderIconLayers(meta);

  // Слайды объявлены в meta.json (пути относительно meta/); битые отбрасываются при загрузке
  const shots = Array.isArray(meta.screenshots) ? meta.screenshots : [];
  let carouselHtml = "";
  let expandHtml = "";
  if (shots.length) {
    const slides = shots.map((shot, i) =>
      `<div class="cover-slide" data-index="${i}" data-shot="${escapeAttr(resolveMetaPath(shot, meta.id))}"></div>`
    ).join("");
    const dots = shots.length > 1
      ? `<div class="cover-dots" aria-label="Скриншоты приложения">${shots.map((_, i) =>
          `<button type="button" class="cover-dot" data-dot="${i}" aria-label="Скриншот ${i + 1}"></button>`).join("")}</div>`
      : "";
    // Стрелки по краям: листают с зацикливанием
    const arrows = shots.length > 1
      ? `<button type="button" class="cover-arrow prev" data-dir="-1" aria-label="Предыдущий скриншот" title="Предыдущий скриншот"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" class="cover-arrow next" data-dir="1" aria-label="Следующий скриншот" title="Следующий скриншот"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>`
      : "";
    // Кнопка «развернуть» в углу: элемент скриншотов разворачивается на весь экран
    expandHtml = `<button type="button" class="cover-expand" aria-label="Развернуть скриншоты" title="Развернуть">
      <svg class="ic-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M10 21H3v-7M21 3l-8 8M3 21l8-8"/></svg>
      <svg class="ic-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </button>`;
    carouselHtml = `<div class="cover-slides">${slides}</div>${arrows}${dots}`;
  }

  return `<div class="card-icon" style="--icon-color:${escapeAttr(coverColor(meta))}"${shots.length ? ` data-shots="${shots.length}" data-title="${escapeAttr(meta.title)}"` : ""}>
    <span class="icon-glyph">${escapeHtml(glyph)}</span>
    ${imgHtml}
    ${carouselHtml}
    ${expandHtml}
  </div>`;
}

/* --- Поведение карусели: lazy-load, точки, свайп, клик, толерантность к битым картинкам --- */
const gridEl = () => document.getElementById("grid");

// Слайды конкретной обложки (в порядке объявления)
function coverSlides(cover) {
  return [...cover.querySelectorAll(".cover-slide")];
}
function coverActiveIndex(cover) {
  const i = parseInt(cover.dataset.active || "0", 10);
  return Number.isFinite(i) ? i : 0;
}

// Ленивая загрузка: <img> создаётся при первом показе слайда
function ensureSlide(cover, declaredIndex) {
  const slide = cover.querySelector(`.cover-slide[data-index="${declaredIndex}"]`);
  if (!slide || slide.dataset.loaded) return;
  slide.dataset.loaded = "1";
  const img = document.createElement("img");
  img.className = "cover-img";
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = `Скриншот ${cover.dataset.title || ""} — ${declaredIndex + 1}`;
  img.onerror = () => {
    // Битый/недоступный скриншот: слайд и его точка пропадают, каталог не падает
    const dot = cover.querySelector(`.cover-dot[data-dot="${declaredIndex}"]`);
    if (dot) dot.remove();
    slide.remove();
    const left = coverSlides(cover);
    if (!left.length) {
      // Все битые → остаётся иконка, карусель со стрелками и точками убирается
      cover.querySelectorAll(".cover-slides, .cover-dots, .cover-arrow").forEach(el => el.remove());
      delete cover.dataset.shots;
      delete cover.dataset.active;
      cover.style.removeProperty("--slide-pos");
      if (coverObserver) coverObserver.unobserve(cover);
    } else if (cover.dataset.active === String(declaredIndex)) {
      setCoverSlide(cover, Number(left[0].dataset.index));
    }
  };
  img.src = slide.dataset.shot;
  slide.appendChild(img);
}

// Показ слайда по объявленному индексу (или первого оставшегося)
function setCoverSlide(cover, declaredIndex) {
  const slides = coverSlides(cover);
  if (!slides.length) return;
  const target = slides.find(s => s.dataset.index === String(declaredIndex)) || slides[0];
  const pos = Math.max(0, slides.indexOf(target));
  cover.dataset.active = target.dataset.index;
  cover.style.setProperty("--slide-pos", String(pos)); // сдвиг слайд-трека
  cover.querySelectorAll(".cover-dot").forEach(d =>
    d.classList.toggle("active", d.dataset.dot === target.dataset.index));
  ensureSlide(cover, Number(target.dataset.index));
  // Соседние слайды готовим заранее, чтобы переключение было мгновенным
  const prev = slides[pos - 1];
  const next = slides[pos + 1];
  if (prev) ensureSlide(cover, Number(prev.dataset.index));
  if (next) ensureSlide(cover, Number(next.dataset.index));
}

// Соседний слайд с зацикливанием (стрелки, клик по скриншотам и клавиши ←/→)
function stepCover(cover, dir) {
  const slides = coverSlides(cover);
  if (!slides.length) return;
  const pos = slides.findIndex(s => s.dataset.index === String(coverActiveIndex(cover)));
  const next = slides[(pos + dir + slides.length) % slides.length];
  if (next) setCoverSlide(cover, Number(next.dataset.index));
}

// Первый скриншот догружается при попадании карточки в viewport
let coverObserver = null;
function observeCovers() {
  if (coverObserver) coverObserver.disconnect();
  if (!("IntersectionObserver" in window)) return;
  coverObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      if (entry.target.dataset.shots) {
        setCoverSlide(entry.target, 0);
        coverObserver.unobserve(entry.target);
      }
    });
  }, { rootMargin: "240px" });
  gridEl().querySelectorAll(".card-icon[data-shots]").forEach(el => coverObserver.observe(el));
}

/* --- Рендер бейджа нейросети --- */
function renderAiBadge(ai) {
  if (!ai || !ai.trim()) return "";
  const hue = hueFor(ai);
  return `<button class="ai-badge" type="button" data-ai="${escapeAttr(ai)}" style="--hue:${hue}" title="Фильтр: ${escapeAttr(ai)}">
    <span class="ai-robot" aria-hidden="true">🤖</span>${escapeHtml(ai)}
  </button>`;
}

/* --- Рендер бейджа платформы --- */
const PLATFORMS = {
  desktop: { icon: "🖥", label: "Desktop" },
  mobile:  { icon: "📱", label: "Mobile" },
  both:    { icon: "📲", label: "Desktop & Mobile" }
};
function renderPlatformBadge(platform) {
  const p = PLATFORMS[platform];
  if (!p) return "";
  return `<span class="platform-badge" title="Платформа: ${escapeAttr(p.label)}">${p.icon} ${escapeHtml(p.label)}</span>`;
}

/* --- Рендер бейджей языков (не фильтр, только подпись) ---
   Код ISO 639-1 → флаг-emoji по таблице соответствий; неизвестный код —
   бейдж с самим кодом. Подсказка — эндоним через Intl.DisplayNames
   (на Windows флаги рендерятся буквами — принято). */
const LANG_FLAG_MAP = {
  ru: "RU", uk: "UA", be: "BY", kk: "KZ",
  en: "GB", de: "DE", fr: "FR", es: "ES", it: "IT", pt: "PT", nl: "NL",
  pl: "PL", cs: "CZ", sk: "SK", bg: "BG", sr: "RS", hr: "HR", sl: "SI",
  mk: "MK", hu: "HU", ro: "RO", el: "GR", et: "EE", lv: "LV", lt: "LT",
  sv: "SE", no: "NO", nb: "NO", nn: "NO", da: "DK", fi: "FI", is: "IS",
  zh: "CN", ja: "JP", ko: "KR", th: "TH", vi: "VN", id: "ID", ms: "MY",
  tl: "PH", sw: "KE", ar: "SA", he: "IL", fa: "IR", ur: "PK", hi: "IN",
  bn: "BD", ta: "IN", tr: "TR", ka: "GE", hy: "AM", az: "AZ", uz: "UZ"
};
function flagEmoji(countryCode) {
  return String(countryCode).toUpperCase()
    .replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
}
// Эндоним: название языка на самом языке («русский», «English», «Deutsch»)
function langEndonym(code) {
  try {
    if (typeof Intl !== "undefined" && Intl.DisplayNames) {
      const name = new Intl.DisplayNames([code], { type: "language" }).of(code);
      if (name && name.toLowerCase() !== String(code).toLowerCase()) {
        return name.charAt(0).toLocaleUpperCase(code) + name.slice(1);
      }
    }
  } catch (e) { /* толерантно: подсказка не критична */ }
  return String(code).toUpperCase();
}
function renderLangBadges(langs) {
  // Пусто → дефолт «ru» на стороне плеера
  const list = (Array.isArray(langs) && langs.length) ? langs : ["ru"];
  return list.map(raw => {
    const code = String(raw).trim().toLowerCase();
    if (!code) return "";
    const country = LANG_FLAG_MAP[code];
    const label = country ? flagEmoji(country) : escapeHtml(code.toUpperCase());
    const name = langEndonym(code);
    return `<span class="lang-badge" title="${escapeAttr(name)}" aria-label="${escapeAttr(name)}" lang="${escapeAttr(code)}">${label}</span>`;
  }).join("");
}

/* --- Рендер крупной карточки: обложка, иконка с названием, описание, мета --- */

/* --- Рендер одной карточки: вид зависит от настройки «Вид карточек» --- */
function renderCard(app) {
  return cardView === "compact" ? renderCardCompact(app) : renderCardLarge(app);
}

/* --- Основной рендер с учётом фильтров и сортировки --- */
function render() {
  const grid = document.getElementById("grid");

  if (allApps.length === 0) {
    grid.innerHTML = `<div class="empty">Приложений пока нет</div>`;
    return;
  }

  let list = allApps.slice();

  // Общий поиск по каталогу
  if (catalogSearch) {
    const q = catalogSearch.toLocaleLowerCase("ru");
    list = list.filter(app => [app.title, app.description, app.info, app.ai, app.id, ...(app.tags || [])]
      .some(value => String(value || "").toLocaleLowerCase("ru").includes(q)));
  }
  // Фильтр по одному тегу
  if (activeTagFilter) {
    list = list.filter(app => (app.tags || []).includes(activeTagFilter));
  }
  // Фильтр по нейросети
  if (activeAiFilter) {
    list = list.filter(app => (app.ai || "").trim() === activeAiFilter);
  }
  // Фильтр по платформе (both попадает и в desktop, и в mobile)
  if (activePlatform !== "all") {
    list = list.filter(app => app.platform === activePlatform || app.platform === "both");
  }
  // Сортировка: default — новые сверху (обратный порядок apps.json)
  if (sortMode === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title, "ru"));
  } else if (sortMode === "za") {
    list.sort((a, b) => b.title.localeCompare(a.title, "ru"));
  } else if (sortMode === "default") {
    list.reverse(); // Новые добавленные — сверху
  }

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">Ничего не найдено</div>`;
    return;
  }

  grid.innerHTML = list.map(renderCard).join("");
  observeCovers(); // первый скриншот каждой обложки — лениво по viewport
  updatePreviewDim(); // сетка пересобрана — превью больше нет, гасим затемнение
  queueEllipsisUpdate(); // обрезанные тексты получили кнопку «⋯»
}

/* --- Управление состоянием кнопки «Сбросить фильтры» и счётчика фильтров --- */
function updateResetBtn() {
  const show = !!catalogSearch || !!activeTagFilter || !!activeAiFilter || activePlatform !== "all" || sortMode !== "default";
  document.getElementById("reset-btn").style.display = show ? "" : "none";
  updateFiltersCount();
}

// Счётчик активных фильтров на кнопке «Фильтры» (поиск не считаем — он всегда виден)
function updateFiltersCount() {
  const count = (activePlatform !== "all") + (sortMode !== "default") + (activeTagFilter ? 1 : 0) + (activeAiFilter ? 1 : 0);
  const badge = document.getElementById("filters-count");
  badge.textContent = String(count);
  badge.hidden = count === 0;
}

// При клике по тегу/нейросети на карточке раскрываем панель фильтров и нужную секцию
function ensureFiltersVisible(accordionName) {
  const body = document.getElementById("toolbar-body");
  if (!body.classList.contains("open")) setToolbarOpen(true);
  if (accordionName) {
    const section = document.querySelector(`.filter-accordion[data-accordion="${accordionName}"]`);
    if (section && !section.classList.contains("open")) setAccordionOpen(section, true);
  }
}

function applyTagFilter(tag) {
  activeTagFilter = activeTagFilter === tag ? "" : tag;
  document.querySelectorAll(".tag-filter").forEach(b =>
    b.classList.toggle("active", b.dataset.tag === activeTagFilter));
  ensureFiltersVisible("tags");
  render();
  updateResetBtn();
}

function applyAiFilter(ai) {
  activeAiFilter = activeAiFilter === ai ? "" : ai;
  document.querySelectorAll(".ai-filter").forEach(b =>
    b.classList.toggle("active", b.dataset.ai === activeAiFilter));
  ensureFiltersVisible("ai");
  render();
  updateResetBtn();
}

const SORT_LABELS = { default: "Новые", first: "Старые", az: "По алфавиту (А–Я)", za: "По алфавиту (Я–А)" };
const PLATFORM_LABELS = { all: "Все", desktop: "Desktop", mobile: "Mobile" };

function resetFilters() {

/* --- Темы: системная, светлая, тёмная и переходные; выбор в меню с запоминанием --- */
const THEMES = [
  { value: "system",   icon: "🌗", name: "Системная" },
  { value: "light",    icon: "☀️", name: "Светлая" },
  { value: "dawn",     icon: "🌅", name: "Рассвет" },
  { value: "overcast", icon: "☁️", name: "Пасмурно" },
  { value: "dusk",     icon: "🌆", name: "Сумерки" },
  { value: "dark",     icon: "🌙", name: "Тёмная" }
];
// Цвет мобильной browser-панели под тему
const THEME_UI_COLORS = {
  light: "#f4f5f9", dawn: "#e4e9db", overcast: "#99a392", dusk: "#161b16", dark: "#0a0c10"
};
// В переходных темах на фоне разбросаны едва заметные иконки приложений
const DECOR_THEMES = ["dawn", "overcast", "dusk"];
const DECOR_ICON_SVG = '<svg viewBox="0 0 128 128" focusable="false"><path d="M28 34c14-5 26-3 36 4v59c-10-7-22-9-36-4V34Zm72 0c-14-5-26-3-36 4v59c10-7 22-9 36-4V34Z" fill="#FFFFFF" stroke="#E8EFE5" stroke-width="5" stroke-linejoin="round"/><path d="M64 39v58" stroke="#527D3D" stroke-width="4" stroke-linecap="round"/><path d="M37 48c8-2 15-1 21 3M37 60c8-2 15-1 21 3M91 48c-8-2-15-1-21 3M91 60c-8-2-15-1-21 3" fill="none" stroke="#527D3D" stroke-width="3" stroke-linecap="round"/></svg>';

const SYSTEM_SCHEME = window.matchMedia("(prefers-color-scheme: light)");
function systemTheme() {
  return SYSTEM_SCHEME.matches ? "light" : "dark";
}

// «Системная» — живое следование теме ОС
function resolveTheme(value) {
  if (value === "system") return systemTheme() === "light" ? "dawn" : "dusk";
  return value;
}

// Выбранная в списке тема (может быть "system")
let currentThemeValue = null;

// Пока выбрана «Системная» — переключаемся следом за темой ОС и пере-подкрашиваем фон
if (typeof SYSTEM_SCHEME.addEventListener === "function") {
  SYSTEM_SCHEME.addEventListener("change", () => {
    if (currentThemeValue === "system") {
      applyTheme("system");
      applyBaseColor(settings.baseColor); // оттенки фона считаются от новой темы
      updateSettingsUI();
    }
  });
}

function applyTheme(value) {
  const resolved = resolveTheme(value);
  currentThemeValue = value;
  document.documentElement.setAttribute("data-theme", resolved);
  // Иконки на фоне: пересобираем при каждом входе в переходную тему, вне их — убираем
  if (DECOR_THEMES.includes(resolved)) buildBgDecor();
  else {
    const layer = document.getElementById("bg-decor");
    if (layer) layer.innerHTML = "";
  }
}

/* --- Вид карточек: компактный или крупный --- */
const CARD_VIEWS = [
  { value: "compact", name: "Компактно" },
  { value: "large",   name: "Крупно" }
];

function applyCardView(value) {
  if (!CARD_VIEWS.some(v => v.value === value)) value = "compact";
  cardView = value;
  document.documentElement.setAttribute("data-card-view", value);
  if (allApps.length) render(); // на старте каталог ещё пуст — рендерит loadApps
}

/* --- Стиль шапки: обычная / прозрачная / стекло --- */
const HEADER_STYLES = ["default", "translucent", "glass"];
function applyHeaderStyle(style) {
  const header = document.querySelector(".app-header");
  if (!header) return;
  if (style === "default") header.removeAttribute("data-header-style");
  else header.setAttribute("data-header-style", style);
  if (style === "glass") GlassHeader.ensure(); // шейдер живёт только пока выбрано «стекло»
}

/* ============================================================
   Настройки плеера: единое хранилище с валидацией.
   Любая проблема при загрузке (битый JSON, недоступный localStorage,
   неизвестное значение) сбрасывает опцию к дефолту — проблемную одну,
   нечитаемое хранилище — всё сразу.
   ============================================================ */
const SETTINGS_KEY = "appboo-settings";
// Прежние отдельные ключи: переносим их выбор один раз при первом запуске
const LEGACY_KEYS = {
  theme: "appboo-theme",
  cardView: "appboo-card-view",
  headerStyle: "appboo-header-style"
};
// Дефолты для новых пользователей (п.15): системная тема, прозрачная шапка,
// крупный вид, родной зелёный базовый цвет, русский язык
const DEFAULT_SETTINGS = {
  theme: "system",
  headerStyle: "translucent",
  cardView: "large",
  baseColor: "green",
  lang: "ru"
};
// Для тех, кто пользовался прежними ключами: несохранённые опции остаются
// при старом поведении, а не внезапно меняются
const LEGACY_DEFAULTS = {
  theme: "system",
  headerStyle: "default",
  cardView: "compact",
  baseColor: "green",
  lang: "ru"
};

/* --- Базовый цвет: акценты и лёгкий оттенок поверхностей (Material You) --- */
const BASE_COLORS = {
  green:  { hex: "#86C26B", name: "Зелёный" },
  blue:   { hex: "#6FA6D9", name: "Синий" },
  violet: { hex: "#A48BDB", name: "Фиолетовый" },
  amber:  { hex: "#DFAF68", name: "Янтарный" },
  rose:   { hex: "#D98FA6", name: "Розовый" },
  teal:   { hex: "#6FC7B2", name: "Бирюзовый" }
};
const BASE_COLOR_VAR_MIX = [
  ["--bg", 8], ["--bg-elevated", 6], ["--card", 5], ["--card-hover", 5],
  ["--border", 10], ["--border-strong", 12], ["--sk-color", 10]
];
/* --- Язык интерфейса: выбор запоминается, локализация пока не подключена --- */
const LANGS = [
  { value: "ru", name: "Русский", icon: "🇷🇺" },
  { value: "en", name: "English", icon: "🇬🇧" }
];

let settings = { ...DEFAULT_SETTINGS };

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) { /* недоступное хранилище — настройки живут до перезагрузки */ }
}

// Проблемная опция — к дефолту одной, остальное не трогаем
function normalizeSettings() {
  if (!THEMES.some(t => t.value === settings.theme)) settings.theme = DEFAULT_SETTINGS.theme;
  if (!HEADER_STYLES.includes(settings.headerStyle)) settings.headerStyle = DEFAULT_SETTINGS.headerStyle;
  if (!CARD_VIEWS.some(v => v.value === settings.cardView)) settings.cardView = DEFAULT_SETTINGS.cardView;
  if (!(settings.baseColor in BASE_COLORS)) settings.baseColor = DEFAULT_SETTINGS.baseColor;
  if (!LANGS.some(l => l.value === settings.lang)) settings.lang = DEFAULT_SETTINGS.lang;
}

function loadSettings() {
  let stored = null;
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) stored = JSON.parse(raw); // битый JSON — null → все настройки к дефолту
  } catch (e) { stored = null; }       // недоступный localStorage — к дефолту
  if (stored && typeof stored === "object" && !Array.isArray(stored)) {
    settings = { ...DEFAULT_SETTINGS };
    Object.keys(DEFAULT_SETTINGS).forEach(k => {
      if (stored[k] !== undefined && stored[k] !== null) settings[k] = stored[k];
    });
  } else {
    settings = { ...DEFAULT_SETTINGS };
    try {
      const legacy = {
        theme: localStorage.getItem(LEGACY_KEYS.theme),
        cardView: localStorage.getItem(LEGACY_KEYS.cardView),
        headerStyle: localStorage.getItem(LEGACY_KEYS.headerStyle)
      };
      const hasLegacy = Object.values(legacy).some(v => v != null);
      if (hasLegacy) {
        // Прежний пользователь: переносим выбор, несохранённые опции — старые дефолты
        settings = { ...LEGACY_DEFAULTS };
        Object.keys(legacy).forEach(k => { if (legacy[k] != null) settings[k] = legacy[k]; });
        Object.values(LEGACY_KEYS).forEach(k => {
          try { localStorage.removeItem(k); } catch (e) { /* не критично */ }
        });
      }
    } catch (e) { /* дефолты */ }
  }
  normalizeSettings();
  saveSettings(); // нормализуем хранилище — единый ключ вместо разрозненных
}

// Смена одной опции: сохранить и применить только её
function updateSetting(key, value) {
  if (!(key in DEFAULT_SETTINGS)) return;
  settings[key] = value;
  normalizeSettings();
  saveSettings();
  if (key === "theme") { applyTheme(settings.theme); applyBaseColor(settings.baseColor); }
  else if (key === "headerStyle") applyHeaderStyle(settings.headerStyle);
  else if (key === "cardView") applyCardView(settings.cardView);
  else if (key === "baseColor") applyBaseColor(settings.baseColor);
  updateSettingsUI();
}

// Применить всё при старте: тема → шапка → вид → базовый цвет → UI-состояния
function applySettings() {
  applyTheme(settings.theme);
  applyHeaderStyle(settings.headerStyle);
  applyCardView(settings.cardView);
  applyBaseColor(settings.baseColor); // в конце — meta theme-color от темы и цвета
  updateSettingsUI();
}

/* --- Подкрашивание поверхностей базовым цветом --- */
function mixHex(a, b, t) {
  const pa = /^#?([0-9a-f]{6})$/i.exec(String(a).trim());
  const pb = /^#?([0-9a-f]{6})$/i.exec(String(b).trim());
  if (!pa || !pb) return a;
  const A = parseInt(pa[1], 16), B = parseInt(pb[1], 16);
  const ch = (sa, sb) => Math.round(sa + (sb - sa) * t);
  const r = ch((A >> 16) & 255, (B >> 16) & 255);
  const g = ch((A >> 8) & 255, (B >> 8) & 255);
  const b2 = ch(A & 255, B & 255);
  return "#" + [r, g, b2].map(v => v.toString(16).padStart(2, "0")).join("");
}

function applyBaseColor(key) {
  const root = document.documentElement;
  // Сначала сброс: снимаем прошлые переопределения и читаем чистые цвета темы
  BASE_COLOR_VAR_MIX.forEach(([name]) => root.style.removeProperty(name));
  ["--accent", "--accent-hover", "--accent-soft"].forEach(name => root.style.removeProperty(name));
  const pal = BASE_COLORS[key];
  updateThemeMeta();
  if (!pal || key === "green") return; // зелёный — родная палитра темы
  const cs = getComputedStyle(root);
  const accent = pal.hex;
  BASE_COLOR_VAR_MIX.forEach(([name, pct]) => {
    const base = cs.getPropertyValue(name).trim();
    if (base) root.style.setProperty(name, `color-mix(in srgb, ${accent} ${pct}%, ${base})`);
  });
  root.style.setProperty("--accent", accent);
  root.style.setProperty("--accent-hover", `color-mix(in srgb, ${accent} 82%, #000)`);
  root.style.setProperty("--accent-soft", `color-mix(in srgb, ${accent} 16%, transparent)`);
  GlassHeader.refreshTint();
}

// Цвет мобильной browser-панели: фон темы, чуть подкрашенный базовым цветом
function updateThemeMeta() {
  const resolved = resolveTheme(currentThemeValue || "system");
  const base = THEME_UI_COLORS[resolved] || "#0a0c10";
  const pal = BASE_COLORS[settings.baseColor];
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", pal && settings.baseColor !== "green" ? mixHex(base, pal.hex, 0.08) : base);
}

/* --- Синхронизация UI окна настроек с текущими настройками --- */
function updateSettingsUI() {
  document.querySelectorAll("#settings-modal [data-header-style]").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.headerStyle === settings.headerStyle));
  document.querySelectorAll("#settings-modal [data-view]").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.view === settings.cardView));
  const theme = THEMES.find(t => t.value === settings.theme);
  const themeIcon = document.getElementById("theme-current-icon");
  const themeName = document.getElementById("theme-current-name");
  if (themeIcon) themeIcon.textContent = theme ? theme.icon : "🌗";
  if (themeName) themeName.textContent = theme ? theme.name : "Системная";
  const lang = LANGS.find(l => l.value === settings.lang);
  const langIcon = document.getElementById("lang-current-icon");
  const langName = document.getElementById("lang-current-name");
  if (langIcon) langIcon.textContent = lang ? lang.icon : "🇷🇺";
  if (langName) langName.textContent = lang ? lang.name : "Русский";

    opt.setAttribute("aria-selected", String(opt.dataset.value === settings.theme)));
  document.querySelectorAll("#lang-dropdown [data-value]").forEach(opt =>
    opt.setAttribute("aria-selected", String(opt.dataset.value === settings.lang)));

/* --- Разбросанные фоновые иконки: книжка appboo + иконки мини-приложений,
       редкие, разного масштаба и с случайным поворотом --- */
function decorIconSources() {
  // Пути к реальным иконкам всех загруженных мини-приложений
  const sources = [];
  allApps.forEach(app => {
    const iconVal = (app.icon || "").trim();
    if (iconVal && isIconFile(iconVal)) sources.push(resolveMetaPath(iconVal, app.id));
  });
  return sources;
}

function buildBgDecor() {
  let layer = document.getElementById("bg-decor");
  if (!layer) {
    layer = document.createElement("div");
    layer.id = "bg-decor";
    layer.setAttribute("aria-hidden", "true");
    document.body.prepend(layer);
  }
  layer.innerHTML = "";
  const icons = decorIconSources();
  // Плотность подбираем от площади экрана, чтобы узор оставался «редким»
  const area = window.innerWidth * window.innerHeight;
  const count = Math.max(18, Math.min(38, Math.round(area / 32000)));
  for (let i = 0; i < count; i++) {
    const item = document.createElement("span");
    item.className = "bg-decor-item";
    const size = 30 + Math.random() * 105;                // масштаб: 1x–4x базовой иконки
    const rotate = Math.round(Math.random() * 60 - 30);   // поворот: −30°…30°
    item.style.left = (Math.random() * 100).toFixed(2) + "%";
    item.style.top = (Math.random() * 100).toFixed(2) + "%";
    item.style.width = size.toFixed(1) + "px";
    item.style.height = size.toFixed(1) + "px";
    item.style.transform = `rotate(${rotate}deg)`;
    item.style.opacity = (0.14 + Math.random() * 0.10).toFixed(2); // заметные, но фоновые
    // ~70% — иконки мини-приложений, остальные — книжка appboo
    if (icons.length && Math.random() < 0.7) {
      const src = icons[Math.floor(Math.random() * icons.length)];
      if (/\.svg$/i.test(src)) {
        // Штриховые SVG перекрашиваем в цвет темы через маску — единый стиль с книжкой
        item.classList.add("bg-decor-mask");
        item.style.setProperty("--icon-src", `url('${escapeAttr(src)}')`);
      } else {
        item.innerHTML = `<img class="bg-decor-img" src="${escapeAttr(src)}" alt="" loading="lazy" onerror="this.remove()">`;
      }
    } else {
      item.innerHTML = DECOR_ICON_SVG;
    }
    layer.appendChild(item);
  }
}
