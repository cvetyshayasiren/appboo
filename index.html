/* --- Темы: системная, тёмная и светлая; выбор в настройках с запоминанием --- */
const THEMES = [
  { value: "system", name: "Системная" },
  { value: "light",  name: "Светлая" },
  { value: "dark",   name: "Тёмная" }
];
// Цвет мобильной browser-панели под тему
const THEME_UI_COLORS = { dark: "#161b16", light: "#e4e9db" };
// Книжка appboo среди фоновых иконок (SVG-книжка с «чернилами» под цвет темы)
const DECOR_ICON_SVG = '<svg viewBox="0 0 128 128" focusable="false"><path d="M28 34c14-5 26-3 36 4v59c-10-7-22-9-36-4V34Zm72 0c-14-5-26-3-36 4v59c10-7 22-9 36-4V34Z" fill="#FFFFFF" stroke="#E8EFE5" stroke-width="5" stroke-linejoin="round"/><path d="M64 39v58" stroke="#527D3D" stroke-width="4" stroke-linecap="round"/><path d="M37 48c8-2 15-1 21 3M37 60c8-2 15-1 21 3M91 48c-8-2-15-1-21 3M91 60c-8-2-15-1-21 3" fill="none" stroke="#527D3D" stroke-width="3" stroke-linecap="round"/></svg>';

const SYSTEM_SCHEME = window.matchMedia("(prefers-color-scheme: light)");
function systemTheme() {
  return SYSTEM_SCHEME.matches ? "light" : "dark";
}

// «Системная» — живое следование теме ОС
function resolveTheme(value) {
  if (value === "system") return systemTheme();
  return value;
}

// Выбранная в списке тема (может быть "system")
let currentThemeValue = null;

// Пока выбрана «Системная» — переключаемся следом за темой ОС и пере-подкрашиваем фон
if (typeof SYSTEM_SCHEME.addEventListener === "function") {
  SYSTEM_SCHEME.addEventListener("change", () => {
    if (currentThemeValue === "system") {
      applyTheme("system");
      applyBaseColor(settings.baseColor); // оттенки фона считаются от новой темы
      updateSettingsUI();
    }
  });
}

function applyTheme(value) {
  const resolved = resolveTheme(value);
  currentThemeValue = value;
  document.documentElement.setAttribute("data-theme", resolved);
  // Фоновые иконки приложений есть в обеих темах — пересобираем на каждом входе
  buildBgDecor();
}

/* --- Вид карточек: компактный или крупный --- */
const CARD_VIEWS = [
  { value: "compact", name: "Компактно" },
  { value: "large",   name: "Крупно" }
];

function applyCardView(value) {
  if (!CARD_VIEWS.some(v => v.value === value)) value = "compact";
  cardView = value;
  document.documentElement.setAttribute("data-card-view", value);
  if (allApps.length) render(); // на старте каталог ещё пуст — рендерит loadApps
}

/* --- Стиль шапки: обычная / прозрачная / стекло --- */
const HEADER_STYLES = ["default", "translucent", "glass"];
function applyHeaderStyle(style) {
  const header = document.querySelector(".app-header");
  if (!header) return;
  if (style === "default") header.removeAttribute("data-header-style");
  else header.setAttribute("data-header-style", style);
  if (style === "glass") GlassHeader.ensure(); // шейдер живёт только пока выбрано «стекло»
}

/* ============================================================
   Настройки плеера: единое хранилище с валидацией.
   Любая проблема при загрузке (битый JSON, недоступный localStorage,
   неизвестное значение) сбрасывает опцию к дефолту — проблемную одну,
   нечитаемое хранилище — всё сразу.
   ============================================================ */
const SETTINGS_KEY = "appboo-settings";
// Дефолты: системная тема, прозрачная шапка, крупный вид, родной зелёный
// базовый цвет, русский язык
const DEFAULT_SETTINGS = {
  theme: "system",
  headerStyle: "translucent",
  cardView: "large",
  baseColor: "green",
  lang: "ru"
};

/* --- Базовый цвет: акценты и лёгкий оттенок поверхностей (Material You) --- */
const BASE_COLORS = {
  green:  { hex: "#86C26B", name: "Зелёный" },
  blue:   { hex: "#6FA6D9", name: "Синий" },
  violet: { hex: "#A48BDB", name: "Фиолетовый" },
  amber:  { hex: "#DFAF68", name: "Янтарный" },
  rose:   { hex: "#D98FA6", name: "Розовый" },
  teal:   { hex: "#6FC7B2", name: "Бирюзовый" }
};
// Случайный акцентный цвет: приятный оттенок с умеренной насыщенностью и светлотой
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return "#" + [0, 8, 4].map(ch => Math.round(f(ch) * 255).toString(16).padStart(2, "0")).join("");
}
function randomAccentHex() {
  const h = Math.floor(Math.random() * 360);
  const s = 52 + Math.floor(Math.random() * 22); // 52–73%
  const l = 52 + Math.floor(Math.random() * 12); // 52–63%
  return hslToHex(h, s, l);
}
const BASE_COLOR_VAR_MIX = [
  ["--bg", 8], ["--bg-elevated", 6], ["--card", 5], ["--card-hover", 5],
  ["--border", 10], ["--border-strong", 12], ["--sk-color", 10]
];
/* --- Язык интерфейса: выбор запоминается, локализация пока не подключена --- */
const LANGS = [
  { value: "ru", name: "Русский", icon: "🇷🇺" },
  { value: "en", name: "English", icon: "🇬🇧" }
];

let settings = { ...DEFAULT_SETTINGS };

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) { /* недоступное хранилище — настройки живут до перезагрузки */ }
}

// Проблемная опция — к дефолту одной, остальное не трогаем
function normalizeSettings() {
  if (!THEMES.some(t => t.value === settings.theme)) settings.theme = DEFAULT_SETTINGS.theme;
  if (!HEADER_STYLES.includes(settings.headerStyle)) settings.headerStyle = DEFAULT_SETTINGS.headerStyle;
  if (!CARD_VIEWS.some(v => v.value === settings.cardView)) settings.cardView = DEFAULT_SETTINGS.cardView;
  if (!(settings.baseColor in BASE_COLORS) && !isHexColor(settings.baseColor)) settings.baseColor = DEFAULT_SETTINGS.baseColor;
  if (!LANGS.some(l => l.value === settings.lang)) settings.lang = DEFAULT_SETTINGS.lang;
}

function loadSettings() {
  let stored = null;
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) stored = JSON.parse(raw); // битый JSON — null → все настройки к дефолту
  } catch (e) { stored = null; }       // недоступный localStorage — к дефолту
  settings = { ...DEFAULT_SETTINGS };
  if (stored && typeof stored === "object" && !Array.isArray(stored)) {
    Object.keys(DEFAULT_SETTINGS).forEach(k => {
      if (stored[k] !== undefined && stored[k] !== null) settings[k] = stored[k];
    });
  }
  normalizeSettings();
  saveSettings(); // нормализуем хранилище
}

// Смена одной опции: сохранить и применить только её
function updateSetting(key, value) {
  if (!(key in DEFAULT_SETTINGS)) return;
  settings[key] = value;
  normalizeSettings();
  saveSettings();
  if (key === "theme") { applyTheme(settings.theme); applyBaseColor(settings.baseColor); }
  else if (key === "headerStyle") applyHeaderStyle(settings.headerStyle);
  else if (key === "cardView") applyCardView(settings.cardView);
  else if (key === "baseColor") applyBaseColor(settings.baseColor);
  updateSettingsUI();
}

// Применить всё при старте: тема → шапка → вид → базовый цвет → UI-состояния
function applySettings() {
  applyTheme(settings.theme);
  applyHeaderStyle(settings.headerStyle);
  applyCardView(settings.cardView);
  applyBaseColor(settings.baseColor); // в конце — meta theme-color от темы и цвета
  updateSettingsUI();
}

/* --- Подкрашивание поверхностей базовым цветом --- */
function mixHex(a, b, t) {
  const pa = /^#?([0-9a-f]{6})$/i.exec(String(a).trim());
  const pb = /^#?([0-9a-f]{6})$/i.exec(String(b).trim());
  if (!pa || !pb) return a;
  const A = parseInt(pa[1], 16), B = parseInt(pb[1], 16);
  const ch = (sa, sb) => Math.round(sa + (sb - sa) * t);
  const r = ch((A >> 16) & 255, (B >> 16) & 255);
  const g = ch((A >> 8) & 255, (B >> 8) & 255);
  const b2 = ch(A & 255, B & 255);
  return "#" + [r, g, b2].map(v => v.toString(16).padStart(2, "0")).join("");
}

// Выбранный цвет: ключ шаблона или свой цвет в hex (#rrggbb)
function isHexColor(value) {
  return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
}
// Hex выбранного цвета: для шаблона — из палитры, для своего — как есть
function baseColorHex(key) {
  if (isHexColor(key)) return key;
  return BASE_COLORS[key] ? BASE_COLORS[key].hex : null;
}

// Иконка вкладки: тот же знак, что и в шапке, но подкрашенный базовым
// цветом (SVG как data-URI: внешний файл не умеет следовать CSS-переменным)
function updateFavicon(hex) {
  const link = document.querySelector('link[rel="icon"]');
  if (!link || !hex) return;
  // Дефолтный зелёный — исходная иконка без изменений
  if (hex.toLowerCase() === BASE_COLORS.green.hex.toLowerCase()) { link.href = "./appboo-icon.svg"; return; }
  const ink = mixHex(hex, "#000000", 0.38);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hex}"/><stop offset="1" stop-color="${mixHex(hex, "#ffffff", 0.4)}"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><path d="M112 132c58-22 108-12 144 18v230c-40-29-88-38-144-18V132Zm288 0c-58-22-108-12-144 18v230c40-29 88-38 144-18V132Z" fill="#FFFFFF" stroke="#E8EFE5" stroke-width="18" stroke-linejoin="round"/><path d="M256 151v229" fill="none" stroke="${ink}" stroke-width="15" stroke-linecap="round"/><path d="M145 188c31-8 62-4 88 10M145 236c31-8 62-4 88 10M367 188c-31-8-62-4-88 10M367 236c-31-8-62-4-88 10" fill="none" stroke="${ink}" stroke-width="12" stroke-linecap="round"/></svg>`;
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
}

function applyBaseColor(key) {
  const root = document.documentElement;
  // Сначала сброс: снимаем прошлые переопределения и читаем чистые цвета темы
  BASE_COLOR_VAR_MIX.forEach(([name]) => root.style.removeProperty(name));
  ["--accent", "--accent-hover", "--accent-soft"].forEach(name => root.style.removeProperty(name));
  const accent = baseColorHex(key);
  updateThemeMeta();
  updateFavicon(accent || BASE_COLORS.green.hex);
  if (!accent || key === "green") return; // зелёный — родная палитра темы
  const cs = getComputedStyle(root); // чистые цвета темы после сброса
  BASE_COLOR_VAR_MIX.forEach(([name, pct]) => {
    const base = cs.getPropertyValue(name).trim();
    if (base) root.style.setProperty(name, `color-mix(in srgb, ${accent} ${pct}%, ${base})`);
  });
  root.style.setProperty("--accent", accent);
  root.style.setProperty("--accent-hover", `color-mix(in srgb, ${accent} 82%, #000)`);
  root.style.setProperty("--accent-soft", `color-mix(in srgb, ${accent} 16%, transparent)`);
  GlassHeader.refreshTint();
}

// Цвет мобильной browser-панели: фон темы, чуть подкрашенный базовым цветом
function updateThemeMeta() {
  const resolved = resolveTheme(currentThemeValue || "system");
  const base = THEME_UI_COLORS[resolved] || "#0a0c10";
  const accent = baseColorHex(settings.baseColor);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", accent && settings.baseColor !== "green" ? mixHex(base, accent, 0.08) : base);
}

/* --- Синхронизация UI окна настроек с текущими настройками --- */
function updateSettingsUI() {
  document.querySelectorAll("#settings-modal [data-header-style]").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.headerStyle === settings.headerStyle));
  document.querySelectorAll("#settings-modal [data-view]").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.view === settings.cardView));
  // Тема: активная иконка подсвечена
  document.querySelectorAll("#theme-options [data-theme-value]").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.themeValue === settings.theme));
  const lang = LANGS.find(l => l.value === settings.lang);
  const langIcon = document.getElementById("lang-current-icon");
  const langName = document.getElementById("lang-current-name");
  if (langIcon) langIcon.textContent = lang ? lang.icon : "🇷🇺";
  if (langName) langName.textContent = lang ? lang.name : "Русский";
  document.querySelectorAll("#lang-dropdown [data-value]").forEach(opt =>
    opt.setAttribute("aria-selected", String(opt.dataset.value === settings.lang)));
  // Шаблоны активны при точном совпадении; радужный пикер — когда задан свой цвет
  document.querySelectorAll("#base-color-options [data-base-color]").forEach(sw =>
    sw.classList.toggle("active", sw.dataset.baseColor === settings.baseColor));
  const customSwatch = document.querySelector(".color-swatch-custom");
  if (customSwatch) {
    const isCustom = isHexColor(settings.baseColor);
    customSwatch.classList.toggle("active", isCustom);
    customSwatch.style.setProperty("--custom-face", isCustom ? settings.baseColor : "transparent");
    if (isCustom) document.getElementById("base-color-input").value = settings.baseColor;
  }
}

/* --- Разбросанные фоновые иконки: книжка appboo + иконки мини-приложений,
       редкие, разного масштаба и с случайным поворотом --- */
function decorIconSources() {
  // Пути к реальным иконкам всех загруженных мини-приложений
  const sources = [];
  allApps.forEach(app => {
    const iconVal = (app.icon || "").trim();
    if (iconVal && isIconFile(iconVal)) sources.push(resolveMetaPath(iconVal, app.id));
  });
  return sources;
}

function buildBgDecor() {
  let layer = document.getElementById("bg-decor");
  if (!layer) {
    layer = document.createElement("div");
    layer.id = "bg-decor";
    layer.setAttribute("aria-hidden", "true");
    document.body.prepend(layer);
  }
  layer.innerHTML = "";
  const icons = decorIconSources();
  // Плотность подбираем от площади экрана, чтобы узор оставался «редким»
  const area = window.innerWidth * window.innerHeight;
  const count = Math.max(18, Math.min(38, Math.round(area / 32000)));
  for (let i = 0; i < count; i++) {
    const item = document.createElement("span");
    item.className = "bg-decor-item";
    const size = 30 + Math.random() * 105;                // масштаб: 1x–4x базовой иконки
    const rotate = Math.round(Math.random() * 60 - 30);   // поворот: −30°…30°
    item.style.left = (Math.random() * 100).toFixed(2) + "%";
    item.style.top = (Math.random() * 100).toFixed(2) + "%";
    item.style.width = size.toFixed(1) + "px";
    item.style.height = size.toFixed(1) + "px";
    item.style.transform = `rotate(${rotate}deg)`;
    item.style.opacity = (0.14 + Math.random() * 0.10).toFixed(2); // заметные, но фоновые
    // ~70% — иконки мини-приложений, остальные — книжка appboo
    if (icons.length && Math.random() < 0.7) {
      const src = icons[Math.floor(Math.random() * icons.length)];
      if (/\.svg$/i.test(src)) {
        // Штриховые SVG перекрашиваем в цвет темы через маску — единый стиль с книжкой
        item.classList.add("bg-decor-mask");
        item.style.setProperty("--icon-src", `url('${escapeAttr(src)}')`);
      } else {
        item.innerHTML = `<img class="bg-decor-img" src="${escapeAttr(src)}" alt="" loading="lazy" onerror="this.remove()">`;
      }
    } else {
      item.innerHTML = DECOR_ICON_SVG;
    }
    layer.appendChild(item);
  }
}

/* --- Уведомление об успешном копировании --- */
let copyToastTimer = null;
function showCopyToast() {
  let toast = document.getElementById("copy-toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "copy-toast";
    toast.className = "copy-toast";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    toast.innerHTML = '<span class="copy-toast-icon" aria-hidden="true">✓</span><span>Ссылка скопирована</span>';
    document.body.appendChild(toast);
  }
  toast.classList.add("show");
  if (copyToastTimer) window.clearTimeout(copyToastTimer);
  copyToastTimer = window.setTimeout(() => {
    toast.classList.remove("show");
    copyToastTimer = null;
  }, 2200);
}

/* --- Liquid glass для шапки: WebGL-шейдер рисует блики на канвасе
       поверх матового слоя backdrop-filter. Оттенок берётся из --accent,
       поэтому следует базовому цвету. Кадр статичный: узор не движется
       сам по себе — перерисовка только при изменении размера, смене
       акцента, темы или показе шапки. Нет WebGL — канвас убирается,
       остаётся обычное CSS-стекло --- */
const GlassHeader = (() => {
  const VERT = "attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }";
  const FRAG = [
    "precision mediump float;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform vec3 u_tint;",
    "float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }",
    "float vnoise(vec2 p) {",
    "  vec2 i = floor(p); vec2 f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
    "}",
    "float fbm(vec2 p) {",
    "  float v = 0.0; float a = 0.5;",
    "  for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.07 + vec2(1.7, 4.3); a *= 0.5; }",
    "  return v;",
    "}",
    "void main() {",
    "  vec2 uv = gl_FragCoord.xy / u_res;",
    "  float t = u_time * 0.10;",
    "  vec2 p = vec2(uv.x * 3.2, uv.y * 1.4);",
    "  float n1 = fbm(p + vec2(t, -t * 0.7));",
    "  float n2 = fbm(p * 1.8 + n1 * 0.8 - vec2(t * 0.6, t * 0.35));",
    "  float liquid = n1 * 0.62 + n2 * 0.38;",
    // тонкие светлые «прожилки» жидкого стекла
    "  float vein = smoothstep(0.52, 0.60, liquid) * (1.0 - smoothstep(0.66, 0.74, liquid));",
    "  float glow = smoothstep(0.35, 0.85, liquid) * 0.08;",
    // стеклянные кромки: светлая сверху, слабее снизу
    "  float rimTop = smoothstep(0.78, 1.0, uv.y) * 0.14;",
    "  float rimBottom = (1.0 - smoothstep(0.0, 0.22, uv.y)) * 0.09;",
    "  float a = vein * 0.30 + glow + rimTop + rimBottom;",
    "  vec3 col = mix(vec3(1.0), u_tint, 0.35);",
    "  gl_FragColor = vec4(col * a, a);", // премультиплицированная альфа
    "}"
  ].join("\n");

  let canvas = null;
  let gl = null;
  let program = null;
  let uRes = null, uTime = null, uTint = null;
  // Фиксированная фаза узора: кадр всегда один и тот же, без движения
  const STATIC_TIME = 6.5;
  let tint = [0.52, 0.76, 0.42];

  function isActive() {
    if (!gl || !canvas || !canvas.isConnected || document.hidden) return false;
    const header = canvas.closest(".app-header");
    return !!header && header.getAttribute("data-header-style") === "glass";
  }

  // Вычисленный цвет акцента: канвас стилизован color: var(--accent),
  // computed color всегда встречается как rgb(...)
  function readAccentRgb() {
    if (!canvas) return tint;
    try {
      const c = getComputedStyle(canvas).color;
      const m = /rgba?\(([^)]+)\)/.exec(c);
      if (!m) return tint;
      const parts = m[1].split(/[,\s/]+/).filter(Boolean).map(Number);
      if (parts.length < 3 || parts.some(n => !Number.isFinite(n))) return tint;
      return [parts[0] / 255, parts[1] / 255, parts[2] / 255];
    } catch (e) { return tint; }
  }

  function init() {
    canvas = document.getElementById("header-glass-canvas");
    if (!canvas) return;
    gl = canvas.getContext("webgl", { alpha: true, antialias: false, premultipliedAlpha: true })
      || canvas.getContext("experimental-webgl", { alpha: true, antialias: false, premultipliedAlpha: true });
    if (!gl) { canvas.remove(); canvas = null; return; } // шейдеры недоступны — CSS-стекло
    const compile = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || "shader");
      return sh;
    };
    try {
      program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error("link");
    } catch (e) {
      canvas.remove(); canvas = null; gl = null; return; // fallback на CSS-стекло
    }
    gl.useProgram(program);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, "a_pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uRes = gl.getUniformLocation(program, "u_res");
    uTime = gl.getUniformLocation(program, "u_time");
    uTint = gl.getUniformLocation(program, "u_tint");
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    canvas.addEventListener("webglcontextlost", e => {
      e.preventDefault();
      gl = null;
      if (canvas) canvas.style.display = "none"; // CSS-стекло продолжает работать
    });
    tint = readAccentRgb();
    resize();
  }

  function resize() {
    if (!gl || !canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function render() {
    if (!gl) return;
    resize();
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, STATIC_TIME);
    tint = readAccentRgb(); // акцент мог смениться с прошлого кадра
    gl.uniform3f(uTint, tint[0], tint[1], tint[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function ensure() {
    if (isActive()) render(); // статичный кадр при показе шапки со стеклом
  }

  // Перерисовка при изменении размера окна (пока стиль — «стекло»)
  window.addEventListener("resize", () => {
    if (canvas && canvas.style.display !== "none") ensure();
  });

  return { init, ensure, refreshTint() { if (gl) render(); } };
})();

/* --- Раскрытие/сворачивание секций фильтров (общее для всех аккордеонов) --- */
function setAccordionOpen(section, open) {
  section.classList.toggle("open", open);
  const button = section.querySelector(".filter-accordion-toggle");
  if (button) button.setAttribute("aria-expanded", String(open));
  const panel = document.getElementById(button && button.getAttribute("aria-controls"));
  if (panel) panel.setAttribute("aria-hidden", String(!open));
  const summary = section.querySelector(".filter-summary");
  // У сортировки и платформы в summary всегда показан текущий выбор
  if (summary && (section.dataset.accordion === "tags" || section.dataset.accordion === "ai")) {
    summary.textContent = open ? "Скрыть фильтры" : "Показать фильтры";
  }
}

/* --- Выпадающее меню фильтров в шапке (открывается кнопкой, закрывается
       кликом мимо, по Esc или выбором фильтра) --- */
function setToolbarOpen(open) {
  const body = document.getElementById("toolbar-body");
  if (open) alignFiltersDropdown(); // ширина могла измениться с прошлого показа
  body.classList.toggle("open", open);
  body.setAttribute("aria-hidden", String(!open));
  document.getElementById("toolbar-toggle").setAttribute("aria-expanded", String(open));
}

function initToolbar() {
  setToolbarOpen(false); // при старте меню всегда закрыто
  // На узких экранах плейсхолдер короче, чтобы умещался в маленькое поле поиска
  const searchInput = document.getElementById("catalog-search");
  const PLACEHOLDER_FULL = "Найти приложение по названию, описанию или тегу…";
  const applySearchPlaceholder = () => {
    searchInput.placeholder = window.innerWidth <= 600 ? "Поиск" : PLACEHOLDER_FULL;
  };
  applySearchPlaceholder();
  window.addEventListener("resize", applySearchPlaceholder);
  alignFiltersDropdown();
  window.addEventListener("resize", alignFiltersDropdown);
}

/* --- Ширина выпадающего меню фильтров: от левой границы поля поиска
       (а не иконки — она внутри поля) до иконки фильтров
       (на телефоне меню фиксировано на всю ширину) --- */
function alignFiltersDropdown() {
  const body = document.getElementById("toolbar-body");
  if (!body) return;
  if (window.innerWidth <= 600) { body.style.width = ""; return; }
  const search = document.getElementById("catalog-search");
  const btn = document.getElementById("toolbar-toggle");
  if (!search || !btn) return;
  const w = Math.round(btn.getBoundingClientRect().right - search.getBoundingClientRect().left);
  body.style.width = w >= 240 ? w + "px" : ""; // слишком узко — оставить обычное поведение
}

/* --- Окно настроек: открытие, закрытие, возврат фокуса --- */
let settingsOpener = null;
function openSettings() {
  settingsOpener = document.activeElement;
  document.getElementById("settings-modal").classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("settings-panel").focus();
}
function closeSettings() {
  const modal = document.getElementById("settings-modal");
  if (!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  document.body.style.overflow = "";
  if (settingsOpener && typeof settingsOpener.focus === "function") settingsOpener.focus();
  settingsOpener = null;
}

/* --- Режим просмотра скриншотов: отдельное окно на затемнённом фоне.
       Единственный вход — клик по свободному месту скриншота на странице
       приложения; закрывается кликом по затемнению или по самому окну --- */
function expandCover(cover) {
  if (cover.classList.contains("cover-expanded")) return;
  cover.classList.add("cover-expanded");
  const dim = document.getElementById("cover-viewer-dim");
  if (dim) dim.classList.add("show");
  setCoverSlide(cover, coverActiveIndex(cover)); // слайд мог быть ещё не загружен
  document.body.style.overflow = "hidden";
}
function collapseCover(cover) {
  if (!cover.classList.contains("cover-expanded")) return;
  cover.classList.remove("cover-expanded");
  const dim = document.getElementById("cover-viewer-dim");
  if (dim && !document.querySelector(".card-icon.cover-expanded")) dim.classList.remove("show");
  document.body.style.overflow = "";
}

/* --- Выпадающие списки окна настроек: кнопка раскрывает панель,
       выбор опции сохраняет значение и закрывает, клик мимо закрывает --- */
function closeAllDropdowns() {
  document.querySelectorAll(".settings-dropdown.open").forEach(root => {
    root.classList.remove("open");
    const btn = root.querySelector(".settings-dropdown-btn");
    if (btn) btn.setAttribute("aria-expanded", "false");
  });
}
function setupDropdown(id, onChange) {
  const root = document.getElementById(id);
  if (!root) return;
  const btn = root.querySelector(".settings-dropdown-btn");
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const willOpen = !root.classList.contains("open");
    closeAllDropdowns();
    root.classList.toggle("open", willOpen);
    btn.setAttribute("aria-expanded", String(willOpen));
  });
  root.querySelector(".settings-dropdown-panel").addEventListener("click", e => {
    const opt = e.target.closest("[data-value]");
    if (!opt) return;
    onChange(opt.dataset.value);
    closeAllDropdowns();
  });
}

/* --- Навешивание событий --- */
function bindEvents() {
  // Раскрытие и сворачивание секций: платформа, сортировка, теги, нейросети
  document.querySelectorAll(".filter-accordion-toggle").forEach(button => {
    button.addEventListener("click", () => {
      const section = button.closest(".filter-accordion");
      setAccordionOpen(section, !section.classList.contains("open"));
    });
  });

  // Выпадающее меню фильтров в шапке
  document.getElementById("toolbar-toggle").addEventListener("click", () => {
    setToolbarOpen(!document.getElementById("toolbar-body").classList.contains("open"));
  });

  // Поиск по всему каталогу
  document.getElementById("catalog-search").addEventListener("input", e => {
    catalogSearch = e.target.value.trim();
    render();
    updateResetBtn();
  });
  // Локальный поиск внутри списков тегов и нейросетей
  document.getElementById("tag-search").addEventListener("input", e => {
    tagSearch = e.target.value;
    buildTagFilters();
  });
  document.getElementById("ai-search").addEventListener("input", e => {
    aiSearch = e.target.value;
    buildAiFilters();
  });

  // Фильтр по платформе
  document.querySelector(".seg").addEventListener("click", e => {
    const btn = e.target.closest("[data-platform]");
    if (!btn) return;
    document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activePlatform = btn.dataset.platform;
    document.getElementById("platform-summary").textContent = PLATFORM_LABELS[activePlatform] || PLATFORM_LABELS.all;
    render();
    updateResetBtn();
  });

  // Сортировка в том же раскрывающемся стиле, что теги и нейросети
  document.getElementById("sort-options").addEventListener("click", e => {
    const btn = e.target.closest("[data-sort]");
    if (!btn) return;
    sortMode = btn.dataset.sort;
    document.querySelectorAll(".sort-option").forEach(option =>
      option.classList.toggle("active", option === btn));
    document.getElementById("sort-summary").textContent = SORT_LABELS[sortMode] || SORT_LABELS.default;
    render();
    updateResetBtn();
  });

  // Фильтр по тегам (делегирование на контейнер пилюль)
  document.getElementById("tag-filters").addEventListener("click", e => {
    const btn = e.target.closest("[data-tag]");
    if (!btn) return;
    applyTagFilter(btn.dataset.tag);
  });

  // Фильтр по нейросетям
  document.getElementById("ai-filters").addEventListener("click", e => {
    const btn = e.target.closest("[data-ai]");
    if (!btn) return;
    applyAiFilter(btn.dataset.ai);
  });

  // Сброс
  document.getElementById("reset-btn").addEventListener("click", resetFilters);

  /* --- Карусель скриншотов: клавиши ←/→ на обложке, свайп (тач/перо).
         Слушаем на документе: работает и в карточках, и на странице приложения --- */
  document.addEventListener("keydown", e => {
    const cover = e.target.closest(".card-icon[data-shots]");
    if (!cover) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); stepCover(cover, -1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); stepCover(cover, 1); }
  });

  // Свайп внутри обложки: touch-action: pan-y оставляет вертикальный скролл браузеру
  let swipeState = null;
  document.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    const cover = e.target.closest(".card-icon[data-shots]");
    if (!cover) return;
    swipeState = { cover, x: e.clientX, y: e.clientY };
  });
  document.addEventListener("pointermove", e => {
    if (!swipeState || swipeState.cover !== e.target.closest(".card-icon")) return;
    const dx = e.clientX - swipeState.x;
    const dy = e.clientY - swipeState.y;
    if (Math.abs(dx) <= Math.abs(dy) || Math.abs(dx) < 28) return; // не горизонтальный жест
    swipeState.x = e.clientX; // перезарядка: жест можно продолжить
    const cover = swipeState.cover;
    const slides = coverSlides(cover);
    const pos = slides.findIndex(s => s.dataset.index === String(coverActiveIndex(cover)));
    const next = slides[dx < 0 ? Math.min(slides.length - 1, pos + 1) : Math.max(0, pos - 1)];
    if (!next) return;
    setCoverSlide(cover, Number(next.dataset.index));
  });
  const endSwipe = () => { swipeState = null; };
  document.addEventListener("pointerup", endSwipe);
  document.addEventListener("pointercancel", endSwipe);

  // «Поделиться»: скопировать прямую ссылку, галочка на кнопке, тост.
  // Иконка на кнопке может быть любой (ссылка, «поделиться») — восстанавливаем
  // исходное содержимое, а не захардкоженный SVG
  async function copyLink(link, btn) {
    const url = new URL(link, document.baseURI).href;
    const originalTitle = btn.title;
    const originalLabel = btn.getAttribute("aria-label");
    const originalHtml = btn.innerHTML;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
      } else {
        const field = document.createElement("textarea");
        field.value = url;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        if (!copied) throw new Error("Не удалось скопировать ссылку");
      }
      showCopyToast();
      btn.classList.add("copied");
      btn.title = "Ссылка скопирована";
      btn.setAttribute("aria-label", "Ссылка скопирована");
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
      window.setTimeout(() => {
        if (!btn.isConnected) return;
        btn.classList.remove("copied");
        btn.title = originalTitle;
        btn.setAttribute("aria-label", originalLabel);
        btn.innerHTML = originalHtml;
      }, 1600);
    } catch (error) {
      btn.title = "Не удалось скопировать";
      btn.setAttribute("aria-label", "Не удалось скопировать ссылку");
    }
  }

  // Клики в каталоге: карусель, кнопки карточек, пилюли-фильтры,
  // клик по свободному месту карточки — открыть страницу приложения
  document.getElementById("grid").addEventListener("click", async e => {
    // Стрелка карусели: соседний слайд (с зацикливанием), карточку не открывать
    const arrow = e.target.closest(".cover-arrow");
    if (arrow) {
      e.preventDefault();
      e.stopPropagation();
      const cover = arrow.closest(".card-icon");
      if (cover) stepCover(cover, Number(arrow.dataset.dir));
      return;
    }
    // Точка карусели: переключить слайд, карточку не открывать
    const dot = e.target.closest(".cover-dot");
    if (dot) {
      e.preventDefault();
      e.stopPropagation();
      const cover = dot.closest(".card-icon");
      if (cover) setCoverSlide(cover, Number(dot.dataset.dot));
      return;
    }
    // Клик по скриншотам: следующий слайд по кругу. Просмотр скриншотов
    // отсюда больше не открывается — только со страницы приложения
    const coverClick = e.target.closest(".card-icon[data-shots]");
    if (coverClick) {
      e.preventDefault();
      e.stopPropagation();
      stepCover(coverClick, 1);
      return;
    }
    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      e.preventDefault();
      e.stopPropagation();
      await copyLink(copyBtn.dataset.copy, copyBtn);
      return;
    }
    const iframeBtn = e.target.closest("[data-iframe]");
    if (iframeBtn) {
      e.preventDefault();
      e.stopPropagation();
      openIframe(iframeBtn.dataset.iframe);
      return;
    }
    const tagBtn = e.target.closest("[data-tag]");
    if (tagBtn) {
      e.preventDefault();
      e.stopPropagation();
      applyTagFilter(tagBtn.dataset.tag);
      return;
    }
    const aiBtn = e.target.closest("[data-ai]");
    if (aiBtn) {
      e.preventDefault();
      e.stopPropagation();
      applyAiFilter(aiBtn.dataset.ai);
      return;
    }
    // Промахи между кнопками действий не считаются кликом по карточке
    if (e.target.closest(".card-actions")) return;
    // Свободное место карточки — страница приложения вместо перехода по ссылке
    const card = e.target.closest(".card[data-open]");
    if (card) openAppPage(card.dataset.id);
  });

  // Клики на странице приложения: назад, карусель, просмотр скриншотов,
  // кнопки, теги и нейросети (ведут в каталог с включённым фильтром)
  document.getElementById("app-page").addEventListener("click", async e => {
    const backBtn = e.target.closest("[data-back]");
    if (backBtn) {
      e.preventDefault();
      e.stopPropagation();
      closeAppPage();
      return;
    }
    const arrow = e.target.closest(".cover-arrow");
    if (arrow) {
      e.preventDefault();
      e.stopPropagation();
      const cover = arrow.closest(".card-icon");
      if (cover) stepCover(cover, Number(arrow.dataset.dir));
      return;
    }
    const dot = e.target.closest(".cover-dot");
    if (dot) {
      e.preventDefault();
      e.stopPropagation();
      const cover = dot.closest(".card-icon");
      if (cover) setCoverSlide(cover, Number(dot.dataset.dot));
      return;
    }
    // Клик по скриншоту или свободному месту карусели: в открытом просмотре —
    // следующий слайд, иначе открыть просмотр скриншотов
    const cover = e.target.closest(".card-icon[data-shots]");
    if (cover) {
      e.preventDefault();
      e.stopPropagation();
      if (cover.classList.contains("cover-expanded")) stepCover(cover, 1);
      else expandCover(cover);
      return;
    }
    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      e.preventDefault();
      e.stopPropagation();
      await copyLink(copyBtn.dataset.copy, copyBtn);
      return;
    }
    const iframeBtn = e.target.closest("[data-iframe]");
    if (iframeBtn) {
      e.preventDefault();
      e.stopPropagation();
      openIframe(iframeBtn.dataset.iframe);
      return;
    }
    const tagBtn = e.target.closest("[data-tag]");
    if (tagBtn) {
      e.preventDefault();
      e.stopPropagation();
      filterFromAppPage("tag", tagBtn.dataset.tag);
      return;
    }
    const aiBtn = e.target.closest("[data-ai]");
    if (aiBtn) {
      e.preventDefault();
      e.stopPropagation();
      filterFromAppPage("ai", aiBtn.dataset.ai);
      return;
    }
  });

  document.getElementById("modal-close").addEventListener("click", closeIframe);
  document.getElementById("app-modal").addEventListener("click", e => {
    if (e.target.id === "app-modal") closeIframe();
  });
  // Клик по затемнению закрывает окно просмотра скриншотов
  document.getElementById("cover-viewer-dim").addEventListener("click", () => {
    document.querySelectorAll(".card-icon.cover-expanded").forEach(collapseCover);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeIframe();
      closeSettings();
      // Просмотрщик закрывается первым: следующий Esc уже вернёт из страницы приложения
      const hadViewer = !!document.querySelector(".card-icon.cover-expanded");
      document.querySelectorAll(".card-icon.cover-expanded").forEach(collapseCover);
      closeAllDropdowns();
      setToolbarOpen(false);
      // Esc на странице приложения, когда больше ничего не открыто, — назад в каталог
      if (!hadViewer && appPageIdFromHash()
          && !document.getElementById("app-modal").classList.contains("open")
          && !document.getElementById("settings-modal").classList.contains("open")) {
        closeAppPage(true);
      }
    }
  });
  // Клик/тап мимо закрывает выпадающие списки настроек и меню фильтров
  document.addEventListener("click", e => {
    if (!e.target.closest(".settings-dropdown")) closeAllDropdowns();
    if (!e.target.closest(".header-filters-wrap") && !e.target.closest("#toolbar-toggle")) {
      setToolbarOpen(false);
    }
  });

  /* --- Окно настроек: открытие, закрытие по крестику/фону/Esc, ловушка фокуса --- */
  document.getElementById("settings-open").addEventListener("click", openSettings);
  document.getElementById("settings-close").addEventListener("click", closeSettings);
  // Тема: три кнопки-иконки вместо выпадающего списка
  document.querySelectorAll("#theme-options [data-theme-value]").forEach(button => {
    button.addEventListener("click", () => updateSetting("theme", button.dataset.themeValue));
  });
  // Язык: выбор запоминается, локализация пока не подключена
  setupDropdown("lang-dropdown", value => updateSetting("lang", value));
  // Базовый цвет: оттенок фона и акцентов — шаблоны или свой цвет из пикера
  document.getElementById("base-color-options").addEventListener("click", e => {
    const swatch = e.target.closest("[data-base-color]");
    if (swatch) updateSetting("baseColor", swatch.dataset.baseColor);
  });
  // Кубик: случайный приятный базовый цвет
  document.getElementById("base-color-dice").addEventListener("click", () => {
    updateSetting("baseColor", randomAccentHex());
  });
  // Свой цвет: системный пикер при перетаскивании шлёт десятки input-событий
  // в секунду, и каждое пересчитывает color-mix и перерисовывает страницу —
  // это подвисало. Применяем не чаще ~8 раз в секунду, финальный цвет — сразу
  let pendingColor = null;
  let colorApplyTimer = 0;
  let lastColorApply = 0;
  function applyPickedColor(value, final) {
    if (!isHexColor(value)) return;
    if (final) {
      clearTimeout(colorApplyTimer);
      colorApplyTimer = 0;
      pendingColor = null;
      updateSetting("baseColor", value);
      return;
    }
    pendingColor = value;
    if (colorApplyTimer) return; // применение уже запланировано — берём поздний цвет
    const wait = Math.max(0, 120 - (performance.now() - lastColorApply));
    colorApplyTimer = setTimeout(() => {
      colorApplyTimer = 0;
      lastColorApply = performance.now();
      if (pendingColor) {
        updateSetting("baseColor", pendingColor);
        pendingColor = null;
      }
    }, wait);
  }
  document.getElementById("base-color-input").addEventListener("input", e => applyPickedColor(e.target.value, false));
  document.getElementById("base-color-input").addEventListener("change", e => applyPickedColor(e.target.value, true));
  // Вид карточек: компактно или крупно
  document.querySelectorAll("#settings-modal [data-view]").forEach(button => {
    button.addEventListener("click", () => updateSetting("cardView", button.dataset.view));
  });
  // Стиль шапки: обычная / прозрачная / стекло
  document.querySelectorAll("#settings-modal [data-header-style]").forEach(button => {
    button.addEventListener("click", () => updateSetting("headerStyle", button.dataset.headerStyle));
  });
  document.getElementById("settings-modal").addEventListener("click", e => {
    if (e.target.id === "settings-modal") closeSettings();
  });
  // Tab не выпускает фокус из окна настроек, пока оно открыто
  document.getElementById("settings-modal").addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const focusables = [...document.getElementById("settings-panel")
      .querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])")]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  });

  // Кнопки прокрутки каталога: плавный переход к началу или к концу списка
  document.getElementById("scroll-top").addEventListener("click", () => smoothScrollTo(0));
  document.getElementById("scroll-bottom").addEventListener("click", () => smoothScrollTo(document.documentElement.scrollHeight));
  window.addEventListener("scroll", updateScrollNav, { passive: true });
  window.addEventListener("resize", updateScrollNav);
  // Высота страницы меняется (рендер карточек, фильтры, загрузка иконок) — пересчитать видимость
  new ResizeObserver(updateScrollNav).observe(document.body);
}

/* --- Встроенное окно приложения --- */
function openIframe(url) {
  const modal = document.getElementById("app-modal");
  document.getElementById("modal-frame").src = url;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeIframe() {
  const modal = document.getElementById("app-modal");
  modal.classList.remove("open");
  document.getElementById("modal-frame").src = "about:blank";
  document.body.style.overflow = "";
}

/* ============================================================
   Отдельная страница приложения: hash-роутинг #/app/<id>.
   Открывается кликом по карточке или прямой ссылкой, работает
   с историей браузера; каталог при этом скрыт.
   ============================================================ */
const appPageEl = document.getElementById("app-page");
const appPageInner = document.getElementById("app-page-inner");
let appReturnScroll = 0;   // куда вернуть скролл каталога при возврате
let appCloseToTop = false; // при переходе к фильтру каталог открывается сверху

// id приложения из текущего hash (или null)
function appPageIdFromHash() {
  const m = /^#\/app\/(.+)$/.exec(location.hash);
  return m ? decodeURIComponent(m[1]) : null;
}

function openAppPage(id) {
  if (!id) return;
  const target = "#/app/" + encodeURIComponent(id);
  if (location.hash === target) {
    showAppPage(); // страница уже открыта — просто пересобрать
    return;
  }
  location.hash = target; // hashchange вызовет showAppPage
}

// Возврат в каталог: кнопка «Каталог», Esc или history.back()
function closeAppPage(toTop = false) {
  appCloseToTop = toTop;
  if (location.hash) location.hash = ""; // hashchange вызовет hideAppPage
  else hideAppPage();
}

function showAppPage() {
  if (!document.body.classList.contains("app-view")) {
    appReturnScroll = window.scrollY;
    document.body.classList.add("app-view");
    window.scrollTo(0, 0);
  }
  const app = allApps.find(a => a.id === appPageIdFromHash());
  if (!allApps.length) {
    // Прямой вход по ссылке до окончания загрузки каталога
    appPageInner.innerHTML = `<div class="empty">Загрузка каталога…</div>`;
    return;
  }
  if (!app) {
    appPageInner.innerHTML = `
      <button class="app-back" type="button" data-back aria-label="Вернуться в каталог" title="Вернуться в каталог">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Каталог
      </button>
      <div class="empty">Приложение не найдено</div>`;
    return;
  }
  appPageInner.innerHTML = renderAppPage(app);
  observeCovers(); // карусель страницы подхватывает ленивую загрузку скриншотов
  updateScrollNav();
}

function hideAppPage() {
  if (!document.body.classList.contains("app-view")) return;
  document.body.classList.remove("app-view");
  appPageInner.innerHTML = "";
  updateScrollNav();
  window.scrollTo(0, appCloseToTop ? 0 : appReturnScroll);
  appCloseToTop = false;
}

// Любое изменение hash — в том числе «назад» браузера — переключает экран
function route() {
  if (appPageIdFromHash()) showAppPage();
  else hideAppPage();
}
window.addEventListener("hashchange", route);

/* --- Рендер страницы приложения: скриншоты, кнопки, полная информация, GitHub --- */
function renderAppPage(app) {
  const url = appUrl(app.id);
  const tagsHtml = (app.tags || []).map(t => {
    const hue = hueFor(t);
    return `<button class="tag" type="button" data-tag="${escapeAttr(t)}" style="--hue:${hue}">${escapeHtml(t)}</button>`;
  }).join("");
  const tagsWrap = tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : "";
  const langHtml = renderLangBadges(app.languages);
  const aiHtml = renderAiBadge(app.ai);
  const platformHtml = renderPlatformBadge(app.platform);
  const metaHtml = (langHtml || aiHtml || platformHtml)
    ? `<div class="card-meta">${langHtml}${aiHtml}${platformHtml}</div>` : "";

  return `
    <button class="app-back" type="button" data-back aria-label="Вернуться в каталог" title="Вернуться в каталог">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Каталог
    </button>
    ${renderCover(app, "app-shots")}
    <div class="app-actions">
      <a class="btn btn-primary" href="${escapeAttr(url)}">Перейти</a>
      <button class="btn btn-secondary" type="button" data-iframe="${escapeAttr(url)}">Окно</button>
      <button class="btn-copy" type="button" data-copy="${escapeAttr(url)}" aria-label="Скопировать ссылку" title="Скопировать ссылку">
        ${SHARE_ICON_SVG}
      </button>
    </div>
    <div class="app-info">
      <div class="card-title-row">
        ${renderTileCompact(app)}
        <h2 class="card-title">${escapeHtml(app.title)}</h2>
      </div>
      ${app.description ? `<p class="card-desc">${escapeHtml(app.description)}</p>` : ""}
      ${app.info ? `<p class="card-info">${escapeHtml(app.info)}</p>` : ""}
      ${metaHtml}
      ${tagsWrap}
    </div>
    <footer class="github-footer">
      <a href="https://github.com/cvetyshayasiren" target="_blank" rel="noopener noreferrer" aria-label="GitHub автора: cvetyshayasiren">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.44-2.53-.44-.91-2.02-2.22-2.56-2.22-2.56-.44-.76.36-.74.36-.74.97.11 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.05.2-2.19 0 0 .64-.2 2.1.79.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.45-1 2.1-.79 2.1-.79.65 1.15.29 1.94.2 2.19.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85 0 1.33-.01 2.4-.01 2.73 0 .26.18.58.69.5C13.71 14.53 16 11.54 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>GitHub · cvetyshayasiren</span>
      </a>
    </footer>`;
}

// Со страницы приложения: включить фильтр и вернуться на начальную
// страницу плеера — дальше работает как везде (фильтрует, открывает панель)
function filterFromAppPage(kind, value) {
  if (kind === "tag") setTagFilter(value);
  else setAiFilter(value);
  ensureFiltersVisible(kind === "tag" ? "tags" : "ai");
  closeAppPage(true);
}

/* --- Кнопки прокрутки списка: видны, только когда есть куда идти --- */
const SCROLL_NAV_EDGE = 40; // запас от края страницы, при котором кнопка прячется (px)

function updateScrollNav() {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const y = window.scrollY;
  document.getElementById("scroll-top").classList.toggle("is-hidden", y <= SCROLL_NAV_EDGE);
  document.getElementById("scroll-bottom").classList.toggle("is-hidden", y >= maxScroll - SCROLL_NAV_EDGE);
}

function smoothScrollTo(top) {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
}

/* --- Старт --- */
loadSettings();       // настройки с нормализацией и сбросом проблемных опций
GlassHeader.init();   // шейдер шапки: контекст готов заранее, рисует только в стиле «стекло»
applySettings();
initToolbar();
bindEvents();
route();              // прямой вход по ссылке #/app/<id> — покажем страницу (пока скелет)
loadApps();           // по окончании загрузки перестроит страницу приложения
</script>
