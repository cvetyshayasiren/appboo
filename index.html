/* --- Liquid glass для шапки: WebGL-шейдер рисует живые блики на канвасе
       поверх матового слоя backdrop-filter. Оттенок берётся из --accent,
       поэтому следует базовому цвету. Нет WebGL — канвас убирается,
       остаётся обычное CSS-стекло. Анимация останавливается, когда стиль
       не «стекло», вкладка скрыта или пользователь просил меньше движения --- */
const GlassHeader = (() => {
  const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");
  const VERT = "attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }";
  const FRAG = [
    "precision mediump float;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform vec3 u_tint;",
    "float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }",
    "float vnoise(vec2 p) {",
    "  vec2 i = floor(p); vec2 f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
    "}",
    "float fbm(vec2 p) {",
    "  float v = 0.0; float a = 0.5;",
    "  for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.07 + vec2(1.7, 4.3); a *= 0.5; }",
    "  return v;",
    "}",
    "void main() {",
    "  vec2 uv = gl_FragCoord.xy / u_res;",
    "  float t = u_time * 0.10;",
    "  vec2 p = vec2(uv.x * 3.2, uv.y * 1.4);",
    "  float n1 = fbm(p + vec2(t, -t * 0.7));",
    "  float n2 = fbm(p * 1.8 + n1 * 0.8 - vec2(t * 0.6, t * 0.35));",
    "  float liquid = n1 * 0.62 + n2 * 0.38;",
    // тонкие светлые «прожилки» жидкого стекла
    "  float vein = smoothstep(0.52, 0.60, liquid) * (1.0 - smoothstep(0.66, 0.74, liquid));",
    "  float glow = smoothstep(0.35, 0.85, liquid) * 0.08;",
    // стеклянные кромки: светлая сверху, слабее снизу
    "  float rimTop = smoothstep(0.78, 1.0, uv.y) * 0.14;",
    "  float rimBottom = (1.0 - smoothstep(0.0, 0.22, uv.y)) * 0.09;",
    "  float a = vein * 0.30 + glow + rimTop + rimBottom;",
    "  vec3 col = mix(vec3(1.0), u_tint, 0.35);",
    "  gl_FragColor = vec4(col * a, a);", // премультиплицированная альфа
    "}"
  ].join("\n");

  let canvas = null;
  let gl = null;
  let program = null;
  let uRes = null, uTime = null, uTint = null;
  let rafId = 0, running = false, start = performance.now(), frame = 0;
  let tint = [0.52, 0.76, 0.42];

  function isActive() {
    if (!gl || !canvas || !canvas.isConnected || document.hidden) return false;
    const header = canvas.closest(".app-header");
    return !!header && header.getAttribute("data-header-style") === "glass";
  }

  // Вычисленный цвет акцента: канвас стилизован color: var(--accent),
  // computed color всегда встречается как rgb(...)
  function readAccentRgb() {
    if (!canvas) return tint;
    try {
      const c = getComputedStyle(canvas).color;
      const m = /rgba?\(([^)]+)\)/.exec(c);
      if (!m) return tint;
      const parts = m[1].split(/[,\s/]+/).filter(Boolean).map(Number);
      if (parts.length < 3 || parts.some(n => !Number.isFinite(n))) return tint;
      return [parts[0] / 255, parts[1] / 255, parts[2] / 255];
    } catch (e) { return tint; }
  }

  function init() {
    canvas = document.getElementById("header-glass-canvas");
    if (!canvas) return;
    gl = canvas.getContext("webgl", { alpha: true, antialias: false, premultipliedAlpha: true })
      || canvas.getContext("experimental-webgl", { alpha: true, antialias: false, premultipliedAlpha: true });
    if (!gl) { canvas.remove(); canvas = null; return; } // шейдеры недоступны — CSS-стекло
    const compile = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || "shader");
      return sh;
    };
    try {
      program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error("link");
    } catch (e) {
      canvas.remove(); canvas = null; gl = null; return; // fallback на CSS-стекло
    }
    gl.useProgram(program);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, "a_pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uRes = gl.getUniformLocation(program, "u_res");
    uTime = gl.getUniformLocation(program, "u_time");
    uTint = gl.getUniformLocation(program, "u_tint");
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    canvas.addEventListener("webglcontextlost", e => {
      e.preventDefault();
      stop();
      gl = null;
      if (canvas) canvas.style.display = "none"; // CSS-стекло продолжает работать
    });
    tint = readAccentRgb();
    resize();
  }

  function resize() {
    if (!gl || !canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function render(now) {
    if (!gl) return;
    resize();
    const t = (now - start) / 1000;
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t);
    if (frame % 120 === 0) tint = readAccentRgb(); // акцент мог смениться
    gl.uniform3f(uTint, tint[0], tint[1], tint[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    frame++;
  }

  function loop(now) {
    if (!isActive()) { running = false; return; }
    render(now);
    rafId = requestAnimationFrame(loop);
  }

  function ensure() {
    if (!isActive()) return;
    if (REDUCE_MOTION.matches) { render(performance.now()); return; } // статичный кадр
    if (!running) { running = true; rafId = requestAnimationFrame(loop); }
  }

  function stop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    running = false;
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
    else ensure();
  });
  window.addEventListener("resize", () => {
    if (REDUCE_MOTION.matches && isActive()) render(performance.now());
  });

  return { init, ensure, refreshTint() { if (gl) tint = readAccentRgb(); } };
})();

/* --- Раскрытие/сворачивание секций фильтров (общее для всех аккордеонов) --- */
function setAccordionOpen(section, open) {
  section.classList.toggle("open", open);
  const button = section.querySelector(".filter-accordion-toggle");
  if (button) button.setAttribute("aria-expanded", String(open));
  const panel = document.getElementById(button && button.getAttribute("aria-controls"));
  if (panel) panel.setAttribute("aria-hidden", String(!open));
  const summary = section.querySelector(".filter-summary");
  // У сортировки и платформы в summary всегда показан текущий выбор
  if (summary && (section.dataset.accordion === "tags" || section.dataset.accordion === "ai")) {
    summary.textContent = open ? "Скрыть фильтры" : "Показать фильтры";
  }
}

/* --- Выпадающее меню фильтров в шапке (открывается кнопкой, закрывается
       кликом мимо, по Esc или выбором фильтра) --- */
function setToolbarOpen(open) {
  const body = document.getElementById("toolbar-body");
  if (open) alignFiltersDropdown(); // ширина могла измениться с прошлого показа
  body.classList.toggle("open", open);
  body.setAttribute("aria-hidden", String(!open));
  document.getElementById("toolbar-toggle").setAttribute("aria-expanded", String(open));
}

function initToolbar() {
  setToolbarOpen(false); // при старте меню всегда закрыто
  // На узких экранах плейсхолдер короче, чтобы умещался в маленькое поле поиска
  const searchInput = document.getElementById("catalog-search");
  const PLACEHOLDER_FULL = "Найти приложение по названию, описанию или тегу…";
  const applySearchPlaceholder = () => {
    searchInput.placeholder = window.innerWidth <= 600 ? "Поиск" : PLACEHOLDER_FULL;
  };
  applySearchPlaceholder();
  window.addEventListener("resize", applySearchPlaceholder);
  alignFiltersDropdown();
  window.addEventListener("resize", alignFiltersDropdown);
}

/* --- Ширина выпадающего меню фильтров: ровно от иконки поиска
       до иконки фильтров (на телефоне меню фиксировано на всю ширину) --- */
function alignFiltersDropdown() {
  const body = document.getElementById("toolbar-body");
  if (!body) return;
  if (window.innerWidth <= 600) { body.style.width = ""; return; }
  const icon = document.querySelector(".header-search-zone .search-icon");
  const btn = document.getElementById("toolbar-toggle");
  if (!icon || !btn) return;
  const w = Math.round(btn.getBoundingClientRect().right - icon.getBoundingClientRect().left);
  body.style.width = w >= 240 ? w + "px" : ""; // слишком узко — оставить обычное поведение
}

/* --- Окно настроек: открытие, закрытие, возврат фокуса --- */
let settingsOpener = null;
function openSettings() {
  settingsOpener = document.activeElement;
  document.getElementById("settings-modal").classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("settings-panel").focus();
}
function closeSettings() {
  const modal = document.getElementById("settings-modal");
  if (!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  document.body.style.overflow = "";
  if (settingsOpener && typeof settingsOpener.focus === "function") settingsOpener.focus();
  settingsOpener = null;
}

/* --- Крупный просмотр компактной карточки: сборка по требованию, показ
       по наведению, закрепление по клику на кнопку «крупно» или «+N» --- */
function ensurePreview(card) {
  const holder = card.querySelector(".card-large-preview");
  if (!holder || holder.dataset.built) return;
  const app = allApps.find(a => a.id === holder.dataset.previewFor);
  if (!app) return;
  holder.innerHTML = renderCardLarge(app);
  holder.dataset.built = "1";
  holder.setAttribute("aria-hidden", "false");
  // Кнопка «свернуть» слева сверху: правый угол обложки занят разворотом скриншотов
  holder.insertAdjacentHTML("afterbegin", `<button type="button" class="card-collapse" data-collapse aria-label="Свернуть карточку" title="Свернуть">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10V4h6"/><path d="M4 4l7 7"/><path d="M20 14v6h-6"/><path d="M20 20l-7-7"/></svg>
  </button>`);
  updateEllipsisButtons(); // в превью могли оказаться обрезанные тексты
  observeCovers(); // обложка превью подхватит ленивую загрузку скриншотов
}
function showPreview(card) {
  ensurePreview(card);
  card.classList.add("preview-shown");
  updatePreviewDim();
}
function hidePreview(card) {
  card.classList.remove("preview-shown");
  updatePreviewDim();
}
function updatePreviewDim() {
  const dim = document.getElementById("preview-dim");
  if (dim) dim.classList.toggle("show", !!document.querySelector(".card.preview-shown"));
}
function setPreviewPinned(card, pinned) {
  card.classList.toggle("preview-pinned", pinned);
  const toggle = card.querySelector(".card-info-toggle");
  if (toggle) toggle.setAttribute("aria-expanded", String(pinned));
  if (pinned) {
    // Закреплён один просмотр — остальные закрываем
    document.querySelectorAll(".card.preview-pinned").forEach(other => {
      if (other !== card) {
        other.classList.remove("preview-pinned");
        const otherToggle = other.querySelector(".card-info-toggle");
        if (otherToggle) otherToggle.setAttribute("aria-expanded", "false");
        hidePreview(other);
      }
    });
    showPreview(card);
  } else {
    // Снимаем закрепление. Липкий :hover после тапа на тач-экране не учитываем:
    // на телефонах превью всегда прячется, курсор-ловушка только для мыши
    const hoverable = window.matchMedia("(hover: hover)").matches;
    const over = hoverable && (card.querySelector("[data-info]")?.matches(":hover")
      || card.querySelector(".card-large-preview")?.matches(":hover"));
    if (!over) hidePreview(card);
  }
}
function unpinPreviews() {
  document.querySelectorAll(".card.preview-pinned").forEach(card => setPreviewPinned(card, false));
  // По Esc убираем и наведённые просмотр
  document.querySelectorAll(".card.preview-shown").forEach(hidePreview);
}

/* --- Кнопка «⋯» у обрезанного текста: показывается, только если текст
       реально не влёкся; клик открывает привязанное прокручиваемое окно
       со всем описанием и инфо. Клик/тап вне окна закрывает его --- */
function updateEllipsisButtons() {
  document.querySelectorAll(".card-text-wrap").forEach(wrap => {
    const p = wrap.querySelector(".card-desc, .card-info");
    if (!p) return;
    wrap.classList.toggle("is-clamped", p.scrollHeight > p.clientHeight + 1);
  });
}
let ellipsisRaf = 0;
function queueEllipsisUpdate() {
  if (ellipsisRaf) return;
  ellipsisRaf = requestAnimationFrame(() => { ellipsisRaf = 0; updateEllipsisButtons(); });
}
window.addEventListener("resize", queueEllipsisUpdate);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateEllipsisButtons);

const textPopupState = { btn: null, popup: null, dim: null };

function ensureTextPopup() {
  if (textPopupState.popup) return;
  const popup = document.createElement("div");
  popup.className = "text-popup";
  popup.setAttribute("role", "dialog");
  popup.setAttribute("aria-label", "Полный текст приложения");
  document.body.appendChild(popup);
  textPopupState.popup = popup;
  const dim = document.getElementById("text-popup-dim");
  if (dim) {
    dim.addEventListener("click", closeTextPopup);
    textPopupState.dim = dim;
  }
}

// Позиция у кнопки: приоритет — справа снизу (низ окна по низу кнопки),
// не влезло — слева, потом ниже кнопки с прижатием к краям экрана
function positionTextPopup() {
  const popup = textPopupState.popup, btn = textPopupState.btn;
  if (!popup || !btn || !btn.isConnected) return;
  const r = btn.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight, M = 10;
  const pw = popup.offsetWidth, ph = popup.offsetHeight;
  let left = r.right + 10;
  if (left + pw > vw - M) left = r.left - 10 - pw;
  if (left < M) left = M;
  let top = r.bottom - ph;
  if (top < M) top = r.bottom + 10;
  if (top + ph > vh - M) top = Math.max(M, vh - M - ph);
  popup.style.left = Math.round(left) + "px";
  popup.style.top = Math.round(top) + "px";
}

function openTextPopup(btn) {
  const card = btn.closest(".card");
  const app = card ? allApps.find(a => a.id === card.dataset.id) : null;
  if (!app) return;
  // Повторный клик по той же кнопке закрывает окно
  if (textPopupState.popup && textPopupState.btn === btn && textPopupState.popup.classList.contains("open")) {
    closeTextPopup();
    return;
  }
  ensureTextPopup();
  const popup = textPopupState.popup;
  const sections = [];
  if (app.description) sections.push(`<div class="text-popup-section"><h5>Описание</h5><p>${escapeHtml(app.description)}</p></div>`);
  if (app.info) sections.push(`<div class="text-popup-section"><h5>Инфо</h5><p>${escapeHtml(app.info)}</p></div>`);
  if (!sections.length) return;
  popup.innerHTML = `<h4 class="text-popup-title">${escapeHtml(app.title)}</h4>${sections.join("")}`;
  popup.scrollTop = 0;
  textPopupState.btn = btn;
  popup.classList.add("open");
  if (textPopupState.dim) textPopupState.dim.classList.add("show");
  positionTextPopup(); // после вставки есть реальные размеры
}

function closeTextPopup() {
  if (!textPopupState.popup) return;
  textPopupState.popup.classList.remove("open");
  if (textPopupState.dim) textPopupState.dim.classList.remove("show");
  textPopupState.btn = null;
}

/* --- Режим просмотра скриншотов: отдельное окно на затемнённом фоне.
       Показывается одинаково откуда угодно — из карточки или из превью --- */
function expandCover(cover) {
  if (cover.classList.contains("cover-expanded")) return;
  cover.classList.add("cover-expanded");
  const dim = document.getElementById("cover-viewer-dim");
  if (dim) dim.classList.add("show");
  const card = cover.closest(".card");
  if (card) card.classList.add("cover-open");
  const host = cover.closest(".card-large-preview");
  if (host) host.classList.add("cover-open-host");
  setCoverSlide(cover, coverActiveIndex(cover)); // слайд мог быть ещё не загружен
  document.body.style.overflow = "hidden";
}
function collapseCover(cover) {
  if (!cover.classList.contains("cover-expanded")) return;
  cover.classList.remove("cover-expanded");
  const dim = document.getElementById("cover-viewer-dim");
  if (dim && !document.querySelector(".card-icon.cover-expanded")) dim.classList.remove("show");
  const card = cover.closest(".card");
  if (card) card.classList.remove("cover-open");
  const host = cover.closest(".card-large-preview");
  if (host) host.classList.remove("cover-open-host");
  document.body.style.overflow = "";
}

/* --- Выпадающие списки окна настроек: кнопка раскрывает панель,
       выбор опции сохраняет значение и закрывает, клик мимо закрывает --- */
function closeAllDropdowns() {
  document.querySelectorAll(".settings-dropdown.open").forEach(root => {
    root.classList.remove("open");
    const btn = root.querySelector(".settings-dropdown-btn");
    if (btn) btn.setAttribute("aria-expanded", "false");
  });
}
function setupDropdown(id, onChange) {
  const root = document.getElementById(id);
  if (!root) return;
  const btn = root.querySelector(".settings-dropdown-btn");
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const willOpen = !root.classList.contains("open");
    closeAllDropdowns();
    root.classList.toggle("open", willOpen);
    btn.setAttribute("aria-expanded", String(willOpen));
  });
  root.querySelector(".settings-dropdown-panel").addEventListener("click", e => {
    const opt = e.target.closest("[data-value]");
    if (!opt) return;
    onChange(opt.dataset.value);
    closeAllDropdowns();
  });
}

/* --- Навешивание событий --- */
function bindEvents() {
  // Раскрытие и сворачивание секций: платформа, сортировка, теги, нейросети
  document.querySelectorAll(".filter-accordion-toggle").forEach(button => {
    button.addEventListener("click", () => {
      const section = button.closest(".filter-accordion");
      setAccordionOpen(section, !section.classList.contains("open"));
    });
  });

  // Выпадающее меню фильтров в шапке
  document.getElementById("toolbar-toggle").addEventListener("click", () => {
    setToolbarOpen(!document.getElementById("toolbar-body").classList.contains("open"));
  });

  // Поиск по всему каталогу
  document.getElementById("catalog-search").addEventListener("input", e => {
    catalogSearch = e.target.value.trim();
    render();
    updateResetBtn();
  });
  // Локальный поиск внутри списков тегов и нейросетей
  document.getElementById("tag-search").addEventListener("input", e => {
    tagSearch = e.target.value;
    buildTagFilters();
  });
  document.getElementById("ai-search").addEventListener("input", e => {
    aiSearch = e.target.value;
    buildAiFilters();
  });

  // Фильтр по платформе
  document.querySelector(".seg").addEventListener("click", e => {
    const btn = e.target.closest("[data-platform]");
    if (!btn) return;
    document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activePlatform = btn.dataset.platform;
    document.getElementById("platform-summary").textContent = PLATFORM_LABELS[activePlatform] || PLATFORM_LABELS.all;
    render();
    updateResetBtn();
  });

  // Сортировка в том же раскрывающемся стиле, что теги и нейросети
  document.getElementById("sort-options").addEventListener("click", e => {
    const btn = e.target.closest("[data-sort]");
    if (!btn) return;
    sortMode = btn.dataset.sort;
    document.querySelectorAll(".sort-option").forEach(option =>
      option.classList.toggle("active", option === btn));
    document.getElementById("sort-summary").textContent = SORT_LABELS[sortMode] || SORT_LABELS.default;
    render();
    updateResetBtn();
  });

  // Фильтр по тегам (делегирование на контейнер пилюль)
  document.getElementById("tag-filters").addEventListener("click", e => {
    const btn = e.target.closest("[data-tag]");
    if (!btn) return;
    applyTagFilter(btn.dataset.tag);
  });

  // Фильтр по нейросетям
  document.getElementById("ai-filters").addEventListener("click", e => {
    const btn = e.target.closest("[data-ai]");
    if (!btn) return;
    applyAiFilter(btn.dataset.ai);
  });

  // Сброс
  document.getElementById("reset-btn").addEventListener("click", resetFilters);

  /* --- Карусель скриншотов: клавиши ←/→ на обложке, свайп (тач/перо) --- */
  gridEl().addEventListener("keydown", e => {
    const cover = e.target.closest(".card-icon[data-shots]");
    if (!cover) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); stepCover(cover, -1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); stepCover(cover, 1); }
  });

  // Свайп внутри обложки: touch-action: pan-y оставляет вертикальный скролл браузеру
  let swipeState = null;
  gridEl().addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    const cover = e.target.closest(".card-icon[data-shots]");
    if (!cover) return;
    swipeState = { cover, x: e.clientX, y: e.clientY };
  });
  gridEl().addEventListener("pointermove", e => {
    if (!swipeState || swipeState.cover !== e.target.closest(".card-icon")) return;
    const dx = e.clientX - swipeState.x;
    const dy = e.clientY - swipeState.y;
    if (Math.abs(dx) <= Math.abs(dy) || Math.abs(dx) < 28) return; // не горизонтальный жест
    swipeState.x = e.clientX; // перезарядка: жест можно продолжить
    const cover = swipeState.cover;
    const slides = coverSlides(cover);
    const pos = slides.findIndex(s => s.dataset.index === String(coverActiveIndex(cover)));
    const next = slides[dx < 0 ? Math.min(slides.length - 1, pos + 1) : Math.max(0, pos - 1)];
    if (!next) return;
    setCoverSlide(cover, Number(next.dataset.index));
  });
  const endSwipe = () => { swipeState = null; };
  gridEl().addEventListener("pointerup", endSwipe);
  gridEl().addEventListener("pointercancel", endSwipe);

  // Копирование прямой ссылки на приложение из карточки
  document.getElementById("grid").addEventListener("click", async e => {
    // «Свернуть»: вернуть крупный просмотр компактной карточки к обычному виду
    const collapseBtn = e.target.closest("[data-collapse]");
    if (collapseBtn) {
      e.preventDefault();
      e.stopPropagation();
      const card = collapseBtn.closest(".card-compact");
      if (card) setPreviewPinned(card, false);
      return;
    }
    // «⋯» у обрезанного текста: привязанное окно со всем описанием и инфо
    const ellipsisBtn = e.target.closest(".text-ellipsis");
    if (ellipsisBtn) {
      e.preventDefault();
      e.stopPropagation();
      openTextPopup(ellipsisBtn);
      return;
    }
    // «+N» вместо обрезанных тегов: крупный просмотр карточки с закреплением
    const tagMore = e.target.closest(".tag-more");
    if (tagMore) {
      e.preventDefault();
      e.stopPropagation();
      const card = tagMore.closest(".card-compact");
      if (card) setPreviewPinned(card, true);
      return;
    }
    // Кнопка «крупно»: наведение уже показывает превью, клик закрепляет его
    const infoBtn = e.target.closest("[data-info]");
    if (infoBtn) {
      e.preventDefault();
      e.stopPropagation();
      const card = infoBtn.closest(".card-compact");
      if (card) setPreviewPinned(card, !card.classList.contains("preview-pinned"));
      return;
    }
    // «Развернуть» на элементе скриншотов: развернуть или вернуть как было
    const expandBtn = e.target.closest(".cover-expand");
    if (expandBtn) {
      e.preventDefault();
      e.stopPropagation();
      const cover = expandBtn.closest(".card-icon");
      if (cover) {
        if (cover.classList.contains("cover-expanded")) collapseCover(cover);
        else expandCover(cover);
      }
      return;
    }
    // Стрелка карусели: соседний слайд (с зацикливанием), карточку не открывать
    const arrow = e.target.closest(".cover-arrow");
    if (arrow) {
      e.preventDefault();
      e.stopPropagation();
      const cover = arrow.closest(".card-icon");
      if (cover) stepCover(cover, Number(arrow.dataset.dir));
      return;
    }
    // Точка карусели: переключить слайд, карточку не открывать
    const dot = e.target.closest(".cover-dot");
    if (dot) {
      e.preventDefault();
      e.stopPropagation();
      const cover = dot.closest(".card-icon");
      if (cover) setCoverSlide(cover, Number(dot.dataset.dot));
      return;
    }
    // Клик по элементу скриншотов: следующий слайд по кругу, карточку не открывать
    const coverClick = e.target.closest(".card-icon[data-shots]");
    if (coverClick) {
      e.preventDefault();
      e.stopPropagation();
      stepCover(coverClick, 1);
      return;
    }
    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      e.preventDefault();
      e.stopPropagation();
      const link = new URL(copyBtn.dataset.copy, document.baseURI).href;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(link);
        } else {
          const field = document.createElement("textarea");
          field.value = link;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          if (!copied) throw new Error("Не удалось скопировать ссылку");
        }
        showCopyToast();
        const originalTitle = "Скопировать ссылку";
        copyBtn.classList.add("copied");
        copyBtn.title = "Ссылка скопирована";
        copyBtn.setAttribute("aria-label", "Ссылка скопирована");
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
        window.setTimeout(() => {
          if (!copyBtn.isConnected) return;
          copyBtn.classList.remove("copied");
          copyBtn.title = originalTitle;
          copyBtn.setAttribute("aria-label", originalTitle);
          copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>';
        }, 1600);
      } catch (error) {
        copyBtn.title = "Не удалось скопировать";
        copyBtn.setAttribute("aria-label", "Не удалось скопировать ссылку");
      }
      return;
    }

    const iframeBtn = e.target.closest("[data-iframe]");
    if (iframeBtn) {
      e.preventDefault();
      e.stopPropagation();
      openIframe(iframeBtn.dataset.iframe);
      return;
    }
    const tagBtn = e.target.closest("[data-tag]");
    if (tagBtn) {
      e.preventDefault();
      e.stopPropagation();
      applyTagFilter(tagBtn.dataset.tag);
      return;
    }
    const aiBtn = e.target.closest("[data-ai]");
    if (aiBtn) {
      e.preventDefault();
      e.stopPropagation();
      applyAiFilter(aiBtn.dataset.ai);
      return;
    }
    const action = e.target.closest(".card-actions");
    if (action) return;
    const card = e.target.closest(".card[data-open]");
    if (card) window.location.href = card.dataset.open;
  });

  document.getElementById("modal-close").addEventListener("click", closeIframe);
  document.getElementById("app-modal").addEventListener("click", e => {
    if (e.target.id === "app-modal") closeIframe();
  });
  // Клик по затемнению закрывает окно просмотра скриншотов
  document.getElementById("cover-viewer-dim").addEventListener("click", () => {
    document.querySelectorAll(".card-icon.cover-expanded").forEach(collapseCover);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeIframe();
      closeSettings();
      closeTextPopup();
      document.querySelectorAll(".card-icon.cover-expanded").forEach(collapseCover);
      unpinPreviews();
      closeAllDropdowns();
      setToolbarOpen(false);
    }
  });
  /* Клик/тап мимо закрывает всё всплывшее. Для закреплённого крупного
     просмотра исключение — клики внутри самого превью и по его кнопке
     «крупно»: тап вне области возвращает карточку к компактному виду,
     что особенно важно на тач-экранах, где наведения нет */
  document.addEventListener("click", e => {
    const pinnedCard = document.querySelector(".card.preview-pinned");
    if (pinnedCard) {
      const preview = pinnedCard.querySelector(".card-large-preview");
      const onToggle = !!e.target.closest("[data-info]") && e.target.closest(".card") === pinnedCard;
      const inPreview = !!preview && (preview === e.target || preview.contains(e.target));
      const inTextPopup = !!(textPopupState.popup && (textPopupState.popup === e.target || textPopupState.popup.contains(e.target)));
      const onEllipsis = !!e.target.closest(".text-ellipsis");
      if (!onToggle && !inPreview && !inTextPopup && !onEllipsis) {
        setPreviewPinned(pinnedCard, false);
      }
    }
    if (!e.target.closest(".text-popup") && !e.target.closest(".text-ellipsis")) {
      closeTextPopup();
    }
    if (!e.target.closest(".settings-dropdown")) closeAllDropdowns();
    if (!e.target.closest(".header-filters-wrap") && !e.target.closest("#toolbar-toggle")) {
      setToolbarOpen(false);
    }
  });
  // Окно полного текста держится у своей кнопки при скролле и смене размера
  window.addEventListener("scroll", () => { if (textPopupState.btn) positionTextPopup(); }, { passive: true });
  window.addEventListener("resize", () => { if (textPopupState.btn) positionTextPopup(); });

  // Крупный просмотр: показ по наведению на кнопку «крупно» или само превью (только мышь)
  gridEl().addEventListener("pointerover", e => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    const trigger = e.target.closest("[data-info], .card-large-preview");
    if (!trigger) return;
    const card = trigger.closest(".card-compact");
    if (card) showPreview(card);
  });
  gridEl().addEventListener("pointerout", e => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    const card = e.target.closest(".card-compact.preview-shown");
    if (!card || card.classList.contains("preview-pinned")) return;
    const to = e.relatedTarget;
    if (to && typeof to.closest === "function") {
      const next = to.closest("[data-info], .card-large-preview");
      if (next && next.closest(".card-compact") === card) return;
    }
    hidePreview(card);
  });

  /* --- Окно настроек: открытие, закрытие по крестику/фону/Esc, ловушка фокуса --- */
  document.getElementById("settings-open").addEventListener("click", openSettings);
  document.getElementById("settings-close").addEventListener("click", closeSettings);
  // Тема: выпадающий список со всеми вариантами
  setupDropdown("theme-dropdown", value => updateSetting("theme", value));
  // Язык: выбор запоминается, локализация пока не подключена
  setupDropdown("lang-dropdown", value => updateSetting("lang", value));
  // Базовый цвет: оттенок фона и акцентов
  document.getElementById("base-color-options").addEventListener("click", e => {
    const swatch = e.target.closest("[data-base-color]");
    if (swatch) updateSetting("baseColor", swatch.dataset.baseColor);
  });
  // Вид карточек: компактно или крупно
  document.querySelectorAll("#settings-modal [data-view]").forEach(button => {
    button.addEventListener("click", () => updateSetting("cardView", button.dataset.view));
  });
  // Стиль шапки: обычная / прозрачная / стекло
  document.querySelectorAll("#settings-modal [data-header-style]").forEach(button => {
    button.addEventListener("click", () => updateSetting("headerStyle", button.dataset.headerStyle));
  });
  document.getElementById("settings-modal").addEventListener("click", e => {
    if (e.target.id === "settings-modal") closeSettings();
  });
  // Tab не выпускает фокус из окна настроек, пока оно открыто
  document.getElementById("settings-modal").addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const focusables = [...document.getElementById("settings-panel")
      .querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])")]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  });

  // Кнопки прокрутки каталога: плавный переход к началу или к концу списка
  document.getElementById("scroll-top").addEventListener("click", () => smoothScrollTo(0));
  document.getElementById("scroll-bottom").addEventListener("click", () => smoothScrollTo(document.documentElement.scrollHeight));
  window.addEventListener("scroll", updateScrollNav, { passive: true });
  window.addEventListener("resize", updateScrollNav);
  // Высота страницы меняется (рендер карточек, фильтры, загрузка иконок) — пересчитать видимость
  new ResizeObserver(updateScrollNav).observe(document.body);
}

/* --- Встроенное окно приложения --- */
function openIframe(url) {
  const modal = document.getElementById("app-modal");
  document.getElementById("modal-frame").src = url;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeIframe() {
  const modal = document.getElementById("app-modal");
  modal.classList.remove("open");
  document.getElementById("modal-frame").src = "about:blank";
  document.body.style.overflow = "";
}

/* --- Кнопки прокрутки списка: видны, только когда есть куда идти --- */
const SCROLL_NAV_EDGE = 40; // запас от края страницы, при котором кнопка прячется (px)

function updateScrollNav() {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const y = window.scrollY;
  document.getElementById("scroll-top").classList.toggle("is-hidden", y <= SCROLL_NAV_EDGE);
  document.getElementById("scroll-bottom").classList.toggle("is-hidden", y >= maxScroll - SCROLL_NAV_EDGE);
}

function smoothScrollTo(top) {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
}

/* --- Старт --- */
loadSettings();       // настройки с миграцией и сбросом проблемных опций
GlassHeader.init();   // шейдер шапки: контекст готов заранее, рисует только в стиле «стекло»
applySettings();
initToolbar();
bindEvents();
loadApps();
</script>
